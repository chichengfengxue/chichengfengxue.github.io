<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Love</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#06030b}
body{background:#06030b}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.home{
    position:fixed;top:20px;left:22px;z-index:10;
    color:rgba(255,225,242,.25);text-decoration:none;
    font:10px Arial,sans-serif;letter-spacing:3px;transition:.35s
}
.home:hover{color:#fff0f8;text-shadow:0 0 15px #ff71c1}
</style>
</head>
<body>
<a class="home" href="/">HOME</a>
<canvas id="c"></canvas>

<script>
(()=>{
"use strict";

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d",{alpha:false});
const TAU=Math.PI*2;
const CURVE_N=2048;

let W=0,H=0,DPR=1;
let mouseX=0,mouseY=0,targetMouseX=0,targetMouseY=0;
let firstFrame=true,lastTime=performance.now();
let burstAccumulator=0;

const curveX=new Float32Array(CURVE_N);
const curveY=new Float32Array(CURVE_N);
const curveNX=new Float32Array(CURVE_N);
const curveNY=new Float32Array(CURVE_N);

const flowGroups=[[],[],[]];
let hotFlow=[];
let dust=[];
let rays=[];
let ribbons=[];
let bursts=[];
let floorDots=[];
let streamDust=[];
let stars=[];

let glowWhite,glowPink,glowSoft;

const COLORS=[
    "rgba(255,237,248,1)",
    "rgba(255,160,216,1)",
    "rgba(230,93,186,1)"
];

function rand(a,b){return a+Math.random()*(b-a)}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function normU(u){u%=1;if(u<0)u+=1;return u}
function gaussian(){
    return Math.random()+Math.random()+Math.random()+Math.random()-2;
}

function heart(t){
    const s=Math.sin(t);
    return [
        16*s*s*s,
        -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))
    ];
}

function buildCurve(){
    for(let i=0;i<CURVE_N;i++){
        const t=i/CURVE_N*TAU;
        const p=heart(t);
        curveX[i]=p[0];
        curveY[i]=p[1];
    }

    for(let i=0;i<CURVE_N;i++){
        const a=(i-2+CURVE_N)%CURVE_N;
        const b=(i+2)%CURVE_N;

        let dx=curveX[b]-curveX[a];
        let dy=curveY[b]-curveY[a];
        const l=Math.hypot(dx,dy)||1;

        dx/=l;
        dy/=l;

        let nx=-dy;
        let ny=dx;

        if(nx*curveX[i]+ny*curveY[i]<0){
            nx=-nx;
            ny=-ny;
        }

        curveNX[i]=nx;
        curveNY[i]=ny;
    }
}

function sampleCurve(u){
    u=normU(u);

    const f=u*CURVE_N;
    const i=Math.floor(f)%CURVE_N;
    const j=(i+1)%CURVE_N;
    const a=f-Math.floor(f);

    let nx=curveNX[i]+(curveNX[j]-curveNX[i])*a;
    let ny=curveNY[i]+(curveNY[j]-curveNY[i])*a;
    const nl=Math.hypot(nx,ny)||1;
    nx/=nl;
    ny/=nl;

    const x=curveX[i]+(curveX[j]-curveX[i])*a;
    const y=curveY[i]+(curveY[j]-curveY[i])*a;

    const tx=-ny;
    const ty=nx;

    return {x,y,nx,ny,tx,ty};
}

function makeGlow(size,c0,c1,c2){
    const c=document.createElement("canvas");
    c.width=c.height=size;
    const g=c.getContext("2d");
    const r=size/2;

    const grad=g.createRadialGradient(r,r,0,r,r,r);
    grad.addColorStop(0,c0);
    grad.addColorStop(.09,c0);
    grad.addColorStop(.25,c1);
    grad.addColorStop(.58,c2);
    grad.addColorStop(1,"rgba(255,80,190,0)");

    g.fillStyle=grad;
    g.fillRect(0,0,size,size);
    return c;
}

function createSprites(){
    glowWhite=makeGlow(
        96,
        "rgba(255,255,255,1)",
        "rgba(255,232,246,.95)",
        "rgba(255,132,205,.20)"
    );

    glowPink=makeGlow(
        72,
        "rgba(255,243,250,.88)",
        "rgba(255,135,205,.72)",
        "rgba(242,79,180,.15)"
    );

    glowSoft=makeGlow(
        128,
        "rgba(255,190,226,.22)",
        "rgba(232,83,188,.13)",
        "rgba(167,48,154,.05)"
    );
}

function getLayout(){
    const mobile=W<700;

    const heartWidth=Math.min(
        W*(mobile?.80:.52),
        H*(mobile?.72:.74)
    );

    return {
        cx:W*.5+mouseX*4,
        cy:H*(mobile?.34:.34)+mouseY*2,
        scale:heartWidth/32
    };
}

function heartbeat(t){
    const q=t%1.48;
    let b=0;

    if(q<.105)b=Math.sin(q/.105*Math.PI);
    if(q>.17&&q<.285)b+=.47*Math.sin((q-.17)/.115*Math.PI);

    return 1+b*.020+Math.sin(t*.65)*.0035;
}

function localWidth(u,t,scale){
    const a=Math.sin(u*TAU*3.0-t*.41);
    const b=Math.sin(u*TAU*8.0+t*.29);
    const c=Math.sin(u*TAU*17.0-t*.17);

    return scale*(
        .63+
        a*.095+
        b*.065+
        c*.025
    );
}

function targetPosition(p,t,layout,pulse){
    const u=normU(p.u);
    const c=sampleCurve(u);

    const width=localWidth(u,t,layout.scale);

    const turbulence=
        Math.sin(u*TAU*9+t*.92+p.phase)*width*.13+
        Math.sin(u*TAU*21-t*.47+p.phase*1.7)*width*.055;

    const offset=
        p.band*width+
        turbulence;

    const wave=
        Math.sin(u*TAU*5-t*.28)*
        layout.scale*.055;

    return {
        x:layout.cx+
          c.x*layout.scale*pulse+
          c.nx*(offset+wave),

        y:layout.cy+
          c.y*layout.scale*pulse+
          c.ny*(offset+wave),

        nx:c.nx,
        ny:c.ny,
        tx:c.tx,
        ty:c.ty
    };
}

function createFlow(){
    for(const g of flowGroups)g.length=0;
    hotFlow.length=0;

    const mobile=W<700;
    const count=mobile?3800:7600;

    for(let i=0;i<count;i++){
        const r=Math.random();

        let band=gaussian()*.52;

        if(r>.82)band*=1.55;
        if(r>.96)band*=2.1;

        const tone=
            Math.random()<.40?0:
            Math.random()<.72?1:2;

        const p={
            u:Math.random(),
            band,
            phase:rand(0,TAU),
            speed:rand(.022,.060)*(Math.random()<.10?-1:1),
            x:0,y:0,px:0,py:0,
            vx:0,vy:0,
            size:rand(.45,1.15),
            alpha:rand(.50,1),
            tone,
            hot:Math.random()<.035,
            hotSize:rand(4,10)
        };

        flowGroups[tone].push(p);
        if(p.hot)hotFlow.push(p);
    }

    const L=getLayout();
    const pulse=heartbeat(0);

    for(const group of flowGroups){
        for(const p of group){
            const q=targetPosition(p,0,L,pulse);
            p.x=p.px=q.x+gaussian()*2;
            p.y=p.py=q.y+gaussian()*2;
        }
    }
}

function createDust(){
    dust.length=0;

    const count=W<700?650:1550;

    for(let i=0;i<count;i++){
        dust.push({
            u:Math.random(),
            radius:Math.pow(Math.random(),.55)*.80,
            phase:rand(0,TAU),
            size:Math.random()<.94?rand(.45,1.1):rand(2,4),
            alpha:rand(.06,.36),
            hot:Math.random()<.03
        });
    }
}

function createRays(){
    rays.length=0;

    const count=W<700?65:145;

    for(let i=0;i<count;i++){
        rays.push({
            u:Math.random(),
            phase:rand(0,TAU),
            speed:rand(.11,.31),
            length:rand(.08,.28),
            start:rand(3,40),
            width:rand(.35,1.05),
            alpha:rand(.035,.16)
        });
    }
}

function createRibbons(){
    ribbons.length=0;

    const count=W<700?13:26;

    for(let i=0;i<count;i++){
        ribbons.push({
            u:Math.random(),
            speed:rand(.035,.092)*(Math.random()<.12?-1:1),
            band:gaussian()*.30,
            phase:rand(0,TAU),
            length:rand(.016,.045),
            alpha:rand(.10,.35),
            width:rand(.6,1.35)
        });
    }
}

function createStars(){
    stars.length=0;

    const count=W<700?350:900;

    for(let i=0;i<count;i++){
        stars.push({
            x:Math.random(),
            y:Math.random(),
            size:Math.random()<.97?rand(.35,1):rand(2,3.5),
            alpha:rand(.03,.28),
            phase:rand(0,TAU)
        });
    }
}

function createFloorDots(){
    floorDots.length=0;

    const count=W<700?600:1500;

    for(let i=0;i<count;i++){
        floorDots.push({
            r:Math.sqrt(Math.random()),
            a:Math.random()*TAU,
            alpha:rand(.04,.24),
            size:rand(.35,.9)
        });
    }

    streamDust.length=0;

    const streamCount=W<700?100:230;

    for(let i=0;i<streamCount;i++){
        streamDust.push({
            q:Math.random(),
            phase:rand(0,TAU),
            alpha:rand(.20,.85),
            size:Math.random()<.9?rand(.5,1.2):rand(2,4)
        });
    }
}

function recreate(){
    createFlow();
    createDust();
    createRays();
    createRibbons();
    createStars();
    createFloorDots();
    bursts.length=0;
}

function resize(){
    W=innerWidth;
    H=innerHeight;
    DPR=Math.min(devicePixelRatio||1,1.7);

    canvas.width=Math.round(W*DPR);
    canvas.height=Math.round(H*DPR);

    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(DPR,0,0,DPR,0,0);

    firstFrame=true;
    recreate();
}

function drawBackground(t,layout){
    ctx.globalCompositeOperation="source-over";

    if(firstFrame){
        ctx.fillStyle="#06030b";
        ctx.fillRect(0,0,W,H);
    }else{
        ctx.fillStyle="rgba(6,3,11,.20)";
        ctx.fillRect(0,0,W,H);
    }

    const radius=Math.max(W,H)*.50;

    const g=ctx.createRadialGradient(
        layout.cx,
        layout.cy-H*.01,
        0,
        layout.cx,
        layout.cy,
        radius
    );

    g.addColorStop(0,"rgba(91,28,74,.055)");
    g.addColorStop(.30,"rgba(61,19,59,.035)");
    g.addColorStop(.67,"rgba(18,7,27,.015)");
    g.addColorStop(1,"rgba(0,0,0,0)");

    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);

    ctx.globalCompositeOperation="lighter";

    for(const s of stars){
        const alpha=s.alpha*(.55+.45*Math.sin(t*.35+s.phase));

        ctx.globalAlpha=alpha;
        ctx.fillStyle="rgb(239,143,209)";

        const x=s.x*W;
        const y=s.y*H;

        if(s.size<1.4){
            ctx.fillRect(x,y,s.size,s.size);
        }else{
            ctx.drawImage(
                glowPink,
                x-s.size,
                y-s.size,
                s.size*2,
                s.size*2
            );
        }
    }

    ctx.globalAlpha=1;
}

function drawRays(t,layout,pulse){
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.lineCap="round";

    const maxDim=Math.max(W,H);

    for(const r of rays){
        const c=sampleCurve(r.u);

        const hx=layout.cx+c.x*layout.scale*pulse;
        const hy=layout.cy+c.y*layout.scale*pulse;

        const pulseRay=Math.pow(
            Math.max(0,Math.sin(t*r.speed+r.phase)),
            4
        );

        if(pulseRay<.01)continue;

        let ox=c.nx;
        let oy=c.ny;

        const start=r.start+
            Math.sin(t*.4+r.phase)*8;

        const length=maxDim*r.length*(.65+.35*pulseRay);

        const sx=hx+ox*start;
        const sy=hy+oy*start;

        const ex=sx+ox*length;
        const ey=sy+oy*length;

        const grad=ctx.createLinearGradient(sx,sy,ex,ey);
        grad.addColorStop(0,"rgba(255,145,213,.55)");
        grad.addColorStop(.25,"rgba(229,83,183,.22)");
        grad.addColorStop(1,"rgba(125,37,130,0)");

        ctx.globalAlpha=r.alpha*pulseRay;
        ctx.strokeStyle=grad;
        ctx.lineWidth=r.width;

        ctx.beginPath();
        ctx.moveTo(sx,sy);
        ctx.lineTo(ex,ey);
        ctx.stroke();
    }

    ctx.restore();
}

function drawDust(t,layout,pulse){
    ctx.save();
    ctx.globalCompositeOperation="lighter";

    ctx.fillStyle="rgba(245,161,217,1)";

    for(const p of dust){
        const c=sampleCurve(p.u);

        const drift=
            Math.sin(t*.33+p.phase)*layout.scale*.09;

        const r=p.radius+
            Math.sin(t*.17+p.phase)*.006;

        const x=
            layout.cx+
            c.x*layout.scale*r*pulse+
            c.nx*drift;

        const y=
            layout.cy+
            c.y*layout.scale*r*pulse+
            c.ny*drift;

        const shimmer=.5+.5*Math.sin(t*(.5+p.alpha)+p.phase);

        ctx.globalAlpha=p.alpha*(.45+.55*shimmer);

        if(p.hot){
            const s=p.size*2.4;
            ctx.drawImage(glowWhite,x-s/2,y-s/2,s,s);
        }else if(p.size>1.5){
            const s=p.size*2;
            ctx.drawImage(glowPink,x-s/2,y-s/2,s,s);
        }else{
            ctx.fillRect(x,y,p.size,p.size);
        }
    }

    ctx.restore();
}

function updateFlow(t,dt,layout,pulse){
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.lineCap="round";

    for(let tone=0;tone<3;tone++){
        const group=flowGroups[tone];

        ctx.beginPath();

        for(const p of group){
            p.px=p.x;
            p.py=p.y;

            p.u=normU(p.u+p.speed*dt);

            const q=targetPosition(p,t,layout,pulse);

            const dx=q.x-p.x;
            const dy=q.y-p.y;

            p.vx+=dx*.060;
            p.vy+=dy*.060;

            const swirl=
                Math.sin(t*.8+p.phase+p.u*TAU*7);

            p.vx+=q.tx*swirl*.012;
            p.vy+=q.ty*swirl*.012;

            p.vx*=.875;
            p.vy*=.875;

            p.x+=p.vx;
            p.y+=p.vy;

            const movement=Math.hypot(p.x-p.px,p.y-p.py);

            if(movement<12){
                ctx.moveTo(p.px,p.py);
                ctx.lineTo(p.x,p.y);
            }
        }

        ctx.globalAlpha=tone===0?.31:tone===1?.24:.14;
        ctx.strokeStyle=COLORS[tone];
        ctx.lineWidth=tone===0?.82:tone===1?.72:.60;
        ctx.stroke();

        ctx.globalAlpha=tone===0?.75:tone===1?.58:.38;
        ctx.fillStyle=COLORS[tone];

        for(let i=0;i<group.length;i+=2){
            const p=group[i];
            ctx.fillRect(
                p.x-p.size*.5,
                p.y-p.size*.5,
                p.size,
                p.size
            );
        }
    }

    for(const p of hotFlow){
        const q=.72+.28*Math.sin(t*2.7+p.phase);
        const s=p.hotSize*q;

        ctx.globalAlpha=.28+p.alpha*.34;

        ctx.drawImage(
            glowWhite,
            p.x-s/2,
            p.y-s/2,
            s,s
        );
    }

    ctx.restore();
}

function drawRibbons(t,layout,pulse){
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.lineCap="round";
    ctx.lineJoin="round";

    for(const r of ribbons){
        r.u=normU(r.u+r.speed/60);

        const steps=15;

        let previous=null;

        for(let i=0;i<steps;i++){
            const q=i/(steps-1);

            const u=normU(
                r.u-
                r.length*q*
                Math.sign(r.speed)
            );

            const c=sampleCurve(u);
            const w=localWidth(u,t,layout.scale);

            const offset=
                r.band*w+
                Math.sin(
                    u*TAU*13+
                    t*.8+
                    r.phase
                )*
                w*.12;

            const x=
                layout.cx+
                c.x*layout.scale*pulse+
                c.nx*offset;

            const y=
                layout.cy+
                c.y*layout.scale*pulse+
                c.ny*offset;

            if(previous){
                const alpha=(1-q)*(1-q)*r.alpha;

                ctx.globalAlpha=alpha;
                ctx.strokeStyle=
                    q<.3
                        ?"rgba(255,250,253,1)"
                        :"rgba(255,150,214,1)";

                ctx.lineWidth=r.width*(1-q*.65);

                ctx.beginPath();
                ctx.moveTo(previous.x,previous.y);
                ctx.lineTo(x,y);
                ctx.stroke();
            }

            previous={x,y};
        }
    }

    ctx.restore();
}

function spawnBurst(t,layout,pulse){
    const u=Math.random();
    const c=sampleCurve(u);

    const width=localWidth(u,t,layout.scale);
    const offset=gaussian()*width*.75;

    const x=
        layout.cx+
        c.x*layout.scale*pulse+
        c.nx*offset;

    const y=
        layout.cy+
        c.y*layout.scale*pulse+
        c.ny*offset;

    const outward=rand(22,95);
    const tangent=rand(-35,35);

    bursts.push({
        x,y,px:x,py:y,
        vx:c.nx*outward+c.tx*tangent,
        vy:c.ny*outward+c.ty*tangent,
        life:rand(.55,1.65),
        age:0,
        size:Math.random()<.92?rand(.45,1.15):rand(2.5,5.5),
        tone:Math.random()<.45?0:1,
        phase:rand(0,TAU)
    });
}

function updateBursts(t,dt,layout,pulse){
    burstAccumulator+=(W<700?75:165)*dt;

    while(burstAccumulator>=1){
        burstAccumulator--;
        spawnBurst(t,layout,pulse);
    }

    if(bursts.length>1500){
        bursts.splice(0,bursts.length-1500);
    }

    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.lineCap="round";

    for(let i=bursts.length-1;i>=0;i--){
        const p=bursts[i];

        p.age+=dt;

        if(p.age>=p.life){
            bursts.splice(i,1);
            continue;
        }

        p.px=p.x;
        p.py=p.y;

        const q=p.age/p.life;

        p.vx*=Math.pow(.982,dt*60);
        p.vy*=Math.pow(.982,dt*60);

        p.vx+=Math.sin(t*2+p.phase)*2.5*dt;
        p.vy+=Math.cos(t*1.7+p.phase)*2.0*dt;

        p.x+=p.vx*dt;
        p.y+=p.vy*dt;

        const fade=(1-q)*(1-q);

        ctx.globalAlpha=fade*.30;
        ctx.strokeStyle=COLORS[p.tone];
        ctx.lineWidth=.65;

        ctx.beginPath();
        ctx.moveTo(p.px,p.py);
        ctx.lineTo(p.x,p.y);
        ctx.stroke();

        ctx.globalAlpha=fade*.85;

        if(p.size<1.6){
            ctx.fillStyle=COLORS[p.tone];
            ctx.fillRect(p.x,p.y,p.size,p.size);
        }else{
            const s=p.size*(1+.5*q);
            ctx.drawImage(
                p.tone===0?glowWhite:glowPink,
                p.x-s/2,
                p.y-s/2,
                s,s
            );
        }
    }

    ctx.restore();
}

function bottomPoint(layout,pulse){
    const c=sampleCurve(.5);

    return {
        x:layout.cx+c.x*layout.scale*pulse,
        y:layout.cy+c.y*layout.scale*pulse
    };
}

function drawFloor(t,layout,pulse){
    const tip=bottomPoint(layout,pulse);

    const floorY=tip.y+Math.max(14,layout.scale*.62);

    const maxR=Math.min(
        W*(W<700?.62:.39),
        H*.47
    );

    const sy=W<700?.21:.19;

    ctx.save();
    ctx.globalCompositeOperation="lighter";

    const floorGlow=ctx.createRadialGradient(
        layout.cx,floorY,0,
        layout.cx,floorY,maxR*.72
    );

    floorGlow.addColorStop(0,"rgba(255,190,229,.08)");
    floorGlow.addColorStop(.28,"rgba(212,88,193,.025)");
    floorGlow.addColorStop(1,"rgba(100,30,120,0)");

    ctx.globalAlpha=1;
    ctx.fillStyle=floorGlow;
    ctx.fillRect(
        layout.cx-maxR,
        floorY-maxR*.25,
        maxR*2,
        maxR*.5
    );

    const spokes=W<700?40:64;

    for(let i=0;i<spokes;i++){
        const a=i/spokes*TAU;

        const x2=layout.cx+Math.cos(a)*maxR;
        const y2=floorY+Math.sin(a)*maxR*sy;

        const grad=ctx.createLinearGradient(
            layout.cx,floorY,x2,y2
        );

        grad.addColorStop(0,"rgba(255,205,236,.24)");
        grad.addColorStop(.23,"rgba(220,110,206,.11)");
        grad.addColorStop(1,"rgba(130,57,150,0)");

        ctx.globalAlpha=.22;
        ctx.strokeStyle=grad;
        ctx.lineWidth=.45;

        ctx.beginPath();
        ctx.moveTo(layout.cx,floorY);
        ctx.lineTo(x2,y2);
        ctx.stroke();
    }

    const ringCount=W<700?17:23;

    for(let ri=1;ri<=ringCount;ri++){
        const q=ri/ringCount;
        const base=maxR*Math.pow(q,1.43);
        const steps=190;

        ctx.beginPath();

        for(let i=0;i<=steps;i++){
            const a=i/steps*TAU;

            const petal=
                1+
                (.105*(1-q)+.018)*
                Math.sin(
                    a*8-
                    t*.42+
                    ri*.37
                );

            const fine=
                1+
                .015*
                Math.sin(
                    a*19+
                    t*.21+
                    ri
                );

            const r=base*petal*fine;

            const x=layout.cx+Math.cos(a)*r;
            const y=floorY+Math.sin(a)*r*sy;

            if(i===0)ctx.moveTo(x,y);
            else ctx.lineTo(x,y);
        }

        ctx.globalAlpha=.07+.23*(1-q);
        ctx.strokeStyle=
            ri<5
                ?"rgba(255,225,243,1)"
                :"rgba(212,118,211,1)";

        ctx.lineWidth=ri<5?.85:.5;
        ctx.stroke();
    }

    for(const d of floorDots){
        const r=d.r*maxR;

        const x=layout.cx+Math.cos(d.a)*r;
        const y=floorY+Math.sin(d.a)*r*sy;

        ctx.globalAlpha=d.alpha*(1-d.r*.7);
        ctx.fillStyle="rgba(245,183,228,1)";
        ctx.fillRect(x,y,d.size,d.size);
    }

    for(let i=0;i<6;i++){
        const breathe=
            1+
            Math.sin(t*1.25-i*.62)*.035;

        const rx=(9+i*10)*breathe;
        const ry=(2.0+i*1.9)*breathe;

        ctx.globalAlpha=.34-i*.042;
        ctx.strokeStyle=
            i<2
                ?"rgba(255,246,251,1)"
                :"rgba(255,147,215,1)";

        ctx.lineWidth=i<2?.95:.65;

        ctx.beginPath();
        ctx.ellipse(
            layout.cx,
            floorY,
            rx,ry,
            0,0,TAU
        );
        ctx.stroke();
    }

    drawTipStream(t,tip.x,tip.y,floorY,layout.scale);

    ctx.restore();
}

function drawTipStream(t,x,tipY,floorY,scale){
    const gap=floorY-tipY;

    if(gap<=0)return;

    ctx.save();
    ctx.globalCompositeOperation="lighter";

    for(const p of streamDust){
        const q=normU(p.q+t*.08);

        const middle=Math.sin(q*Math.PI);

        const y=tipY+gap*q;

        const spread=
            scale*.17*
            middle;

        const xx=
            x+
            Math.sin(
                p.phase+
                t*1.7+
                q*13
            )*
            spread+
            gaussian()*.08;

        ctx.globalAlpha=
            p.alpha*
            middle;

        if(p.size<1.5){
            ctx.fillStyle="rgba(255,225,242,1)";
            ctx.fillRect(xx,y,p.size,p.size);
        }else{
            const s=p.size;
            ctx.drawImage(
                glowWhite,
                xx-s/2,
                y-s/2,
                s,s
            );
        }
    }

    ctx.globalAlpha=.20;

    ctx.drawImage(
        glowWhite,
        x-scale*.55,
        floorY-scale*.55,
        scale*1.1,
        scale*1.1
    );

    ctx.restore();
}

function drawMist(layout){
    ctx.save();
    ctx.globalCompositeOperation="lighter";

    const s=Math.min(W,H)*.42;

    ctx.globalAlpha=.12;
    ctx.drawImage(
        glowSoft,
        layout.cx-s/2,
        layout.cy-s*.44,
        s,s
    );

    ctx.restore();
}

function drawVignette(){
    ctx.save();
    ctx.globalCompositeOperation="source-over";

    const r=Math.max(W,H)*.72;

    const g=ctx.createRadialGradient(
        W*.5,H*.44,
        Math.min(W,H)*.23,
        W*.5,H*.44,
        r
    );

    g.addColorStop(0,"rgba(0,0,0,0)");
    g.addColorStop(.62,"rgba(0,0,0,.025)");
    g.addColorStop(1,"rgba(0,0,0,.58)");

    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);

    ctx.restore();
}

function animate(now){
    requestAnimationFrame(animate);

    const dt=Math.min((now-lastTime)/1000,.033);
    lastTime=now;

    const t=now*.001;

    mouseX+=(targetMouseX-mouseX)*.025;
    mouseY+=(targetMouseY-mouseY)*.025;

    const layout=getLayout();
    const pulse=heartbeat(t);

    drawBackground(t,layout);
    drawMist(layout);
    drawRays(t,layout,pulse);
    drawFloor(t,layout,pulse);
    drawDust(t,layout,pulse);
    updateFlow(t,dt,layout,pulse);
    drawRibbons(t,layout,pulse);
    updateBursts(t,dt,layout,pulse);
    drawVignette();

    firstFrame=false;
}

addEventListener("pointermove",e=>{
    targetMouseX=(e.clientX/W-.5)*2;
    targetMouseY=(e.clientY/H-.5)*2;
},{passive:true});

addEventListener("pointerleave",()=>{
    targetMouseX=0;
    targetMouseY=0;
},{passive:true});

let resizeTimer=null;

addEventListener("resize",()=>{
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(resize,120);
},{passive:true});

buildCurve();
createSprites();
resize();
requestAnimationFrame(animate);

})();
</script>
</body>
</html>
