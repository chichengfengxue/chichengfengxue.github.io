<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Love</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#050208}
body{background:radial-gradient(circle at 50% 36%,#21101f 0,#0c0612 38%,#050208 72%)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.home{
    position:fixed;
    left:22px;
    top:20px;
    z-index:10;
    color:rgba(255,225,242,.24);
    text-decoration:none;
    font:10px Arial,sans-serif;
    letter-spacing:3px;
    transition:.35s
}
.home:hover{color:#fff3fa;text-shadow:0 0 16px #ff75c4}
</style>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}

<body>

<a class="home" href="/">HOME</a>

<script type="module">
import * as THREE from "three";
import {EffectComposer} from "three/addons/postprocessing/EffectComposer.js";
import {RenderPass} from "three/addons/postprocessing/RenderPass.js";
import {UnrealBloomPass} from "three/addons/postprocessing/UnrealBloomPass.js";
import {OutputPass} from "three/addons/postprocessing/OutputPass.js";

const MOBILE=innerWidth<720;

const COUNT=MOBILE?18000:36000;
const BURST_COUNT=MOBILE?2600:6500;
const STAR_COUNT=MOBILE?650:1500;

const LOOP=10.4;
const FLOOR_Y=-11.8;
const HEART_Y=2.8;

const DPR=Math.min(
    devicePixelRatio||1,
    MOBILE?1.25:1.65
);

/* ============================================================
   SCENE
============================================================ */

const scene=new THREE.Scene();

scene.background=
    new THREE.Color(0x050208);

scene.fog=
    new THREE.FogExp2(
        0x050208,
        .014
    );

const camera=
    new THREE.PerspectiveCamera(
        MOBILE?57:48,
        innerWidth/innerHeight,
        .1,
        130
    );

camera.position.set(
    0,
    MOBILE?4.2:4.6,
    MOBILE?43:38.5
);

camera.lookAt(
    0,
    .5,
    0
);

const renderer=
    new THREE.WebGLRenderer({
        antialias:false,
        powerPreference:"high-performance"
    });

renderer.setPixelRatio(DPR);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.outputColorSpace=
    THREE.SRGBColorSpace;

renderer.toneMapping=
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure=
    1.08;

document.body.appendChild(
    renderer.domElement
);

/* ============================================================
   BLOOM
============================================================ */

const composer=
    new EffectComposer(renderer);

composer.addPass(
    new RenderPass(
        scene,
        camera
    )
);

const bloom=
    new UnrealBloomPass(
        new THREE.Vector2(
            innerWidth,
            innerHeight
        ),
        1.45,
        .72,
        .07
    );

bloom.threshold=.025;

bloom.strength=
    MOBILE?1.08:1.35;

bloom.radius=.72;

composer.addPass(bloom);

composer.addPass(
    new OutputPass()
);

/* ============================================================
   HEART
============================================================ */

const heartGroup=
    new THREE.Group();

heartGroup.position.y=
    HEART_Y;

scene.add(
    heartGroup
);

function heart(t){

    const s=
        Math.sin(t);

    return [
        16*s*s*s,

        13*Math.cos(t)
        -5*Math.cos(2*t)
        -2*Math.cos(3*t)
        -Math.cos(4*t)
    ];
}

/*
 * 参考常见社交平台动态粒子心实现里的
 * scatter_inside 思路。
 *
 * 不只是沿轮廓撒粒子，
 * 而是把一部分轮廓粒子向内部随机扩散。
 */

function scatterInside(
    x,
    y,
    beta
){

    const rx=
        Math.min(
            .92,
            -beta*
            Math.log(
                Math.max(
                    1e-5,
                    Math.random()
                )
            )
        );

    const ry=
        Math.min(
            .92,
            -beta*
            Math.log(
                Math.max(
                    1e-5,
                    Math.random()
                )
            )
        );

    return [
        x-rx*x,
        y-ry*y
    ];
}

function randn(){

    let u=0;
    let v=0;

    while(u===0)
        u=Math.random();

    while(v===0)
        v=Math.random();

    return (
        Math.sqrt(
            -2*Math.log(u)
        )*
        Math.cos(
            Math.PI*2*v
        )
    );
}

/* ============================================================
   BUILD HEART PARTICLES
============================================================ */

function buildHeartData(count){

    const heartPos=
        new Float32Array(
            count*3
        );

    const columnPos=
        new Float32Array(
            count*3
        );

    const seed=
        new Float32Array(
            count
        );

    const size=
        new Float32Array(
            count
        );

    const edge=
        new Float32Array(
            count
        );

    const colorMix=
        new Float32Array(
            count
        );

    for(
        let i=0;
        i<count;
        i++
    ){

        const t=
            Math.random()*
            Math.PI*2;

        let [x,y]=
            heart(t);

        const mode=
            Math.random();

        let e=0;
        let z=0;

        /*
         * 外轮廓主粒子
         */
        if(mode<.43){

            x+=randn()*.18;
            y+=randn()*.18;

            z=
                randn()*.52;

            e=1;

        /*
         * 边缘扩散层
         */
        }else if(mode<.82){

            [x,y]=
                scatterInside(
                    x,
                    y,
                    .065+
                    Math.random()*.055
                );

            x+=randn()*.10;
            y+=randn()*.10;

            z=
                randn()*.85;

            e=.72;

        /*
         * 内部星尘
         */
        }else{

            [x,y]=
                scatterInside(
                    x,
                    y,
                    .18+
                    Math.random()*.16
                );

            x+=randn()*.10;
            y+=randn()*.10;

            z=
                randn()*1.35;

            e=.30;
        }

        const scale=.66;

        x*=scale;
        y*=scale;
        z*=scale;

        const j=
            i*3;

        heartPos[j]=x;
        heartPos[j+1]=y;
        heartPos[j+2]=z;

        /*
         * 对应的“竖直能量柱”目标位置
         */
        const a=
            Math.random()*
            Math.PI*2;

        const rr=
            Math.pow(
                Math.random(),
                1.9
            )*
            (
                e>.7
                    ?.70
                    :1.12
            );

        columnPos[j]=
            Math.cos(a)*rr;

        columnPos[j+1]=
            THREE.MathUtils.lerp(
                -8.4,
                8.2,
                Math.random()
            );

        columnPos[j+2]=
            Math.sin(a)*rr;

        seed[i]=
            Math.random();

        edge[i]=e;

        colorMix[i]=
            Math.random();

        const s=
            Math.random();

        /*
         * 绝大多数极小粒子
         */
        size[i]=
            s<.83
                ?.055+
                Math.random()*.055

            :s<.98
                ?.11+
                Math.random()*.07

            :.20+
            Math.random()*.12;
    }

    return {
        heartPos,
        columnPos,
        seed,
        size,
        edge,
        colorMix
    };
}

const heartData=
    buildHeartData(
        COUNT
    );

const heartGeo=
    new THREE.BufferGeometry();

heartGeo.setAttribute(
    "position",
    new THREE.BufferAttribute(
        new Float32Array(
            COUNT*3
        ),
        3
    )
);

heartGeo.setAttribute(
    "aHeart",
    new THREE.BufferAttribute(
        heartData.heartPos,
        3
    )
);

heartGeo.setAttribute(
    "aColumn",
    new THREE.BufferAttribute(
        heartData.columnPos,
        3
    )
);

heartGeo.setAttribute(
    "aSeed",
    new THREE.BufferAttribute(
        heartData.seed,
        1
    )
);

heartGeo.setAttribute(
    "aSize",
    new THREE.BufferAttribute(
        heartData.size,
        1
    )
);

heartGeo.setAttribute(
    "aEdge",
    new THREE.BufferAttribute(
        heartData.edge,
        1
    )
);

heartGeo.setAttribute(
    "aColorMix",
    new THREE.BufferAttribute(
        heartData.colorMix,
        1
    )
);

/* ============================================================
   GLSL COMMON
============================================================ */

const common=`

float smoother(
    float a,
    float b,
    float x
){
    float t=
        clamp(
            (x-a)/(b-a),
            0.0,
            1.0
        );

    return
        t*t*t*
        (
            t*
            (
                t*6.0-15.0
            )
            +10.0
        );
}

float gaussPulse(
    float x,
    float c,
    float w
){
    float q=
        (x-c)/w;

    return
        exp(-q*q);
}

mat2 rot(float a){

    float c=cos(a);
    float s=sin(a);

    return mat2(
        c,-s,
        s,c
    );
}

`;

/* ============================================================
   HEART VERTEX SHADER
============================================================ */

const heartVertex=`

${common}

attribute vec3 aHeart;
attribute vec3 aColumn;

attribute float aSeed;
attribute float aSize;
attribute float aEdge;
attribute float aColorMix;

uniform float uTime;
uniform float uPixelRatio;
uniform float uLayerSize;
uniform float uLayerAlpha;

varying vec3 vColor;
varying float vAlpha;

void main(){

    float ph=
        mod(
            uTime,
            ${LOOP.toFixed(3)}
        );

    /*
     * ========================================================
     * 动画时间线
     *
     * 0 - 3.8    正面稳定
     * 3.8 - 5.2  向侧面旋转
     * 5.2 - 6.1  压缩成竖直粒子柱
     * 6.1 - 6.8  粒子柱
     * 6.8 - 8.1  重新形成心形
     * 8.1 - 8.85 转回正面
     * 8.85+      爆发
     * ========================================================
     */

    float collapse=
        smoother(
            5.20,
            6.10,
            ph
        );

    float reform=
        smoother(
            6.80,
            8.10,
            ph
        );

    float heartMix=
        clamp(
            1.0-
            collapse+
            reform,
            0.0,
            1.0
        );

    vec3 hp=
        aHeart;

    vec3 cp=
        aColumn;

    /*
     * 微弱呼吸
     */

    float breathe=
        1.0+
        sin(
            uTime*1.15+
            aSeed*4.0
        )*.008;

    /*
     * 双心跳
     */

    float beat1=
        gaussPulse(
            mod(
                uTime,
                1.48
            ),
            .12,
            .075
        );

    float beat2=
        .48*
        gaussPulse(
            mod(
                uTime,
                1.48
            ),
            .30,
            .085
        );

    float beat=
        (
            beat1+
            beat2
        )*
        heartMix;

    hp.xy*=
        breathe*
        (
            1.0+
            beat*.025
        );

    /*
     * 粒子不断微微流动
     */

    float jitterAmp=
        mix(
            .020,
            .085,
            aEdge
        );

    hp.x+=
        sin(
            uTime*1.7+
            aSeed*41.0+
            hp.y*.65
        )*
        jitterAmp;

    hp.y+=
        cos(
            uTime*1.35+
            aSeed*31.0+
            hp.x*.55
        )*
        jitterAmp;

    hp.z+=
        sin(
            uTime*.9+
            aSeed*27.0
        )*
        jitterAmp*.65;

    /*
     * ========================================================
     * 3D 旋转
     * ========================================================
     */

    float rotY=
        .025*
        sin(ph*.55);

    /*
     * 开始转向侧面
     */

    if(
        ph>=3.80 &&
        ph<5.20
    ){

        rotY=
            mix(
                .02,
                1.43,
                smoother(
                    3.80,
                    5.20,
                    ph
                )
            );

    /*
     * 保持侧面
     */

    }else if(
        ph>=5.20 &&
        ph<6.80
    ){

        rotY=
            1.43;

    /*
     * 心开始重新出现
     */

    }else if(
        ph>=6.80 &&
        ph<8.10
    ){

        rotY=
            mix(
                1.43,
                .90,
                smoother(
                    6.80,
                    8.10,
                    ph
                )
            );

    /*
     * 转回正面
     */

    }else if(
        ph>=8.10 &&
        ph<8.85
    ){

        rotY=
            mix(
                .90,
                .02,
                smoother(
                    8.10,
                    8.85,
                    ph
                )
            );

    }else if(
        ph>=8.85
    ){

        rotY=
            .02;
    }

    hp.xz=
        rot(rotY)*
        hp.xz;

    /*
     * ========================================================
     * 能量柱本身不是死的
     *
     * 会有螺旋扰动
     * ========================================================
     */

    float columnTwist=
        uTime*.72+
        aSeed*6.28318;

    cp.xz=
        rot(
            columnTwist*.18
        )*
        cp.xz;

    cp.x+=
        sin(
            cp.y*.72-
            uTime*2.2+
            aSeed*16.0
        )*.10;

    cp.z+=
        cos(
            cp.y*.64+
            uTime*1.7+
            aSeed*13.0
        )*.10;

    /*
     * 心 <-> 能量柱
     */

    vec3 p=
        mix(
            cp,
            hp,
            heartMix
        );

    /*
     * 重组完成后的能量冲击
     */

    float reveal=
        gaussPulse(
            ph,
            8.95,
            .34
        );

    p.xy*=
        1.0+
        reveal*
        .035*
        aEdge;

    vec4 mv=
        modelViewMatrix*
        vec4(
            p,
            1.0
        );

    float perspective=
        44.0/
        max(
            7.0,
            -mv.z
        );

    float hot=
        smoothstep(
            .965,
            1.0,
            aSeed
        )*.70+
        reveal*
        .55*
        aEdge;

    gl_PointSize=
        clamp(
            aSize*
            uLayerSize*
            uPixelRatio*
            perspective,
            .45,
            8.0
        );

    gl_Position=
        projectionMatrix*
        mv;

    /*
     * ========================================================
     * COLOR
     * ========================================================
     */

    vec3 purple=
        vec3(
            .63,
            .20,
            .66
        );

    vec3 pink=
        vec3(
            1.0,
            .34,
            .72
        );

    vec3 pale=
        vec3(
            1.0,
            .74,
            .90
        );

    vec3 white=
        vec3(
            1.0,
            .985,
            1.0
        );

    vec3 col=
        mix(
            purple,
            pink,
            .52+
            .30*
            aColorMix
        );

    col=
        mix(
            col,
            pale,
            aEdge*.58
        );

    col=
        mix(
            col,
            white,
            clamp(
                hot,
                0.0,
                1.0
            )
        );

    float twinkle=
        .70+
        .30*
        sin(
            uTime*
            (
                1.4+
                aSeed*2.4
            )+
            aSeed*39.0
        );

    float columnAlpha=
        mix(
            .48,
            .86,
            aEdge
        );

    float heartAlpha=
        mix(
            .24,
            1.0,
            aEdge
        );

    vAlpha=
        mix(
            columnAlpha,
            heartAlpha,
            heartMix
        )*
        twinkle*
        uLayerAlpha;

    vColor=col;
}

`;

/* ============================================================
   HEART FRAGMENT
============================================================ */

const heartFrag=`

precision highp float;

varying vec3 vColor;
varying float vAlpha;

uniform float uSoft;

void main(){

    vec2 p=
        gl_PointCoord-
        .5;

    float d=
        length(p);

    if(d>.5)
        discard;

    float core=
        exp(
            -d*d*44.0
        );

    float soft=
        exp(
            -d*d*9.0
        );

    float a=
        mix(
            core,
            soft,
            uSoft
        )*
        vAlpha;

    gl_FragColor=
        vec4(
            vColor,
            a
        );
}

`;

function makeHeartMaterial(
    layerSize,
    layerAlpha,
    soft
){

    return new THREE.ShaderMaterial({

        vertexShader:
            heartVertex,

        fragmentShader:
            heartFrag,

        uniforms:{

            uTime:{
                value:0
            },

            uPixelRatio:{
                value:DPR
            },

            uLayerSize:{
                value:layerSize
            },

            uLayerAlpha:{
                value:layerAlpha
            },

            uSoft:{
                value:soft
            }
        },

        transparent:true,

        depthWrite:false,

        depthTest:true,

        blending:
            THREE.AdditiveBlending
    });
}

/*
 * 大范围极淡光晕
 */

const auraMat=
    makeHeartMaterial(
        4.6,
        .065,
        1
    );

/*
 * 主体
 */

const heartMat=
    makeHeartMaterial(
        1,
        .96,
        .14
    );

const aura=
    new THREE.Points(
        heartGeo,
        auraMat
    );

const heartPoints=
    new THREE.Points(
        heartGeo,
        heartMat
    );

aura.frustumCulled=false;

heartPoints.frustumCulled=false;

heartGroup.add(
    aura,
    heartPoints
);

/* ============================================================
   EXPLOSION
============================================================ */

function buildBurstData(count){

    const source=
        new Float32Array(
            count*3
        );

    const dir=
        new Float32Array(
            count*3
        );

    const seed=
        new Float32Array(
            count
        );

    const length=
        new Float32Array(
            count
        );

    const size=
        new Float32Array(
            count
        );

    for(
        let i=0;
        i<count;
        i++
    ){

        const t=
            Math.random()*
            Math.PI*2;

        let [x,y]=
            heart(t);

        const sc=.66;

        x*=sc;
        y*=sc;

        x+=randn()*.28;
        y+=randn()*.28;

        const z=
            randn()*.75;

        const j=i*3;

        source[j]=x;
        source[j+1]=y;
        source[j+2]=z;

        /*
         * 粒子主要向外，
         * 同时具有切向偏移。
         */

        const l=
            Math.hypot(
                x,
                y
            )||1;

        let dx=x/l;
        let dy=y/l;

        let dz=
            randn()*.22;

        const swirl=
            (
                Math.random()-.5
            )*.22;

        const tx=-dy;
        const ty=dx;

        dx+=tx*swirl;
        dy+=ty*swirl;

        const dl=
            Math.hypot(
                dx,
                dy,
                dz
            )||1;

        dir[j]=dx/dl;
        dir[j+1]=dy/dl;
        dir[j+2]=dz/dl;

        seed[i]=
            Math.random();

        length[i]=
            5+
            Math.pow(
                Math.random(),
                .45
            )*19;

        size[i]=
            .045+
            Math.random()*.075;
    }

    return {
        source,
        dir,
        seed,
        length,
        size
    };
}

const burstData=
    buildBurstData(
        BURST_COUNT
    );

const burstGeo=
    new THREE.BufferGeometry();

burstGeo.setAttribute(
    "position",
    new THREE.BufferAttribute(
        new Float32Array(
            BURST_COUNT*3
        ),
        3
    )
);

burstGeo.setAttribute(
    "aSource",
    new THREE.BufferAttribute(
        burstData.source,
        3
    )
);

burstGeo.setAttribute(
    "aDir",
    new THREE.BufferAttribute(
        burstData.dir,
        3
    )
);

burstGeo.setAttribute(
    "aSeed",
    new THREE.BufferAttribute(
        burstData.seed,
        1
    )
);

burstGeo.setAttribute(
    "aLength",
    new THREE.BufferAttribute(
        burstData.length,
        1
    )
);

burstGeo.setAttribute(
    "aSize",
    new THREE.BufferAttribute(
        burstData.size,
        1
    )
);

/* ============================================================
   EXPLOSION SHADER
============================================================ */

const burstVertex=`

${common}

attribute vec3 aSource;
attribute vec3 aDir;

attribute float aSeed;
attribute float aLength;
attribute float aSize;

uniform float uTime;
uniform float uPixelRatio;
uniform float uTrail;

varying vec3 vColor;
varying float vAlpha;

void main(){

    float ph=
        mod(
            uTime,
            ${LOOP.toFixed(3)}
        );

    /*
     * 爆发时间
     */

    float q=
        clamp(
            (
                ph-
                8.55
            )/
            1.12,
            0.0,
            1.0
        );

    /*
     * 四层历史轨迹
     *
     * 不是一条呆板直线，
     * 而是几份不同时间的粒子。
     */

    float local=
        clamp(
            q-
            uTrail*
            (
                .035+
                .055*
                aSeed
            ),
            0.0,
            1.0
        );

    float motion=
        pow(
            local,
            .72
        );

    float fade=
        smoother(
            0.0,
            .12,
            local
        )*
        (
            1.0-
            smoother(
                .58,
                1.0,
                local
            )
        );

    vec3 p=
        aSource+
        aDir*
        aLength*
        motion;

    /*
     * 爆射路径略微弯曲
     */

    float curve=
        sin(
            local*
            3.14159
        )*
        aLength*
        (
            .02+
            .05*
            aSeed
        );

    p.x+=
        -aDir.y*
        curve;

    p.y+=
        aDir.x*
        curve;

    p.z+=
        sin(
            aSeed*25.0+
            local*8.0
        )*
        curve*.35;

    vec4 mv=
        modelViewMatrix*
        vec4(
            p,
            1.0
        );

    float perspective=
        44.0/
        max(
            7.0,
            -mv.z
        );

    gl_PointSize=
        clamp(
            aSize*
            uPixelRatio*
            perspective*
            (
                1.0-
                uTrail*.20
            ),
            .45,
            3.0
        );

    gl_Position=
        projectionMatrix*
        mv;

    float hot=
        smoothstep(
            .93,
            1.0,
            aSeed
        );

    vColor=
        mix(
            vec3(
                1.0,
                .34,
                .72
            ),
            vec3(
                1.0,
                .95,
                .99
            ),
            hot
        );

    vAlpha=
        fade*
        (
            .18+
            .62*
            aSeed
        )*
        (
            1.0-
            uTrail*.19
        );
}

`;

const burstFrag=`

precision highp float;

varying vec3 vColor;
varying float vAlpha;

void main(){

    vec2 p=
        gl_PointCoord-
        .5;

    float d=
        length(p);

    if(d>.5)
        discard;

    float a=
        exp(
            -d*d*30.0
        )*
        vAlpha;

    gl_FragColor=
        vec4(
            vColor,
            a
        );
}

`;

function makeBurstMaterial(trail){

    return new THREE.ShaderMaterial({

        vertexShader:
            burstVertex,

        fragmentShader:
            burstFrag,

        uniforms:{

            uTime:{
                value:0
            },

            uPixelRatio:{
                value:DPR
            },

            uTrail:{
                value:trail
            }
        },

        transparent:true,

        depthWrite:false,

        blending:
            THREE.AdditiveBlending
    });
}

/*
 * 四份不同时间偏移，
 * 形成真正的拖尾。
 */

const burstMats=[];

for(
    const trail of [
        0,
        1,
        2,
        3
    ]
){

    const material=
        makeBurstMaterial(
            trail
        );

    burstMats.push(
        material
    );

    const particles=
        new THREE.Points(
            burstGeo,
            material
        );

    particles.frustumCulled=
        false;

    particles.position.y=
        HEART_Y;

    scene.add(
        particles
    );
}

/* ============================================================
   ORBIT RINGS
============================================================ */

function createOrbitSystem(){

    const group=
        new THREE.Group();

    group.position.y=
        HEART_Y;

    scene.add(
        group
    );

    const rings=[];

    const ringInfo=[

        {
            r:6.7,
            y:-3.4,
            tilt:.30,
            speed:.68,
            phase:.2
        },

        {
            r:7.6,
            y:-.8,
            tilt:-.22,
            speed:-.54,
            phase:1.8
        },

        {
            r:7.0,
            y:2.0,
            tilt:.28,
            speed:.61,
            phase:3.2
        },

        {
            r:5.8,
            y:4.5,
            tilt:-.20,
            speed:-.72,
            phase:4.7
        }
    ];

    for(
        const info of
        ringInfo
    ){

        const n=
            MOBILE
                ?260
                :430;

        const pos=
            new Float32Array(
                n*3
            );

        const seed=
            new Float32Array(
                n
            );

        for(
            let i=0;
            i<n;
            i++
        ){

            const a=
                i/n*
                Math.PI*2;

            pos[i*3]=
                Math.cos(a)*
                info.r;

            pos[i*3+1]=
                Math.sin(
                    a*2+
                    info.phase
                )*.18;

            pos[i*3+2]=
                Math.sin(a)*
                info.r;

            seed[i]=
                i/n;
        }

        const geometry=
            new THREE.BufferGeometry();

        geometry.setAttribute(
            "position",
            new THREE.BufferAttribute(
                pos,
                3
            )
        );

        geometry.setAttribute(
            "aSeed",
            new THREE.BufferAttribute(
                seed,
                1
            )
        );

        const vertex=`

        attribute float aSeed;

        uniform float uTime;
        uniform float uPhase;
        uniform float uPixelRatio;

        varying float vAlpha;
        varying vec3 vColor;

        void main(){

            float ph=
                mod(
                    uTime,
                    ${LOOP.toFixed(3)}
                );

            /*
             * 在爱心转侧面前出现，
             * 重组成正面后消失。
             */

            float appear=
                smoothstep(
                    3.55,
                    4.55,
                    ph
                );

            float disappear=
                1.0-
                smoothstep(
                    8.25,
                    9.10,
                    ph
                );

            float vis=
                appear*
                disappear;

            vec3 p=
                position;

            /*
             * 光环不是完全固定的圆
             */

            p.y+=
                sin(
                    aSeed*25.1327-
                    uTime*1.2+
                    uPhase
                )*.10;

            vec4 mv=
                modelViewMatrix*
                vec4(
                    p,
                    1.0
                );

            gl_PointSize=
                clamp(
                    (
                        .055+
                        .035*
                        sin(
                            aSeed*40.0+
                            uTime*2.0
                        )
                    )*
                    uPixelRatio*
                    45.0/
                    max(
                        7.0,
                        -mv.z
                    ),
                    .45,
                    2.3
                );

            gl_Position=
                projectionMatrix*
                mv;

            vAlpha=
                vis*
                (
                    .32+
                    .50*
                    pow(
                        .5+
                        .5*
                        sin(
                            aSeed*31.0+
                            uTime*2.4
                        ),
                        3.0
                    )
                );

            vColor=
                mix(
                    vec3(
                        1.0,
                        .34,
                        .72
                    ),
                    vec3(
                        1.0,
                        .90,
                        .97
                    ),
                    pow(
                        .5+
                        .5*
                        sin(
                            aSeed*17.0+
                            uPhase
                        ),
                        5.0
                    )
                );
        }

        `;

        const fragment=`

        precision highp float;

        varying float vAlpha;
        varying vec3 vColor;

        void main(){

            vec2 p=
                gl_PointCoord-
                .5;

            float d=
                length(p);

            if(d>.5)
                discard;

            gl_FragColor=
                vec4(
                    vColor,
                    exp(
                        -d*d*26.0
                    )*
                    vAlpha
                );
        }

        `;

        const material=
            new THREE.ShaderMaterial({

                vertexShader:
                    vertex,

                fragmentShader:
                    fragment,

                uniforms:{

                    uTime:{
                        value:0
                    },

                    uPhase:{
                        value:
                            info.phase
                    },

                    uPixelRatio:{
                        value:DPR
                    }
                },

                transparent:true,

                depthWrite:false,

                blending:
                    THREE.AdditiveBlending
            });

        const points=
            new THREE.Points(
                geometry,
                material
            );

        points.position.y=
            info.y;

        points.rotation.x=
            info.tilt;

        points.userData=
            info;

        points.frustumCulled=
            false;

        group.add(
            points
        );

        rings.push(
            points
        );
    }

    return {
        group,
        rings
    };
}

const orbit=
    createOrbitSystem();

/* ============================================================
   FLOOR
============================================================ */

function createFloor(){

    const group=
        new THREE.Group();

    scene.add(group);

    const materialFar=
        new THREE.LineBasicMaterial({

            color:
                0x9e4fa9,

            transparent:true,

            opacity:.11,

            depthWrite:false,

            blending:
                THREE.AdditiveBlending
        });

    const materialNear=
        new THREE.LineBasicMaterial({

            color:
                0xf3b0dc,

            transparent:true,

            opacity:.26,

            depthWrite:false,

            blending:
                THREE.AdditiveBlending
        });

    /*
     * 花瓣式波纹
     */

    const ringCount=
        MOBILE
            ?18
            :27;

    for(
        let ri=1;
        ri<=ringCount;
        ri++
    ){

        const q=
            ri/ringCount;

        const base=
            .55+
            Math.pow(
                q,
                1.28
            )*23;

        const points=[];

        const segments=
            MOBILE
                ?110
                :180;

        for(
            let i=0;
            i<segments;
            i++
        ){

            const a=
                i/
                segments*
                Math.PI*2;

            const petal=
                1+
                (
                    .16*
                    (1-q)+
                    .025
                )*
                Math.sin(
                    a*12+
                    ri*.47
                );

            const fine=
                1+
                .014*
                Math.sin(
                    a*29+
                    ri
                );

            const r=
                base*
                petal*
                fine;

            points.push(

                new THREE.Vector3(

                    Math.cos(a)*r,

                    FLOOR_Y,

                    Math.sin(a)*r
                )
            );
        }

        const geometry=
            new THREE.BufferGeometry()
            .setFromPoints(
                points
            );

        group.add(

            new THREE.LineLoop(

                geometry,

                ri<6
                    ?materialNear
                    :materialFar
            )
        );
    }

    /*
     * 放射线
     */

    const spokes=[];

    const spokeCount=
        MOBILE
            ?38
            :58;

    for(
        let i=0;
        i<spokeCount;
        i++
    ){

        const a=
            i/
            spokeCount*
            Math.PI*2;

        spokes.push(

            0,
            FLOOR_Y,
            0,

            Math.cos(a)*24,
            FLOOR_Y,
            Math.sin(a)*24
        );
    }

    const spokeGeo=
        new THREE.BufferGeometry();

    spokeGeo.setAttribute(

        "position",

        new THREE.Float32BufferAttribute(
            spokes,
            3
        )
    );

    group.add(

        new THREE.LineSegments(

            spokeGeo,

            new THREE.LineBasicMaterial({

                color:
                    0x8e4a9b,

                transparent:true,

                opacity:.065,

                depthWrite:false,

                blending:
                    THREE.AdditiveBlending
            })
        )
    );

    /*
     * 地面点阵
     */

    const dots=
        MOBILE
            ?2200
            :5200;

    const dp=
        new Float32Array(
            dots*3
        );

    const dc=
        new Float32Array(
            dots*3
        );

    for(
        let i=0;
        i<dots;
        i++
    ){

        const r=
            Math.sqrt(
                Math.random()
            )*23;

        const a=
            Math.random()*
            Math.PI*2;

        dp[i*3]=
            Math.cos(a)*r;

        dp[i*3+1]=
            FLOOR_Y+.01;

        dp[i*3+2]=
            Math.sin(a)*r;

        const near=
            1-r/23;

        dc[i*3]=
            .52+
            .42*near;

        dc[i*3+1]=
            .24+
            .42*near;

        dc[i*3+2]=
            .65+
            .33*near;
    }

    const dotGeo=
        new THREE.BufferGeometry();

    dotGeo.setAttribute(

        "position",

        new THREE.BufferAttribute(
            dp,
            3
        )
    );

    dotGeo.setAttribute(

        "color",

        new THREE.BufferAttribute(
            dc,
            3
        )
    );

    group.add(

        new THREE.Points(

            dotGeo,

            new THREE.PointsMaterial({

                size:.045,

                vertexColors:true,

                transparent:true,

                opacity:.45,

                depthWrite:false,

                blending:
                    THREE.AdditiveBlending
            })
        )
    );

    /*
     * 中央能量波纹
     */

    const center=
        new THREE.Group();

    center.position.y=
        FLOOR_Y+.025;

    for(
        let i=0;
        i<7;
        i++
    ){

        const r=
            .55+
            i*.54;

        const points=[];

        for(
            let j=0;
            j<150;
            j++
        ){

            const a=
                j/
                150*
                Math.PI*2;

            points.push(

                new THREE.Vector3(

                    Math.cos(a)*r,

                    0,

                    Math.sin(a)*r
                )
            );
        }

        const geometry=
            new THREE.BufferGeometry()
            .setFromPoints(
                points
            );

        center.add(

            new THREE.LineLoop(

                geometry,

                new THREE.LineBasicMaterial({

                    color:
                        i<2
                            ?0xffe5f5
                            :0xdd72c2,

                    transparent:true,

                    opacity:
                        .33-
                        i*.035,

                    depthWrite:false,

                    blending:
                        THREE.AdditiveBlending
                })
            )
        );
    }

    group.add(center);

    return {
        group,
        center
    };
}

const floor=
    createFloor();

/* ============================================================
   BACKGROUND STARS
============================================================ */

function createStars(){

    const position=
        new Float32Array(
            STAR_COUNT*3
        );

    const color=
        new Float32Array(
            STAR_COUNT*3
        );

    for(
        let i=0;
        i<STAR_COUNT;
        i++
    ){

        position[i*3]=
            (
                Math.random()-.5
            )*90;

        position[i*3+1]=
            (
                Math.random()-.5
            )*58+2;

        position[i*3+2]=
            -10-
            Math.random()*45;

        const b=
            .22+
            Math.random()*.42;

        color[i*3]=b;

        color[i*3+1]=
            b*.48;

        color[i*3+2]=
            b*.84;
    }

    const geometry=
        new THREE.BufferGeometry();

    geometry.setAttribute(

        "position",

        new THREE.BufferAttribute(
            position,
            3
        )
    );

    geometry.setAttribute(

        "color",

        new THREE.BufferAttribute(
            color,
            3
        )
    );

    const stars=
        new THREE.Points(

            geometry,

            new THREE.PointsMaterial({

                size:.07,

                vertexColors:true,

                transparent:true,

                opacity:.60,

                depthWrite:false,

                blending:
                    THREE.AdditiveBlending
            })
        );

    scene.add(stars);

    return stars;
}

const stars=
    createStars();

/* ============================================================
   POINTER
============================================================ */

const pointer={
    x:0,
    y:0,
    tx:0,
    ty:0
};

addEventListener(
    "pointermove",
    e=>{

        pointer.tx=
            (
                e.clientX/
                innerWidth-
                .5
            )*2;

        pointer.ty=
            (
                e.clientY/
                innerHeight-
                .5
            )*2;

    },
    {
        passive:true
    }
);

addEventListener(
    "pointerleave",
    ()=>{

        pointer.tx=0;
        pointer.ty=0;

    },
    {
        passive:true
    }
);

/* ============================================================
   RESIZE
============================================================ */

addEventListener(
    "resize",
    ()=>{

        const mobile=
            innerWidth<720;

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.fov=
            mobile
                ?57
                :48;

        camera.position.z=
            mobile
                ?43
                :38.5;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

        composer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

/* ============================================================
   ANIMATION
============================================================ */

const clock=
    new THREE.Clock();

function animate(){

    requestAnimationFrame(
        animate
    );

    const t=
        clock.getElapsedTime();

    const phase=
        t%LOOP;

    /*
     * Heart
     */

    heartMat
    .uniforms
    .uTime
    .value=t;

    auraMat
    .uniforms
    .uTime
    .value=t;

    /*
     * Burst
     */

    for(
        const material of
        burstMats
    ){

        material
        .uniforms
        .uTime
        .value=t;
    }

    /*
     * Orbit
     */

    for(
        const ring of
        orbit.rings
    ){

        ring
        .material
        .uniforms
        .uTime
        .value=t;

        ring.rotation.y=
            t*
            ring.userData.speed+
            ring.userData.phase;
    }

    /*
     * Pointer parallax
     */

    pointer.x+=
        (
            pointer.tx-
            pointer.x
        )*.025;

    pointer.y+=
        (
            pointer.ty-
            pointer.y
        )*.025;

    camera.position.x+=
        (
            pointer.x*.34-
            camera.position.x
        )*.025;

    camera.position.y+=
        (
            (
                MOBILE
                    ?4.2
                    :4.6
            )
            -
            pointer.y*.18
            -
            camera.position.y
        )*.025;

    camera.lookAt(
        0,
        .5,
        0
    );

    heartGroup.rotation.x=
        pointer.y*.015;

    heartGroup.rotation.z=
        Math.sin(
            t*.22
        )*.004;

    /*
     * Orbit animation
     */

    const orbitVisible=
        THREE.MathUtils.smoothstep(
            phase,
            3.55,
            4.55
        )*
        (
            1-
            THREE.MathUtils.smoothstep(
                phase,
                8.25,
                9.10
            )
        );

    orbit.group.scale.setScalar(
        .98+
        .025*
        Math.sin(
            t*1.5
        )
    );

    orbit.group.position.x=
        Math.sin(
            t*.38
        )*
        .04*
        orbitVisible;

    /*
     * Ground
     */

    floor.group.rotation.y=
        t*.026;

    floor.center.rotation.y=
        -t*.20;

    floor.center.scale.setScalar(
        1+
        .025*
        Math.sin(
            t*1.4
        )
    );

    /*
     * Stars
     */

    stars.rotation.z=
        t*.0011;

    composer.render();
}

animate();

</script>
