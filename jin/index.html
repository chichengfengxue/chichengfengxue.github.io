<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Love</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#030106}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.home{
    position:fixed;left:22px;top:20px;z-index:10;
    color:rgba(255,240,248,.28);text-decoration:none;
    font:10px Arial,sans-serif;letter-spacing:3px;transition:.3s
}
.home:hover{color:#fff;text-shadow:0 0 10px #ff8fc9}
</style>
</head>

<body>
<a class="home" href="/">HOME</a>
<canvas id="heart"></canvas>

<script>
(()=>{
"use strict";

const canvas=document.getElementById("heart");
const ctx=canvas.getContext("2d",{alpha:false});

const TAU=Math.PI*2;

let W=0;
let H=0;
let DPR=1;

let heartScale=1;
let centerX=0;
let centerY=0;
let floorY=0;

let particles=[];
let targets=[];
let emitters=[];
let stars=[];
let floorDots=[];

let lastTime=performance.now();
let resizeTimer=null;

const MOBILE=()=>innerWidth<720;

const CONFIG={
    traceLengthDesktop:32,
    traceLengthMobile:20,
    heartParticleDesktop:1650,
    heartParticleMobile:800,
    emitterDesktop:520,
    emitterMobile:260
};

const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* =========================================================
   Heart
========================================================= */

function heartPoint(t){
    return {
        x:16*Math.pow(Math.sin(t),3),
        y:-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))
    };
}

/*
 * 比仓库 love6 原本只用 3 层更密。
 *
 * 多层轮廓叠起来之后，
 * 中心不是空心，而是有明显体积感。
 */
const HEART_LAYERS=[
    {r:1.000,density:1.00},
    {r:.955,density:.95},
    {r:.905,density:.90},
    {r:.845,density:.86},
    {r:.775,density:.80},
    {r:.695,density:.72},
    {r:.605,density:.64},
    {r:.505,density:.54},
    {r:.395,density:.44},
    {r:.285,density:.34}
];

function buildTargets(){
    targets=[];

    const step=MOBILE()?.032:.020;

    HEART_LAYERS.forEach((layer,layerId)=>{
        for(let t=0;t<TAU;t+=step/layer.density){
            const p=heartPoint(t);

            /*
             * 内层稍微进行非线性收缩，
             * 避免只是十个机械的同心心形。
             */
            const wobble=
                1+
                Math.sin(t*7+layerId*.71)*(.007*(1-layer.r))+
                Math.sin(t*13-layerId*.37)*(.004*(1-layer.r));

            targets.push({
                x:centerX+p.x*heartScale*layer.r*wobble,
                y:centerY+p.y*heartScale*layer.r*wobble,
                layer:layerId,
                radial:layer.r
            });
        }
    });
}

/* =========================================================
   Flow particles
   核心参考 love6：
   q / D / velocity / force / trace
========================================================= */

function buildFlowParticles(){
    particles=[];

    const count=MOBILE()
        ?CONFIG.heartParticleMobile
        :CONFIG.heartParticleDesktop;

    const traceLength=MOBILE()
        ?CONFIG.traceLengthMobile
        :CONFIG.traceLengthDesktop;

    for(let i=0;i<count;i++){
        const q=(Math.random()*targets.length)|0;
        const target=targets[q];

        /*
         * 不像原实现一样从全屏随机飞过来。
         * 初始化就在心形附近，页面一打开就是完整心形。
         */
        const x=target.x+rand(-30,30);
        const y=target.y+rand(-30,30);

        const trace=[];

        for(let k=0;k<traceLength;k++){
            trace.push({
                x:x+rand(-2,2),
                y:y+rand(-2,2)
            });
        }

        const brightness=Math.random();

        let color;

        /*
         * 目标颜色：
         * 白 → 很浅的樱花粉 → 淡粉
         *
         * 不再使用紫色主体。
         */
        if(brightness>.93){
            color={
                r:255,
                g:247,
                b:251,
                a:rand(.55,.88)
            };
        }else if(brightness>.55){
            color={
                r:255,
                g:187+rand(0,35),
                b:218+rand(0,25),
                a:rand(.32,.66)
            };
        }else{
            color={
                r:246+rand(0,9),
                g:135+rand(0,45),
                b:194+rand(0,30),
                a:rand(.16,.42)
            };
        }

        particles.push({
            vx:0,
            vy:0,

            /*
             * 当前目标点
             */
            q,

            /*
             * 沿心形顺/逆方向走
             */
            direction:Math.random()<.5?-1:1,

            /*
             * love6 使用 rand()+5，
             * 这里稍微降低并增加随机层次。
             */
            speed:rand(.65,2.05),

            /*
             * 速度阻尼
             */
            force:rand(.76,.91),

            trace,

            color,

            size:
                brightness>.96
                    ?rand(1.25,1.9)
                    :rand(.55,1.15),

            changeChance:rand(.001,.0045),

            /*
             * 不同粒子跳 target 的跨度不同，
             * 能看到较明显的沿心运动。
             */
            step:
                Math.random()<.82
                    ?1
                    :Math.random()<.95
                    ?2
                    :3
        });
    }
}

function updateFlow(dt){
    const dtScale=Math.min(2,dt*60);

    for(const p of particles){
        const head=p.trace[0];
        const target=targets[p.q];

        const dx=head.x-target.x;
        const dy=head.y-target.y;
        const distance=Math.sqrt(dx*dx+dy*dy)||1;

        /*
         * 到达当前目标点后继续沿目标曲线前进。
         * 这是 love6 动画“活”的核心。
         */
        if(distance<5.5){
            if(Math.random()<p.changeChance){
                p.q=(Math.random()*targets.length)|0;
            }else{
                if(Math.random()<.003){
                    p.direction*=-1;
                }

                p.q+=p.direction*p.step;

                if(p.q>=targets.length)p.q-=targets.length;
                if(p.q<0)p.q+=targets.length;
            }
        }

        /*
         * 吸引到 target。
         */
        p.vx+=(-dx/distance)*p.speed*dtScale;
        p.vy+=(-dy/distance)*p.speed*dtScale;

        /*
         * 很小的流体扰动。
         * 不改变心形，只避免机械运动。
         */
        const tt=performance.now()*.001;

        p.vx+=Math.sin(
            head.y*.013+
            tt*.72+
            p.q*.017
        )*.008*dtScale;

        p.vy+=Math.cos(
            head.x*.011-
            tt*.61+
            p.q*.013
        )*.008*dtScale;

        head.x+=p.vx*dtScale;
        head.y+=p.vy*dtScale;

        p.vx*=Math.pow(p.force,dtScale);
        p.vy*=Math.pow(p.force,dtScale);

        /*
         * trace follower
         *
         * 完全沿用 love6 的优秀思想：
         * 后一个点追前一个点。
         */
        for(let k=0;k<p.trace.length-1;k++){
            const a=p.trace[k];
            const b=p.trace[k+1];

            const follow=.30+.16*(1-k/p.trace.length);

            b.x-=follow*(b.x-a.x);
            b.y-=follow*(b.y-a.y);
        }
    }
}

function drawFlow(){
    ctx.save();

    ctx.globalCompositeOperation="lighter";

    for(const p of particles){
        const n=p.trace.length;

        /*
         * 尾巴到头部逐渐变亮，
         * 不会出现 love6 那种统一透明度的硬线。
         */
        for(let k=n-1;k>=0;k--){
            const point=p.trace[k];

            const life=1-k/n;

            const alpha=
                p.color.a*
                Math.pow(life,1.65);

            const size=
                Math.max(
                    .42,
                    p.size*
                    (.46+.54*life)
                );

            ctx.globalAlpha=alpha;

            ctx.fillStyle=
                `rgb(${p.color.r|0},${p.color.g|0},${p.color.b|0})`;

            ctx.fillRect(
                point.x-size*.5,
                point.y-size*.5,
                size,
                size
            );
        }
    }

    ctx.restore();
}

/* =========================================================
   Heart dust
   参考 love.html 的 ParticlePool 思路：
   心形边缘不断产生、向外减速、消散
========================================================= */

function pointOnOutline(){
    const t=Math.random()*TAU;
    const p=heartPoint(t);

    const x=p.x*heartScale;
    const y=p.y*heartScale;

    const l=Math.sqrt(x*x+y*y)||1;

    return {
        x:centerX+x,
        y:centerY+y,
        nx:x/l,
        ny:y/l
    };
}

function buildEmitters(){
    emitters=[];

    const count=MOBILE()
        ?CONFIG.emitterMobile
        :CONFIG.emitterDesktop;

    for(let i=0;i<count;i++){
        resetEmitter({
            age:Math.random()*2
        },true);
    }
}

function resetEmitter(p,initial=false){
    const h=pointOnOutline();

    const tangentX=-h.ny;
    const tangentY=h.nx;

    const speed=rand(7,22);

    p.x=h.x+rand(-2,2);
    p.y=h.y+rand(-2,2);

    p.px=p.x;
    p.py=p.y;

    /*
     * 不是粗暴直射，
     * 主速度沿外法线，但混入切向速度。
     */
    const tangent=rand(-.60,.60);

    p.vx=(h.nx+tangentX*tangent)*speed;
    p.vy=(h.ny+tangentY*tangent)*speed;

    p.age=initial?Math.random()*2:0;
    p.life=rand(.8,2.1);

    p.size=
        Math.random()<.92
            ?rand(.45,1.05)
            :rand(1.2,2.1);

    p.hot=Math.random()<.075;
}

function updateEmitters(dt){
    for(const p of emitters){
        p.age+=dt;

        if(p.age>=p.life){
            resetEmitter(p);
            continue;
        }

        p.px=p.x;
        p.py=p.y;

        /*
         * love.html 使用 effect=-0.75，
         * 本质是让速度逐渐衰减。
         */
        const drag=Math.pow(.972,dt*60);

        p.vx*=drag;
        p.vy*=drag;

        /*
         * 加非常小的旋转，
         * 外围不会变成呆板的径向直线。
         */
        const angle=.010*dt*60;

        const vx=
            p.vx*Math.cos(angle)-
            p.vy*Math.sin(angle);

        const vy=
            p.vx*Math.sin(angle)+
            p.vy*Math.cos(angle);

        p.vx=vx;
        p.vy=vy;

        p.x+=p.vx*dt;
        p.y+=p.vy*dt;
    }
}

function drawEmitters(){
    ctx.save();

    ctx.globalCompositeOperation="lighter";
    ctx.lineCap="round";

    for(const p of emitters){
        const q=p.age/p.life;

        const fade=
            Math.pow(1-q,1.45);

        /*
         * 极短拖尾
         */
        ctx.globalAlpha=fade*.16;

        ctx.strokeStyle=
            p.hot
                ?"rgb(255,244,250)"
                :"rgb(255,141,198)";

        ctx.lineWidth=.55;

        ctx.beginPath();
        ctx.moveTo(p.px,p.py);
        ctx.lineTo(p.x,p.y);
        ctx.stroke();

        ctx.globalAlpha=
            fade*
            (p.hot?.88:.42);

        ctx.fillStyle=
            p.hot
                ?"rgb(255,250,252)"
                :"rgb(255,166,207)";

        ctx.fillRect(
            p.x-p.size*.5,
            p.y-p.size*.5,
            p.size,
            p.size
        );
    }

    ctx.restore();
}

/* =========================================================
   Stars
========================================================= */

function buildStars(){
    stars=[];

    const count=MOBILE()?350:900;

    for(let i=0;i<count;i++){
        stars.push({
            x:Math.random(),
            y:Math.random(),
            size:Math.random()<.97?rand(.3,.8):rand(1.1,2),
            alpha:rand(.018,.12),
            phase:rand(0,TAU)
        });
    }
}

function drawBackground(time){
    ctx.globalCompositeOperation="source-over";
    ctx.globalAlpha=1;

    ctx.fillStyle="#030106";
    ctx.fillRect(0,0,W,H);

    /*
     * 只保留非常弱的莓粉环境色。
     */
    const gradient=
        ctx.createRadialGradient(
            centerX,
            centerY,
            0,
            centerX,
            centerY,
            Math.max(W,H)*.46
        );

    gradient.addColorStop(
        0,
        "rgba(96,16,53,.105)"
    );

    gradient.addColorStop(
        .36,
        "rgba(52,7,31,.042)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,W,H);

    ctx.globalCompositeOperation="lighter";

    ctx.fillStyle="#ffb3d4";

    for(const s of stars){
        ctx.globalAlpha=
            s.alpha*
            (.55+.45*Math.sin(time*.7+s.phase));

        ctx.fillRect(
            s.x*W,
            s.y*H,
            s.size,
            s.size
        );
    }

    ctx.globalAlpha=1;
}

/* =========================================================
   Subtle floor
========================================================= */

function buildFloor(){
    floorDots=[];

    const count=MOBILE()?500:1200;

    for(let i=0;i<count;i++){
        floorDots.push({
            r:Math.sqrt(Math.random()),
            a:Math.random()*TAU,
            size:rand(.3,.8),
            alpha:rand(.035,.16)
        });
    }
}

function drawFloor(time){
    ctx.save();

    ctx.globalCompositeOperation="lighter";

    const maxR=
        Math.min(
            W*.32,
            heartScale*17
        );

    const squash=.21;

    /*
     * 放射线比之前弱很多。
     * 不抢爱心主体。
     */
    const spokes=MOBILE()?30:46;

    for(let i=0;i<spokes;i++){
        const a=i/spokes*TAU+time*.010;

        const x2=
            centerX+
            Math.cos(a)*maxR;

        const y2=
            floorY+
            Math.sin(a)*maxR*squash;

        const gradient=
            ctx.createLinearGradient(
                centerX,
                floorY,
                x2,
                y2
            );

        gradient.addColorStop(
            0,
            "rgba(255,232,244,.22)"
        );

        gradient.addColorStop(
            .30,
            "rgba(255,150,204,.07)"
        );

        gradient.addColorStop(
            1,
            "rgba(255,120,190,0)"
        );

        ctx.globalAlpha=.25;
        ctx.strokeStyle=gradient;
        ctx.lineWidth=.40;

        ctx.beginPath();
        ctx.moveTo(centerX,floorY);
        ctx.lineTo(x2,y2);
        ctx.stroke();
    }

    /*
     * 波纹
     */
    const rings=MOBILE()?13:20;

    for(let r=1;r<=rings;r++){
        const q=r/rings;

        const base=
            maxR*
            Math.pow(q,1.45);

        ctx.beginPath();

        for(let i=0;i<=150;i++){
            const a=i/150*TAU;

            const wave=
                1+
                (.075*(1-q)+.008)*
                Math.sin(
                    a*12-
                    time*.45+
                    r*.38
                );

            const rr=base*wave;

            const x=
                centerX+
                Math.cos(a)*rr;

            const y=
                floorY+
                Math.sin(a)*rr*squash;

            if(i===0)ctx.moveTo(x,y);
            else ctx.lineTo(x,y);
        }

        ctx.globalAlpha=
            .035+
            .14*(1-q);

        ctx.strokeStyle=
            r<4
                ?"rgb(255,228,241)"
                :"rgb(234,130,190)";

        ctx.lineWidth=
            r<4?.65:.4;

        ctx.stroke();
    }

    /*
     * 微粒
     */
    ctx.fillStyle="#ffc7df";

    for(const p of floorDots){
        const rr=p.r*maxR;

        const a=
            p.a+
            time*.007*
            (1-p.r);

        const x=
            centerX+
            Math.cos(a)*rr;

        const y=
            floorY+
            Math.sin(a)*rr*squash;

        ctx.globalAlpha=
            p.alpha*
            (1-p.r*.7);

        ctx.fillRect(
            x,
            y,
            p.size,
            p.size
        );
    }

    /*
     * 中央光环
     */
    for(let i=0;i<5;i++){
        const rx=8+i*9;
        const ry=1.8+i*1.7;

        ctx.globalAlpha=.25-i*.037;
        ctx.strokeStyle=
            i<2
                ?"rgb(255,242,248)"
                :"rgb(255,166,207)";

        ctx.lineWidth=i<2?.75:.5;

        ctx.beginPath();
        ctx.ellipse(
            centerX,
            floorY,
            rx,
            ry,
            0,
            0,
            TAU
        );
        ctx.stroke();
    }

    ctx.restore();
}

/* =========================================================
   Tip stream
========================================================= */

let tipParticles=[];

function buildTipParticles(){
    tipParticles=[];

    const count=MOBILE()?70:160;

    for(let i=0;i<count;i++){
        tipParticles.push({
            q:Math.random(),
            speed:rand(.05,.11),
            phase:rand(0,TAU),
            size:Math.random()<.92?rand(.4,.9):rand(1.1,1.8),
            alpha:rand(.15,.52)
        });
    }
}

function drawTip(time){
    /*
     * t = PI 是心尖
     */
    const p=heartPoint(Math.PI);

    const x=centerX+p.x*heartScale;
    const y=centerY+p.y*heartScale;

    ctx.save();

    ctx.globalCompositeOperation="lighter";

    for(const d of tipParticles){
        const q=(d.q+time*d.speed)%1;

        const middle=
            Math.sin(q*Math.PI);

        const yy=
            y+
            (floorY-y)*q;

        const xx=
            x+
            Math.sin(
                d.phase+
                time*1.8+
                q*12
            )*
            heartScale*.045*
            middle;

        ctx.globalAlpha=
            d.alpha*
            middle;

        ctx.fillStyle=
            d.size>1
                ?"rgb(255,245,250)"
                :"rgb(255,186,218)";

        ctx.fillRect(
            xx-d.size*.5,
            yy-d.size*.5,
            d.size,
            d.size
        );
    }

    ctx.restore();
}

/* =========================================================
   Resize
========================================================= */

function rebuild(){
    W=innerWidth;
    H=innerHeight;

    DPR=Math.min(
        devicePixelRatio||1,
        1.6
    );

    canvas.width=
        Math.round(W*DPR);

    canvas.height=
        Math.round(H*DPR);

    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );

    /*
     * 目标：占画面约 55% 宽，
     * 不再像你上一版大到贴边。
     */
    heartScale=
        Math.min(
            W*.54/32,
            H*.60/29
        );

    centerX=W*.5;
    centerY=H*.35;

    /*
     * 地面离心尖近一点，
     * 对齐你的参考视频。
     */
    const tip=heartPoint(Math.PI);

    floorY=
        Math.min(
            H*.81,
            centerY+
            tip.y*heartScale+
            heartScale*2.0
        );

    buildTargets();
    buildFlowParticles();
    buildEmitters();
    buildStars();
    buildFloor();
    buildTipParticles();

    ctx.fillStyle="#030106";
    ctx.fillRect(0,0,W,H);
}

/* =========================================================
   Render
========================================================= */

function render(now){
    requestAnimationFrame(render);

    const time=now*.001;

    const dt=
        Math.min(
            (now-lastTime)/1000,
            .033
        );

    lastTime=now;

    drawBackground(time);

    /*
     * 地面最先画。
     */
    drawFloor(time);

    updateEmitters(dt);
    drawEmitters();

    /*
     * 主体的 trace 粒子最后画，
     * 确保白粉色心体最清晰。
     */
    updateFlow(dt);
    drawFlow();

    drawTip(time);
}

addEventListener(
    "resize",
    ()=>{
        clearTimeout(resizeTimer);
        resizeTimer=setTimeout(rebuild,120);
    },
    {passive:true}
);

rebuild();
requestAnimationFrame(render);

})();
</script>
</body>
</html>
