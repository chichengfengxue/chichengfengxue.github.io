<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050914">
<title>Love</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#03060d}
body{overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="love" aria-hidden="true"></canvas>

<script>
(()=>{
"use strict";

const canvas=document.getElementById("love");
const ctx=canvas.getContext("2d",{alpha:false});
const TAU=Math.PI*2;
const LUT_SIZE=2048;

let W=0,H=0,DPR=1;
let centerX=0,floorY=0,heartUnit=1,floorRadius=1;
let bgGradient=null,vignetteGradient=null;
let glowPink=null,glowWhite=null;
let lastProfile="";
let animationTime=0;
let lastFrameTime=performance.now();

let core=[];
let shell=[];
let inside=[];
let dust=[];
let floorDots=[];
let rays=[];
let debris=[];
let stars=[];
let stem=[];

const curveX=new Float32Array(LUT_SIZE);
const curveY=new Float32Array(LUT_SIZE);
const curveNX=new Float32Array(LUT_SIZE);
const curveNY=new Float32Array(LUT_SIZE);

const curveSample={x:0,y:0,nx:0,ny:0};
const projected={x:0,y:0,k:1,z:0};
const floorProjected={x:0,y:0,z:0};
const orbitSample={x:0,y:0,z:0};

const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const mix=(a,b,t)=>a+(b-a)*t;
const fract=v=>v-Math.floor(v);

const smooth=v=>{
    v=clamp(v);
    return v*v*(3-2*v);
};

const smoother=v=>{
    v=clamp(v);
    return v*v*v*(v*(v*6-15)+10);
};

function mulberry32(seed){
    return function(){
        seed|=0;
        seed=seed+0x6D2B79F5|0;
        let t=Math.imul(seed^seed>>>15,1|seed);
        t=t+Math.imul(t^t>>>7,61|t)^t;
        return((t^t>>>14)>>>0)/4294967296;
    };
}

let random=mulberry32(0x5f3759df);

const rnd=(a=1,b)=>{
    if(b===undefined){
        b=a;
        a=0;
    }
    return a+(b-a)*random();
};

const gaussian=()=>random()+random()+random()+random()-2;

function heartPoint(t){
    const s=Math.sin(t);

    const y=
        13*Math.cos(t)
        -5*Math.cos(2*t)
        -2*Math.cos(3*t)
        -Math.cos(4*t);

    return[
        .97*s*s*s,
        (y+2.5)/14.5
    ];
}

function buildCurve(){
    for(let i=0;i<LUT_SIZE;i++){
        const p=heartPoint(i/LUT_SIZE*TAU);
        curveX[i]=p[0];
        curveY[i]=p[1];
    }

    for(let i=0;i<LUT_SIZE;i++){
        const a=(i-2+LUT_SIZE)%LUT_SIZE;
        const b=(i+2)%LUT_SIZE;

        const dx=curveX[b]-curveX[a];
        const dy=curveY[b]-curveY[a];
        const length=Math.hypot(dx,dy)||1;

        curveNX[i]=-dy/length;
        curveNY[i]=dx/length;
    }
}

function sampleCurve(u){
    const f=fract(u)*LUT_SIZE;
    const i=f|0;
    const j=(i+1)%LUT_SIZE;
    const q=f-i;

    curveSample.x=mix(curveX[i],curveX[j],q);
    curveSample.y=mix(curveY[i],curveY[j],q);
    curveSample.nx=mix(curveNX[i],curveNX[j],q);
    curveSample.ny=mix(curveNY[i],curveNY[j],q);

    return curveSample;
}

function makeGlow(size,inner,mid){
    const c=document.createElement("canvas");
    c.width=c.height=size;

    const g=c.getContext("2d");
    const r=size/2;
    const gradient=g.createRadialGradient(r,r,0,r,r,r);

    gradient.addColorStop(0,"rgba(255,255,255,1)");
    gradient.addColorStop(.10,inner);
    gradient.addColorStop(.34,mid);
    gradient.addColorStop(1,"rgba(255,105,183,0)");

    g.fillStyle=gradient;
    g.fillRect(0,0,size,size);

    return c;
}

function pointBase(u,offset,z,size,alpha,hot,flow){
    return{
        u,
        offset,
        z,
        size,
        alpha,
        hot,
        flow,
        phase:rnd(TAU),
        twinkle:rnd(1.8,5.2),
        wobble:rnd(.002,.013),
        zWobble:rnd(.002,.018),
        burst:rnd(.2,1)
    };
}

function buildHeart(profile){
    random=mulberry32(0x5f3759df);

    const mobile=profile==="mobile";

    const count={
        core:mobile?760:1250,
        shell:mobile?2450:4200,
        inside:mobile?2250:3900,
        dust:mobile?460:780
    };

    core=[];
    shell=[];
    inside=[];
    dust=[];

    for(let i=0;i<count.core;i++){
        const u=(i+rnd(-.38,.38))/count.core;
        const ring=rnd(.004,.034);
        const angle=rnd(TAU);

        core.push(pointBase(
            u,
            Math.cos(angle)*ring+gaussian()*.006,
            Math.sin(angle)*ring*1.3+gaussian()*.008,
            rnd(.75,1.9),
            rnd(.62,.96),
            random()<.16,
            rnd(.0028,.0058)
        ));
    }

    for(let i=0;i<count.shell;i++){
        const tube=Math.abs(gaussian())*rnd(.035,.105);
        const angle=rnd(TAU);

        let offset=
            Math.cos(angle)*tube+
            gaussian()*.022;

        if(random()<.17){
            offset+=
                Math.sign(gaussian()||1)
                *rnd(.05,.18)
                *Math.pow(random(),1.8);
        }

        shell.push(pointBase(
            random(),
            offset,
            Math.sin(angle)*tube*1.5+gaussian()*.038,
            random()<.09?rnd(2,3.25):rnd(.65,2.15),
            rnd(.30,.76),
            random()<.075,
            rnd(.004,.009)
        ));
    }

    for(let i=0;i<count.inside;i++){
        const radius=.035+.925*Math.sqrt(random());

        const p=pointBase(
            random(),
            gaussian()*.018,
            gaussian()*(.035+.10*(1-radius)),
            random()<.065?rnd(1.8,2.65):rnd(.58,1.72),
            rnd(.29,.70),
            random()<.075,
            rnd(.002,.0065)
        );

        p.radius=radius;
        p.jx=gaussian()*.15*(1-radius);
        p.jy=gaussian()*.12*(1-radius);

        inside.push(p);
    }

    for(let i=0;i<count.dust;i++){
        const side=Math.sign(gaussian()||1);

        const p=pointBase(
            random(),
            gaussian()*.12+
            side*rnd(.055,.23)*Math.pow(random(),.72),
            gaussian()*.15,
            rnd(.45,1.45),
            rnd(.10,.38),
            random()<.045,
            rnd(.006,.013)
        );

        p.wobble=rnd(.008,.035);
        dust.push(p);
    }
}

function buildFloor(){
    floorDots=[];

    for(let ringIndex=0;ringIndex<10;ringIndex++){
        const radius=.10+ringIndex*.092;
        const count=36+ringIndex*10;

        for(let i=0;i<count;i++){
            const angle=
                i/count*TAU+
                rnd(-.008,.008);

            floorDots.push({
                x:Math.cos(angle)*radius,
                z:Math.sin(angle)*radius,
                size:rnd(.55,1.18),
                alpha:rnd(.20,.56),
                phase:rnd(TAU)
            });
        }
    }

    for(let spokeIndex=0;spokeIndex<46;spokeIndex++){
        const angle=spokeIndex/46*TAU;

        for(let i=2;i<19;i++){
            const radius=
                i/19+
                rnd(-.008,.008);

            floorDots.push({
                x:Math.cos(angle)*radius,
                z:Math.sin(angle)*radius,
                size:rnd(.52,1.12),
                alpha:rnd(.18,.48),
                phase:rnd(TAU)
            });
        }
    }

    for(let i=0;i<720;i++){
        const angle=i/720*TAU;
        const wave=Math.sin(18*angle);

        const radius=
            Math.sign(wave)*
            Math.pow(Math.abs(wave),.72);

        floorDots.push({
            x:Math.cos(angle)*radius,
            z:Math.sin(angle)*radius,
            size:rnd(.55,1.22),
            alpha:rnd(.28,.65),
            phase:rnd(TAU)
        });
    }
}

function buildEffects(profile){
    const mobile=profile==="mobile";

    rays=[];
    debris=[];
    stem=[];

    const rayCount=mobile?95:170;

    for(let i=0;i<rayCount;i++){
        rays.push({
            angle:i/rayCount*TAU+rnd(-.045,.045),
            length:rnd(.70,1.95)*Math.pow(rnd(.35,1),.38),
            start:rnd(.04,.30),
            width:random()<.14?rnd(1.2,2.2):rnd(.35,1.05),
            alpha:rnd(.18,.78),
            delay:rnd(0,.22),
            phase:rnd(TAU)
        });
    }

    const debrisCount=mobile?520:1050;

    for(let i=0;i<debrisCount;i++){
        debris.push({
            angle:rnd(TAU),
            speed:rnd(.45,1.75)*Math.pow(rnd(.2,1),.35),
            start:rnd(.05,.46),
            delay:rnd(0,.22),
            curve:rnd(-.25,.25),
            size:random()<.08?rnd(1.8,3.1):rnd(.5,1.55),
            alpha:rnd(.18,.72),
            phase:rnd(TAU),
            hot:random()<.08
        });
    }

    const stemCount=mobile?100:180;

    for(let i=0;i<stemCount;i++){
        stem.push({
            phase:random(),
            speed:rnd(.10,.24),
            sway:rnd(-1,1),
            size:rnd(.55,1.45),
            alpha:rnd(.18,.62)
        });
    }
}

function buildStars(profile){
    const mobile=profile==="mobile";
    const count=mobile?130:260;

    stars=[];

    for(let i=0;i<count;i++){
        stars.push({
            x:rnd(.05,.95),
            y:rnd(.10,.78),
            size:random()<.05?rnd(1.5,2.4):rnd(.35,1.15),
            alpha:rnd(.035,.22),
            phase:rnd(TAU),
            speed:rnd(.35,1.25)
        });
    }
}

function resize(){
    W=Math.max(1,innerWidth);
    H=Math.max(1,innerHeight);

    const profile=W<720?"mobile":"desktop";

    DPR=Math.min(
        devicePixelRatio||1,
        profile==="mobile"?1.30:1.55
    );

    canvas.width=Math.round(W*DPR);
    canvas.height=Math.round(H*DPR);
    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.imageSmoothingEnabled=true;

    centerX=W*.5;
    floorY=H*(W/H<.76?.69:.70);
    heartUnit=Math.min(W*.36,H*.255,330);
    floorRadius=Math.min(W*.49,H*.58,720);

    bgGradient=ctx.createRadialGradient(
        centerX,H*.44,0,
        centerX,H*.44,
        Math.max(W,H)*.72
    );

    bgGradient.addColorStop(0,"#182235");
    bgGradient.addColorStop(.30,"#101827");
    bgGradient.addColorStop(.64,"#080e19");
    bgGradient.addColorStop(1,"#02050b");

    vignetteGradient=ctx.createRadialGradient(
        centerX,H*.48,Math.min(W,H)*.15,
        centerX,H*.48,Math.max(W,H)*.70
    );

    vignetteGradient.addColorStop(0,"rgba(0,0,0,0)");
    vignetteGradient.addColorStop(.68,"rgba(0,0,0,.08)");
    vignetteGradient.addColorStop(1,"rgba(0,0,0,.64)");

    if(profile!==lastProfile){
        buildHeart(profile);
        buildEffects(profile);
        lastProfile=profile;
    }

    buildStars(profile);
}

function sceneState(seconds){
    const t=seconds%10;

    let zoom=1;

    if(t>=6&&t<6.78){
        zoom=mix(1,.70,smoother((t-6)/.78));
    }else if(t>=6.78&&t<9.10){
        zoom=.70;
    }else if(t>=9.10){
        zoom=mix(.70,1,smoother((t-9.10)/.90));
    }

    let rotation=0;

    if(t<1.45){
        rotation=Math.PI*smoother(t/1.45);
    }else if(t<1.90){
        rotation=Math.PI;
    }else if(t<2.88){
        rotation=
            Math.PI+
            Math.PI*smoother((t-1.90)/.98);
    }else if(t<7.15){
        rotation=TAU;
    }else{
        rotation=
            TAU+
            TAU*smoother((t-7.15)/2.85);
    }

    const ringIn=smooth(t/.48);
    const ringOut=1-smooth((t-1.92)/.70);
    const ring=ringIn*ringOut;

    const flash=
        smooth((t-1.91)/.13)*
        (1-smooth((t-2.19)/.48));

    const burst=
        smooth((t-1.98)/.14)*
        (1-smooth((t-2.43)/.82));

    const burstProgress=clamp((t-1.92)/.48);

    const linger=
        smooth((t-2.42)/.42)*
        (1-smooth((t-5.72)/.68));

    return{
        t,
        zoom,
        rotation,
        ring,
        flash,
        burst,
        burstProgress,
        linger
    };
}

function projectHeart(x,y,z,state,centerY){
    const c=Math.cos(state.rotation);
    const s=Math.sin(state.rotation);

    const xr=x*c+z*s;
    const zr=-x*s+z*c;
    const k=1/(1-zr*.17);

    projected.x=
        centerX+
        xr*heartUnit*state.zoom*k;

    projected.y=
        centerY-
        y*heartUnit*1.045*state.zoom*k;

    projected.k=k;
    projected.z=zr;

    return projected;
}

function projectOrbit(x,y,z,state,centerY){
    const k=1/(1-z*.17);

    projected.x=
        centerX+
        x*heartUnit*state.zoom*k;

    projected.y=
        centerY-
        y*heartUnit*1.045*state.zoom*k;

    projected.k=k;
    projected.z=z;

    return projected;
}

function projectFloor(x,z,zoom,angle){
    const c=Math.cos(angle);
    const s=Math.sin(angle);

    const xr=x*c-z*s;
    const zr=x*s+z*c;
    const k=1/(1-zr*.27);

    floorProjected.x=
        centerX+
        xr*floorRadius*zoom*k;

    floorProjected.y=
        floorY+
        zr*floorRadius*.30*zoom*k;

    floorProjected.z=zr;

    return floorProjected;
}

function drawBackground(seconds){
    ctx.globalCompositeOperation="source-over";
    ctx.globalAlpha=1;
    ctx.fillStyle=bgGradient;
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle="#ffd2e6";

    for(let i=0;i<stars.length;i++){
        const p=stars[i];

        const flicker=
            .55+
            .45*Math.sin(seconds*p.speed+p.phase);

        ctx.globalAlpha=
            p.alpha*
            (.45+.55*flicker*flicker);

        ctx.fillRect(
            p.x*W,
            p.y*H,
            p.size,
            p.size
        );
    }

    ctx.globalAlpha=1;
}

function drawFloorGlow(state){
    const radius=floorRadius*state.zoom;

    ctx.save();
    ctx.translate(centerX,floorY);
    ctx.scale(1,.31);

    const gradient=ctx.createRadialGradient(
        0,0,0,
        0,0,radius*1.05
    );

    gradient.addColorStop(
        0,
        `rgba(255,185,221,${.13+state.burst*.13})`
    );

    gradient.addColorStop(
        .25,
        "rgba(255,125,193,.055)"
    );

    gradient.addColorStop(
        1,
        "rgba(255,95,177,0)"
    );

    ctx.fillStyle=gradient;
    ctx.beginPath();
    ctx.arc(0,0,radius*1.05,0,TAU);
    ctx.fill();

    ctx.restore();
}

function rosettePath(state,seconds){
    const angle=seconds*.012;
    const count=1450;

    ctx.beginPath();

    for(let i=0;i<=count;i++){
        const a=i/count*TAU;
        const wave=Math.sin(18*a);

        const radius=
            Math.sign(wave)*
            Math.pow(Math.abs(wave),.72);

        const p=projectFloor(
            Math.cos(a)*radius,
            Math.sin(a)*radius,
            state.zoom,
            angle
        );

        if(i===0){
            ctx.moveTo(p.x,p.y);
        }else{
            ctx.lineTo(p.x,p.y);
        }
    }
}

function floorCircle(radius,state,seconds){
    const angle=seconds*.012;
    const count=120;

    ctx.beginPath();

    for(let i=0;i<=count;i++){
        const a=i/count*TAU;

        const p=projectFloor(
            Math.cos(a)*radius,
            Math.sin(a)*radius,
            state.zoom,
            angle
        );

        if(i===0){
            ctx.moveTo(p.x,p.y);
        }else{
            ctx.lineTo(p.x,p.y);
        }
    }
}

function drawFloor(state,seconds){
    drawFloorGlow(state);

    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.lineJoin="round";
    ctx.lineCap="round";

    rosettePath(state,seconds);

    ctx.globalAlpha=.09+state.burst*.055;
    ctx.strokeStyle="#ff79b9";
    ctx.lineWidth=5;
    ctx.shadowColor="#ff71b6";
    ctx.shadowBlur=13;
    ctx.stroke();

    rosettePath(state,seconds);

    ctx.globalAlpha=.54+state.burst*.16;
    ctx.strokeStyle="#ffd1e5";
    ctx.lineWidth=.72;
    ctx.shadowBlur=4;
    ctx.stroke();

    const rings=[.045,.085,.135,.205,.285];

    for(let i=0;i<rings.length;i++){
        floorCircle(rings[i],state,seconds);

        ctx.globalAlpha=
            .60-i*.065+
            state.burst*.12;

        ctx.strokeStyle=
            i<2?
            "#fff5fb":
            "#ffc7df";

        ctx.lineWidth=i<2?1.25:.82;
        ctx.shadowColor="#ff84bd";
        ctx.shadowBlur=7;
        ctx.stroke();
    }

    const angle=seconds*.012;

    ctx.fillStyle="#ffd5e7";
    ctx.shadowBlur=0;

    for(let i=0;i<floorDots.length;i++){
        const dot=floorDots[i];

        const p=projectFloor(
            dot.x,
            dot.z,
            state.zoom,
            angle
        );

        const flicker=
            .70+
            .30*Math.sin(seconds*1.35+dot.phase);

        ctx.globalAlpha=
            dot.alpha*
            flicker*
            (1+state.burst*.35);

        const size=
            dot.size*
            (.78+.22*state.zoom);

        ctx.fillRect(
            p.x-size*.5,
            p.y-size*.5,
            size,
            size
        );
    }

    ctx.restore();
}

function drawStem(state,seconds){
    const centerY=
        floorY-
        heartUnit*state.zoom*1.045;

    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.fillStyle="#ffd4e7";

    for(let i=0;i<stem.length;i++){
        const p=stem[i];
        const life=fract(seconds*p.speed+p.phase);

        const y=
            floorY-
            life*heartUnit*.22*state.zoom;

        const width=
            (1-life)*
            heartUnit*.055*
            state.zoom;

        const x=
            centerX+
            p.sway*width+
            Math.sin(seconds*2+p.phase*TAU)*
            width*.13;

        const fade=Math.sin(life*Math.PI);

        ctx.globalAlpha=
            p.alpha*
            fade*
            (.72+state.burst*.55);

        ctx.fillRect(
            x-p.size*.5,
            y-p.size*.5,
            p.size,
            p.size
        );
    }

    const gradient=ctx.createRadialGradient(
        centerX,floorY,0,
        centerX,floorY,
        heartUnit*.17*state.zoom
    );

    gradient.addColorStop(
        0,
        `rgba(255,248,252,${.24+state.flash*.18})`
    );

    gradient.addColorStop(
        .18,
        "rgba(255,180,218,.13)"
    );

    gradient.addColorStop(
        1,
        "rgba(255,110,184,0)"
    );

    ctx.globalAlpha=1;
    ctx.fillStyle=gradient;
    ctx.beginPath();

    ctx.arc(
        centerX,
        floorY,
        heartUnit*.17*state.zoom,
        0,
        TAU
    );

    ctx.fill();
    ctx.restore();

    return centerY;
}

function drawRays(state,centerY){
    if(
        state.burst<=.001&&
        state.linger<=.001
    ){
        return;
    }

    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.lineCap="round";
    ctx.shadowColor="#ff7fbd";
    ctx.shadowBlur=7;

    for(let i=0;i<rays.length;i++){
        const ray=rays[i];

        if(
            state.burst<.012&&
            i%6!==0
        ){
            continue;
        }

        const q=clamp(
            (state.burstProgress-ray.delay)/
            (1-ray.delay)
        );

        if(q<=0)continue;

        const travel=
            1-
            Math.pow(1-q,2.7);

        const head=
            heartUnit*
            state.zoom*
            (ray.start+ray.length*travel);

        const tail=
            head-
            heartUnit*
            state.zoom*
            (
                .10+
                .43*(1-q)+
                ray.length*
                (.13+state.linger*.18)
            );

        const bend=
            Math.sin(ray.phase+q*3)*
            heartUnit*.025;

        const ca=Math.cos(ray.angle);
        const sa=Math.sin(ray.angle);

        ctx.beginPath();

        ctx.moveTo(
            centerX+
            ca*Math.max(0,tail)-
            sa*bend,

            centerY+
            sa*Math.max(0,tail)+
            ca*bend
        );

        ctx.lineTo(
            centerX+ca*head,
            centerY+sa*head
        );

        ctx.globalAlpha=
            ray.alpha*
            (
                state.burst*(1-q*.56)+
                state.linger*.10
            );

        ctx.strokeStyle=
            i%6===0?
            "#fff5fb":
            "#ff9ccc";

        ctx.lineWidth=ray.width;
        ctx.stroke();
    }

    ctx.restore();
}

function drawFlare(state,centerY,front=false){
    if(state.flash<=.002)return;

    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.translate(centerX,centerY);
    ctx.scale(.72,1);

    const radius=
        heartUnit*
        state.zoom*
        (front?.34:.76);

    const gradient=ctx.createRadialGradient(
        0,0,0,
        0,0,radius
    );

    if(front){
        gradient.addColorStop(
            0,
            `rgba(255,255,255,${state.flash*.28})`
        );

        gradient.addColorStop(
            .30,
            `rgba(255,224,240,${state.flash*.12})`
        );
    }else{
        gradient.addColorStop(
            0,
            `rgba(255,255,255,${state.flash*.75})`
        );

        gradient.addColorStop(
            .16,
            `rgba(255,224,241,${state.flash*.46})`
        );

        gradient.addColorStop(
            .48,
            `rgba(255,114,188,${state.flash*.15})`
        );
    }

    gradient.addColorStop(
        1,
        "rgba(255,95,177,0)"
    );

    ctx.fillStyle=gradient;
    ctx.beginPath();
    ctx.arc(0,0,radius,0,TAU);
    ctx.fill();

    ctx.restore();
}

function orbitPoint(index,count,seconds){
    const progress=index/(count-1);
    const u=progress*TAU*3.18;
    const phase=u+seconds*.78;

    const radius=
        1.13+
        .055*Math.sin(u*2.35+seconds*.7);

    orbitSample.x=Math.cos(phase)*radius;
    orbitSample.z=Math.sin(phase)*radius;

    orbitSample.y=
        .84-
        progress*1.68+
        .065*Math.sin(u*1.7+seconds*.8);

    return orbitSample;
}

function traceOrbit(front,state,seconds,centerY){
    const count=520;
    let drawing=false;

    ctx.beginPath();

    for(let i=0;i<count;i++){
        const orbit=orbitPoint(
            i,
            count,
            seconds
        );

        const visible=
            front?
            orbit.z>=-.02:
            orbit.z<-.02;

        const p=projectOrbit(
            orbit.x,
            orbit.y,
            orbit.z,
            state,
            centerY
        );

        if(visible){
            if(!drawing){
                ctx.moveTo(p.x,p.y);
            }else{
                ctx.lineTo(p.x,p.y);
            }

            drawing=true;
        }else{
            drawing=false;
        }
    }
}

function drawOrbit(front,state,seconds,centerY){
    if(state.ring<=.002)return;

    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.lineCap="round";
    ctx.lineJoin="round";

    const depth=front?1:.34;

    traceOrbit(
        front,
        state,
        seconds,
        centerY
    );

    ctx.globalAlpha=
        state.ring*
        depth*.14;

    ctx.strokeStyle="#ff69b1";
    ctx.lineWidth=7;
    ctx.shadowColor="#ff66b0";
    ctx.shadowBlur=18;
    ctx.stroke();

    traceOrbit(
        front,
        state,
        seconds,
        centerY
    );

    ctx.globalAlpha=
        state.ring*
        depth*.94;

    ctx.strokeStyle=
        front?
        "#ffd5e8":
        "#ffacd0";

    ctx.lineWidth=front?1.35:.82;
    ctx.shadowColor="#ff88c1";
    ctx.shadowBlur=8;
    ctx.stroke();

    if(front){
        ctx.fillStyle="#fff4fa";
        ctx.shadowBlur=0;

        for(let i=0;i<95;i++){
            const u=fract(
                i/95+
                seconds*.055
            );

            const index=Math.floor(u*519);

            const orbit=orbitPoint(
                index,
                520,
                seconds
            );

            if(orbit.z<0)continue;

            const p=projectOrbit(
                orbit.x,
                orbit.y,
                orbit.z,
                state,
                centerY
            );

            const alpha=
                .26+
                .74*Math.pow(
                    Math.sin(
                        (u+i*.17)*Math.PI
                    ),
                    2
                );

            ctx.globalAlpha=
                state.ring*
                alpha*.72;

            const size=
                i%17===0?
                2.1:
                .85;

            ctx.fillRect(
                p.x-size*.5,
                p.y-size*.5,
                size,
                size
            );
        }
    }

    ctx.restore();
}

function traceHeart(state,centerY,zOffset=0){
    const count=360;

    ctx.beginPath();

    for(let i=0;i<=count;i++){
        const p=sampleCurve(i/count);

        const q=projectHeart(
            p.x,
            p.y,
            zOffset,
            state,
            centerY
        );

        if(i===0){
            ctx.moveTo(q.x,q.y);
        }else{
            ctx.lineTo(q.x,q.y);
        }
    }

    ctx.closePath();
}

function drawHeartTrace(state,centerY){
    ctx.save();
    ctx.globalCompositeOperation="lighter";

    traceHeart(state,centerY);

    ctx.globalAlpha=
        .095+
        state.flash*.08;

    ctx.strokeStyle="#ff72b5";
    ctx.lineWidth=9*state.zoom;
    ctx.shadowColor="#ff68ae";
    ctx.shadowBlur=22*state.zoom;
    ctx.stroke();

    traceHeart(state,centerY);

    ctx.globalAlpha=
        .28+
        state.flash*.17;

    ctx.strokeStyle="#ffd0e4";
    ctx.lineWidth=.75;
    ctx.shadowColor="#ff9bc9";
    ctx.shadowBlur=7;
    ctx.stroke();

    ctx.restore();
}

function frameValue(seed,a,b){
    return(
        a+
        (b-a)*
        (
            .5+
            .5*Math.sin(seed*12.9898)
        )
    );
}

function drawHeartParticles(
    list,
    kind,
    state,
    seconds,
    centerY,
    color,
    gain
){
    ctx.fillStyle=color;

    for(let i=0;i<list.length;i++){
        const p=list[i];

        const curve=sampleCurve(
            p.u+
            seconds*p.flow
        );

        const oscillation=Math.sin(
            seconds*(1.05+p.twinkle*.11)+
            p.phase
        );

        let x,y,z;

        if(kind==="inside"){
            x=
                curve.x*p.radius+
                p.jx;

            y=
                (curve.y+.055)*p.radius-
                .055+
                p.jy;

            x+=curve.nx*p.offset;
            y+=curve.ny*p.offset;

            z=
                p.z+
                oscillation*p.zWobble;
        }else{
            const offset=
                p.offset+
                oscillation*p.wobble;

            x=curve.x+curve.nx*offset;
            y=curve.y+curve.ny*offset;

            z=
                p.z+
                oscillation*p.zWobble;
        }

        if(state.burst>.001){
            const push=
                1+
                state.burst*
                p.burst*.026;

            x*=push;
            y=(y+.04)*push-.04;
        }

        const screen=projectHeart(
            x,
            y,
            z,
            state,
            centerY
        );

        if(
            screen.x<-12||
            screen.x>W+12||
            screen.y<-12||
            screen.y>H+12
        ){
            continue;
        }

        const twinkle=
            .82+
            .18*Math.pow(
                .5+
                .5*Math.sin(
                    seconds*p.twinkle+
                    p.phase
                ),
                2
            );

        const alpha=clamp(
            p.alpha*
            gain*
            twinkle*
            (1+state.flash*.55)
        );

        const size=
            p.size*
            (.78+.22*state.zoom)*
            clamp(screen.k,.78,1.24);

        ctx.globalAlpha=alpha;

        ctx.fillRect(
            screen.x-size*.5,
            screen.y-size*.5,
            size,
            size
        );

        if(p.hot){
            const sprite=
                kind==="core"?
                glowWhite:
                glowPink;

            const diameter=
                size*
                frameValue(
                    p.phase,
                    4.2,
                    6.8
                )*
                (1+state.flash*.32);

            ctx.globalAlpha=
                alpha*
                (kind==="core"?.34:.25);

            ctx.drawImage(
                sprite,
                screen.x-diameter*.5,
                screen.y-diameter*.5,
                diameter,
                diameter
            );
        }
    }
}

function drawDebris(state,centerY){
    if(state.burst<=.002)return;

    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.fillStyle="#ffc3dd";

    for(let i=0;i<debris.length;i++){
        const p=debris[i];

        const q=clamp(
            (state.burstProgress-p.delay)/
            (1-p.delay)
        );

        if(q<=0)continue;

        const travel=
            1-
            Math.pow(1-q,2.25);

        const distance=
            heartUnit*
            state.zoom*
            (p.start+p.speed*travel);

        const angle=
            p.angle+
            p.curve*q;

        const x=
            centerX+
            Math.cos(angle)*distance;

        const y=
            centerY+
            Math.sin(angle)*distance;

        const fade=
            state.burst*
            (1-q*.67);

        ctx.globalAlpha=
            p.alpha*
            fade;

        ctx.fillRect(
            x-p.size*.5,
            y-p.size*.5,
            p.size,
            p.size
        );

        if(p.hot){
            const diameter=p.size*5.5;

            ctx.globalAlpha=
                p.alpha*
                fade*.24;

            ctx.drawImage(
                glowPink,
                x-diameter*.5,
                y-diameter*.5,
                diameter,
                diameter
            );
        }
    }

    ctx.restore();
}

function drawVignette(){
    ctx.globalCompositeOperation="source-over";
    ctx.globalAlpha=1;
    ctx.fillStyle=vignetteGradient;
    ctx.fillRect(0,0,W,H);
}

function render(now){
    const delta=Math.min(
        .034,
        Math.max(
            0,
            (now-lastFrameTime)/1000
        )
    );

    lastFrameTime=now;
    animationTime+=delta;

    const seconds=animationTime;
    const state=sceneState(seconds);

    drawBackground(seconds);
    drawFloor(state,seconds);

    const centerY=drawStem(
        state,
        seconds
    );

    drawRays(state,centerY);
    drawFlare(state,centerY,false);
    drawOrbit(false,state,seconds,centerY);
    drawHeartTrace(state,centerY);

    ctx.save();
    ctx.globalCompositeOperation="lighter";

    drawHeartParticles(
        dust,
        "dust",
        state,
        seconds,
        centerY,
        "#ff95c5",
        .92
    );

    drawHeartParticles(
        inside,
        "inside",
        state,
        seconds,
        centerY,
        "#ffd2e5",
        1
    );

    drawHeartParticles(
        shell,
        "shell",
        state,
        seconds,
        centerY,
        "#ffb4d3",
        1.08
    );

    drawHeartParticles(
        core,
        "core",
        state,
        seconds,
        centerY,
        "#fff1f8",
        1.16
    );

    ctx.restore();

    drawOrbit(
        true,
        state,
        seconds,
        centerY
    );

    drawDebris(state,centerY);
    drawFlare(state,centerY,true);
    drawVignette();

    requestAnimationFrame(render);
}

buildCurve();
buildFloor();

glowPink=makeGlow(
    64,
    "rgba(255,232,244,.96)",
    "rgba(255,118,186,.42)"
);

glowWhite=makeGlow(
    64,
    "rgba(255,255,255,.98)",
    "rgba(255,191,220,.48)"
);

addEventListener(
    "resize",
    resize,
    {passive:true}
);

document.addEventListener(
    "visibilitychange",
    ()=>{
        lastFrameTime=performance.now();
    },
    {passive:true}
);

resize();
requestAnimationFrame(render);
})();
</script>
</body>
</html>
