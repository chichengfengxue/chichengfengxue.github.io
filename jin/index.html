<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Love</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#05030b}
body{
    background:
        radial-gradient(circle at 50% 44%,rgba(82,20,77,.24) 0%,rgba(25,8,40,.12) 35%,rgba(5,3,11,0) 62%),
        radial-gradient(circle at 50% 100%,rgba(64,24,90,.16),transparent 48%),
        #05030b;
}
canvas{position:fixed;inset:0;display:block;width:100%;height:100%}
.home{
    position:fixed;
    z-index:10;
    left:24px;
    top:22px;
    color:rgba(255,230,244,.32);
    text-decoration:none;
    font:11px/1 Arial,sans-serif;
    letter-spacing:3px;
    transition:.35s;
    user-select:none;
}
.home:hover{
    color:rgba(255,230,244,.9);
    text-shadow:0 0 14px rgba(255,130,210,.8);
}
.loading{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    color:rgba(255,210,235,.55);
    background:#05030b;
    font:10px Arial,sans-serif;

    transition:opacity 1.2s ease;
}

@media(max-width:768px){
    .home{left:17px;top:17px;font-size:9px}
}
</style>

<script type="importmap">
{
    "imports":{
        "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>
</head>
<body>

<a class="home" href="/">HOME</a>
<div class="loading" id="loading">LOVE</div>

<script type="module">
import * as THREE from "three";
import {EffectComposer} from "three/addons/postprocessing/EffectComposer.js";
import {RenderPass} from "three/addons/postprocessing/RenderPass.js";
import {UnrealBloomPass} from "three/addons/postprocessing/UnrealBloomPass.js";
import {OutputPass} from "three/addons/postprocessing/OutputPass.js";

const MOBILE=window.innerWidth<768;
const CONFIG={
    mainCount:MOBILE?26000:50000,
    auraCount:MOBILE?5000:12000,
    streamCount:MOBILE?2600:6500,
    starCount:MOBILE?700:1800,
    floorCount:MOBILE?2600:5500,
    rayCount:MOBILE?45:100,
    pixelRatio:Math.min(window.devicePixelRatio||1,MOBILE?1.35:1.8)
};

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x05030b,0.013);

const camera=new THREE.PerspectiveCamera(
    MOBILE?58:52,
    innerWidth/innerHeight,
    .1,
    250
);

camera.position.set(0,MOBILE?2.5:2.0,MOBILE?54:43);

const renderer=new THREE.WebGLRenderer({
    antialias:false,
    alpha:true,
    powerPreference:"high-performance"
});

renderer.setPixelRatio(CONFIG.pixelRatio);
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x05030b,1);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;
document.body.appendChild(renderer.domElement);

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));

const bloom=new UnrealBloomPass(
    new THREE.Vector2(innerWidth,innerHeight),
    1.9,
    .78,
    .03
);

bloom.threshold=.02;
bloom.strength=MOBILE?1.45:1.8;
bloom.radius=.82;

composer.addPass(bloom);
composer.addPass(new OutputPass());

const clock=new THREE.Clock();

const heartGroup=new THREE.Group();
heartGroup.position.y=2.2;
scene.add(heartGroup);

function randomNormal(){
    const u=1-Math.random();
    const v=Math.random();
    return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}

function heartPoint(t){
    const s=Math.sin(t);
    return new THREE.Vector3(
        16*s*s*s,
        13*Math.cos(t)
        -5*Math.cos(2*t)
        -2*Math.cos(3*t)
        -Math.cos(4*t),
        0
    );
}

function makeColor(type,rnd,t,scale){
    const c=new THREE.Color();

    if(type==="aura"){
        if(rnd<.45)c.setRGB(.92,.25,.76);
        else if(rnd<.78)c.setRGB(.72,.25,1);
        else c.setRGB(1,.48,.84);

        c.multiplyScalar(.55+Math.random()*.3);
        return c;
    }

    const nearDip=
        Math.abs(Math.sin(t))<.18 &&
        Math.cos(t)>.25;

    const hot=Math.random();

    if(nearDip||hot<.22){
        c.setRGB(1,.88,.96);
    }else if(hot<.52){
        c.setRGB(1,.53,.81);
    }else if(hot<.84){
        c.setRGB(.95,.31,.72);
    }else{
        c.setRGB(.75,.28,1);
    }

    if(scale>.98)c.lerp(new THREE.Color(1,.82,.94),.25);

    return c;
}

const heartVertex=`
attribute float aSize;
attribute float aSeed;
attribute float aAlpha;
attribute vec3 color;

uniform float uTime;
uniform float uBeat;

varying vec3 vColor;
varying float vAlpha;
varying float vSeed;

void main(){
    vec3 p=position;

    float n1=sin(
        p.x*.62+
        uTime*1.10+
        aSeed*12.0
    );

    float n2=cos(
        p.y*.57-
        uTime*.86+
        aSeed*9.0
    );

    float n3=sin(
        (p.x+p.y)*.26+
        uTime*.55+
        aSeed*17.0
    );

    float breathe=
        1.0+
        uBeat*.032+
        sin(uTime*.72)*.007;

    p.xy*=breathe;

    p.x+=n1*.075+n3*.035;
    p.y+=n2*.070+n3*.025;
    p.z+=sin(uTime*.65+aSeed*15.0)*.11;

    vec4 mv=modelViewMatrix*vec4(p,1.0);

    float perspective=
        260.0/
        max(8.0,-mv.z);

    gl_PointSize=
        clamp(
            aSize*perspective,
            .55,
            7.0
        );

    gl_Position=
        projectionMatrix*mv;

    vColor=color;
    vAlpha=aAlpha;
    vSeed=aSeed;
}
`;

const heartFragment=`
precision highp float;

varying vec3 vColor;
varying float vAlpha;
varying float vSeed;

void main(){
    vec2 uv=
        gl_PointCoord-
        vec2(.5);

    float d=length(uv);

    if(d>.5)discard;

    float core=
        1.0-
        smoothstep(
            .0,
            .5,
            d
        );

    float soft=
        pow(core,2.3);

    float hot=
        pow(
            max(
                0.0,
                1.0-d*4.2
            ),
            3.0
        );

    vec3 col=
        mix(
            vColor,
            vec3(1.0,.93,.98),
            hot*.7
        );

    gl_FragColor=
        vec4(
            col,
            soft*vAlpha
        );
}
`;

function createHeartSystem(count,type){
    const pos=new Float32Array(count*3);
    const colors=new Float32Array(count*3);
    const sizes=new Float32Array(count);
    const seeds=new Float32Array(count);
    const alphas=new Float32Array(count);

    for(let i=0;i<count;i++){
        const t=Math.random()*Math.PI*2;
        const hp=heartPoint(t);

        let scale;
        let spread;
        let zSpread;

        if(type==="aura"){
            scale=
                1.0+
                Math.pow(
                    Math.random(),
                    1.7
                )*.18;

            spread=1.55;
            zSpread=6.8;
        }else{
            const mode=Math.random();

            if(mode<.73){
                scale=
                    .80+
                    Math.pow(
                        Math.random(),
                        .20
                    )*.225;
            }else if(mode<.91){
                scale=
                    .35+
                    Math.sqrt(
                        Math.random()
                    )*.54;
            }else{
                scale=
                    1.0+
                    Math.random()*.055;
            }

            spread=
                mode<.73
                    ?.55
                    :.85;

            zSpread=
                2.5+
                (1-scale)*2.5;
        }

        const i3=i*3;

        pos[i3]=
            hp.x*scale+
            randomNormal()*spread*.33;

        pos[i3+1]=
            hp.y*scale+
            randomNormal()*spread*.31;

        pos[i3+2]=
            randomNormal()*
            zSpread*.32;

        const c=
            makeColor(
                type,
                Math.random(),
                t,
                scale
            );

        colors[i3]=c.r;
        colors[i3+1]=c.g;
        colors[i3+2]=c.b;

        if(type==="aura"){
            sizes[i]=
                .16+
                Math.pow(
                    Math.random(),
                    2
                )*.38;

            alphas[i]=
                .07+
                Math.random()*.13;
        }else{
            const r=Math.random();

            sizes[i]=
                r<.86
                    ?.07+
                    Math.random()*.11
                    :.15+
                    Math.random()*.16;

            alphas[i]=
                .34+
                Math.random()*.58;
        }

        seeds[i]=Math.random();
    }

    const geometry=
        new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(pos,3)
    );

    geometry.setAttribute(
        "color",
        new THREE.BufferAttribute(colors,3)
    );

    geometry.setAttribute(
        "aSize",
        new THREE.BufferAttribute(sizes,1)
    );

    geometry.setAttribute(
        "aSeed",
        new THREE.BufferAttribute(seeds,1)
    );

    geometry.setAttribute(
        "aAlpha",
        new THREE.BufferAttribute(alphas,1)
    );

    const material=
        new THREE.ShaderMaterial({
            vertexShader:heartVertex,
            fragmentShader:heartFragment,

            uniforms:{
                uTime:{value:0},
                uBeat:{value:0}
            },

            vertexColors:true,
            transparent:true,
            depthWrite:false,
            depthTest:true,

            blending:
                THREE.AdditiveBlending
        });

    const points=
        new THREE.Points(
            geometry,
            material
        );

    points.frustumCulled=false;

    heartGroup.add(points);

    return {
        points,
        material
    };
}

const mainHeart=
    createHeartSystem(
        CONFIG.mainCount,
        "main"
    );

const auraHeart=
    createHeartSystem(
        CONFIG.auraCount,
        "aura"
    );

/* ============================
   OUTWARD STREAM PARTICLES
============================ */

const streamVertex=`
attribute vec3 aStart;
attribute vec3 aDirection;
attribute float aPhase;
attribute float aSpeed;
attribute float aSize;
attribute float aAlpha;
attribute vec3 color;

uniform float uTime;

varying vec3 vColor;
varying float vAlpha;

void main(){
    float q=
        fract(
            aPhase+
            uTime*aSpeed
        );

    float travel=
        pow(q,1.45);

    vec3 p=
        aStart+
        aDirection*
        travel*
        18.0;

    p.x+=
        sin(
            uTime*3.0+
            aPhase*20.0
        )*.10*q;

    p.y+=
        cos(
            uTime*2.3+
            aPhase*15.0
        )*.08*q;

    vec4 mv=
        modelViewMatrix*
        vec4(p,1.0);

    gl_PointSize=
        clamp(
            aSize*
            270.0/
            max(8.0,-mv.z),
            .45,
            4.0
        );

    gl_Position=
        projectionMatrix*mv;

    vColor=color;

    vAlpha=
        aAlpha*
        pow(
            1.0-q,
            1.4
        );
}
`;

const streamFragment=`
precision highp float;

varying vec3 vColor;
varying float vAlpha;

void main(){
    vec2 p=
        gl_PointCoord-
        .5;

    float d=
        length(p);

    if(d>.5)discard;

    float a=
        pow(
            1.0-
            d*2.0,
            2.0
        );

    gl_FragColor=
        vec4(
            vColor,
            a*vAlpha
        );
}
`;

function createStreams(){
    const n=CONFIG.streamCount;

    const starts=new Float32Array(n*3);
    const dirs=new Float32Array(n*3);
    const colors=new Float32Array(n*3);

    const phase=new Float32Array(n);
    const speed=new Float32Array(n);
    const size=new Float32Array(n);
    const alpha=new Float32Array(n);

    for(let i=0;i<n;i++){
        const t=Math.random()*Math.PI*2;
        const hp=heartPoint(t);

        const scale=
            .92+
            Math.random()*.10;

        const x=
            hp.x*scale+
            randomNormal()*.35;

        const y=
            hp.y*scale+
            randomNormal()*.30;

        const z=
            randomNormal()*1.2;

        const i3=i*3;

        starts[i3]=x;
        starts[i3+1]=y;
        starts[i3+2]=z;

        const dir=
            new THREE.Vector3(
                x,
                y*.9,
                z+randomNormal()*2
            )
            .normalize();

        dir.x+=
            randomNormal()*.11;

        dir.y+=
            randomNormal()*.11;

        dir.z+=
            randomNormal()*.13;

        dirs[i3]=dir.x;
        dirs[i3+1]=dir.y;
        dirs[i3+2]=dir.z;

        const c=
            Math.random()<.48
                ?new THREE.Color(
                    1,
                    .72,
                    .90
                )
                :new THREE.Color(
                    1,
                    .35,
                    .73
                );

        colors[i3]=c.r;
        colors[i3+1]=c.g;
        colors[i3+2]=c.b;

        phase[i]=Math.random();

        speed[i]=
            .025+
            Math.random()*.07;

        size[i]=
            .08+
            Math.random()*.11;

        alpha[i]=
            .18+
            Math.random()*.60;
    }

    const g=
        new THREE.BufferGeometry();

    g.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            new Float32Array(n*3),
            3
        )
    );

    g.setAttribute(
        "aStart",
        new THREE.BufferAttribute(starts,3)
    );

    g.setAttribute(
        "aDirection",
        new THREE.BufferAttribute(dirs,3)
    );

    g.setAttribute(
        "color",
        new THREE.BufferAttribute(colors,3)
    );

    g.setAttribute(
        "aPhase",
        new THREE.BufferAttribute(phase,1)
    );

    g.setAttribute(
        "aSpeed",
        new THREE.BufferAttribute(speed,1)
    );

    g.setAttribute(
        "aSize",
        new THREE.BufferAttribute(size,1)
    );

    g.setAttribute(
        "aAlpha",
        new THREE.BufferAttribute(alpha,1)
    );

    const m=
        new THREE.ShaderMaterial({
            vertexShader:streamVertex,
            fragmentShader:streamFragment,

            uniforms:{
                uTime:{value:0}
            },

            transparent:true,
            depthWrite:false,
            blending:
                THREE.AdditiveBlending
        });

    const p=
        new THREE.Points(g,m);

    p.frustumCulled=false;

    heartGroup.add(p);

    return {
        points:p,
        material:m
    };
}

const streams=createStreams();

/* ============================
   CENTRAL FALLING / RISING DUST
============================ */

function createFountain(){
    const n=MOBILE?700:1700;

    const position=
        new Float32Array(n*3);

    const color=
        new Float32Array(n*3);

    for(let i=0;i<n;i++){
        const q=Math.random();

        const radius=
            (1-q)*
            (1-q)*
            1.8;

        const a=
            Math.random()*
            Math.PI*2;

        position[i*3]=
            Math.cos(a)*
            radius;

        position[i*3+1]=
            -20.1+
            q*6.3+
            randomNormal()*.13;

        position[i*3+2]=
            Math.sin(a)*
            radius*.45;

        const c=
            Math.random()<.5
                ?new THREE.Color(
                    1,.9,.97
                )
                :new THREE.Color(
                    1,.36,.77
                );

        color[i*3]=c.r;
        color[i*3+1]=c.g;
        color[i*3+2]=c.b;
    }

    const g=
        new THREE.BufferGeometry();

    g.setAttribute(
        "position",
        new THREE.BufferAttribute(
            position,
            3
        )
    );

    g.setAttribute(
        "color",
        new THREE.BufferAttribute(
            color,
            3
        )
    );

    const m=
        new THREE.PointsMaterial({
            size:.13,
            vertexColors:true,
            transparent:true,
            opacity:.8,
            depthWrite:false,
            blending:
                THREE.AdditiveBlending
        });

    const p=new THREE.Points(g,m);

    p.position.y=2.2;

    scene.add(p);

    return p;
}

const fountain=
    createFountain();

/* ============================
   FLOOR PARTICLE FIELD
============================ */

function createFloor(){
    const positions=[];
    const colors=[];

    const rings=30;

    for(let ring=1;ring<=rings;ring++){
        const radius=
            .85+
            Math.pow(
                ring/rings,
                1.26
            )*34;

        const count=
            Math.floor(
                20+
                radius*5.0
            );

        for(let j=0;j<count;j++){
            const a=
                j/count*
                Math.PI*2+
                (ring%2)*.035;

            positions.push(
                Math.cos(a)*radius,
                -18.2,
                Math.sin(a)*radius
            );

            const bright=
                Math.max(
                    .08,
                    1-ring/rings
                );

            colors.push(
                .72+.28*bright,
                .34+.38*bright,
                .9
            );
        }
    }

    while(
        positions.length/3<
        CONFIG.floorCount
    ){
        const radius=
            Math.sqrt(
                Math.random()
            )*35;

        const a=
            Math.random()*
            Math.PI*2;

        positions.push(
            Math.cos(a)*radius,
            -18.2+
            (Math.random()-.5)*.025,
            Math.sin(a)*radius
        );

        colors.push(
            .7,
            .32,
            .92
        );
    }

    const g=
        new THREE.BufferGeometry();

    g.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            positions,
            3
        )
    );

    g.setAttribute(
        "color",
        new THREE.Float32BufferAttribute(
            colors,
            3
        )
    );

    const m=
        new THREE.PointsMaterial({
            size:.055,
            sizeAttenuation:true,
            vertexColors:true,
            transparent:true,
            opacity:.33,
            depthWrite:false,
            blending:
                THREE.AdditiveBlending
        });

    const p=
        new THREE.Points(g,m);

    scene.add(p);

    const lines=[];
    const radialCount=42;

    for(let i=0;i<radialCount;i++){
        const a=
            i/radialCount*
            Math.PI*2;

        lines.push(
            0,-18.19,0,
            Math.cos(a)*36,
            -18.19,
            Math.sin(a)*36
        );
    }

    const lg=
        new THREE.BufferGeometry();

    lg.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            lines,
            3
        )
    );

    const lm=
        new THREE.LineBasicMaterial({
            color:0xb16bd9,
            transparent:true,
            opacity:.055,
            depthWrite:false,
            blending:
                THREE.AdditiveBlending
        });

    scene.add(
        new THREE.LineSegments(
            lg,
            lm
        )
    );
}

createFloor();

/* ============================
   GROUND GLOW RINGS
============================ */

const groundRingGroup=
    new THREE.Group();

groundRingGroup.position.set(
    0,
    -18.05,
    0
);

scene.add(
    groundRingGroup
);

for(let i=0;i<7;i++){
    const r=
        1.25+
        i*.73;

    const points=[];

    for(let j=0;j<130;j++){
        const a=
            j/130*
            Math.PI*2;

        points.push(
            new THREE.Vector3(
                Math.cos(a)*r,
                0,
                Math.sin(a)*r
            )
        );
    }

    const g=
        new THREE.BufferGeometry()
        .setFromPoints(
            points
        );

    const m=
        new THREE.LineBasicMaterial({
            color:
                i<2
                    ?0xffd7ef
                    :0xe177cf,

            transparent:true,
            opacity:
                .30-i*.03,

            blending:
                THREE.AdditiveBlending,

            depthWrite:false
        });

    groundRingGroup.add(
        new THREE.LineLoop(
            g,
            m
        )
    );
}

/* ============================
   BACKGROUND STARS
============================ */

function createStars(){
    const n=
        CONFIG.starCount;

    const p=
        new Float32Array(
            n*3
        );

    const c=
        new Float32Array(
            n*3
        );

    for(let i=0;i<n;i++){
        p[i*3]=
            (Math.random()-.5)*95;

        p[i*3+1]=
            (Math.random()-.5)*64;

        p[i*3+2]=
            -8-
            Math.random()*55;

        const b=
            .45+
            Math.random()*.55;

        c[i*3]=b;
        c[i*3+1]=b*.63;
        c[i*3+2]=b*.93;
    }

    const g=
        new THREE.BufferGeometry();

    g.setAttribute(
        "position",
        new THREE.BufferAttribute(
            p,
            3
        )
    );

    g.setAttribute(
        "color",
        new THREE.BufferAttribute(
            c,
            3
        )
    );

    const m=
        new THREE.PointsMaterial({
            size:.085,
            vertexColors:true,
            transparent:true,
            opacity:.52,
            depthWrite:false,
            blending:
                THREE.AdditiveBlending
        });

    const stars=
        new THREE.Points(
            g,
            m
        );

    scene.add(stars);

    return stars;
}

const stars=createStars();

/* ============================
   RADIAL LIGHT STREAKS
============================ */

function createRays(){
    const verts=[];

    for(let i=0;i<CONFIG.rayCount;i++){
        const a=
            Math.random()*
            Math.PI*2;

        const start=
            16+
            Math.random()*8;

        const length=
            3+
            Math.random()*13;

        const flatten=
            .78;

        verts.push(
            Math.cos(a)*start,
            Math.sin(a)*start*flatten+2,
            -4-Math.random()*8,

            Math.cos(a)*(start+length),
            Math.sin(a)*(start+length)*flatten+2,
            -4-Math.random()*8
        );
    }

    const g=
        new THREE.BufferGeometry();

    g.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            verts,
            3
        )
    );

    const m=
        new THREE.LineBasicMaterial({
            color:0xed78c8,
            transparent:true,
            opacity:.085,
            blending:
                THREE.AdditiveBlending,
            depthWrite:false
        });

    const rays=
        new THREE.LineSegments(
            g,
            m
        );

    scene.add(rays);

    return rays;
}

const rays=createRays();

/* ============================
   MOUSE PARALLAX
============================ */

const pointer={
    x:0,
    y:0,
    tx:0,
    ty:0
};

window.addEventListener(
    "pointermove",
    e=>{
        pointer.tx=
            (
                e.clientX/
                innerWidth-
                .5
            )*2;

        pointer.ty=
            (
                e.clientY/
                innerHeight-
                .5
            )*2;
    },
    {passive:true}
);

window.addEventListener(
    "pointerleave",
    ()=>{
        pointer.tx=0;
        pointer.ty=0;
    },
    {passive:true}
);

/* ============================
   RESIZE
============================ */

window.addEventListener(
    "resize",
    ()=>{
        camera.aspect=
            innerWidth/
            innerHeight;

        camera.fov=
            innerWidth<768
                ?58
                :52;

        camera.position.z=
            innerWidth<768
                ?54
                :43;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

        composer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

/* ============================
   ANIMATION
============================ */

function heartbeat(t){
    const cycle=
        t%1.45;

    let value=0;

    if(cycle<.13){
        value=
            Math.sin(
                cycle/.13*
                Math.PI
            );
    }

    if(
        cycle>.18 &&
        cycle<.31
    ){
        value+=
            .48*
            Math.sin(
                (cycle-.18)/
                .13*
                Math.PI
            );
    }

    return value;
}

let first=true;

function animate(){
    requestAnimationFrame(
        animate
    );

    const t=
        clock.getElapsedTime();

    const beat=
        heartbeat(t);

    mainHeart.material.uniforms
        .uTime.value=t;

    mainHeart.material.uniforms
        .uBeat.value=beat;

    auraHeart.material.uniforms
        .uTime.value=t;

    auraHeart.material.uniforms
        .uBeat.value=beat;

    streams.material.uniforms
        .uTime.value=t;

    pointer.x+=
        (pointer.tx-pointer.x)*
        .025;

    pointer.y+=
        (pointer.ty-pointer.y)*
        .025;

    heartGroup.rotation.y=
        pointer.x*.075+
        Math.sin(t*.16)*.018;

    heartGroup.rotation.x=
        pointer.y*.035;

    camera.position.x+=
        (
            pointer.x*.45-
            camera.position.x
        )*.025;

    camera.position.y+=
        (
            2-
            pointer.y*.25-
            camera.position.y
        )*.025;

    camera.lookAt(
        0,
        .4,
        0
    );

    auraHeart.points.rotation.z=
        Math.sin(t*.10)*.006;

    streams.points.rotation.z=
        Math.sin(t*.13)*.004;

    groundRingGroup.scale.setScalar(
        1+
        beat*.025+
        Math.sin(t*1.2)*.008
    );

    fountain.rotation.y=
        t*.05;

    stars.rotation.z=
        t*.002;

    rays.rotation.z=
        Math.sin(t*.08)*.006;

    composer.render();

    if(first){
        first=false;

        setTimeout(
            ()=>{
                document
                    .getElementById(
                        "loading"
                    )
                    .classList
                    .add(
                        "hide"
                    );
            },
            450
        );
    }
}

animate();
</script>
