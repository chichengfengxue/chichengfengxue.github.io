<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050914">
<title>Love</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#03060d}
body{overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="love" aria-hidden="true"></canvas>
<script>
(()=>{
"use strict";

const canvas=document.getElementById("love");
const ctx=canvas.getContext("2d",{alpha:false});
const TAU=Math.PI*2;
const LUT_SIZE=2048;

let W=0,H=0,DPR=1;
let centerX=0,floorY=0,heartUnit=1,floorRadius=1;
let bgGradient=null,vignetteGradient=null;
let glowPink=null,glowWhite=null;
let lastProfile="";
let animationTime=0;
let lastFrameTime=performance.now();

let core=[];
let shell=[];
let inside=[];
let lower=[];
let dust=[];
let floorDots=[];
let rays=[];
let debris=[];
let stars=[];
let stem=[];

const curveX=new Float32Array(LUT_SIZE);
const curveY=new Float32Array(LUT_SIZE);
const curveNX=new Float32Array(LUT_SIZE);
const curveNY=new Float32Array(LUT_SIZE);
const curveSample={x:0,y:0,nx:0,ny:0};
const projected={x:0,y:0,k:1,z:0};
const floorProjected={x:0,y:0,z:0};
const orbitSample={x:0,y:0,z:0};

const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const mix=(a,b,t)=>a+(b-a)*t;
const fract=v=>v-Math.floor(v);
const smooth=v=>{
    v=clamp(v);
    return v*v*(3-2*v);
};

function mulberry32(seed){
    return function(){
        seed|=0;
        seed=seed+0x6D2B79F5|0;
        let t=Math.imul(seed^seed>>>15,1|seed);
        t=t+Math.imul(t^t>>>7,61|t)^t;
        return((t^t>>>14)>>>0)/4294967296;
    };
}

let random=mulberry32(0x5f3759df);

const rnd=(a=1,b)=>{
    if(b===undefined){
        b=a;
        a=0;
    }
    return a+(b-a)*random();
};

const gaussian=()=>random()+random()+random()+random()-2;

function heartPoint(t){
    const s=Math.sin(t);
    const q=Math.abs(s);
    const rawY=
        13*Math.cos(t)
        -5*Math.cos(2*t)
        -2*Math.cos(3*t)
        -Math.cos(4*t);

    let y=(rawY+2.5)/14.5;

    if(y<.08){
        y=.08+(y-.08)*.86;
    }

    const lowerPart=clamp((.18-y)/1.08);
    const lowerBulge=
        1+.36*Math.pow(lowerPart,.62)*(1-.38*lowerPart);
    const roundedBase=
        .44*lowerPart*q*(1-.25*q);

    return[
        Math.sign(s)*(1.02*q*q*q*lowerBulge+roundedBase),
        y
    ];
}

function buildCurve(){
    for(let i=0;i<LUT_SIZE;i++){
        const p=heartPoint(i/LUT_SIZE*TAU);
        curveX[i]=p[0];
        curveY[i]=p[1];
    }

    for(let i=0;i<LUT_SIZE;i++){
        const a=(i-2+LUT_SIZE)%LUT_SIZE;
        const b=(i+2)%LUT_SIZE;
        const dx=curveX[b]-curveX[a];
        const dy=curveY[b]-curveY[a];
        const length=Math.hypot(dx,dy)||1;

        curveNX[i]=-dy/length;
        curveNY[i]=dx/length;
    }
}

function sampleCurve(u){
    const f=fract(u)*LUT_SIZE;
    const i=f|0;
    const j=(i+1)%LUT_SIZE;
    const q=f-i;

    curveSample.x=mix(curveX[i],curveX[j],q);
    curveSample.y=mix(curveY[i],curveY[j],q);
    curveSample.nx=mix(curveNX[i],curveNX[j],q);
    curveSample.ny=mix(curveNY[i],curveNY[j],q);

    return curveSample;
}

function makeGlow(size,inner,mid){
    const c=document.createElement("canvas");
    c.width=c.height=size;

    const g=c.getContext("2d");
    const r=size/2;
    const gradient=g.createRadialGradient(r,r,0,r,r,r);

    gradient.addColorStop(0,"rgba(255,255,255,1)");
    gradient.addColorStop(.10,inner);
    gradient.addColorStop(.34,mid);
    gradient.addColorStop(1,"rgba(255,105,183,0)");

    g.fillStyle=gradient;
    g.fillRect(0,0,size,size);

    return c;
}

function pointBase(u,offset,z,size,alpha,hot,flow){
    return{
        u,
        offset,
        z,
        size,
        alpha,
        hot,
        flow,
        phase:rnd(TAU),
        twinkle:rnd(1.8,5.2),
        wobble:rnd(.002,.013),
        zWobble:rnd(.002,.018),
        burst:rnd(.2,1)
    };
}

function buildHeart(profile){
    random=mulberry32(0x5f3759df);

    const mobile=profile==="mobile";
    const count={
        core:mobile?820:1380,
        shell:mobile?2350:4050,
        inside:mobile?2450:4250,
        lower:mobile?820:1450,
        dust:mobile?480:820
    };

    core=[];
    shell=[];
    inside=[];
    lower=[];
    dust=[];

    for(let i=0;i<count.core;i++){
        const u=(i+rnd(-.38,.38))/count.core;
        const ring=rnd(.004,.034);
        const a=rnd(TAU);

        core.push(
            pointBase(
                u,
                Math.cos(a)*ring+gaussian()*.006,
                Math.sin(a)*ring*1.85+gaussian()*.014,
                rnd(.75,1.9),
                rnd(.62,.96),
                random()<.20,
                rnd(.0028,.0058)
            )
        );
    }

    for(let i=0;i<count.shell;i++){
        const tube=Math.abs(gaussian())*rnd(.035,.105);
        const a=rnd(TAU);

        let offset=Math.cos(a)*tube+gaussian()*.022;

        if(random()<.17){
            offset+=
                Math.sign(gaussian()||1)*
                rnd(.05,.18)*
                Math.pow(random(),1.8);
        }

        shell.push(
            pointBase(
                random(),
                offset,
                Math.sin(a)*tube*1.9+gaussian()*.052,
                random()<.09?rnd(2,3.25):rnd(.65,2.15),
                rnd(.30,.76),
                random()<.095,
                rnd(.004,.009)
            )
        );
    }

    for(let i=0;i<count.inside;i++){
        const radius=.035+.925*Math.sqrt(random());

        const p=pointBase(
            random(),
            gaussian()*.018,
            gaussian()*(.065+.145*(1-radius)),
            random()<.065?rnd(1.8,2.65):rnd(.58,1.72),
            rnd(.29,.70),
            random()<.09,
            rnd(.002,.0065)
        );

        p.radius=radius;
        p.jx=gaussian()*.15*(1-radius);
        p.jy=gaussian()*.12*(1-radius);

        inside.push(p);
    }

    for(let i=0;i<count.lower;i++){
        const bell=(random()+random()+random())/3;
        const radius=.18+.80*Math.pow(random(),.54);

        const p=pointBase(
            .285+.43*bell,
            gaussian()*.014,
            gaussian()*(.075+.155*(1-radius)),
            random()<.085?rnd(1.9,2.85):rnd(.62,1.82),
            rnd(.38,.78),
            random()<.11,
            rnd(.0018,.0052)
        );

        p.radius=radius;
        p.jx=gaussian()*.13*(1-radius);
        p.jy=gaussian()*.08*(1-radius)-rnd(0,.022);

        lower.push(p);
    }

    for(let i=0;i<count.dust;i++){
        const side=Math.sign(gaussian()||1);

        const p=pointBase(
            random(),
            gaussian()*.12+
                side*rnd(.055,.23)*Math.pow(random(),.72),
            gaussian()*.19,
            rnd(.45,1.45),
            rnd(.10,.38),
            random()<.045,
            rnd(.006,.013)
        );

        p.wobble=rnd(.008,.035);
        dust.push(p);
    }
}

function buildFloor(){
    floorDots=[];

    for(let ringIndex=0;ringIndex<10;ringIndex++){
        const r=.10+ringIndex*.092;
        const n=36+ringIndex*10;

        for(let i=0;i<n;i++){
            const a=i/n*TAU+rnd(-.008,.008);

            floorDots.push({
                x:Math.cos(a)*r,
                z:Math.sin(a)*r,
                size:rnd(.55,1.18),
                alpha:rnd(.20,.56),
                phase:rnd(TAU)
            });
        }
    }

    for(let spoke=0;spoke<46;spoke++){
        const a=spoke/46*TAU;

        for(let i=2;i<19;i++){
            const r=i/19+rnd(-.008,.008);

            floorDots.push({
                x:Math.cos(a)*r,
                z:Math.sin(a)*r,
                size:rnd(.52,1.12),
                alpha:rnd(.18,.48),
                phase:rnd(TAU)
            });
        }
    }

    for(let i=0;i<720;i++){
        const a=i/720*TAU;
        const wave=Math.sin(18*a);
        const r=Math.sign(wave)*Math.pow(Math.abs(wave),.72);

        floorDots.push({
            x:Math.cos(a)*r,
            z:Math.sin(a)*r,
            size:rnd(.55,1.22),
            alpha:rnd(.28,.65),
            phase:rnd(TAU)
        });
    }
}

function buildEffects(profile){
    const mobile=profile==="mobile";

    rays=[];
    debris=[];
    stem=[];

    const rayCount=mobile?95:170;

    for(let i=0;i<rayCount;i++){
        rays.push({
            angle:i/rayCount*TAU+rnd(-.045,.045),
            length:rnd(.70,1.95)*Math.pow(rnd(.35,1),.38),
            start:rnd(.04,.30),
            width:random()<.14?rnd(1.2,2.2):rnd(.35,1.05),
            alpha:rnd(.18,.78),
            delay:rnd(0,.22),
            phase:rnd(TAU)
        });
    }

    const debrisCount=mobile?520:1050;

    for(let i=0;i<debrisCount;i++){
        debris.push({
            angle:rnd(TAU),
            speed:rnd(.45,1.75)*Math.pow(rnd(.2,1),.35),
            start:rnd(.05,.46),
            delay:rnd(0,.22),
            curve:rnd(-.25,.25),
            size:random()<.08?rnd(1.8,3.1):rnd(.5,1.55),
            alpha:rnd(.18,.72),
            phase:rnd(TAU),
            hot:random()<.08
        });
    }

    const stemCount=mobile?100:180;

    for(let i=0;i<stemCount;i++){
        stem.push({
            phase:random(),
            speed:rnd(.10,.24),
            sway:rnd(-1,1),
            size:rnd(.55,1.45),
            alpha:rnd(.18,.62)
        });
    }
}

function buildStars(profile){
    const mobile=profile==="mobile";

    stars=[];

    const count=mobile?130:260;

    for(let i=0;i<count;i++){
        stars.push({
            x:rnd(.05,.95),
            y:rnd(.10,.78),
            size:random()<.05?rnd(1.5,2.4):rnd(.35,1.15),
            alpha:rnd(.035,.22),
            phase:rnd(TAU),
            speed:rnd(.35,1.25)
        });
    }
}

function resize(){
    W=Math.max(1,innerWidth);
    H=Math.max(1,innerHeight);

    const profile=W<720?"mobile":"desktop";

    DPR=Math.min(
        devicePixelRatio||1,
        profile==="mobile"?1.18:1.42
    );

    canvas.width=Math.round(W*DPR);
    canvas.height=Math.round(H*DPR);
    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.imageSmoothingEnabled=true;

    centerX=W*.5;
    floorY=H*(W/H<.76?.69:.70);
    heartUnit=Math.min(W*.385,H*.275,350);
    floorRadius=Math.min(W*.49,H*.58,720);

    bgGradient=ctx.createRadialGradient(
        centerX,H*.44,0,
        centerX,H*.44,
        Math.max(W,H)*.72
    );

    bgGradient.addColorStop(0,"#202944");
    bgGradient.addColorStop(.27,"#151d33");
    bgGradient.addColorStop(.62,"#090f20");
    bgGradient.addColorStop(1,"#02040b");

    vignetteGradient=ctx.createRadialGradient(
        centerX,H*.48,Math.min(W,H)*.15,
        centerX,H*.48,Math.max(W,H)*.70
    );

    vignetteGradient.addColorStop(0,"rgba(0,0,0,0)");
    vignetteGradient.addColorStop(.68,"rgba(0,0,0,.08)");
    vignetteGradient.addColorStop(1,"rgba(0,0,0,.64)");

    if(profile!==lastProfile){
        buildHeart(profile);
        buildEffects(profile);
        lastProfile=profile;
    }

    buildStars(profile);
}

function sceneState(seconds){
    const t=seconds%10;
    const phase=t/10;
    const cycleAngle=phase*TAU;

    const rotation=
        seconds/10*TAU-
        .16*Math.sin(cycleAngle);

    const pitch=
        .042*Math.sin(seconds*.37)+
        .015*Math.sin(seconds*.91);

    const roll=.018*Math.sin(seconds*.23);

    const flash=
        smooth((t-1.84)/.12)*
        (1-smooth((t-2.12)/.58));

    const burst=
        smooth((t-1.90)/.13)*
        (1-smooth((t-2.47)/.90));

    const burstProgress=clamp((t-1.84)/.68);

    const linger=
        smooth((t-2.33)/.32)*
        (1-smooth((t-5.92)/.90));

    const ring=
        .80+
        .20*Math.pow(.5+.5*Math.sin(seconds*.58+.7),2);

    const zoom=1+flash*.022;

    return{
        t,
        phase,
        zoom,
        rotation,
        pitch,
        roll,
        ring,
        flash,
        burst,
        burstProgress,
        linger
    };
}

function projectHeart(x,y,z,state,centerY){
    const c=Math.cos(state.rotation);
    const s=Math.sin(state.rotation);

    let xr=x*c+z*s;
    let zr=-x*s+z*c;

    const cp=Math.cos(state.pitch);
    const sp=Math.sin(state.pitch);

    let yr=y*cp-zr*sp;
    zr=y*sp+zr*cp;

    const cr=Math.cos(state.roll);
    const sr=Math.sin(state.roll);

    const xf=xr*cr-yr*sr;
    const yf=xr*sr+yr*cr;
    const k=1/(1-zr*.17);

    projected.x=
        centerX+
        xf*heartUnit*state.zoom*k;

    projected.y=
        centerY-
        yf*heartUnit*1.045*state.zoom*k;

    projected.k=k;
    projected.z=zr;

    return projected;
}

function projectOrbit(x,y,z,state,centerY){
    const cr=Math.cos(state.roll);
    const sr=Math.sin(state.roll);

    const xf=x*cr-y*sr;
    const yf=x*sr+y*cr;
    const k=1/(1-z*.17);

    projected.x=
        centerX+
        xf*heartUnit*state.zoom*k;

    projected.y=
        centerY-
        yf*heartUnit*1.045*state.zoom*k;

    projected.k=k;
    projected.z=z;

    return projected;
}

function projectFloor(x,z,zoom,angle){
    const c=Math.cos(angle);
    const s=Math.sin(angle);

    const xr=x*c-z*s;
    const zr=x*s+z*c;
    const k=1/(1-zr*.27);

    floorProjected.x=
        centerX+
        xr*floorRadius*zoom*k;

    floorProjected.y=
        floorY+
        zr*floorRadius*.30*zoom*k;

    floorProjected.z=zr;

    return floorProjected;
}

function drawBackground(seconds){
    ctx.globalCompositeOperation="source-over";
    ctx.globalAlpha=1;
    ctx.fillStyle=bgGradient;
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle="#ffd2e6";

    for(let i=0;i<stars.length;i++){
        const p=stars[i];
        const flicker=.55+.45*Math.sin(
            seconds*p.speed+p.phase
        );

        ctx.globalAlpha=
            p.alpha*(.45+.55*flicker*flicker);

        ctx.fillRect(
            p.x*W,
            p.y*H,
            p.size,
            p.size
        );

        if(p.size>1.45){
            ctx.globalAlpha*=.48;

            ctx.fillRect(
                p.x*W-p.size*2,
                p.y*H+p.size*.35,
                p.size*5,
                p.size*.28
            );

            ctx.fillRect(
                p.x*W+p.size*.35,
                p.y*H-p.size*2,
                p.size*.28,
                p.size*5
            );
        }
    }

    ctx.globalAlpha=1;
}

function drawAtmosphere(state,seconds,centerY){
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.translate(centerX,centerY);
    ctx.scale(1.12,.92);

    const radius=heartUnit*1.58*state.zoom;
    const g=ctx.createRadialGradient(
        0,0,0,
        0,0,radius
    );

    g.addColorStop(
        0,
        `rgba(255,221,239,${.075+state.flash*.15})`
    );

    g.addColorStop(
        .22,
        `rgba(255,139,198,${.050+state.burst*.08})`
    );

    g.addColorStop(
        .54,
        "rgba(191,119,255,.024)"
    );

    g.addColorStop(
        1,
        "rgba(114,74,214,0)"
    );

    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(0,0,radius,0,TAU);
    ctx.fill();

    ctx.rotate(seconds*.035);
    ctx.globalAlpha=.035+state.burst*.045;
    ctx.fillStyle="#ff9fce";

    for(let i=0;i<12;i++){
        ctx.rotate(TAU/12);
        ctx.beginPath();
        ctx.moveTo(heartUnit*.30,-1);
        ctx.lineTo(
            heartUnit*1.65,
            -heartUnit*.018
        );
        ctx.lineTo(
            heartUnit*1.65,
            heartUnit*.018
        );
        ctx.closePath();
        ctx.fill();
    }

    ctx.restore();
}

function drawLensFlare(state,centerY){
    const power=
        state.flash+
        state.burst*.24;

    if(power<.002)return;

    const radius=
        heartUnit*
        state.zoom*
        (1.75+state.burst*.45);

    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.translate(centerX,centerY);
    ctx.globalAlpha=power;

    let g=ctx.createLinearGradient(
        -radius,0,
        radius,0
    );

    g.addColorStop(
        0,
        "rgba(255,128,194,0)"
    );

    g.addColorStop(
        .32,
        "rgba(255,145,204,.035)"
    );

    g.addColorStop(
        .49,
        "rgba(255,246,251,.56)"
    );

    g.addColorStop(
        .51,
        "rgba(255,246,251,.56)"
    );

    g.addColorStop(
        .68,
        "rgba(255,145,204,.035)"
    );

    g.addColorStop(
        1,
        "rgba(255,128,194,0)"
    );

    ctx.fillStyle=g;
    ctx.fillRect(
        -radius,
        -1.25,
        radius*2,
        2.5
    );

    g=ctx.createLinearGradient(
        0,-radius*.72,
        0,radius*.72
    );

    g.addColorStop(
        0,
        "rgba(255,150,211,0)"
    );

    g.addColorStop(
        .48,
        "rgba(255,244,250,.28)"
    );

    g.addColorStop(
        .52,
        "rgba(255,244,250,.28)"
    );

    g.addColorStop(
        1,
        "rgba(255,150,211,0)"
    );

    ctx.fillStyle=g;
    ctx.fillRect(
        -.75,
        -radius*.72,
        1.5,
        radius*1.44
    );

    ctx.rotate(Math.PI*.25);
    ctx.globalAlpha=power*.28;
    ctx.fillStyle="#ffe5f2";

    ctx.fillRect(
        -radius*.72,
        -.38,
        radius*1.44,
        .76
    );

    ctx.rotate(Math.PI*.5);

    ctx.fillRect(
        -radius*.72,
        -.38,
        radius*1.44,
        .76
    );

    ctx.restore();
}

function drawFloorGlow(state){
    const r=floorRadius*state.zoom;

    ctx.save();
    ctx.translate(centerX,floorY);
    ctx.scale(1,.31);

    const g=ctx.createRadialGradient(
        0,0,0,
        0,0,r*1.05
    );

    g.addColorStop(
        0,
        `rgba(255,205,231,${.17+state.burst*.18})`
    );

    g.addColorStop(
        .25,
        "rgba(255,125,193,.075)"
    );

    g.addColorStop(
        1,
        "rgba(255,95,177,0)"
    );

    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(0,0,r*1.05,0,TAU);
    ctx.fill();
    ctx.restore();
}

function rosettePath(
    state,
    seconds,
    petals=18,
    direction=1,
    phase=0,
    radiusScale=1
){
    const angle=
        seconds*.018*direction+
        phase*.08;

    const n=petals===18?1280:860;

    ctx.beginPath();

    for(let i=0;i<=n;i++){
        const a=i/n*TAU;
        const wave=Math.sin(petals*a+phase);

        const r=
            Math.sign(wave)*
            Math.pow(Math.abs(wave),.72)*
            radiusScale;

        const p=projectFloor(
            Math.cos(a)*r,
            Math.sin(a)*r,
            state.zoom,
            angle
        );

        if(i===0){
            ctx.moveTo(p.x,p.y);
        }else{
            ctx.lineTo(p.x,p.y);
        }
    }
}

function floorCircle(radius,state,seconds){
    const angle=seconds*.018;
    const n=120;

    ctx.beginPath();

    for(let i=0;i<=n;i++){
        const a=i/n*TAU;

        const p=projectFloor(
            Math.cos(a)*radius,
            Math.sin(a)*radius,
            state.zoom,
            angle
        );

        if(i===0){
            ctx.moveTo(p.x,p.y);
        }else{
            ctx.lineTo(p.x,p.y);
        }
    }
}

function drawFloor(state,seconds){
    drawFloorGlow(state);

    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.lineJoin="round";
    ctx.lineCap="round";

    rosettePath(
        state,
        seconds,
        18,
        1,
        0,
        1
    );

    ctx.globalAlpha=
        .12+
        state.burst*.075;

    ctx.strokeStyle="#ff79b9";
    ctx.lineWidth=6.2;
    ctx.shadowColor="#ff71b6";
    ctx.shadowBlur=17;
    ctx.stroke();

    ctx.globalAlpha=
        .70+
        state.burst*.19;

    ctx.strokeStyle="#ffd1e5";
    ctx.lineWidth=.82;
    ctx.shadowBlur=5;
    ctx.stroke();

    rosettePath(
        state,
        seconds,
        12,
        -1,
        Math.PI*.37,
        .72
    );

    ctx.globalAlpha=
        .075+
        state.burst*.055;

    ctx.strokeStyle="#c991ff";
    ctx.lineWidth=4.4;
    ctx.shadowColor="#be7bff";
    ctx.shadowBlur=13;
    ctx.stroke();

    ctx.globalAlpha=
        .34+
        state.burst*.15;

    ctx.strokeStyle="#ffd9ec";
    ctx.lineWidth=.62;
    ctx.shadowBlur=4;
    ctx.stroke();

    const rings=[
        .045,
        .085,
        .135,
        .205,
        .285
    ];

    for(let i=0;i<rings.length;i++){
        floorCircle(
            rings[i],
            state,
            seconds
        );

        ctx.globalAlpha=
            .68-
            i*.058+
            state.burst*.15;

        ctx.strokeStyle=
            i<2
                ?"#fff5fb"
                :"#ffc7df";

        ctx.lineWidth=
            i<2
                ?1.25
                :.82;

        ctx.shadowColor="#ff84bd";
        ctx.shadowBlur=7;
        ctx.stroke();
    }

    const angle=seconds*.018;

    ctx.fillStyle="#ffd5e7";
    ctx.shadowBlur=0;

    for(let i=0;i<floorDots.length;i++){
        const d=floorDots[i];

        const p=projectFloor(
            d.x,
            d.z,
            state.zoom,
            angle
        );

        const flicker=
            .70+
            .30*Math.sin(
                seconds*1.35+d.phase
            );

        ctx.globalAlpha=
            d.alpha*
            flicker*
            (1.14+state.burst*.48);

        const size=
            d.size*
            (.78+.22*state.zoom);

        ctx.fillRect(
            p.x-size*.5,
            p.y-size*.5,
            size,
            size
        );
    }

    ctx.restore();
}

function drawStem(state,seconds){
    const centerY=
        floorY-
        heartUnit*
        state.zoom*
        1.045;

    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.fillStyle="#ffd4e7";

    for(let i=0;i<stem.length;i++){
        const p=stem[i];
        const life=fract(
            seconds*p.speed+p.phase
        );

        const y=
            floorY-
            life*
            heartUnit*
            .22*
            state.zoom;

        const width=
            (1-life)*
            heartUnit*
            .055*
            state.zoom;

        const x=
            centerX+
            p.sway*width+
            Math.sin(
                seconds*2+
                p.phase*TAU
            )*width*.13;

        const fade=Math.sin(life*Math.PI);

        ctx.globalAlpha=
            p.alpha*
            fade*
            (.72+state.burst*.55);

        ctx.fillRect(
            x-p.size*.5,
            y-p.size*.5,
            p.size,
            p.size
        );
    }

    const g=ctx.createRadialGradient(
        centerX,floorY,0,
        centerX,floorY,
        heartUnit*.17*state.zoom
    );

    g.addColorStop(
        0,
        `rgba(255,248,252,${.24+state.flash*.18})`
    );

    g.addColorStop(
        .18,
        "rgba(255,180,218,.13)"
    );

    g.addColorStop(
        1,
        "rgba(255,110,184,0)"
    );

    ctx.globalAlpha=1;
    ctx.fillStyle=g;
    ctx.beginPath();

    ctx.arc(
        centerX,
        floorY,
        heartUnit*.17*state.zoom,
        0,
        TAU
    );

    ctx.fill();
    ctx.restore();

    return centerY;
}

function drawRays(state,centerY){
    if(
        state.burst<=.001&&
        state.linger<=.001
    ){
        return;
    }

    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.lineCap="round";
    ctx.shadowColor="#ff7fbd";
    ctx.shadowBlur=10;

    for(let i=0;i<rays.length;i++){
        const ray=rays[i];

        if(
            state.burst<.012&&
            i%6!==0
        ){
            continue;
        }

        const q=clamp(
            (
                state.burstProgress-
                ray.delay
            )/
            (1-ray.delay)
        );

        if(q<=0)continue;

        const travel=
            1-
            Math.pow(1-q,2.7);

        const head=
            heartUnit*
            state.zoom*
            (
                ray.start+
                ray.length*travel
            );

        const tail=
            head-
            heartUnit*
            state.zoom*
            (
                .10+
                .43*(1-q)+
                ray.length*
                (.13+state.linger*.18)
            );

        const bend=
            Math.sin(
                ray.phase+q*3
            )*
            heartUnit*
            .025;

        const ca=Math.cos(ray.angle);
        const sa=Math.sin(ray.angle);

        ctx.beginPath();

        ctx.moveTo(
            centerX+
                ca*Math.max(0,tail)-
                sa*bend,
            centerY+
                sa*Math.max(0,tail)+
                ca*bend
        );

        ctx.lineTo(
            centerX+ca*head,
            centerY+sa*head
        );

        ctx.globalAlpha=
            ray.alpha*
            (
                state.burst*
                (1-q*.48)+
                state.linger*.16
            );

        ctx.strokeStyle=
            i%6===0
                ?"#fff5fb"
                :"#ff9ccc";

        ctx.lineWidth=
            ray.width*
            (i%11===0?1.28:1);

        ctx.stroke();
    }

    ctx.restore();
}

function drawFlare(state,centerY,front=false){
    if(state.flash<=.002)return;

    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.translate(centerX,centerY);
    ctx.scale(.72,1);

    const radius=
        heartUnit*
        state.zoom*
        (front?.39:.86);

    const g=ctx.createRadialGradient(
        0,0,0,
        0,0,radius
    );

    if(front){
        g.addColorStop(
            0,
            `rgba(255,255,255,${state.flash*.28})`
        );

        g.addColorStop(
            .30,
            `rgba(255,224,240,${state.flash*.12})`
        );
    }else{
        g.addColorStop(
            0,
            `rgba(255,255,255,${state.flash*.88})`
        );

        g.addColorStop(
            .16,
            `rgba(255,224,241,${state.flash*.54})`
        );

        g.addColorStop(
            .48,
            `rgba(255,114,188,${state.flash*.20})`
        );
    }

    g.addColorStop(
        1,
        "rgba(255,95,177,0)"
    );

    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(0,0,radius,0,TAU);
    ctx.fill();
    ctx.restore();
}

function orbitPoint(
    i,
    n,
    state,
    seconds,
    strand=0
){
    const progress=i/(n-1);
    const u=
        progress*
        TAU*
        (3.12+strand*.025);

    const phase=
        u+
        state.rotation*.72+
        seconds*.105+
        strand*.105;

    const radius=
        1.115+
        strand*.020+
        .050*Math.sin(
            u*2.35+
            seconds*.48+
            strand*.7
        );

    const x=Math.cos(phase)*radius;
    const z=Math.sin(phase)*radius;

    const y=
        .88-
        progress*1.76+
        (strand-.5)*.018+
        .047*Math.sin(
            u*1.7+
            seconds*.54+
            strand*.72
        );

    orbitSample.x=x;
    orbitSample.y=y;
    orbitSample.z=z;

    return orbitSample;
}

function traceOrbit(
    front,
    state,
    seconds,
    centerY,
    strand
){
    const n=420;
    let drawing=false;

    ctx.beginPath();

    for(let i=0;i<n;i++){
        const o=orbitPoint(
            i,
            n,
            state,
            seconds,
            strand
        );

        const visible=
            front
                ?o.z>=-.02
                :o.z<-.02;

        const p=projectOrbit(
            o.x,
            o.y,
            o.z,
            state,
            centerY
        );

        if(visible){
            if(!drawing){
                ctx.moveTo(p.x,p.y);
            }else{
                ctx.lineTo(p.x,p.y);
            }

            drawing=true;
        }else{
            drawing=false;
        }
    }
}

function drawOrbit(
    front,
    state,
    seconds,
    centerY
){
    if(state.ring<=.002)return;

    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.lineCap="round";
    ctx.lineJoin="round";

    const depth=front?1:.38;

    const glowColors=[
        "#ff5dae",
        "#c77dff"
    ];

    const lineColors=[
        "#fff1f8",
        "#f2d7ff"
    ];

    for(let strand=0;strand<2;strand++){
        traceOrbit(
            front,
            state,
            seconds,
            centerY,
            strand
        );

        ctx.globalAlpha=
            state.ring*
            depth*
            (.10+strand*.018);

        ctx.strokeStyle=
            glowColors[strand];

        ctx.lineWidth=
            front
                ?7.5-strand*.7
                :5.3-strand*.5;

        ctx.shadowColor=
            glowColors[strand];

        ctx.shadowBlur=19;
        ctx.stroke();

        ctx.globalAlpha=
            state.ring*
            depth*
            (front?.88:.64);

        ctx.strokeStyle=
            lineColors[strand];

        ctx.lineWidth=
            front
                ?1.28-strand*.09
                :.76;

        ctx.shadowColor=
            glowColors[strand];

        ctx.shadowBlur=7;
        ctx.stroke();
    }

    if(front){
        ctx.fillStyle="#fff4fa";
        ctx.shadowBlur=0;

        for(let i=0;i<126;i++){
            const strand=i%2;

            const u=fract(
                i/126+
                seconds*
                (.036+strand*.004)
            );

            const index=Math.floor(u*419);

            const o=orbitPoint(
                index,
                420,
                state,
                seconds,
                strand
            );

            if(o.z<0)continue;

            const p=projectOrbit(
                o.x,
                o.y,
                o.z,
                state,
                centerY
            );

            const a=
                .26+
                .74*Math.pow(
                    Math.sin(
                        (u+i*.17)*Math.PI
                    ),
                    2
                );

            ctx.globalAlpha=
                state.ring*
                a*
                .84;

            const size=
                i%19===0
                    ?2.4
                    :.92;

            ctx.fillRect(
                p.x-size*.5,
                p.y-size*.5,
                size,
                size
            );
        }
    }

    ctx.restore();
}

function traceHeart(
    state,
    centerY,
    zOffset=0
){
    const n=360;

    ctx.beginPath();

    for(let i=0;i<=n;i++){
        const p=sampleCurve(i/n);

        const q=projectHeart(
            p.x,
            p.y,
            zOffset,
            state,
            centerY
        );

        if(i===0){
            ctx.moveTo(q.x,q.y);
        }else{
            ctx.lineTo(q.x,q.y);
        }
    }

    ctx.closePath();
}

function drawHeartTrace(state,centerY){
    ctx.save();
    ctx.globalCompositeOperation="lighter";

    traceHeart(state,centerY);

    ctx.globalAlpha=
        .12+
        state.flash*.11;

    ctx.strokeStyle="#ff5eac";
    ctx.lineWidth=13*state.zoom;
    ctx.shadowColor="#ff68ae";
    ctx.shadowBlur=28*state.zoom;
    ctx.stroke();

    ctx.globalAlpha=
        .20+
        state.flash*.15;

    ctx.strokeStyle="#ff9bc8";
    ctx.lineWidth=4.2*state.zoom;
    ctx.shadowColor="#ff7fbd";
    ctx.shadowBlur=13*state.zoom;
    ctx.stroke();

    ctx.globalAlpha=
        .44+
        state.flash*.23;

    ctx.strokeStyle="#ffd0e4";
    ctx.lineWidth=.78;
    ctx.shadowColor="#ff9bc9";
    ctx.shadowBlur=7;
    ctx.stroke();

    ctx.restore();
}

function drawHeartParticles(
    list,
    kind,
    state,
    seconds,
    centerY,
    color,
    gain
){
    ctx.fillStyle=color;

    for(let i=0;i<list.length;i++){
        const p=list[i];

        const c=sampleCurve(
            p.u+
            seconds*p.flow
        );

        const oscillation=Math.sin(
            seconds*
            (1.05+p.twinkle*.11)+
            p.phase
        );

        let x,y,z;

        if(
            kind==="inside"||
            kind==="lower"
        ){
            x=
                c.x*p.radius+
                p.jx;

            y=
                (c.y+.055)*
                p.radius-
                .055+
                p.jy;

            if(kind==="lower"){
                y-=.025*(1-p.radius);
            }

            x+=c.nx*p.offset;
            y+=c.ny*p.offset;

            z=
                p.z+
                oscillation*
                p.zWobble;
        }else{
            const offset=
                p.offset+
                oscillation*
                p.wobble;

            x=c.x+c.nx*offset;
            y=c.y+c.ny*offset;

            z=
                p.z+
                oscillation*
                p.zWobble;
        }

        if(state.burst>.001){
            const push=
                1+
                state.burst*
                p.burst*
                .026;

            x*=push;
            y=(y+.04)*push-.04;
        }

        const q=projectHeart(
            x,
            y,
            z,
            state,
            centerY
        );

        if(
            q.x<-12||
            q.x>W+12||
            q.y<-12||
            q.y>H+12
        ){
            continue;
        }

        const twinkle=
            .76+
            .24*Math.pow(
                .5+
                .5*Math.sin(
                    seconds*
                    p.twinkle+
                    p.phase
                ),
                2
            );

        const alpha=clamp(
            p.alpha*
            gain*
            twinkle*
            (1+state.flash*.55)
        );

        const size=
            p.size*
            (.84+.16*state.zoom)*
            clamp(q.k,.78,1.24);

        ctx.globalAlpha=alpha;

        ctx.fillRect(
            q.x-size*.5,
            q.y-size*.5,
            size,
            size
        );

        if(p.hot){
            const sprite=
                kind==="core"
                    ?glowWhite
                    :glowPink;

            const diameter=
                size*
                rndFrame(
                    p.phase,
                    4.8,
                    8.2
                )*
                (1+state.flash*.36);

            ctx.globalAlpha=
                alpha*
                (
                    kind==="core"
                        ?.42
                        :.31
                );

            ctx.drawImage(
                sprite,
                q.x-diameter*.5,
                q.y-diameter*.5,
                diameter,
                diameter
            );
        }
    }
}

function drawFlowStreaks(
    state,
    seconds,
    centerY
){
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.beginPath();

    for(let i=0;i<shell.length;i+=27){
        const p=shell[i];
        const u=p.u+seconds*p.flow;

        let c=sampleCurve(u);

        const wave=Math.sin(
            seconds*
            (1.05+p.twinkle*.11)+
            p.phase
        );

        const offset=
            p.offset+
            wave*p.wobble;

        const a=projectHeart(
            c.x+c.nx*offset,
            c.y+c.ny*offset,
            p.z+wave*p.zWobble,
            state,
            centerY
        );

        const ax=a.x;
        const ay=a.y;

        c=sampleCurve(
            u-
            .0045-
            rndFrame(
                p.phase,
                .001,
                .004
            )
        );

        const b=projectHeart(
            c.x+c.nx*offset,
            c.y+c.ny*offset,
            p.z,
            state,
            centerY
        );

        ctx.moveTo(b.x,b.y);
        ctx.lineTo(ax,ay);
    }

    ctx.globalAlpha=
        .28+
        state.flash*.18;

    ctx.strokeStyle="#ffe2ef";
    ctx.lineWidth=.72;
    ctx.lineCap="round";
    ctx.shadowColor="#ff79ba";
    ctx.shadowBlur=6;
    ctx.stroke();
    ctx.restore();
}

function drawSparkles(
    list,
    kind,
    state,
    seconds,
    centerY,
    step
){
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.fillStyle="#fff9fc";

    for(let i=0;i<list.length;i+=step){
        const p=list[i];

        if(!p.hot)continue;

        const c=sampleCurve(
            p.u+
            seconds*p.flow
        );

        const wave=Math.sin(
            seconds*
            (1.05+p.twinkle*.11)+
            p.phase
        );

        let x,y,z;

        if(kind==="lower"){
            x=
                c.x*p.radius+
                p.jx+
                c.nx*p.offset;

            y=
                (c.y+.055)*
                p.radius-
                .055+
                p.jy-
                .025*(1-p.radius)+
                c.ny*p.offset;

            z=
                p.z+
                wave*p.zWobble;
        }else{
            const offset=
                p.offset+
                wave*p.wobble;

            x=c.x+c.nx*offset;
            y=c.y+c.ny*offset;
            z=p.z+wave*p.zWobble;
        }

        const q=projectHeart(
            x,
            y,
            z,
            state,
            centerY
        );

        const twinkle=Math.pow(
            .5+
            .5*Math.sin(
                seconds*
                p.twinkle+
                p.phase
            ),
            5
        );

        if(twinkle<.12)continue;

        const length=
            (2.8+p.size*2.4)*
            (.55+twinkle)*
            (1+state.flash*.28);

        ctx.globalAlpha=clamp(
            p.alpha*
            (.22+.62*twinkle)
        );

        ctx.fillRect(
            q.x-length*.5,
            q.y-.28,
            length,
            .56
        );

        ctx.fillRect(
            q.x-.28,
            q.y-length*.5,
            .56,
            length
        );
    }

    ctx.restore();
}

function rndFrame(seed,a,b){
    return a+(b-a)*(
        .5+
        .5*Math.sin(seed*12.9898)
    );
}

function drawDebris(state,centerY){
    if(state.burst<=.002)return;

    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.fillStyle="#ffc3dd";

    for(let i=0;i<debris.length;i++){
        const p=debris[i];

        const q=clamp(
            (
                state.burstProgress-
                p.delay
            )/
            (1-p.delay)
        );

        if(q<=0)continue;

        const travel=
            1-
            Math.pow(1-q,2.25);

        const distance=
            heartUnit*
            state.zoom*
            (
                p.start+
                p.speed*travel
            );

        const angle=
            p.angle+
            p.curve*q;

        const x=
            centerX+
            Math.cos(angle)*distance;

        const y=
            centerY+
            Math.sin(angle)*distance;

        const fade=
            state.burst*
            (1-q*.58);

        ctx.globalAlpha=
            p.alpha*
            fade;

        ctx.fillRect(
            x-p.size*.5,
            y-p.size*.5,
            p.size,
            p.size
        );

        if(p.hot){
            const d=p.size*5.5;

            ctx.globalAlpha=
                p.alpha*
                fade*
                .24;

            ctx.drawImage(
                glowPink,
                x-d*.5,
                y-d*.5,
                d,
                d
            );
        }
    }

    ctx.restore();
}

function drawVignette(){
    ctx.globalCompositeOperation="source-over";
    ctx.globalAlpha=1;
    ctx.fillStyle=vignetteGradient;
    ctx.fillRect(0,0,W,H);
}

function render(now){
    const delta=Math.min(
        .080,
        Math.max(
            0,
            (now-lastFrameTime)/1000
        )
    );

    lastFrameTime=now;
    animationTime+=delta;

    const seconds=animationTime;
    const state=sceneState(seconds);

    drawBackground(seconds);

    const centerY=
        floorY-
        heartUnit*
        state.zoom*
        1.045;

    drawAtmosphere(
        state,
        seconds,
        centerY
    );

    drawFloor(
        state,
        seconds
    );

    drawStem(
        state,
        seconds
    );

    drawRays(
        state,
        centerY
    );

    drawFlare(
        state,
        centerY,
        false
    );

    drawLensFlare(
        state,
        centerY
    );

    drawOrbit(
        false,
        state,
        seconds,
        centerY
    );

    drawHeartTrace(
        state,
        centerY
    );

    drawFlowStreaks(
        state,
        seconds,
        centerY
    );

    ctx.save();
    ctx.globalCompositeOperation="lighter";

    drawHeartParticles(
        dust,
        "dust",
        state,
        seconds,
        centerY,
        "#dea9ff",
        .96
    );

    drawHeartParticles(
        lower,
        "lower",
        state,
        seconds,
        centerY,
        "#ffc2dd",
        1.12
    );

    drawHeartParticles(
        inside,
        "inside",
        state,
        seconds,
        centerY,
        "#ffd6e8",
        1.07
    );

    drawHeartParticles(
        shell,
        "shell",
        state,
        seconds,
        centerY,
        "#ffadd0",
        1.15
    );

    drawHeartParticles(
        core,
        "core",
        state,
        seconds,
        centerY,
        "#fff4f9",
        1.23
    );

    ctx.restore();

    drawSparkles(
        shell,
        "shell",
        state,
        seconds,
        centerY,
        5
    );

    drawSparkles(
        core,
        "core",
        state,
        seconds,
        centerY,
        3
    );

    drawSparkles(
        lower,
        "lower",
        state,
        seconds,
        centerY,
        4
    );

    drawOrbit(
        true,
        state,
        seconds,
        centerY
    );

    drawDebris(
        state,
        centerY
    );

    drawFlare(
        state,
        centerY,
        true
    );

    drawVignette();
    requestAnimationFrame(render);
}
