<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Love</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#050209}
body{
    background:
        radial-gradient(circle at 50% 34%,rgba(78,25,63,.18),transparent 38%),
        #050209;
}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.home{
    position:fixed;z-index:10;left:22px;top:20px;
    color:rgba(255,235,245,.25);text-decoration:none;
    font:10px Arial,sans-serif;letter-spacing:3px;transition:.3s
}
.home:hover{color:#fff5fa;text-shadow:0 0 10px #ff8bc5}
</style>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<a class="home" href="/">HOME</a>

<script type="module">
import * as THREE from "three";
import {EffectComposer} from "three/addons/postprocessing/EffectComposer.js";
import {RenderPass} from "three/addons/postprocessing/RenderPass.js";
import {UnrealBloomPass} from "three/addons/postprocessing/UnrealBloomPass.js";
import {OutputPass} from "three/addons/postprocessing/OutputPass.js";

const MOBILE=innerWidth<720;
const DPR=Math.min(devicePixelRatio||1,MOBILE?1.25:1.7);

const HEART_COUNT=MOBILE?24000:52000;
const FLOW_COUNT=MOBILE?4500:11000;
const BURST_COUNT=MOBILE?2200:5200;
const STAR_COUNT=MOBILE?500:1200;

const LOOP=10.2;
const HEART_Y=2.5;
const FLOOR_Y=-11.0;

/* =========================================================
   BASIC
========================================================= */

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050209);
scene.fog=new THREE.FogExp2(0x050209,.012);

const camera=new THREE.PerspectiveCamera(
    MOBILE?56:47,
    innerWidth/innerHeight,
    .1,
    150
);

camera.position.set(0,4.1,MOBILE?43:38);
camera.lookAt(0,.5,0);

const renderer=new THREE.WebGLRenderer({
    antialias:false,
    powerPreference:"high-performance"
});

renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.03;

document.body.appendChild(renderer.domElement);

/* =========================================================
   BLOOM
   关键：收紧 Bloom，避免上一版“整颗心糊掉”
========================================================= */

const composer=new EffectComposer(renderer);

composer.addPass(
    new RenderPass(scene,camera)
);

const bloom=new UnrealBloomPass(
    new THREE.Vector2(innerWidth,innerHeight),
    .72,
    .26,
    .52
);

bloom.threshold=.52;
bloom.strength=.72;
bloom.radius=.26;

composer.addPass(bloom);
composer.addPass(new OutputPass());

/* =========================================================
   GROUP
========================================================= */

const heartGroup=new THREE.Group();
heartGroup.position.y=HEART_Y;
scene.add(heartGroup);

/* =========================================================
   HELPERS
========================================================= */

function randn(){
    let u=0,v=0;
    while(u===0)u=Math.random();
    while(v===0)v=Math.random();

    return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}

function heartJS(t){
    const s=Math.sin(t);

    return [
        16*s*s*s,
        13*Math.cos(t)
        -5*Math.cos(2*t)
        -2*Math.cos(3*t)
        -Math.cos(4*t)
    ];
}

/* =========================================================
   HEART DATA
========================================================= */

const heartPosition=new Float32Array(HEART_COUNT*3);
const heartT=new Float32Array(HEART_COUNT);
const radial=new Float32Array(HEART_COUNT);
const band=new Float32Array(HEART_COUNT);
const seed=new Float32Array(HEART_COUNT);
const dir=new Float32Array(HEART_COUNT);
const size=new Float32Array(HEART_COUNT);
const edge=new Float32Array(HEART_COUNT);
const brightness=new Float32Array(HEART_COUNT);

for(let i=0;i<HEART_COUNT;i++){

    const t=Math.random()*Math.PI*2;

    const mode=Math.random();

    let r;
    let e;

    /*
     * 绝大部分粒子集中在边缘，
     * 少部分散布内部。
     */

    if(mode<.64){
        r=.92+Math.random()*.11;
        e=.92+Math.random()*.08;
    }else if(mode<.84){
        r=.72+Math.random()*.25;
        e=.55+Math.random()*.28;
    }else{
        r=.18+Math.pow(Math.random(),.55)*.67;
        e=.10+Math.random()*.35;
    }

    heartT[i]=t;
    radial[i]=r;

    band[i]=
        mode<.64
        ?randn()*.20
        :randn()*.32;

    seed[i]=Math.random();

    dir[i]=Math.random()<.5?-1:1;

    const q=Math.random();

    size[i]=
        q<.84
        ?.038+Math.random()*.050
        :q<.985
        ?.085+Math.random()*.060
        :.16+Math.random()*.10;

    edge[i]=e;

    brightness[i]=Math.random();
}

const heartGeo=new THREE.BufferGeometry();

heartGeo.setAttribute(
    "position",
    new THREE.BufferAttribute(
        heartPosition,
        3
    )
);

heartGeo.setAttribute(
    "aT",
    new THREE.BufferAttribute(heartT,1)
);

heartGeo.setAttribute(
    "aRadial",
    new THREE.BufferAttribute(radial,1)
);

heartGeo.setAttribute(
    "aBand",
    new THREE.BufferAttribute(band,1)
);

heartGeo.setAttribute(
    "aSeed",
    new THREE.BufferAttribute(seed,1)
);

heartGeo.setAttribute(
    "aDir",
    new THREE.BufferAttribute(dir,1)
);

heartGeo.setAttribute(
    "aSize",
    new THREE.BufferAttribute(size,1)
);

heartGeo.setAttribute(
    "aEdge",
    new THREE.BufferAttribute(edge,1)
);

heartGeo.setAttribute(
    "aBrightness",
    new THREE.BufferAttribute(brightness,1)
);

/* =========================================================
   HEART SHADER
========================================================= */

const heartVertex=`
#define PI 3.141592653589793
#define TAU 6.283185307179586

attribute float aT;
attribute float aRadial;
attribute float aBand;
attribute float aSeed;
attribute float aDir;
attribute float aSize;
attribute float aEdge;
attribute float aBrightness;

uniform float uTime;
uniform float uPixelRatio;

varying vec3 vColor;
varying float vAlpha;
varying float vHot;

float ease5(float x){
    x=clamp(x,0.0,1.0);
    return x*x*x*(x*(x*6.0-15.0)+10.0);
}

float window(float x,float a,float b,float c,float d){
    return ease5((x-a)/(b-a))*
           (1.0-ease5((x-c)/(d-c)));
}

float bell(float x,float c,float w){
    float q=(x-c)/w;
    return exp(-q*q);
}

mat2 rot(float a){
    float c=cos(a);
    float s=sin(a);
    return mat2(c,-s,s,c);
}

vec2 heart(float t){
    float s=sin(t);

    return vec2(
        16.0*s*s*s,
        13.0*cos(t)
        -5.0*cos(2.0*t)
        -2.0*cos(3.0*t)
        -cos(4.0*t)
    )*.64;
}

vec2 heartD(float t){

    float s=sin(t);
    float c=cos(t);

    return vec2(
        48.0*s*s*c,
        -13.0*sin(t)
        +10.0*sin(2.0*t)
        +6.0*sin(3.0*t)
        +4.0*sin(4.0*t)
    )*.64;
}

void main(){

    float ph=mod(uTime,${LOOP.toFixed(3)});

    /*
     * ---------------------------------------------
     * 粒子不是固定在心形上：
     * 每个粒子持续沿心形切向运动。
     * ---------------------------------------------
     */

    float flowSpeed=
        .030+
        aSeed*.050;

    float t=
        aT+
        uTime*
        flowSpeed*
        aDir;

    vec2 hp=heart(t);

    vec2 tangent=
        normalize(
            heartD(t)
        );

    vec2 normal=
        vec2(
            -tangent.y,
            tangent.x
        );

    /*
     * 不同频率扰动，
     * 让轮廓永远不是死的。
     */

    float n1=
        sin(
            t*9.0+
            uTime*1.18+
            aSeed*27.0
        );

    float n2=
        sin(
            t*19.0-
            uTime*.72+
            aSeed*43.0
        );

    float n3=
        cos(
            t*31.0+
            uTime*.38+
            aSeed*13.0
        );

    float thickness=
        aBand+
        n1*.12+
        n2*.050+
        n3*.022;

    vec2 h=
        hp*aRadial+
        normal*thickness;

    /*
     * 正常呼吸 + 双心跳
     */

    float cycle=
        mod(uTime,1.50);

    float beat=
        bell(cycle,.11,.060)+
        .46*bell(cycle,.27,.067);

    float breathe=
        1.0+
        sin(uTime*.74)*.0045+
        beat*.016;

    h*=breathe;

    /*
     * ---------------------------------------------
     * 整体侧转
     *
     * 不是线性转动，
     * 加轻微过冲和回弹。
     * ---------------------------------------------
     */

    float side=
        window(
            ph,
            3.20,
            4.30,
            7.10,
            8.45
        );

    float sideAngle=
        side*
        (
            1.31+
            .085*
            sin(
                (ph-3.2)*3.1
            )
        );

    /*
     * ---------------------------------------------
     * 错峰坍缩
     *
     * 每个粒子根据 aSeed 在不同时间进入能量柱。
     * 解决“整个心一起缩”带来的机械感。
     * ---------------------------------------------
     */

    float collapseStart=
        4.55+
        aSeed*.58;

    float collapse=
        ease5(
            (
                ph-
                collapseStart
            )/
            .82
        );

    float reformStart=
        6.15+
        (1.0-aSeed)*.62;

    float reform=
        ease5(
            (
                ph-
                reformStart
            )/
            .92
        );

    float shape=
        clamp(
            1.0-
            collapse+
            reform,
            0.0,
            1.0
        );

    /*
     * Heart 3D depth
     */

    float z=
        (
            aSeed-.5
        )*
        (
            .7+
            (1.0-aEdge)*2.1
        );

    vec3 heartPos=
        vec3(
            h,
            z
        );

    heartPos.xz=
        rot(sideAngle)*
        heartPos.xz;

    /*
     * ---------------------------------------------
     * Helix column
     * ---------------------------------------------
     */

    float columnY=
        mix(
            -8.5,
            8.0,
            fract(
                aSeed*7.381+
                aT*.31
            )
        );

    float columnAngle=
        aSeed*TAU*5.0+
        uTime*
        (
            1.0+
            aSeed*.55
        );

    float columnRadius=
        .15+
        aEdge*.32+
        .11*
        sin(
            columnY*.70-
            uTime*2.3+
            aSeed*30.0
        );

    vec3 columnPos=
        vec3(
            cos(columnAngle)*
            columnRadius,

            columnY,

            sin(columnAngle)*
            columnRadius
        );

    /*
     * 柱体自身上下流动
     */

    columnPos.y+=
        sin(
            uTime*1.5+
            aSeed*19.0
        )*.28;

    vec3 p=
        mix(
            columnPos,
            heartPos,
            shape
        );

    /*
     * ---------------------------------------------
     * 重组后的冲击波
     * ---------------------------------------------
     */

    float shock=
        bell(
            ph,
            8.30,
            .27
        );

    vec3 direction=
        normalize(
            vec3(
                heartPos.xy,
                heartPos.z*.35
            )+
            vec3(.0001)
        );

    p+=
        direction*
        shock*
        (
            .08+
            aSeed*.48
        );

    /*
     * 局部漂移
     */

    p.z+=
        sin(
            uTime*.86+
            aSeed*24.0+
            t*3.0
        )*
        .055;

    vec4 mv=
        modelViewMatrix*
        vec4(
            p,
            1.0
        );

    float perspective=
        56.0/
        max(
            7.0,
            -mv.z
        );

    /*
     * 粒径必须小。
     */

    gl_PointSize=
        clamp(
            aSize*
            uPixelRatio*
            perspective,
            .48,
            3.2
        );

    gl_Position=
        projectionMatrix*
        mv;

    /*
     * ---------------------------------------------
     * 颜色
     *
     * 去掉“满屏紫”
     * ---------------------------------------------
     */

    vec3 darkPink=
        vec3(
            .86,
            .36,
            .62
        );

    vec3 pink=
        vec3(
            1.0,
            .56,
            .76
        );

    vec3 pale=
        vec3(
            1.0,
            .82,
            .91
        );

    vec3 white=
        vec3(
            1.18,
            1.10,
            1.14
        );

    vec3 col=
        mix(
            darkPink,
            pink,
            aEdge
        );

    col=
        mix(
            col,
            pale,
            aEdge*.62
        );

    /*
     * 极少数 HDR 高亮点，
     * 只让它们进入 Bloom。
     */

    float hot=
        smoothstep(
            .965,
            1.0,
            aBrightness
        );

    hot+=
        shock*
        smoothstep(
            .72,
            1.0,
            aEdge
        )*.52;

    hot=clamp(hot,0.0,1.0);

    col=
        mix(
            col,
            white,
            hot
        );

    /*
     * 内部粒子明显暗，
     * 轮廓粒子亮。
     */

    float alpha=
        mix(
            .12,
            .82,
            aEdge
        );

    alpha*=
        .76+
        .24*
        sin(
            uTime*
            (
                1.2+
                aSeed*2.0
            )+
            aSeed*31.0
        );

    /*
     * 柱状态稍暗，
     * 避免烧成白柱。
     */

    alpha*=
        mix(
            .62,
            1.0,
            shape
        );

    vColor=col;
    vAlpha=alpha;
    vHot=hot;
}
`;

const heartFragment=`
precision highp float;

varying vec3 vColor;
varying float vAlpha;
varying float vHot;

void main(){

    vec2 uv=
        gl_PointCoord-.5;

    float d=
        length(uv);

    if(d>.5)
        discard;

    /*
     * 非常硬的小核心。
     */

    float core=
        exp(
            -d*d*62.0
        );

    /*
     * halo 极弱。
     */

    float halo=
        exp(
            -d*d*15.0
        )*.065;

    float alpha=
        (
            core+
            halo
        )*
        vAlpha;

    vec3 col=
        vColor*
        (
            1.0+
            vHot*.38
        );

    gl_FragColor=
        vec4(
            col,
            alpha
        );
}
`;

const heartMaterial=
    new THREE.ShaderMaterial({
        vertexShader:heartVertex,
        fragmentShader:heartFragment,

        uniforms:{
            uTime:{value:0},
            uPixelRatio:{value:DPR}
        },

        transparent:true,
        depthWrite:false,
        depthTest:true,
        blending:THREE.AdditiveBlending
    });

const heartPoints=
    new THREE.Points(
        heartGeo,
        heartMaterial
    );

heartPoints.frustumCulled=false;
heartGroup.add(heartPoints);

/* =========================================================
   OUTER FLOW
   外围不再使用直射线。
   变成真正围绕心形高速穿梭的流。
========================================================= */

const flowGeo=
    new THREE.BufferGeometry();

const flowPos=
    new Float32Array(
        FLOW_COUNT*3
    );

const flowSeed=
    new Float32Array(
        FLOW_COUNT
    );

const flowOffset=
    new Float32Array(
        FLOW_COUNT
    );

const flowSize=
    new Float32Array(
        FLOW_COUNT
    );

const flowDir=
    new Float32Array(
        FLOW_COUNT
    );

for(let i=0;i<FLOW_COUNT;i++){

    flowSeed[i]=Math.random();

    flowOffset[i]=
        .45+
        Math.pow(
            Math.random(),
            .7
        )*2.7;

    flowSize[i]=
        .035+
        Math.random()*.055;

    flowDir[i]=
        Math.random()<.5
        ?-1
        :1;
}

flowGeo.setAttribute(
    "position",
    new THREE.BufferAttribute(
        flowPos,
        3
    )
);

flowGeo.setAttribute(
    "aSeed",
    new THREE.BufferAttribute(
        flowSeed,
        1
    )
);

flowGeo.setAttribute(
    "aOffset",
    new THREE.BufferAttribute(
        flowOffset,
        1
    )
);

flowGeo.setAttribute(
    "aSize",
    new THREE.BufferAttribute(
        flowSize,
        1
    )
);

flowGeo.setAttribute(
    "aDir",
    new THREE.BufferAttribute(
        flowDir,
        1
    )
);

const flowVertex=`
#define TAU 6.283185307179586

attribute float aSeed;
attribute float aOffset;
attribute float aSize;
attribute float aDir;

uniform float uTime;
uniform float uPixelRatio;

varying float vAlpha;
varying vec3 vColor;

vec2 heart(float t){
    float s=sin(t);

    return vec2(
        16.0*s*s*s,
        13.0*cos(t)
        -5.0*cos(2.0*t)
        -2.0*cos(3.0*t)
        -cos(4.0*t)
    )*.64;
}

vec2 heartD(float t){

    float s=sin(t);
    float c=cos(t);

    return vec2(
        48.0*s*s*c,

        -13.0*sin(t)
        +10.0*sin(2.0*t)
        +6.0*sin(3.0*t)
        +4.0*sin(4.0*t)
    )*.64;
}

void main(){

    float ph=
        mod(
            uTime,
            ${LOOP.toFixed(3)}
        );

    /*
     * 粒子高速绕心流动
     */

    float t=
        aSeed*TAU+
        uTime*
        (
            .10+
            aSeed*.12
        )*
        aDir;

    vec2 hp=heart(t);

    vec2 tangent=
        normalize(
            heartD(t)
        );

    vec2 normal=
        vec2(
            -tangent.y,
            tangent.x
        );

    /*
     * 外围不是一个固定圈。
     */

    float wave=
        sin(
            t*5.0-
            uTime*1.8+
            aSeed*18.0
        )*.46+

        sin(
            t*13.0+
            uTime*.8+
            aSeed*37.0
        )*.17;

    float offset=
        aOffset+
        wave;

    vec2 p2=
        hp+
        normal*offset;

    /*
     * 切向拖曳。
     */

    p2+=
        tangent*
        sin(
            uTime*2.1+
            aSeed*25.0
        )*.20;

    float z=
        sin(
            aSeed*TAU*4.0+
            uTime*
            (
                .65+
                aSeed
            )
        )*
        (
            .5+
            aOffset*.50
        );

    /*
     * 坍缩期间外围粒子向中间形成旋涡。
     */

    float collapse=
        smoothstep(
            4.55,
            5.55,
            ph
        )*
        (
            1.0-
            smoothstep(
                6.15,
                7.30,
                ph
            )
        );

    float angle=
        aSeed*TAU*4.0+
        uTime*2.15;

    vec3 vortex=
        vec3(
            cos(angle)*
            (
                .4+
                aOffset*.36
            ),

            mix(
                -8.5,
                8.0,
                fract(
                    aSeed*4.7+
                    uTime*.06
                )
            ),

            sin(angle)*
            (
                .4+
                aOffset*.36
            )
        );

    vec3 p=
        mix(
            vec3(
                p2,
                z
            ),
            vortex,
            collapse
        );

    vec4 mv=
        modelViewMatrix*
        vec4(
            p,
            1
        );

    gl_PointSize=
        clamp(
            aSize*
            uPixelRatio*
            55.0/
            max(
                7.0,
                -mv.z
            ),
            .45,
            2.2
        );

    gl_Position=
        projectionMatrix*
        mv;

    float near=
        1.0-
        clamp(
            aOffset/3.2,
            0.0,
            1.0
        );

    vColor=
        mix(
            vec3(
                .78,
                .31,
                .57
            ),
            vec3(
                1.0,
                .72,
                .86
            ),
            near
        );

    vAlpha=
        (
            .08+
            near*.40
        )*
        (
            .65+
            .35*
            sin(
                uTime*2.0+
                aSeed*35.0
            )
        );
}
`;

const flowFragment=`
precision highp float;

varying float vAlpha;
varying vec3 vColor;

void main(){

    vec2 p=
        gl_PointCoord-.5;

    float d=
        length(p);

    if(d>.5)
        discard;

    gl_FragColor=
        vec4(
            vColor,
            exp(
                -d*d*46.0
            )*
            vAlpha
        );
}
`;

const flowMaterial=
    new THREE.ShaderMaterial({
        vertexShader:flowVertex,
        fragmentShader:flowFragment,

        uniforms:{
            uTime:{value:0},
            uPixelRatio:{value:DPR}
        },

        transparent:true,
        depthWrite:false,
        blending:THREE.AdditiveBlending
    });

const flowPoints=
    new THREE.Points(
        flowGeo,
        flowMaterial
    );

flowPoints.frustumCulled=false;
heartGroup.add(flowPoints);

/* =========================================================
   CURVED BURST
========================================================= */

const burstGeo=
    new THREE.BufferGeometry();

const burstSource=
    new Float32Array(BURST_COUNT*3);

const burstDir=
    new Float32Array(BURST_COUNT*3);

const burstSeed=
    new Float32Array(BURST_COUNT);

const burstLen=
    new Float32Array(BURST_COUNT);

const burstSize=
    new Float32Array(BURST_COUNT);

for(let i=0;i<BURST_COUNT;i++){

    const t=
        Math.random()*
        Math.PI*2;

    const [hx,hy]=
        heartJS(t);

    const x=hx*.64;
    const y=hy*.64;

    const l=Math.hypot(x,y)||1;

    let dx=x/l;
    let dy=y/l;

    const tangent=
        (Math.random()-.5)*.5;

    const tx=-dy;
    const ty=dx;

    dx+=tx*tangent;
    dy+=ty*tangent;

    const j=i*3;

    burstSource[j]=x+randn()*.15;
    burstSource[j+1]=y+randn()*.15;
    burstSource[j+2]=randn()*.45;

    burstDir[j]=dx;
    burstDir[j+1]=dy;
    burstDir[j+2]=randn()*.18;

    burstSeed[i]=Math.random();

    burstLen[i]=
        3+
        Math.pow(
            Math.random(),
            .52
        )*15;

    burstSize[i]=
        .035+
        Math.random()*.055;
}

burstGeo.setAttribute(
    "position",
    new THREE.BufferAttribute(
        new Float32Array(
            BURST_COUNT*3
        ),
        3
    )
);

burstGeo.setAttribute(
    "aSource",
    new THREE.BufferAttribute(
        burstSource,
        3
    )
);

burstGeo.setAttribute(
    "aDir",
    new THREE.BufferAttribute(
        burstDir,
        3
    )
);

burstGeo.setAttribute(
    "aSeed",
    new THREE.BufferAttribute(
        burstSeed,
        1
    )
);

burstGeo.setAttribute(
    "aLength",
    new THREE.BufferAttribute(
        burstLen,
        1
    )
);

burstGeo.setAttribute(
    "aSize",
    new THREE.BufferAttribute(
        burstSize,
        1
    )
);

const burstVertex=`
attribute vec3 aSource;
attribute vec3 aDir;
attribute float aSeed;
attribute float aLength;
attribute float aSize;

uniform float uTime;
uniform float uPixelRatio;

varying float vAlpha;
varying vec3 vColor;

void main(){

    float ph=
        mod(
            uTime,
            ${LOOP.toFixed(3)}
        );

    float q=
        clamp(
            (
                ph-
                8.05
            )/
            1.28,
            0.0,
            1.0
        );

    float motion=
        pow(
            q,
            .63
        );

    vec3 p=
        aSource+
        aDir*
        aLength*
        motion;

    /*
     * 爆射不是直线。
     */

    float bend=
        sin(
            q*3.14159
        )*
        aLength*
        (
            .03+
            .07*aSeed
        );

    p.x+=
        -aDir.y*
        bend;

    p.y+=
        aDir.x*
        bend;

    p.z+=
        sin(
            q*9.0+
            aSeed*24.0
        )*
        bend*.32;

    vec4 mv=
        modelViewMatrix*
        vec4(
            p,
            1.0
        );

    gl_PointSize=
        clamp(
            aSize*
            uPixelRatio*
            56.0/
            max(
                7.0,
                -mv.z
            ),
            .45,
            2.5
        );

    gl_Position=
        projectionMatrix*
        mv;

    float fade=
        smoothstep(
            0.0,
            .08,
            q
        )*
        (
            1.0-
            smoothstep(
                .42,
                1.0,
                q
            )
        );

    float hot=
        smoothstep(
            .94,
            1.0,
            aSeed
        );

    vColor=
        mix(
            vec3(
                1.0,
                .49,
                .72
            ),
            vec3(
                1.12,
                1.04,
                1.08
            ),
            hot
        );

    vAlpha=
        fade*
        (
            .25+
            aSeed*.58
        );
}
`;

const burstFrag=`
precision highp float;

varying float vAlpha;
varying vec3 vColor;

void main(){

    vec2 p=
        gl_PointCoord-.5;

    float d=
        length(p);

    if(d>.5)discard;

    gl_FragColor=
        vec4(
            vColor,
            exp(-d*d*50.0)*
            vAlpha
        );
}
`;

const burstMaterial=
    new THREE.ShaderMaterial({
        vertexShader:burstVertex,
        fragmentShader:burstFrag,

        uniforms:{
            uTime:{value:0},
            uPixelRatio:{value:DPR}
        },

        transparent:true,
        depthWrite:false,
        blending:THREE.AdditiveBlending
    });

const burstPoints=
    new THREE.Points(
        burstGeo,
        burstMaterial
    );

burstPoints.position.y=HEART_Y;
burstPoints.frustumCulled=false;
scene.add(burstPoints);

/* =========================================================
   FLOOR
========================================================= */

const floorGroup=new THREE.Group();
scene.add(floorGroup);

const floorLines=[];
const ringCount=MOBILE?17:24;

for(let r=1;r<=ringCount;r++){

    const q=r/ringCount;

    const radius=
        .5+
        Math.pow(q,1.32)*19;

    const segments=150;

    for(let i=0;i<segments;i++){

        const a=i/segments*Math.PI*2;
        const b=(i+1)/segments*Math.PI*2;

        const w1=
            1+
            (.10*(1-q)+.015)*
            Math.sin(a*10+r*.43);

        const w2=
            1+
            (.10*(1-q)+.015)*
            Math.sin(b*10+r*.43);

        floorLines.push(
            Math.cos(a)*radius*w1,
            FLOOR_Y,
            Math.sin(a)*radius*w1,

            Math.cos(b)*radius*w2,
            FLOOR_Y,
            Math.sin(b)*radius*w2
        );
    }
}

const spokes=MOBILE?38:54;

for(let i=0;i<spokes;i++){

    const a=
        i/spokes*
        Math.PI*2;

    floorLines.push(
        0,FLOOR_Y,0,
        Math.cos(a)*20,
        FLOOR_Y,
        Math.sin(a)*20
    );
}

const floorGeo=
    new THREE.BufferGeometry();

floorGeo.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
        floorLines,
        3
    )
);

const floorMat=
    new THREE.LineBasicMaterial({
        color:0xc072ba,
        transparent:true,
        opacity:.075,
        depthWrite:false,
        blending:THREE.AdditiveBlending
    });

floorGroup.add(
    new THREE.LineSegments(
        floorGeo,
        floorMat
    )
);

/* center rings */

const centerRings=
    new THREE.Group();

centerRings.position.y=
    FLOOR_Y+.02;

for(let i=0;i<6;i++){

    const r=
        .55+
        i*.55;

    const points=[];

    for(let j=0;j<128;j++){

        const a=
            j/128*
            Math.PI*2;

        points.push(
            new THREE.Vector3(
                Math.cos(a)*r,
                0,
                Math.sin(a)*r
            )
        );
    }

    const g=
        new THREE.BufferGeometry()
        .setFromPoints(points);

    const m=
        new THREE.LineBasicMaterial({
            color:i<2?0xffd7ec:0xdf83c2,
            transparent:true,
            opacity:.24-i*.026,
            depthWrite:false,
            blending:THREE.AdditiveBlending
        });

    centerRings.add(
        new THREE.LineLoop(g,m)
    );
}

floorGroup.add(centerRings);

/* =========================================================
   STARS
========================================================= */

const starPos=
    new Float32Array(
        STAR_COUNT*3
    );

const starCol=
    new Float32Array(
        STAR_COUNT*3
    );

for(let i=0;i<STAR_COUNT;i++){

    starPos[i*3]=
        (Math.random()-.5)*90;

    starPos[i*3+1]=
        (Math.random()-.5)*60+3;

    starPos[i*3+2]=
        -10-Math.random()*48;

    const b=.18+Math.random()*.40;

    starCol[i*3]=b;
    starCol[i*3+1]=b*.46;
    starCol[i*3+2]=b*.72;
}

const starGeo=
    new THREE.BufferGeometry();

starGeo.setAttribute(
    "position",
    new THREE.BufferAttribute(
        starPos,
        3
    )
);

starGeo.setAttribute(
    "color",
    new THREE.BufferAttribute(
        starCol,
        3
    )
);

const starPoints=
    new THREE.Points(
        starGeo,
        new THREE.PointsMaterial({
            size:.055,
            vertexColors:true,
            transparent:true,
            opacity:.48,
            depthWrite:false,
            blending:THREE.AdditiveBlending
        })
    );

scene.add(starPoints);

/* =========================================================
   POINTER
========================================================= */

const pointer={
    x:0,
    y:0,
    tx:0,
    ty:0
};

addEventListener(
    "pointermove",
    e=>{
        pointer.tx=
            (e.clientX/innerWidth-.5)*2;

        pointer.ty=
            (e.clientY/innerHeight-.5)*2;
    },
    {passive:true}
);

addEventListener(
    "pointerleave",
    ()=>{
        pointer.tx=0;
        pointer.ty=0;
    },
    {passive:true}
);

/* =========================================================
   RESIZE
========================================================= */

addEventListener(
    "resize",
    ()=>{

        const mobile=
            innerWidth<720;

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.fov=
            mobile?56:47;

        camera.position.z=
            mobile?43:38;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

        composer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

/* =========================================================
   ANIMATION
========================================================= */

const clock=new THREE.Clock();

function animate(){

    requestAnimationFrame(animate);

    const t=
        clock.getElapsedTime();

    const ph=
        t%LOOP;

    heartMaterial
        .uniforms
        .uTime
        .value=t;

    flowMaterial
        .uniforms
        .uTime
        .value=t;

    burstMaterial
        .uniforms
        .uTime
        .value=t;

    pointer.x+=
        (pointer.tx-pointer.x)*
        .022;

    pointer.y+=
        (pointer.ty-pointer.y)*
        .022;

    /*
     * 镜头本身也有很轻微的惯性。
     */

    const camX=
        pointer.x*.27+
        Math.sin(t*.16)*.08;

    const camY=
        4.1-
        pointer.y*.14+
        Math.sin(t*.11)*.05;

    camera.position.x+=
        (camX-camera.position.x)*
        .018;

    camera.position.y+=
        (camY-camera.position.y)*
        .018;

    camera.lookAt(
        0,
        .45,
        0
    );

    /*
     * 整个 heartGroup 不再负责“大幅旋转”。
     * 真正旋转由 shader 内每个粒子完成。
     */

    heartGroup.rotation.x=
        pointer.y*.010;

    heartGroup.rotation.z=
        Math.sin(t*.13)*.003;

    /*
     * 地面慢速反向旋转。
     */

    floorGroup.rotation.y=
        -t*.016;

    centerRings.rotation.y=
        t*.14;

    /*
     * 能量冲击时地面产生响应。
     */

    const shock=
        Math.exp(
            -Math.pow(
                (ph-8.30)/.32,
                2
            )
        );

    centerRings.scale.setScalar(
        1+
        shock*.075+
        Math.sin(t*1.2)*.008
    );

    /*
     * 星空非常慢的漂移。
     */

    starPoints.rotation.z=
        t*.0008;

    composer.render();
}

animate();
</script>
</body>
</html>
