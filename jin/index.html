<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Love</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.home{position:fixed;left:22px;top:20px;z-index:10;color:rgba(255,235,245,.26);text-decoration:none;font:10px Arial,sans-serif;letter-spacing:3px;transition:.3s}
.home:hover{color:#fff7fb;text-shadow:0 0 10px #ff8cc6}
</style>
</head>
<body>
<a class="home" href="/">HOME</a>
<canvas id="c"></canvas>
<script>
(()=>{
"use strict";
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d",{alpha:false});
const TAU=Math.PI*2;
let W=0,H=0,DPR=1,scale=1,cx=0,cy=0,floorY=0,last=performance.now(),resizeTimer=null;
let contour=[],edge=[],fills=[],stars=[],floorDots=[],stream=[],notchStream=[];
let glowWhite,glowPink,glowSoft;
const mobile=()=>W<720;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fract=v=>v-Math.floor(v);
const gauss=()=>Math.random()+Math.random()+Math.random()+Math.random()-2;
function smooth(v){v=clamp(v,0,1);return v*v*(3-2*v)}
function hash01(i,f,s=0){let h=(Math.imul((i+1+s)|0,374761393)+Math.imul((f+1)|0,668265263))|0;h=h^(h>>>13);h=Math.imul(h,1274126177);return((h^(h>>>16))>>>0)/4294967296}
function heart(t,s=1){const q=Math.sin(t);return{x:16*q*q*q*s,y:-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*s}}
function heartD(t,s=1){const si=Math.sin(t),co=Math.cos(t);return{x:48*si*si*co*s,y:(13*Math.sin(t)-10*Math.sin(2*t)-6*Math.sin(3*t)-4*Math.sin(4*t))*s}}
function scatterInside(x,y,beta){const rx=-beta*Math.log(Math.max(1e-6,Math.random()));const ry=-beta*Math.log(Math.max(1e-6,Math.random()));return{x:x-rx*x,y:y-ry*y}}
function sprite(size,c0,c1,c2){
    const cv=document.createElement("canvas");
    cv.width=cv.height=size;
    const g=cv.getContext("2d");
    const r=size/2;
    const gr=g.createRadialGradient(r,r,0,r,r,r);
    gr.addColorStop(0,c0);
    gr.addColorStop(.08,c0);
    gr.addColorStop(.24,c1);
    gr.addColorStop(.56,c2);
    gr.addColorStop(1,"rgba(255,120,200,0)");
    g.fillStyle=gr;
    g.fillRect(0,0,size,size);
    return cv;
}
function makeSprites(){
    glowWhite=sprite(96,"rgba(255,255,255,1)","rgba(255,238,246,.95)","rgba(255,165,210,.14)");
    glowPink=sprite(72,"rgba(255,245,250,.92)","rgba(255,165,210,.74)","rgba(255,105,185,.12)");
    glowSoft=sprite(160,"rgba(255,200,228,.18)","rgba(255,140,198,.08)","rgba(255,110,180,.03)");
}
function buildHeart(){
    contour=[];edge=[];fills=[];
    const contourN=mobile()?1700:2900;
    const fillN=mobile()?5600:11800;
    for(let i=0;i<contourN;i++){
        const t=Math.random()*TAU;
        contour.push({
            t,dir:Math.random()<.5?-1:1,seed:Math.random(),band:gauss()*.11,rad:0.985+Math.random()*.035,
            size:Math.random()<.82?1:Math.random()<.97?1.4:2.0,alpha:rand(.72,.96),hot:Math.random()<.06
        });
        for(let k=0;k<2;k++){
            const p=heart(t,scale);
            const q=scatterInside(p.x,p.y,.052+Math.random()*.04);
            edge.push({
                x:q.x,y:q.y,seed:Math.random(),size:Math.random()<.84?1:1.4,alpha:rand(.26,.52),hot:Math.random()<.018
            });
        }
    }
    for(let i=0;i<fillN;i++){
        const t=Math.random()*TAU;
        const p=heart(t,scale);
        const q1=scatterInside(p.x,p.y,.25+Math.random()*.06);
        const q2=scatterInside(q1.x,q1.y,.07*Math.random());
        fills.push({
            x:q2.x+gauss()*scale*.05,
            y:q2.y+gauss()*scale*.05,
            seed:Math.random(),
            size:Math.random()<.92?1:1.4,
            alpha:rand(.05,.16),
            hot:Math.random()<.009
        });
    }
}
function buildDecor(){
    stars=[];floorDots=[];stream=[];notchStream=[];
    const starN=mobile()?380:900;
    const floorN=mobile()?650:1500;
    const streamN=mobile()?120:260;
    const notchN=mobile()?70:180;
    for(let i=0;i<starN;i++)stars.push({x:Math.random(),y:Math.random(),size:Math.random()<.97?rand(.35,.95):rand(1.2,2.4),alpha:rand(.02,.15),phase:rand(0,TAU)});
    for(let i=0;i<floorN;i++)floorDots.push({r:Math.sqrt(Math.random()),a:Math.random()*TAU,s:rand(.4,1),alpha:rand(.06,.24)});
    for(let i=0;i<streamN;i++)stream.push({q:Math.random(),phase:rand(0,TAU),speed:rand(.06,.14),s:Math.random()<.9?rand(.65,1.25):rand(1.8,3),alpha:rand(.22,.8)});
    for(let i=0;i<notchN;i++)notchStream.push({q:Math.random(),phase:rand(0,TAU),speed:rand(.08,.16),s:Math.random()<.9?rand(.6,1.15):rand(1.6,2.8),alpha:rand(.18,.65)});
}
function resize(){
    W=innerWidth;H=innerHeight;
    DPR=Math.min(devicePixelRatio||1,1.6);
    canvas.width=Math.round(W*DPR);
    canvas.height=Math.round(H*DPR);
    canvas.style.width=W+"px";
    canvas.style.height=H+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.imageSmoothingEnabled=true;
    scale=Math.min(W*.50/32,H*.64/29);
    cx=W*.5;
    cy=H*.34;
    floorY=Math.min(H*.82,cy+scale*18.2);
    buildHeart();
    buildDecor();
}
function drawBackground(t){
    ctx.globalCompositeOperation="source-over";
    ctx.globalAlpha=1;
    ctx.fillStyle="#000";
    ctx.fillRect(0,0,W,H);
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.45);
    g.addColorStop(0,"rgba(95,12,53,.10)");
    g.addColorStop(.34,"rgba(48,7,27,.04)");
    g.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation="lighter";
    ctx.fillStyle="#ffbad8";
    for(const s of stars){
        ctx.globalAlpha=s.alpha*(.55+.45*Math.sin(t*.6+s.phase));
        ctx.fillRect(s.x*W,s.y*H,s.size,s.size);
    }
    ctx.globalAlpha=1;
}
function drawFloor(t){
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    const maxR=Math.min(W*.36,scale*18.6);
    const yScale=.23;
    const spokes=mobile()?42:64;
    for(let i=0;i<spokes;i++){
        const a=i/spokes*TAU+t*.012;
        const x2=cx+Math.cos(a)*maxR;
        const y2=floorY+Math.sin(a)*maxR*yScale;
        const gr=ctx.createLinearGradient(cx,floorY,x2,y2);
        gr.addColorStop(0,"rgba(255,248,252,.34)");
        gr.addColorStop(.24,"rgba(255,188,224,.14)");
        gr.addColorStop(1,"rgba(255,120,195,0)");
        ctx.globalAlpha=.42;
        ctx.strokeStyle=gr;
        ctx.lineWidth=.45;
        ctx.beginPath();
        ctx.moveTo(cx,floorY);
        ctx.lineTo(x2,y2);
        ctx.stroke();
    }
    const rings=mobile()?19:29;
    for(let r=1;r<=rings;r++){
        const q=r/rings;
        const base=maxR*Math.pow(q,1.40);
        ctx.beginPath();
        for(let j=0;j<=180;j++){
            const a=j/180*TAU;
            const wave=1+(.135*(1-q)+.015)*Math.sin(a*12-t*.55+r*.42)+.010*Math.sin(a*27+t*.18+r*.3);
            const rr=base*wave;
            const x=cx+Math.cos(a)*rr;
            const y=floorY+Math.sin(a)*rr*yScale;
            if(j===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
        }
        ctx.globalAlpha=.08+.28*(1-q);
        ctx.strokeStyle=r<6?"rgb(255,244,249)":"rgb(255,170,214)";
        ctx.lineWidth=r<6?.85:.5;
        ctx.stroke();
    }
    ctx.fillStyle="#ffd9ea";
    for(const d of floorDots){
        const rr=d.r*maxR;
        const a=d.a+t*.010*(1-d.r);
        const x=cx+Math.cos(a)*rr;
        const y=floorY+Math.sin(a)*rr*yScale;
        ctx.globalAlpha=d.alpha*(1-d.r*.55);
        ctx.fillRect(x,y,d.s,d.s);
    }
    for(let i=0;i<7;i++){
        const k=1+Math.sin(t*1.15-i*.52)*.025;
        const rx=(10+i*10.5)*k;
        const ry=(2.1+i*2.1)*k;
        ctx.globalAlpha=.42-i*.043;
        ctx.strokeStyle=i<2?"#fff8fc":"#ffb4da";
        ctx.lineWidth=i<2?1:.65;
        ctx.beginPath();
        ctx.ellipse(cx,floorY,rx,ry,0,0,TAU);
        ctx.stroke();
    }
    ctx.restore();
}
function heartPath(){
    ctx.beginPath();
    for(let i=0;i<=320;i++){
        const p=heart(i/320*TAU,scale);
        const x=cx+p.x;
        const y=cy+p.y;
        if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.closePath();
}
function drawHeartGlow(t){
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    const s=Math.min(W,H)*.40;
    ctx.globalAlpha=.15;
    ctx.drawImage(glowSoft,cx-s*.5,cy-s*.44,s,s);
    heartPath();
    ctx.strokeStyle="rgba(255,225,238,.06)";
    ctx.lineWidth=scale*.52;
    ctx.stroke();
    heartPath();
    ctx.strokeStyle="rgba(255,155,206,.06)";
    ctx.lineWidth=scale*1.05;
    ctx.stroke();
    ctx.restore();
}
function drawFills(t){
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.fillStyle="#ff9dca";
    for(let i=0;i<fills.length;i++){
        const p=fills[i];
        const dx=Math.sin(t*.35+p.seed*TAU*3)*scale*.028;
        const dy=Math.cos(t*.31+p.seed*TAU*2)*scale*.028;
        const s=p.size;
        ctx.globalAlpha=p.alpha*(.72+.28*Math.sin(t*.7+p.seed*16));
        if(p.hot){
            const hs=3.6;
            ctx.drawImage(glowPink,cx+p.x+dx-hs*.5,cy+p.y+dy-hs*.5,hs,hs);
        }else{
            ctx.fillRect(cx+p.x+dx-s*.5,cy+p.y+dy-s*.5,s,s);
        }
    }
    ctx.restore();
}
function drawEdge(t,frameNo){
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.fillStyle="#ffc8df";
    for(let i=0;i<edge.length;i++){
        const p=edge[i];
        const jx=(hash01(i,frameNo,31)-.5)*1.2;
        const jy=(hash01(i,frameNo,59)-.5)*1.2;
        const drift=Math.sin(t*.55+p.seed*18)*scale*.015;
        const s=p.size;
        ctx.globalAlpha=p.alpha*(.76+.24*Math.sin(t*1.0+p.seed*25));
        if(p.hot){
            const hs=4.2;
            ctx.drawImage(glowWhite,cx+p.x+jx+drift-hs*.5,cy+p.y+jy-hs*.5,hs,hs);
        }else{
            ctx.fillRect(cx+p.x+jx+drift-s*.5,cy+p.y+jy-s*.5,s,s);
        }
    }
    ctx.restore();
}
function drawContour(t,frameNo){
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.fillStyle="#fff1f7";
    for(let i=0;i<contour.length;i++){
        const p=contour[i];
        const tt=p.t+t*(.020+p.seed*.028)*p.dir;
        const hp=heart(tt,scale*p.rad);
        const hd=heartD(tt,scale*p.rad);
        const len=Math.hypot(hd.x,hd.y)||1;
        const nx=-hd.y/len;
        const ny=hd.x/len;
        const thickness=p.band*scale+Math.sin(tt*8+t*.8+p.seed*23)*scale*.025;
        const jx=(hash01(i,frameNo,7)-.5)*1.6;
        const jy=(hash01(i,frameNo,13)-.5)*1.6;
        const x=cx+hp.x+nx*thickness+jx;
        const y=cy+hp.y+ny*thickness+jy;
        const s=p.size;
        ctx.globalAlpha=p.alpha*(.82+.18*Math.sin(t*(1.4+p.seed)+p.seed*37));
        if(p.hot){
            const hs=5.2;
            ctx.drawImage(glowWhite,x-hs*.5,y-hs*.5,hs,hs);
        }else{
            ctx.fillRect(x-s*.5,y-s*.5,s,s);
        }
    }
    ctx.restore();
}
function drawNotchStream(t){
    const notch=heart(0,scale);
    const sx=cx+notch.x;
    const sy=cy+notch.y;
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    for(const p of notchStream){
        const q=fract(p.q+t*p.speed);
        const yy=sy+q*scale*7.3;
        const xx=sx+Math.sin(p.phase+t*1.8+q*12)*scale*.04;
        ctx.globalAlpha=p.alpha*(1-q)*(.55+.45*Math.sin(q*Math.PI));
        if(p.s>1.4){
            const s=p.s;
            ctx.drawImage(glowWhite,xx-s*.5,yy-s*.5,s,s);
        }else{
            ctx.fillStyle="#ffd5e8";
            ctx.fillRect(xx-p.s*.5,yy-p.s*.5,p.s,p.s);
        }
    }
    ctx.globalAlpha=.40;
    ctx.drawImage(glowWhite,sx-10,sy-12,20,20);
    ctx.restore();
}
function drawTipStream(t){
    const tip=heart(Math.PI,scale);
    const tx=cx+tip.x;
    const ty=cy+tip.y;
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    for(const p of stream){
        const q=fract(p.q+t*p.speed);
        const middle=Math.sin(q*Math.PI);
        const yy=ty+(floorY-ty)*q;
        const xx=tx+Math.sin(p.phase+t*2+q*12)*scale*.11*middle;
        ctx.globalAlpha=p.alpha*middle;
        if(p.s>1.5){
            const s=p.s;
            ctx.drawImage(glowWhite,xx-s*.5,yy-s*.5,s,s);
        }else{
            ctx.fillStyle="#ffd0e6";
            ctx.fillRect(xx-p.s*.5,yy-p.s*.5,p.s,p.s);
        }
    }
    ctx.globalAlpha=.58;
    ctx.drawImage(glowWhite,tx-10,ty-10,20,20);
    ctx.restore();
}
function animate(now){
    requestAnimationFrame(animate);
    const t=now*.001;
    const frameNo=(now/16.666)|0;
    drawBackground(t);
    drawFloor(t);
    drawHeartGlow(t);
    drawFills(t);
    drawEdge(t,frameNo);
    drawContour(t,frameNo);
    drawNotchStream(t);
    drawTipStream(t);
}
addEventListener("resize",()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(resize,100)},{passive:true});
makeSprites();
resize();
requestAnimationFrame(animate);
})();
</script>
</body>
</html>
