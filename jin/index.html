<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<title>Love</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020409}
body{overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="love" aria-hidden="true"></canvas>
<script>
(()=>{
"use strict";

const canvas=document.getElementById("love");
const ctx=canvas.getContext("2d",{alpha:false});
const TAU=Math.PI*2;
const LUT_SIZE=2048;
const RIBBON_SAMPLES=460;

let W=0,H=0,DPR=1;
let centerX=0,floorY=0,heartUnit=1,floorRadius=1;
let bgGradient=null,vignetteGradient=null;
let glowPink=null,glowWhite=null;
let lastProfile="";
let animationTime=0;
let lastFrameTime=performance.now();

let core=[],shell=[],inside=[],lower=[],dust=[];
let flowerOuter=[],flowerEdge=[],flowerInner=[],flowerFlow=[],flowerCore=[];
let rays=[],debris=[],stars=[],stem=[];

const curveX=new Float32Array(LUT_SIZE);
const curveY=new Float32Array(LUT_SIZE);
const curveNX=new Float32Array(LUT_SIZE);
const curveNY=new Float32Array(LUT_SIZE);

const curveSample={x:0,y:0,nx:0,ny:0};
const projected={x:0,y:0,k:1,z:0};
const floorProjected={x:0,y:0,z:0};
const orbitSample={x:0,y:0,z:0};
const flowerSample={x:0,z:0,lift:0,u:0};

const ribbonX=[
    new Float32Array(RIBBON_SAMPLES),
    new Float32Array(RIBBON_SAMPLES),
    new Float32Array(RIBBON_SAMPLES)
];
const ribbonY=[
    new Float32Array(RIBBON_SAMPLES),
    new Float32Array(RIBBON_SAMPLES),
    new Float32Array(RIBBON_SAMPLES)
];
const ribbonZ=[
    new Float32Array(RIBBON_SAMPLES),
    new Float32Array(RIBBON_SAMPLES),
    new Float32Array(RIBBON_SAMPLES)
];

const RIBBONS=[
    {turns:2.64,dir:1,top:.94,bottom:-.92,radius:1.13,tilt:.035,speed:.142,follow:.48,phase:.15,wave:.050},
    {turns:1.42,dir:-1,top:.63,bottom:-.34,radius:1.23,tilt:.205,speed:.196,follow:.31,phase:1.72,wave:.072},
    {turns:1.07,dir:1,top:.18,bottom:-.86,radius:1.29,tilt:-.245,speed:.238,follow:.64,phase:3.68,wave:.086}
];

const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const mix=(a,b,t)=>a+(b-a)*t;
const fract=v=>v-Math.floor(v);
const smooth=v=>{
    v=clamp(v);
    return v*v*(3-2*v);
};
const smoother=v=>{
    v=clamp(v);
    return v*v*v*(v*(v*6-15)+10);
};

function turnProgress(time,duration,ramp){
    time=clamp(time,0,duration);
    ramp=Math.min(ramp,duration*.48);
    const distance=duration-ramp;

    if(time<ramp)return time*time/(2*ramp*distance);
    if(time<duration-ramp)return(time-ramp*.5)/distance;

    const remain=duration-time;
    return 1-remain*remain/(2*ramp*distance);
}

function mulberry32(seed){
    return function(){
        seed|=0;
        seed=seed+0x6D2B79F5|0;
        let t=Math.imul(seed^seed>>>15,1|seed);
        t=t+Math.imul(t^t>>>7,61|t)^t;
        return((t^t>>>14)>>>0)/4294967296;
    };
}

let random=mulberry32(0x5f3759df);

const rnd=(a=1,b)=>{
    if(b===undefined){
        b=a;
        a=0;
    }
    return a+(b-a)*random();
};

const gaussian=()=>random()+random()+random()+random()-2;

function heartPoint(t){
    const s=Math.sin(t);
    const rawY=
        13*Math.cos(t)
        -5*Math.cos(2*t)
        -2*Math.cos(3*t)
        -Math.cos(4*t);

    const y=(rawY+2.5)/14.5*.95;

    const lower=smooth((-y+.04)/.78);
    const keepTip=smooth((y+.95)/.28);
    const fullness=1+.105*lower*keepTip;

    return[
        1.055*s*s*s*fullness,
        y
    ];
}

function buildCurve(){
    for(let i=0;i<LUT_SIZE;i++){
        const p=heartPoint(i/LUT_SIZE*TAU);
        curveX[i]=p[0];
        curveY[i]=p[1];
    }

    for(let i=0;i<LUT_SIZE;i++){
        const a=(i-2+LUT_SIZE)%LUT_SIZE;
        const b=(i+2)%LUT_SIZE;
        const dx=curveX[b]-curveX[a];
        const dy=curveY[b]-curveY[a];
        const length=Math.hypot(dx,dy)||1;

        curveNX[i]=-dy/length;
        curveNY[i]=dx/length;
    }
}

function sampleCurve(u){
    const f=fract(u)*LUT_SIZE;
    const i=f|0;
    const j=(i+1)%LUT_SIZE;
    const q=f-i;

    curveSample.x=mix(curveX[i],curveX[j],q);
    curveSample.y=mix(curveY[i],curveY[j],q);
    curveSample.nx=mix(curveNX[i],curveNX[j],q);
    curveSample.ny=mix(curveNY[i],curveNY[j],q);

    return curveSample;
}

function insideHeart(x,y){
    let inside=false;

    for(let i=0,j=LUT_SIZE-1;i<LUT_SIZE;j=i++){
        const yi=curveY[i];
        const yj=curveY[j];

        if((yi>y)!==(yj>y)){
            const crossing=
                (curveX[j]-curveX[i])*
                (y-yi)/(yj-yi)+
                curveX[i];

            if(x<crossing)inside=!inside;
        }
    }

    return inside;
}

function makeGlow(size,inner,mid){
    const c=document.createElement("canvas");
    c.width=c.height=size;

    const g=c.getContext("2d");
    const r=size/2;
    const gradient=g.createRadialGradient(r,r,0,r,r,r);

    gradient.addColorStop(0,"rgba(255,255,255,1)");
    gradient.addColorStop(.10,inner);
    gradient.addColorStop(.34,mid);
    gradient.addColorStop(1,"rgba(255,105,183,0)");

    g.fillStyle=gradient;
    g.fillRect(0,0,size,size);

    return c;
}

function pointBase(u,offset,z,size,alpha,hot,flow){
    return{
        u,
        offset,
        z,
        size,
        alpha,
        hot,
        flow,
        phase:rnd(TAU),
        twinkle:rnd(1.8,5.2),
        wobble:rnd(.002,.013),
        zWobble:rnd(.002,.018),
        burst:rnd(.2,1)
    };
}

function depthAt(x,y,min=.032,max=.148){
    const tipTaper=.34+.66*smooth((y+.95)/.29);
    return(
        min+
        max*Math.pow(clamp(Math.abs(x)/1.06),.62)
    )*tipTaper;
}

function buildHeart(profile){
    random=mulberry32(0x5f3759df);

    const mobile=profile==="mobile";
    const count={
        core:mobile?1050:2050,
        shell:mobile?3000:5700,
        inside:mobile?900:1750,
        lower:mobile?460:860,
        dust:mobile?520:940
    };

    core=[];
    shell=[];
    inside=[];
    lower=[];
    dust=[];

    for(let i=0;i<count.core;i++){
        const u=(i+rnd(-.38,.38))/count.core;
        const c=sampleCurve(u);

        const lowerWeight=
            smooth((-c.y+.02)/.76)*
            smooth((c.y+.95)/.24);

        const depthProfile=depthAt(c.x,c.y);
        const ring=rnd(.004,.028+.012*lowerWeight);
        const a=rnd(TAU);

        const p=pointBase(
            u,
            Math.cos(a)*ring+gaussian()*.010,
            Math.sin(a)*depthProfile*.42+gaussian()*.010,
            rnd(1.05,2.72),
            rnd(.60,.98),
            random()<.28,
            rnd(.0024,.0054)
        );

        p.shapeScale=1;
        core.push(p);
    }

    for(let i=0;i<count.shell;i++){
        const u=random();
        const c=sampleCurve(u);

        const lowerWeight=
            smooth((-c.y+.02)/.76)*
            smooth((c.y+.95)/.24);

        const cross=rnd(TAU);
        const radial=clamp(1+gaussian()*.16,.58,1.48);
        const normalXY=Math.cos(cross);
        const normalZ=Math.sin(cross);

        const tubeXY=(.050+.019*lowerWeight)*radial;
        const tubeZ=depthAt(c.x,c.y)*radial;

        let offset=
            normalXY*tubeXY+
            gaussian()*.010;

        if(random()<.13){
            offset+=
                Math.sign(gaussian()||1)*
                rnd(.018,.062)*
                Math.pow(random(),1.7);
        }

        const p=pointBase(
            u,
            offset,
            normalZ*tubeZ+gaussian()*.011,
            random()<.12?rnd(2.8,4.45):rnd(.88,2.78),
            rnd(.34,.88),
            random()<.15,
            rnd(.0036,.0082)
        );

        p.normalXY=normalXY;
        p.normalZ=normalZ;
        p.jx=gaussian()*.004;
        p.jy=gaussian()*.004;

        shell.push(p);
    }

    for(let i=0;i<count.inside;i++){
        let x=0;
        let y=0;
        let guard=0;

        do{
            x=rnd(-1.10,1.10);
            y=rnd(-.94,.94);
            guard++;
        }while(!insideHeart(x,y)&&guard<80);

        if(guard>=80){
            x=0;
            y=-.15;
        }

        const centerFade=clamp(
            1-Math.hypot(x*.48,(y+.04)*.22),
            .28,
            1
        );

        const depthProfile=depthAt(x,y,.030,.125);

        const p=pointBase(
            random(),
            0,
            clamp(
                gaussian()*depthProfile*centerFade,
                -depthProfile,
                depthProfile
            ),
            random()<.075?rnd(2.2,3.30):rnd(.68,1.95),
            rnd(.15,.52),
            random()<.09,
            rnd(.0014,.0048)
        );

        p.x=x;
        p.y=y;
        p.jx=gaussian()*.008;
        p.jy=gaussian()*.008;
        p.drift=rnd(.004,.017);

        inside.push(p);
    }

    for(let i=0;i<count.lower;i++){
        const u=.245+.51*random();
        const c=sampleCurve(u);
        const cross=rnd(TAU);
        const normalXY=Math.cos(cross);
        const normalZ=Math.sin(cross);

        const tipTaper=.30+.70*smooth((c.y+.95)/.30);
        const depthProfile=(
            .030+
            .155*Math.pow(clamp(Math.abs(c.x)/1.06),.62)
        )*tipTaper;

        const p=pointBase(
            u,
            normalXY*rnd(.045,.082)+gaussian()*.020,
            normalZ*depthProfile*rnd(.82,1.18)+gaussian()*.010,
            random()<.10?rnd(2.3,3.45):rnd(.74,2.18),
            rnd(.28,.68),
            random()<.13,
            rnd(.0015,.0045)
        );

        p.normalXY=normalXY;
        p.normalZ=normalZ;
        p.jx=gaussian()*.006;
        p.jy=gaussian()*.006;

        lower.push(p);
    }

    for(let i=0;i<count.dust;i++){
        const side=Math.sign(gaussian()||1);
        const u=random();
        const c=sampleCurve(u);

        const tipTaper=.32+.68*smooth((c.y+.95)/.30);
        const depthProfile=(
            .030+
            .155*Math.pow(clamp(Math.abs(c.x)/1.06),.62)
        )*tipTaper;

        const p=pointBase(
            u,
            gaussian()*.075+
                side*rnd(.025,.17)*Math.pow(random(),.82),
            gaussian()*depthProfile*.76,
            rnd(.55,1.85),
            rnd(.12,.44),
            random()<.06,
            rnd(.006,.013)
        );

        p.shapeScale=1;
        p.wobble=rnd(.008,.035);

        dust.push(p);
    }
}

function buildFloor(profile){
    random=mulberry32(0x71c49a2d);

    const mobile=profile==="mobile";

    flowerOuter=[];
    flowerEdge=[];
    flowerInner=[];
    flowerFlow=[];
    flowerCore=[];

    const outerPetals=28;
    const outerSteps=mobile?27:46;

    for(let petal=0;petal<outerPetals;petal++){
        for(const side of[-1,1]){
            for(let i=0;i<=outerSteps;i++){
                flowerOuter.push({
                    petal,
                    u:clamp((i+rnd(-.16,.16))/outerSteps),
                    lateral:side*rnd(.94,1.02),
                    radial:rnd(-.005,.005),
                    phase:rnd(TAU),
                    size:random()<.065?rnd(1.50,2.10):rnd(.74,1.38),
                    alpha:rnd(.68,.98),
                    hot:random()<.035
                });
            }
        }
    }

    const fillCount=mobile?520:980;

    for(let i=0;i<fillCount;i++){
        flowerEdge.push({
            petal:i%outerPetals,
            u:rnd(.035,.98),
            lateral:clamp(gaussian()*.52,-.9,.9),
            radial:rnd(-.010,.010),
            phase:rnd(TAU),
            size:rnd(.50,1.05),
            alpha:rnd(.12,.34),
            hot:random()<.018
        });
    }

    const innerPetals=14;
    const innerSteps=mobile?24:39;

    for(let petal=0;petal<innerPetals;petal++){
        for(const side of[-1,1]){
            for(let i=0;i<=innerSteps;i++){
                flowerInner.push({
                    petal,
                    u:clamp((i+rnd(-.14,.14))/innerSteps),
                    lateral:side*rnd(.93,1.02),
                    radial:rnd(-.004,.004),
                    phase:rnd(TAU),
                    size:random()<.08?rnd(1.48,2.05):rnd(.72,1.34),
                    alpha:rnd(.64,.96),
                    hot:random()<.04
                });
            }
        }
    }

    const flowCount=mobile?260:520;

    for(let i=0;i<flowCount;i++){
        flowerFlow.push({
            petal:i%outerPetals,
            u:random(),
            lateral:gaussian()*.07,
            radial:0,
            phase:rnd(TAU),
            speed:rnd(.040,.070),
            size:random()<.10?rnd(1.45,2.15):rnd(.65,1.25),
            alpha:rnd(.42,.84),
            hot:random()<.09
        });
    }

    const ringCount=mobile?5:6;

    for(let ring=0;ring<ringCount;ring++){
        const count=(mobile?34:58)+ring*(mobile?5:8);

        for(let i=0;i<count;i++){
            flowerCore.push({
                angle:i/count*TAU+rnd(-.009,.009),
                radius:.045+ring*.050,
                speed:(ring%2?-1:1)*(.026+ring*.004),
                phase:rnd(TAU),
                size:ring<2?rnd(.94,1.52):rnd(.68,1.22),
                alpha:rnd(.68,.98),
                hot:random()<.045
            });
        }
    }
}

function buildEffects(profile){
    const mobile=profile==="mobile";

    rays=[];
    debris=[];
    stem=[];

    const rayCount=mobile?118:210;

    for(let i=0;i<rayCount;i++){
        rays.push({
            angle:i/rayCount*TAU+rnd(-.045,.045),
            length:rnd(.78,2.25)*Math.pow(rnd(.35,1),.34),
            start:rnd(.04,.30),
            width:random()<.14?rnd(1.2,2.2):rnd(.35,1.05),
            alpha:rnd(.22,.86),
            delay:rnd(0,.22),
            phase:rnd(TAU)
        });
    }

    const debrisCount=mobile?650:1280;

    for(let i=0;i<debrisCount;i++){
        debris.push({
            angle:rnd(TAU),
            speed:rnd(.45,1.75)*Math.pow(rnd(.2,1),.35),
            start:rnd(.05,.46),
            delay:rnd(0,.22),
            curve:rnd(-.25,.25),
            size:random()<.08?rnd(1.8,3.1):rnd(.5,1.55),
            alpha:rnd(.18,.72),
            phase:rnd(TAU),
            hot:random()<.08
        });
    }

    const stemCount=mobile?100:180;

    for(let i=0;i<stemCount;i++){
        stem.push({
            phase:random(),
            speed:rnd(.10,.24),
            sway:rnd(-1,1),
            size:rnd(.55,1.45),
            alpha:rnd(.18,.62)
        });
    }
}

function buildStars(profile){
    const mobile=profile==="mobile";

    stars=[];
    const count=mobile?130:260;

    for(let i=0;i<count;i++){
        stars.push({
            x:rnd(.05,.95),
            y:rnd(.10,.78),
            size:random()<.05?rnd(1.5,2.4):rnd(.35,1.15),
            alpha:rnd(.035,.22),
            phase:rnd(TAU),
            speed:rnd(.35,1.25)
        });
    }
}

function resize(){
    W=Math.max(1,innerWidth);
    H=Math.max(1,innerHeight);

    const profile=W<720?"mobile":"desktop";

    DPR=Math.min(
        devicePixelRatio||1,
        profile==="mobile"?1.18:1.42
    );

    canvas.width=Math.round(W*DPR);
    canvas.height=Math.round(H*DPR);
    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.imageSmoothingEnabled=true;

    centerX=W*.5;
    floorY=H*(W/H<.76?.69:.70);
    heartUnit=Math.min(W*.385,H*.275,350);
    floorRadius=Math.min(W*.49,H*.58,720);

    bgGradient=ctx.createRadialGradient(
        centerX,H*.44,0,
        centerX,H*.44,
        Math.max(W,H)*.72
    );

    bgGradient.addColorStop(0,"#182234");
    bgGradient.addColorStop(.28,"#101827");
    bgGradient.addColorStop(.64,"#070c16");
    bgGradient.addColorStop(1,"#020308");

    vignetteGradient=ctx.createRadialGradient(
        centerX,H*.48,Math.min(W,H)*.15,
        centerX,H*.48,Math.max(W,H)*.70
    );

    vignetteGradient.addColorStop(0,"rgba(0,0,0,0)");
    vignetteGradient.addColorStop(.68,"rgba(0,0,0,.08)");
    vignetteGradient.addColorStop(1,"rgba(0,0,0,.64)");

    if(profile!==lastProfile){
        buildHeart(profile);
        buildEffects(profile);
        buildFloor(profile);
        lastProfile=profile;
    }

    buildStars(profile);
}

function sceneState(seconds){
    const t=seconds%10;

    let zoom=1;

    if(t>=5.55&&t<6.35){
        zoom=mix(1,.66,smoother((t-5.55)/.80));
    }else if(t>=6.35&&t<7.65){
        zoom=.66;
    }else if(t>=7.65&&t<8.72){
        zoom=mix(.66,1,smoother((t-7.65)/1.07));
    }

    let rotation;

    if(t<2.80){
        rotation=TAU*turnProgress(t,2.80,.38);
    }else if(t<6.55){
        rotation=TAU;
    }else{
        rotation=
            TAU+
            TAU*turnProgress(t-6.55,3.45,.42);
    }

    const pitch=
        .032*Math.sin(rotation*.5)+
        .012*Math.sin(seconds*.53);

    const roll=
        .014*Math.sin(seconds*.31)+
        .008*Math.sin(rotation);

    let ring=0;

    if(t<2.42){
        ring=1-smooth((t-1.86)/.56);
    }else if(t>6.72){
        ring=smooth((t-6.72)/.72);
    }

    const flash=
        smooth((t-1.82)/.12)*
        (1-smooth((t-2.13)/.56));

    const burst=
        smooth((t-1.88)/.13)*
        (1-smooth((t-2.43)/.84));

    const burstProgress=clamp((t-1.82)/.70);

    const linger=
        smooth((t-2.28)/.30)*
        (1-smooth((t-4.05)/.78));

    zoom*=1+flash*.018;

    return{
        t,
        zoom,
        rotation,
        pitch,
        roll,
        ring,
        flash,
        burst,
        burstProgress,
        linger,
        rc:Math.cos(rotation),
        rs:Math.sin(rotation),
        pc:Math.cos(pitch),
        ps:Math.sin(pitch),
        lc:Math.cos(roll),
        ls:Math.sin(roll)
    };
}

function projectHeart(x,y,z,state,centerY){
    let xr=x*state.rc+z*state.rs;
    let zr=-x*state.rs+z*state.rc;

    let yr=y*state.pc-zr*state.ps;
    zr=y*state.ps+zr*state.pc;

    const xf=xr*state.lc-yr*state.ls;
    const yf=xr*state.ls+yr*state.lc;
    const k=1/(1-zr*.17);

    projected.x=centerX+xf*heartUnit*state.zoom*k;
    projected.y=centerY-yf*heartUnit*1.045*state.zoom*k;
    projected.k=k;
    projected.z=zr;

    return projected;
}

function projectOrbit(x,y,z,state,centerY){
    const xf=x*state.lc-y*state.ls;
    const yf=x*state.ls+y*state.lc;
    const k=1/(1-z*.17);

    projected.x=centerX+xf*heartUnit*state.zoom*k;
    projected.y=centerY-yf*heartUnit*1.045*state.zoom*k;
    projected.k=k;
    projected.z=z;

    return projected;
}

function projectFloor(x,z,zoom,angle,lift=0){
    const c=Math.cos(angle);
    const s=Math.sin(angle);
    const xr=x*c-z*s;
    const zr=x*s+z*c;
    const k=1/(1-zr*.27);

    floorProjected.x=centerX+xr*floorRadius*zoom*k;
    floorProjected.y=
        floorY+
        zr*floorRadius*.30*zoom*k-
        lift*floorRadius*.18*zoom*k;

    floorProjected.z=zr;

    return floorProjected;
}

function drawBackground(seconds){
    ctx.globalCompositeOperation="source-over";
    ctx.globalAlpha=1;
    ctx.fillStyle=bgGradient;
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle="#e9d6dc";

    for(const p of stars){
        const flicker=
            .55+
            .45*Math.sin(seconds*p.speed+p.phase);

        ctx.globalAlpha=
            p.alpha*
            (.45+.55*flicker*flicker);

        ctx.fillRect(
            p.x*W,
            p.y*H,
            p.size,
            p.size
        );

        if(p.size>1.45){
            ctx.globalAlpha*=.48;

            ctx.fillRect(
                p.x*W-p.size*2,
                p.y*H+p.size*.35,
                p.size*5,
                p.size*.28
            );

            ctx.fillRect(
                p.x*W+p.size*.35,
                p.y*H-p.size*2,
                p.size*.28,
                p.size*5
            );
        }
    }

    ctx.globalAlpha=1;
}

function drawAtmosphere(state,seconds,centerY){
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.translate(centerX,centerY);
    ctx.scale(1.12,.92);

    const radius=heartUnit*1.58*state.zoom;

    const g=ctx.createRadialGradient(
        0,0,0,
        0,0,radius
    );

    g.addColorStop(
        0,
        `rgba(248,226,225,${.070+state.flash*.15})`
    );

    g.addColorStop(
        .22,
        `rgba(201,119,145,${.046+state.burst*.08})`
    );

    g.addColorStop(.54,"rgba(128,107,151,.022)");
    g.addColorStop(1,"rgba(73,63,92,0)");

    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(0,0,radius,0,TAU);
    ctx.fill();

    ctx.rotate(seconds*.035);
    ctx.globalAlpha=
        state.burst*.055+
        state.flash*.075;

    ctx.fillStyle="#d68fa8";

    for(let i=0;i<12;i++){
        ctx.rotate(TAU/12);
        ctx.beginPath();
        ctx.moveTo(heartUnit*.30,-1);
        ctx.lineTo(heartUnit*1.65,-heartUnit*.018);
        ctx.lineTo(heartUnit*1.65,heartUnit*.018);
        ctx.closePath();
        ctx.fill();
    }

    ctx.restore();
}

function drawLensFlare(state,centerY){
    const power=state.flash+state.burst*.24;
    if(power<.002)return;

    const radius=
        heartUnit*
        state.zoom*
        (1.75+state.burst*.45);

    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.translate(centerX,centerY);
    ctx.globalAlpha=power;

    let g=ctx.createLinearGradient(-radius,0,radius,0);

    g.addColorStop(0,"rgba(188,91,124,0)");
    g.addColorStop(.32,"rgba(211,135,157,.032)");
    g.addColorStop(.49,"rgba(255,244,237,.56)");
    g.addColorStop(.51,"rgba(255,244,237,.56)");
    g.addColorStop(.68,"rgba(211,135,157,.032)");
    g.addColorStop(1,"rgba(188,91,124,0)");

    ctx.fillStyle=g;
    ctx.fillRect(-radius,-1.25,radius*2,2.5);

    g=ctx.createLinearGradient(
        0,-radius*.72,
        0,radius*.72
    );

    g.addColorStop(0,"rgba(205,131,153,0)");
    g.addColorStop(.48,"rgba(255,243,236,.28)");
    g.addColorStop(.52,"rgba(255,243,236,.28)");
    g.addColorStop(1,"rgba(205,131,153,0)");

    ctx.fillStyle=g;
    ctx.fillRect(-.75,-radius*.72,1.5,radius*1.44);

    ctx.rotate(Math.PI*.25);
    ctx.globalAlpha=power*.28;
    ctx.fillStyle="#f7e4df";
    ctx.fillRect(-radius*.72,-.38,radius*1.44,.76);

    ctx.rotate(Math.PI*.5);
    ctx.fillRect(-radius*.72,-.38,radius*1.44,.76);

    ctx.restore();
}

function drawFloorGlow(state){
    const r=floorRadius;

    ctx.save();
    ctx.translate(centerX,floorY);
    ctx.scale(1,.31);

    const g=ctx.createRadialGradient(0,0,0,0,0,r*1.05);

    g.addColorStop(
        0,
        `rgba(244,222,219,${.21+state.burst*.20})`
    );

    g.addColorStop(.25,"rgba(191,104,134,.10)");
    g.addColorStop(1,"rgba(139,76,108,0)");

    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(0,0,r*1.05,0,TAU);
    ctx.fill();

    ctx.restore();
}

function flowerPosition(p,seconds,inner=false,flowing=false){
    const petals=inner?14:28;
    const u=flowing?fract(p.u+seconds*p.speed):p.u;
    const rotation=seconds*(inner?-.018:.014);
    const baseAngle=
        p.petal/petals*TAU+
        (inner?TAU/56:0);

    const sway=
        .012*
        Math.sin(seconds*.62+p.petal*.57);

    const curl=
        (p.petal%2?1:-1)*
        (inner?.018:.028)*
        Math.sin(Math.PI*u)*
        (.80+.20*Math.sin(seconds*.42+p.petal));

    const angle=
        baseAngle+
        rotation+
        sway*(.18+.82*u)+
        curl;

    const opening=
        1+
        .026*Math.sin(seconds*.48+p.petal*.39);

    const maximum=
        inner
            ?.62
            :(p.petal%2?.95:1.01);

    const ripple=
        .004*
        Math.sin(seconds*.92+p.petal*.51+u*4.8);

    const radius=
        (.050+u*maximum)*
        opening+
        p.radial+
        ripple;

    const envelope=
        Math.pow(
            Math.max(0,Math.sin(Math.PI*u)),
            .84
        );

    const width=
        (inner?.060:.046)*
        envelope*
        (.78+.26*u);

    const lateral=
        p.lateral*
        width*
        (1+.045*Math.sin(seconds*.68+p.phase));

    const ca=Math.cos(angle);
    const sa=Math.sin(angle);

    const lift=
        envelope*
        (inner?.034:.026)*
        (.58+.42*Math.sin(seconds*.55+p.petal*.31));

    flowerSample.x=ca*radius-sa*lateral;
    flowerSample.z=sa*radius+ca*lateral;
    flowerSample.lift=lift;
    flowerSample.u=u;

    return flowerSample;
}

function drawFlowerLayer(list,inner,state,seconds,color,gain){
    ctx.fillStyle=color;

    for(const item of list){
        const f=flowerPosition(item,seconds,inner,false);
        const expansion=1+state.burst*.035;

        const p=projectFloor(
            f.x*expansion,
            f.z*expansion,
            1,
            0,
            f.lift
        );

        const shimmer=
            .68+
            .32*Math.pow(
                .5+
                .5*Math.sin(
                    seconds*(1.1+item.size*.16)+
                    item.phase
                ),
                2
            );

        const depth=clamp(.82+p.z*.20,.55,1.08);

        const alpha=clamp(
            item.alpha*
            gain*
            shimmer*
            depth*
            (1+state.flash*.28)
        );

        const size=
            item.size*
            clamp(1+p.z*.10,.80,1.20);

        ctx.globalAlpha=alpha;
        ctx.fillRect(
            p.x-size*.5,
            p.y-size*.5,
            size,
            size
        );

        if(item.hot){
            const diameter=
                size*
                (
                    4.5+
                    2.2*Math.pow(
                        .5+
                        .5*Math.sin(seconds*2.1+item.phase),
                        3
                    )
                );

            ctx.globalAlpha=alpha*.34;

            ctx.drawImage(
                glowPink,
                p.x-diameter*.5,
                p.y-diameter*.5,
                diameter,
                diameter
            );
        }
    }
}

function drawFlowerFlow(state,seconds){
    ctx.fillStyle="#f7e9e4";

    for(const item of flowerFlow){
        const f=flowerPosition(item,seconds,false,true);
        const expansion=1+state.burst*.055;

        const p=projectFloor(
            f.x*expansion,
            f.z*expansion,
            1,
            0,
            f.lift+.012
        );

        const life=
            Math.pow(
                Math.sin(Math.PI*f.u),
                .60
            );

        const sparkle=
            .72+
            .28*Math.sin(seconds*3.1+item.phase);

        const alpha=clamp(
            item.alpha*
            life*
            sparkle*
            (1+state.flash*.42)
        );

        const size=
            item.size*
            (.74+.38*life);

        ctx.globalAlpha=alpha;

        ctx.fillRect(
            p.x-size*.5,
            p.y-size*.5,
            size,
            size
        );

        if(item.hot){
            const diameter=
                size*
                (5.5+state.flash*2.5);

            ctx.globalAlpha=alpha*.34;

            ctx.drawImage(
                glowWhite,
                p.x-diameter*.5,
                p.y-diameter*.5,
                diameter,
                diameter
            );
        }
    }
}

function drawFlowerCore(state,seconds){
    ctx.fillStyle="#f4e4df";

    for(const item of flowerCore){
        const angle=
            item.angle+
            seconds*item.speed;

        const pulse=
            .975+
            .025*Math.sin(seconds*.62+item.radius*15);

        const radius=item.radius*pulse;
        const x=Math.cos(angle)*radius;
        const z=Math.sin(angle)*radius;

        const lift=
            .008+
            .006*Math.pow(
                .5+
                .5*Math.sin(seconds*.90+item.radius*18),
                2
            );

        const p=projectFloor(x,z,1,0,lift);

        const twinkle=
            .62+
            .38*Math.pow(
                .5+
                .5*Math.sin(seconds*2.4+item.phase),
                3
            );

        const alpha=clamp(
            item.alpha*
            1.22*
            twinkle*
            (1+state.flash*.45)
        );

        const size=item.size*1.12;

        ctx.globalAlpha=alpha;

        ctx.fillRect(
            p.x-size*.5,
            p.y-size*.5,
            size,
            size
        );

        if(item.hot){
            const diameter=
                size*
                (5.2+state.flash*2.8);

            ctx.globalAlpha=alpha*.38;

            ctx.drawImage(
                glowWhite,
                p.x-diameter*.5,
                p.y-diameter*.5,
                diameter,
                diameter
            );
        }
    }
}

function drawFloor(state,seconds){
    drawFloorGlow(state);

    ctx.save();
    ctx.globalCompositeOperation="lighter";

    drawFlowerLayer(
        flowerEdge,
        false,
        state,
        seconds,
        "#b97891",
        .72
    );

    drawFlowerLayer(
        flowerOuter,
        false,
        state,
        seconds,
        "#eee0dc",
        1.42
    );

    drawFlowerLayer(
        flowerInner,
        true,
        state,
        seconds,
        "#d6a4b0",
        1.30
    );

    drawFlowerFlow(state,seconds);
    drawFlowerCore(state,seconds);

    ctx.restore();
}

function drawStem(state,seconds){
    const centerY=
        floorY-
        heartUnit*state.zoom*1.045;

    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.fillStyle="#e2b6bd";

    for(const p of stem){
        const life=fract(seconds*p.speed+p.phase);
        const y=
            floorY-
            life*heartUnit*.22*state.zoom;

        const width=
            (1-life)*
            heartUnit*.055*
            state.zoom;

        const x=
            centerX+
            p.sway*width+
            Math.sin(seconds*2+p.phase*TAU)*width*.13;

        const fade=Math.sin(life*Math.PI);

        ctx.globalAlpha=
            p.alpha*
            fade*
            (.72+state.burst*.55);

        ctx.fillRect(
            x-p.size*.5,
            y-p.size*.5,
            p.size,
            p.size
        );
    }

    const g=ctx.createRadialGradient(
        centerX,floorY,0,
        centerX,floorY,
        heartUnit*.17*state.zoom
    );

    g.addColorStop(
        0,
        `rgba(255,244,237,${.24+state.flash*.18})`
    );

    g.addColorStop(.18,"rgba(221,168,177,.13)");
    g.addColorStop(1,"rgba(167,88,121,0)");

    ctx.globalAlpha=1;
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(
        centerX,
        floorY,
        heartUnit*.17*state.zoom,
        0,
        TAU
    );
    ctx.fill();

    ctx.restore();

    return centerY;
}

function drawRays(state,centerY){
    if(
        state.burst<=.001&&
        state.linger<=.001
    )return;

    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.lineCap="round";
    ctx.shadowColor="#b85b82";
    ctx.shadowBlur=10;

    for(let i=0;i<rays.length;i++){
        const ray=rays[i];

        if(
            state.burst<.012&&
            i%6!==0
        )continue;

        const q=clamp(
            (state.burstProgress-ray.delay)/
            (1-ray.delay)
        );

        if(q<=0)continue;

        const travel=1-Math.pow(1-q,2.7);

        const head=
            heartUnit*
            state.zoom*
            (ray.start+ray.length*travel);

        const tail=
            head-
            heartUnit*
            state.zoom*
            (
                .10+
                .43*(1-q)+
                ray.length*(.13+state.linger*.18)
            );

        const bend=
            Math.sin(ray.phase+q*3)*
            heartUnit*.025;

        const ca=Math.cos(ray.angle);
        const sa=Math.sin(ray.angle);

        ctx.beginPath();

        ctx.moveTo(
            centerX+
                ca*Math.max(0,tail)-
                sa*bend,
            centerY+
                sa*Math.max(0,tail)+
                ca*bend
        );

        ctx.lineTo(
            centerX+ca*head,
            centerY+sa*head
        );

        ctx.globalAlpha=
            ray.alpha*
            (
                state.burst*(1-q*.48)+
                state.linger*.16
            );

        ctx.strokeStyle=
            i%6===0
                ?"#fff3eb"
                :"#d58ca3";

        ctx.lineWidth=
            ray.width*
            (i%11===0?1.28:1);

        ctx.stroke();
    }

    ctx.restore();
}

function drawFlare(state,centerY,front=false){
    if(state.flash<=.002)return;

    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.translate(centerX,centerY);
    ctx.scale(.72,1);

    const radius=
        heartUnit*
        state.zoom*
        (front?.39:.86);

    const g=ctx.createRadialGradient(
        0,0,0,
        0,0,radius
    );

    if(front){
        g.addColorStop(
            0,
            `rgba(255,250,244,${state.flash*.28})`
        );

        g.addColorStop(
            .30,
            `rgba(240,218,215,${state.flash*.12})`
        );
    }else{
        g.addColorStop(
            0,
            `rgba(255,250,244,${state.flash*.88})`
        );

        g.addColorStop(
            .16,
            `rgba(243,221,218,${state.flash*.54})`
        );

        g.addColorStop(
            .48,
            `rgba(193,99,133,${state.flash*.20})`
        );
    }

    g.addColorStop(1,"rgba(153,74,111,0)");

    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(0,0,radius,0,TAU);
    ctx.fill();

    ctx.restore();
}

function orbitPoint(progress,state,seconds,strand=0){
    const cfg=RIBBONS[strand];
    const u=progress*TAU*cfg.turns*cfg.dir;
    const edge=Math.sin(Math.PI*progress);

    const drift=
        state.rotation*cfg.follow+
        seconds*cfg.speed+
        cfg.phase;

    const flutter=
        cfg.wave*
            Math.sin(
                seconds*.71+
                u*.37+
                strand*1.41
            )+
        cfg.wave*.42*
            Math.sin(
                seconds*1.37-
                u*.81+
                strand*.76
            );

    const phase=
        u+
        drift+
        flutter*edge;

    const radius=
        cfg.radius+
        cfg.wave*
            Math.sin(
                u*1.18+
                seconds*.59+
                strand*.8
            )+
        cfg.wave*.38*
            Math.sin(
                u*2.83-
                seconds*.91+
                strand*2.03
            );

    const y=
        mix(cfg.top,cfg.bottom,progress)+
        cfg.tilt*
            Math.cos(phase+strand*.53)*
            edge+
        cfg.wave*.72*
            Math.sin(
                u*.61+
                seconds*.67+
                strand*.91
            )*
            edge;

    orbitSample.x=Math.cos(phase)*radius;
    orbitSample.y=y;
    orbitSample.z=Math.sin(phase)*radius;

    return orbitSample;
}

function buildRibbonFrame(state,seconds,centerY){
    for(let strand=0;strand<3;strand++){
        const px=ribbonX[strand];
        const py=ribbonY[strand];
        const pz=ribbonZ[strand];

        for(let i=0;i<RIBBON_SAMPLES;i++){
            const o=orbitPoint(
                i/(RIBBON_SAMPLES-1),
                state,
                seconds,
                strand
            );

            const p=projectOrbit(
                o.x,
                o.y,
                o.z,
                state,
                centerY
            );

            px[i]=p.x;
            py[i]=p.y;
            pz[i]=o.z;
        }
    }
}

function traceOrbit(front,strand){
    let drawing=false;

    const px=ribbonX[strand];
    const py=ribbonY[strand];
    const pz=ribbonZ[strand];

    ctx.beginPath();

    for(let i=0;i<RIBBON_SAMPLES;i++){
        const visible=
            front
                ?pz[i]>=-.025
                :pz[i]<-.025;

        if(visible){
            if(!drawing){
                ctx.moveTo(px[i],py[i]);
            }else{
                ctx.lineTo(px[i],py[i]);
            }

            drawing=true;
        }else{
            drawing=false;
        }
    }
}

function drawRibbonParticles(front,state,seconds){
    const colors=[
        "#fff3ec",
        "#f0c9ca",
        "#d6c8df"
    ];

    ctx.shadowBlur=0;

    for(let strand=0;strand<3;strand++){
        ctx.fillStyle=colors[strand];

        for(let comet=0;comet<3;comet++){
            const motion=fract(
                seconds*(.082+strand*.017)+
                comet/3+
                strand*.173
            );

            const head=
                RIBBONS[strand].dir>0
                    ?motion
                    :1-motion;

            for(let tail=0;tail<25;tail++){
                const progress=
                    head-
                    RIBBONS[strand].dir*
                    tail*
                    (.0038+strand*.00045);

                if(
                    progress<=0||
                    progress>=1
                )continue;

                const index=Math.min(
                    RIBBON_SAMPLES-1,
                    Math.max(
                        0,
                        Math.round(
                            progress*
                            (RIBBON_SAMPLES-1)
                        )
                    )
                );

                const z=ribbonZ[strand][index];

                const visible=
                    front
                        ?z>=-.025
                        :z<-.025;

                if(!visible)continue;

                const fade=
                    Math.pow(1-tail/25,1.75)*
                    Math.pow(
                        Math.sin(Math.PI*progress),
                        .28
                    );

                const depth=front?1:.22;

                const alpha=
                    state.ring*
                    depth*
                    fade*
                    (.42+comet*.12);

                const size=
                    (.54+fade*1.42)*
                    (tail===0?1.55:1);

                const x=ribbonX[strand][index];
                const y=ribbonY[strand][index];

                ctx.globalAlpha=alpha;

                ctx.fillRect(
                    x-size*.5,
                    y-size*.5,
                    size,
                    size
                );

                if(front&&tail===0){
                    const d=size*7.4;

                    ctx.globalAlpha=alpha*.34;

                    ctx.drawImage(
                        glowWhite,
                        x-d*.5,
                        y-d*.5,
                        d,
                        d
                    );
                }
            }
        }
    }
}

function drawOrbit(front,state,seconds,centerY){
    if(state.ring<=.002)return;

    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.lineCap="round";
    ctx.lineJoin="round";

    const depth=front?1:.28;

    const glowColors=[
        "#b95178",
        "#bb7587",
        "#766489"
    ];

    const middleColors=[
        "#dc92a9",
        "#e2b0b5",
        "#b6a3c2"
    ];

    const coreColors=[
        "#fff2e9",
        "#f9e2df",
        "#e9e0ee"
    ];

    for(let strand=0;strand<3;strand++){
        traceOrbit(front,strand);

        ctx.setLineDash([]);
        ctx.globalAlpha=
            state.ring*
            depth*
            (front?.105:.072);

        ctx.strokeStyle=glowColors[strand];

        ctx.lineWidth=
            front
                ?[9.2,7.3,6.1][strand]
                :[5.1,4.0,3.4][strand];

        ctx.shadowColor=glowColors[strand];
        ctx.shadowBlur=24;
        ctx.stroke();

        traceOrbit(front,strand);

        ctx.globalAlpha=
            state.ring*
            depth*
            (front?.34:.22);

        ctx.strokeStyle=middleColors[strand];

        ctx.lineWidth=
            front
                ?[2.65,1.92,1.56][strand]
                :[1.38,1.02,.84][strand];

        ctx.shadowColor=glowColors[strand];
        ctx.shadowBlur=10;
        ctx.stroke();

        traceOrbit(front,strand);

        ctx.globalAlpha=
            state.ring*
            depth*
            (front?.82:.43);

        ctx.strokeStyle=coreColors[strand];

        ctx.lineWidth=
            front
                ?[.76,.61,.52][strand]
                :[.46,.38,.32][strand];

        ctx.shadowBlur=5;
        ctx.stroke();

        traceOrbit(front,strand);

        ctx.setLineDash([
            heartUnit*(.085+strand*.012),
            heartUnit*(.19-strand*.015)
        ]);

        ctx.lineDashOffset=
            -seconds*
            heartUnit*
            (.29+strand*.045)*
            RIBBONS[strand].dir;

        ctx.globalAlpha=
            state.ring*
            depth*
            (front?.88:.32);

        ctx.strokeStyle="#ffffff";

        ctx.lineWidth=
            front
                ?[1.28,1.05,.90][strand]
                :[.64,.52,.44][strand];

        ctx.shadowColor=middleColors[strand];
        ctx.shadowBlur=9;
        ctx.stroke();
    }

    ctx.setLineDash([]);
    drawRibbonParticles(front,state,seconds);

    ctx.restore();
}

function traceHeart(state,centerY,zOffset=0){
    ctx.beginPath();

    const n=360;

    for(let i=0;i<=n;i++){
        const p=sampleCurve(i/n);
        const q=projectHeart(
            p.x,
            p.y,
            zOffset,
            state,
            centerY
        );

        if(i===0){
            ctx.moveTo(q.x,q.y);
        }else{
            ctx.lineTo(q.x,q.y);
        }
    }

    ctx.closePath();
}

function drawHeartTrace(state,centerY){
    ctx.save();
    ctx.globalCompositeOperation="lighter";

    traceHeart(state,centerY);

    ctx.globalAlpha=.026+state.flash*.055;
    ctx.strokeStyle="#b95c82";
    ctx.lineWidth=21*state.zoom;
    ctx.shadowColor="#a94f75";
    ctx.shadowBlur=30*state.zoom;
    ctx.stroke();

    traceHeart(state,centerY);

    ctx.globalAlpha=.020+state.flash*.042;
    ctx.strokeStyle="#e3a5b4";
    ctx.lineWidth=3.5*state.zoom;
    ctx.shadowColor="#b96587";
    ctx.shadowBlur=16*state.zoom;
    ctx.stroke();

    ctx.restore();
}

function drawHeartParticles(list,kind,state,seconds,centerY,color,gain){
    ctx.fillStyle=color;

    for(const p of list){
        const c=sampleCurve(
            p.u+
            seconds*p.flow
        );

        const oscillation=
            Math.sin(
                seconds*(1.05+p.twinkle*.11)+
                p.phase
            );

        let x;
        let y;
        let z;

        if(kind==="shell"||kind==="lower"){
            const offset=
                p.offset+
                oscillation*p.wobble;

            x=
                c.x+
                c.nx*offset+
                p.jx;

            y=
                c.y+
                c.ny*offset+
                p.jy;

            z=
                p.z+
                oscillation*p.zWobble;
        }else if(kind==="inside"){
            const drift=
                seconds*.34+
                p.phase;

            x=
                p.x+
                p.jx+
                Math.cos(drift)*p.drift;

            y=
                p.y+
                p.jy+
                Math.sin(drift*.83)*p.drift*.72;

            z=
                p.z+
                oscillation*p.zWobble;
        }else{
            const offset=
                p.offset+
                oscillation*p.wobble;

            const shapeScale=p.shapeScale||1;

            x=
                c.x*shapeScale+
                c.nx*offset;

            y=
                (c.y+.055)*shapeScale-
                .055+
                c.ny*offset;

            z=
                p.z+
                oscillation*p.zWobble;
        }

        if(state.burst>.001){
            const push=
                1+
                state.burst*
                p.burst*
                .026;

            x*=push;
            y=(y+.04)*push-.04;
        }

        const q=projectHeart(
            x,
            y,
            z,
            state,
            centerY
        );

        if(
            q.x<-12||
            q.x>W+12||
            q.y<-12||
            q.y>H+12
        )continue;

        const twinkle=
            .76+
            .24*Math.pow(
                .5+
                .5*Math.sin(
                    seconds*p.twinkle+
                    p.phase
                ),
                2
            );

        const depthLight=
            clamp(
                .76+q.z*.27,
                .48,
                1.19
            );

        let surfaceLight=1;

        if(kind==="shell"||kind==="lower"){
            const normalXY=p.normalXY||0;
            const nz=p.normalZ||0;
            const nx=c.nx*normalXY;
            const ny=c.ny*normalXY;

            let rotatedX=
                nx*state.rc+
                nz*state.rs;

            let rotatedZ=
                -nx*state.rs+
                nz*state.rc;

            let rotatedY=
                ny*state.pc-
                rotatedZ*state.ps;

            rotatedZ=
                ny*state.ps+
                rotatedZ*state.pc;

            const rolledX=
                rotatedX*state.lc-
                rotatedY*state.ls;

            rotatedY=
                rotatedX*state.ls+
                rotatedY*state.lc;

            const light=Math.max(
                0,
                -rolledX*.22+
                rotatedY*.34+
                rotatedZ*.92
            );

            surfaceLight=.50+light*.70;
        }

        const alpha=clamp(
            p.alpha*
            gain*
            twinkle*
            depthLight*
            surfaceLight*
            (1+state.flash*.55)
        );

        const size=
            p.size*
            (.84+.16*state.zoom)*
            clamp(q.k,.76,1.27);

        ctx.globalAlpha=alpha;

        ctx.fillRect(
            q.x-size*.5,
            q.y-size*.5,
            size,
            size
        );

        if(p.hot){
            const sprite=
                kind==="core"
                    ?glowWhite
                    :glowPink;

            const diameter=
                size*
                rndFrame(p.phase,4.8,8.2)*
                (1+state.flash*.36);

            ctx.globalAlpha=
                alpha*
                (kind==="core"?.42:.31);

            ctx.drawImage(
                sprite,
                q.x-diameter*.5,
                q.y-diameter*.5,
                diameter,
                diameter
            );
        }
    }
}

function drawFlowStreaks(state,seconds,centerY){
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.beginPath();

    for(let i=0;i<shell.length;i+=27){
        const p=shell[i];
        const u=p.u+seconds*p.flow;

        let c=sampleCurve(u);

        const wave=
            Math.sin(
                seconds*(1.05+p.twinkle*.11)+
                p.phase
            );

        const offset=
            p.offset+
            wave*p.wobble;

        const x=
            c.x+
            p.jx+
            c.nx*offset;

        const y=
            c.y+
            p.jy+
            c.ny*offset;

        const a=projectHeart(
            x,
            y,
            p.z+wave*p.zWobble,
            state,
            centerY
        );

        const ax=a.x;
        const ay=a.y;

        c=sampleCurve(
            u-
            .0045-
            rndFrame(p.phase,.001,.004)
        );

        const b=projectHeart(
            c.x+p.jx+c.nx*offset,
            c.y+p.jy+c.ny*offset,
            p.z,
            state,
            centerY
        );

        ctx.moveTo(b.x,b.y);
        ctx.lineTo(ax,ay);
    }

    ctx.globalAlpha=.28+state.flash*.18;
    ctx.strokeStyle="#f3d8d5";
    ctx.lineWidth=.72;
    ctx.lineCap="round";
    ctx.shadowColor="#b96184";
    ctx.shadowBlur=6;
    ctx.stroke();

    ctx.restore();
}

function drawSparkles(list,kind,state,seconds,centerY,step){
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.fillStyle="#fff7ef";

    for(let i=0;i<list.length;i+=step){
        const p=list[i];
        if(!p.hot)continue;

        const c=sampleCurve(
            p.u+
            seconds*p.flow
        );

        const wave=
            Math.sin(
                seconds*(1.05+p.twinkle*.11)+
                p.phase
            );

        let x;
        let y;
        let z;

        if(kind==="lower"||kind==="shell"){
            x=c.x+p.jx+c.nx*p.offset;
            y=c.y+p.jy+c.ny*p.offset;
            z=p.z+wave*p.zWobble;
        }else{
            const offset=
                p.offset+
                wave*p.wobble;

            const shapeScale=p.shapeScale||1;

            x=
                c.x*shapeScale+
                c.nx*offset;

            y=
                (c.y+.055)*shapeScale-
                .055+
                c.ny*offset;

            z=
                p.z+
                wave*p.zWobble;
        }

        const q=projectHeart(
            x,
            y,
            z,
            state,
            centerY
        );

        const twinkle=
            Math.pow(
                .5+
                .5*Math.sin(
                    seconds*p.twinkle+
                    p.phase
                ),
                5
            );

        if(twinkle<.12)continue;

        const length=
            (2.8+p.size*2.4)*
            (.55+twinkle)*
            (1+state.flash*.28);

        ctx.globalAlpha=clamp(
            p.alpha*
            (.22+.62*twinkle)
        );

        ctx.fillRect(
            q.x-length*.5,
            q.y-.28,
            length,
            .56
        );

        ctx.fillRect(
            q.x-.28,
            q.y-length*.5,
            .56,
            length
        );
    }

    ctx.restore();
}

function rndFrame(seed,a,b){
    return(
        a+
        (b-a)*
        (.5+.5*Math.sin(seed*12.9898))
    );
}

function drawDebris(state,centerY){
    if(state.burst<=.002)return;

    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.fillStyle="#d99aaa";

    for(const p of debris){
        const q=clamp(
            (state.burstProgress-p.delay)/
            (1-p.delay)
        );

        if(q<=0)continue;

        const travel=
            1-Math.pow(1-q,2.25);

        const distance=
            heartUnit*
            state.zoom*
            (p.start+p.speed*travel);

        const angle=
            p.angle+
            p.curve*q;

        const x=
            centerX+
            Math.cos(angle)*distance;

        const y=
            centerY+
            Math.sin(angle)*distance;

        const fade=
            state.burst*
            (1-q*.58);

        ctx.globalAlpha=p.alpha*fade;

        ctx.fillRect(
            x-p.size*.5,
            y-p.size*.5,
            p.size,
            p.size
        );

        if(p.hot){
            const d=p.size*5.5;

            ctx.globalAlpha=
                p.alpha*
                fade*
                .24;

            ctx.drawImage(
                glowPink,
                x-d*.5,
                y-d*.5,
                d,
                d
            );
        }
    }

    ctx.restore();
}

function drawVignette(){
    ctx.globalCompositeOperation="source-over";
    ctx.globalAlpha=1;
    ctx.fillStyle=vignetteGradient;
    ctx.fillRect(0,0,W,H);
}

function render(now){
    const delta=Math.min(
        .080,
        Math.max(
            0,
            (now-lastFrameTime)/1000
        )
    );

    lastFrameTime=now;
    animationTime+=delta;

    const seconds=animationTime;
    const state=sceneState(seconds);

    drawBackground(seconds);

    const centerY=
        floorY-
        heartUnit*
        state.zoom*
        1.045;

    drawAtmosphere(state,seconds,centerY);
    drawFloor(state,seconds);
    drawStem(state,seconds);
    drawRays(state,centerY);
    drawFlare(state,centerY,false);
    drawLensFlare(state,centerY);

    if(state.ring>.002){
        buildRibbonFrame(state,seconds,centerY);
    }

    drawOrbit(false,state,seconds,centerY);
    drawHeartTrace(state,centerY);
    drawFlowStreaks(state,seconds,centerY);

    ctx.save();
    ctx.globalCompositeOperation="lighter";

    drawHeartParticles(
        dust,
        "dust",
        state,
        seconds,
        centerY,
        "#b9aec8",
        .90
    );

    drawHeartParticles(
        lower,
        "lower",
        state,
        seconds,
        centerY,
        "#dda0af",
        1.08
    );

    drawHeartParticles(
        inside,
        "inside",
        state,
        seconds,
        centerY,
        "#e8bdc2",
        1.03
    );

    drawHeartParticles(
        shell,
        "shell",
        state,
        seconds,
        centerY,
        "#d88ea4",
        1.15
    );

    drawHeartParticles(
        core,
        "core",
        state,
        seconds,
        centerY,
        "#fff0e8",
        1.25
    );

    ctx.restore();

    drawSparkles(
        shell,
        "shell",
        state,
        seconds,
        centerY,
        5
    );

    drawSparkles(
        core,
        "core",
        state,
        seconds,
        centerY,
        3
    );

    drawSparkles(
        lower,
        "lower",
        state,
        seconds,
        centerY,
        4
    );

    drawOrbit(true,state,seconds,centerY);
    drawDebris(state,centerY);
    drawFlare(state,centerY,true);
    drawVignette();

    requestAnimationFrame(render);
}

buildCurve();

glowPink=makeGlow(
    64,
    "rgba(255,239,233,.96)",
    "rgba(184,85,120,.36)"
);

glowWhite=makeGlow(
    64,
    "rgba(255,252,246,.98)",
    "rgba(220,176,174,.44)"
);

addEventListener(
    "resize",
    resize,
    {passive:true}
);

document.addEventListener(
    "visibilitychange",
    ()=>{
        lastFrameTime=performance.now();
    },
    {passive:true}
);

resize();
requestAnimationFrame(render);
})();
</script>
</body>
</html>
