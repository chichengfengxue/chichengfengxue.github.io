<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08070e">
<title>Love · 3D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#08070e}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="love"></canvas>

<script>
(()=>{
"use strict";

let canvas=document.getElementById("love");
const ctx=canvas.getContext("2d",{alpha:false});
const TAU=Math.PI*2;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const fract=v=>v-Math.floor(v);

const ease=v=>{
    v=clamp(v);
    return v*v*v*(v*(v*6-15)+10);
};

const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

let seed=0x249fad;

function random(){
    seed|=0;
    seed=seed+0x6D2B79F5|0;

    let t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;

    return((t^t>>>14)>>>0)/4294967296;
}

const rand=(a,b)=>a+(b-a)*random();
const gauss=()=>random()+random()+random()+random()-2;

const palette=[
    "#ff5fa9",
    "#ff82bd",
    "#ffadd5",
    "#ffe0ee",
    "#d88bc8"
];

const sprites=palette.map(color=>{
    const c=document.createElement("canvas");
    c.width=c.height=40;

    const g=c.getContext("2d");
    const r=g.createRadialGradient(20,20,0,20,20,20);

    r.addColorStop(0,"#fff7fb");
    r.addColorStop(.06,"#ffd6eb");
    r.addColorStop(.22,color);
    r.addColorStop(.46,color+"ee");
    r.addColorStop(.64,color+"7a");
    r.addColorStop(.82,color+"10");
    r.addColorStop(1,color+"00");

    g.fillStyle=r;
    g.fillRect(0,0,40,40);

    return c;
});

const gpu=(()=>{
    const layer=document.createElement("canvas");
    let gl;

    try{
        gl=layer.getContext("webgl",{
            alpha:false,
            antialias:true,
            powerPreference:"high-performance"
        });
    }catch(e){
        return null;
    }

    if(!gl)return null;

    function createProgram(vsSource,fsSource){
        const program=gl.createProgram();

        for(const [type,source] of [
            [gl.VERTEX_SHADER,vsSource],
            [gl.FRAGMENT_SHADER,fsSource]
        ]){
            const shader=gl.createShader(type);

            gl.shaderSource(shader,source);
            gl.compileShader(shader);

            if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS)){
                throw new Error(gl.getShaderInfoLog(shader));
            }

            gl.attachShader(program,shader);
            gl.deleteShader(shader);
        }

        gl.linkProgram(program);

        if(!gl.getProgramParameter(program,gl.LINK_STATUS)){
            throw new Error(gl.getProgramInfoLog(program));
        }

        return program;
    }

    try{
        const pointProgram=createProgram(`
            attribute vec4 a_point;
            attribute float a_alpha;

            uniform vec2 u_size;
            uniform float u_dpr;

            varying mediump float v_index;
            varying mediump float v_alpha;

            void main(){
                gl_Position=vec4(
                    a_point.xy/u_size*vec2(2.0,-2.0)+vec2(-1.0,1.0),
                    0.0,
                    1.0
                );

                gl_PointSize=a_point.z*u_dpr;
                v_index=a_point.w;
                v_alpha=a_alpha;
            }
        `,`
            precision mediump float;

            uniform sampler2D u_atlas;

            varying mediump float v_index;
            varying mediump float v_alpha;

            void main(){
                vec4 color=texture2D(
                    u_atlas,
                    vec2(
                        (gl_PointCoord.x+v_index)/5.0,
                        gl_PointCoord.y
                    )
                );

                gl_FragColor=vec4(color.rgb,color.a*v_alpha);
            }
        `);

        const lineProgram=createProgram(`
            attribute vec2 a_xy;
            attribute vec4 a_color;

            uniform vec2 u_size;

            varying mediump vec4 v_color;

            void main(){
                gl_Position=vec4(
                    a_xy/u_size*vec2(2.0,-2.0)+vec2(-1.0,1.0),
                    0.0,
                    1.0
                );

                v_color=a_color;
            }
        `,`
            precision mediump float;

            varying mediump vec4 v_color;

            void main(){
                gl_FragColor=v_color;
            }
        `);

        const backgroundProgram=createProgram(`
            attribute vec2 a_xy;

            void main(){
                gl_Position=vec4(a_xy,0.0,1.0);
            }
        `,`
            precision mediump float;

            uniform vec2 u_size;
            uniform vec2 u_center;
            uniform float u_dpr;

            void main(){
                vec2 point=vec2(
                    gl_FragCoord.x/u_dpr,
                    u_size.y-gl_FragCoord.y/u_dpr
                );

                float radius=clamp(
                    length(point-u_center)/
                    (max(u_size.x,u_size.y)*0.69),
                    0.0,
                    1.0
                );

                vec3 inner=vec3(36.0,24.0,42.0)/255.0;
                vec3 middle=vec3(17.0,13.0,25.0)/255.0;
                vec3 outer=vec3(3.0,4.0,8.0)/255.0;

                vec3 color=radius<0.38
                    ?mix(inner,middle,radius/0.38)
                    :mix(middle,outer,(radius-0.38)/0.62);

                gl_FragColor=vec4(color,1.0);
            }
        `);

        const atlas=document.createElement("canvas");
        atlas.width=200;
        atlas.height=40;

        const atlasCtx=atlas.getContext("2d");

        sprites.forEach((sprite,index)=>{
            atlasCtx.drawImage(sprite,index*40,0);
        });

        const texture=gl.createTexture();

        gl.bindTexture(gl.TEXTURE_2D,texture);
        gl.texParameteri(
            gl.TEXTURE_2D,
            gl.TEXTURE_MIN_FILTER,
            gl.LINEAR
        );
        gl.texParameteri(
            gl.TEXTURE_2D,
            gl.TEXTURE_MAG_FILTER,
            gl.LINEAR
        );
        gl.texParameteri(
            gl.TEXTURE_2D,
            gl.TEXTURE_WRAP_S,
            gl.CLAMP_TO_EDGE
        );
        gl.texParameteri(
            gl.TEXTURE_2D,
            gl.TEXTURE_WRAP_T,
            gl.CLAMP_TO_EDGE
        );
        gl.texImage2D(
            gl.TEXTURE_2D,
            0,
            gl.RGBA,
            gl.RGBA,
            gl.UNSIGNED_BYTE,
            atlas
        );

        const pointBuffer=gl.createBuffer();
        const lineBuffer=gl.createBuffer();
        const backgroundBuffer=gl.createBuffer();

        gl.bindBuffer(gl.ARRAY_BUFFER,backgroundBuffer);
        gl.bufferData(
            gl.ARRAY_BUFFER,
            new Float32Array([-1,-1,3,-1,-1,3]),
            gl.STATIC_DRAW
        );

        const pointData=new Float32Array(40000*5);
        const lineData=new Float32Array(36000*6);

        let pointLength=0;
        let lineLength=0;

        const colorCache=new Map();

        function attribute(program,name,size,stride,offset){
            const location=gl.getAttribLocation(program,name);

            gl.enableVertexAttribArray(location);
            gl.vertexAttribPointer(
                location,
                size,
                gl.FLOAT,
                false,
                stride,
                offset
            );

            return location;
        }

        function uniform(program,name,...values){
            const location=gl.getUniformLocation(program,name);

            if(values.length===2){
                gl.uniform2f(location,...values);
            }else{
                gl.uniform1f(location,values[0]);
            }
        }

        function flush(){
            if(lineLength){
                gl.useProgram(lineProgram);
                gl.bindBuffer(gl.ARRAY_BUFFER,lineBuffer);
                gl.bufferData(
                    gl.ARRAY_BUFFER,
                    lineData.subarray(0,lineLength),
                    gl.DYNAMIC_DRAW
                );

                const xy=attribute(
                    lineProgram,
                    "a_xy",
                    2,
                    24,
                    0
                );

                const color=attribute(
                    lineProgram,
                    "a_color",
                    4,
                    24,
                    8
                );

                uniform(lineProgram,"u_size",W,H);

                gl.drawArrays(
                    gl.TRIANGLES,
                    0,
                    lineLength/6
                );

                gl.disableVertexAttribArray(xy);
                gl.disableVertexAttribArray(color);

                lineLength=0;
            }

            if(pointLength){
                gl.useProgram(pointProgram);
                gl.bindBuffer(gl.ARRAY_BUFFER,pointBuffer);
                gl.bufferData(
                    gl.ARRAY_BUFFER,
                    pointData.subarray(0,pointLength),
                    gl.DYNAMIC_DRAW
                );

                const point=attribute(
                    pointProgram,
                    "a_point",
                    4,
                    20,
                    0
                );

                const alpha=attribute(
                    pointProgram,
                    "a_alpha",
                    1,
                    20,
                    16
                );

                uniform(pointProgram,"u_size",W,H);
                uniform(pointProgram,"u_dpr",DPR);

                gl.drawArrays(
                    gl.POINTS,
                    0,
                    pointLength/5
                );

                gl.disableVertexAttribArray(point);
                gl.disableVertexAttribArray(alpha);

                pointLength=0;
            }
        }

        layer.id="love";
        canvas.replaceWith(layer);
        canvas=layer;

        return{
            begin(){
                pointLength=0;
                lineLength=0;

                gl.viewport(0,0,canvas.width,canvas.height);
                gl.disable(gl.BLEND);

                gl.useProgram(backgroundProgram);
                gl.bindBuffer(
                    gl.ARRAY_BUFFER,
                    backgroundBuffer
                );

                const position=attribute(
                    backgroundProgram,
                    "a_xy",
                    2,
                    0,
                    0
                );

                uniform(backgroundProgram,"u_size",W,H);
                uniform(backgroundProgram,"u_center",CX,CY);
                uniform(backgroundProgram,"u_dpr",DPR);

                gl.drawArrays(gl.TRIANGLES,0,3);
                gl.disableVertexAttribArray(position);

                gl.enable(gl.BLEND);
                gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
            },

            dot(x,y,size,alpha,color){
                if(pointLength+5>pointData.length)return;

                pointData[pointLength++]=x;
                pointData[pointLength++]=y;
                pointData[pointLength++]=Math.max(
                    1.5,
                    size*4.6
                );
                pointData[pointLength++]=color;
                pointData[pointLength++]=clamp(alpha);
            },

            line(x1,y1,x2,y2,width,alpha,color){
                if(lineLength+36>lineData.length)return;

                let rgb=colorCache.get(color);

                if(!rgb){
                    rgb=[1,3,5].map(
                        i=>parseInt(
                            color.slice(i,i+2),
                            16
                        )/255
                    );

                    colorCache.set(color,rgb);
                }

                const length=Math.hypot(
                    x2-x1,
                    y2-y1
                )||1;

                const dx=-(y2-y1)/length*width/2;
                const dy=(x2-x1)/length*width/2;

                function vertex(x,y){
                    lineData[lineLength++]=x;
                    lineData[lineLength++]=y;
                    lineData[lineLength++]=rgb[0];
                    lineData[lineLength++]=rgb[1];
                    lineData[lineLength++]=rgb[2];
                    lineData[lineLength++]=clamp(alpha);
                }

                vertex(x1+dx,y1+dy);
                vertex(x1-dx,y1-dy);
                vertex(x2+dx,y2+dy);

                vertex(x2+dx,y2+dy);
                vertex(x1-dx,y1-dy);
                vertex(x2-dx,y2-dy);
            },

            flush,
            end:flush
        };
    }catch(e){
        console.warn("Canvas fallback",e);
        return null;
    }
})();

function stroke(x1,y1,x2,y2,width,alpha,color){
    if(alpha<.003)return;

    if(gpu){
        gpu.line(
            x1,y1,x2,y2,
            width,alpha,color
        );
        return;
    }

    ctx.globalAlpha=clamp(alpha);
    ctx.lineWidth=width;
    ctx.strokeStyle=color;
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.stroke();
}

function heart(t){
    const sin=Math.sin(t);

    return{
        x:sin*sin*sin,
        y:(
            13*Math.cos(t)
            -5*Math.cos(2*t)
            -2*Math.cos(3*t)
            -Math.cos(4*t)
            +2.5
        )/15.4
    };
}

const GRID=137;
const SPAN=2.18;
const MIN=-SPAN/2;
const STEP=SPAN/(GRID-1);

const field=new Float32Array(GRID*GRID);

const boundary=Array.from(
    {length:1200},
    (_,i)=>heart(i/1200*TAU)
);

const interior=[];

for(let row=1;row<GRID-1;row++){
    const y=MIN+row*STEP;
    const intersections=[];

    for(let i=0;i<boundary.length;i++){
        const a=boundary[i];
        const b=boundary[(i+1)%boundary.length];

        if((a.y>y)!==(b.y>y)){
            intersections.push(
                a.x+
                (y-a.y)*(b.x-a.x)/(b.y-a.y)
            );
        }
    }

    intersections.sort((a,b)=>a-b);

    for(
        let pair=0;
        pair+1<intersections.length;
        pair+=2
    ){
        for(let column=1;column<GRID-1;column++){
            const x=MIN+column*STEP;

            if(
                x>intersections[pair]&&
                x<intersections[pair+1]
            ){
                interior.push(row*GRID+column);
            }
        }
    }
}

for(let pass=0;pass<460;pass++){
    for(const index of interior){
        const next=(
            field[index-1]+
            field[index+1]+
            field[index-GRID]+
            field[index+GRID]+
            STEP*STEP
        )*.25;

        field[index]+=1.78*(next-field[index]);
    }
}

let fieldMax=0;

for(const index of interior){
    fieldMax=Math.max(fieldMax,field[index]);
}

for(const index of interior){
    field[index]=.37*Math.sqrt(
        Math.max(0,field[index])/fieldMax
    );
}

function height(x,y){
    const fx=(x-MIN)/STEP;
    const fy=(y-MIN)/STEP;

    const column=Math.floor(fx);
    const row=Math.floor(fy);

    if(
        column<0||
        row<0||
        column>=GRID-1||
        row>=GRID-1
    ){
        return 0;
    }

    const u=fx-column;
    const v=fy-row;
    const index=row*GRID+column;

    return lerp(
        lerp(
            field[index],
            field[index+1],
            u
        ),
        lerp(
            field[index+GRID],
            field[index+GRID+1],
            u
        ),
        v
    );
}

function surface(x,y,side){
    const h=height(x,y);
    const offset=STEP*.65;

    const dx=(
        height(x+offset,y)-
        height(x-offset,y)
    )/(offset*2);

    const dy=(
        height(x,y+offset)-
        height(x,y-offset)
    )/(offset*2);

    const normalScale=1/Math.hypot(dx,dy,1);

    return{
        x,
        y,
        z:h*side,
        nx:-dx*normalScale,
        ny:-dy*normalScale,
        nz:side*normalScale
    };
}

let W=0;
let H=0;
let DPR=1;

let S=1;
let CX=0;
let CY=0;
let FY=0;
let FR=1;

let heartDots=[];
let petals=[];
let stars=[];
let bursts=[];

let profile="";
let background=null;

const buckets=Array.from(
    {length:24},
    ()=>[]
);

const state={};

function makeHeart(mobile){
    seed=0x249fad;
    heartDots=[];

    const count=mobile?7600:15200;

    while(heartDots.length<count){
        const index=interior[
            Math.floor(random()*interior.length)
        ];

        const x=MIN+(
            index%GRID+
            rand(-.48,.48)
        )*STEP;

        const y=MIN+(
            Math.floor(index/GRID)+
            rand(-.48,.48)
        )*STEP;

        const h=height(x,y);

        if(h<.007)continue;

        const density=
            .24+
            .76*Math.pow(
                1-clamp(h/.37),
                2
            );

        if(random()>density)continue;

        const point=surface(
            x,y,
            random()<.5?-1:1
        );

        if(
            random()>
            Math.min(
                1,
                .30/Math.max(
                    .08,
                    Math.abs(point.nz)
                )
            )
        ){
            continue;
        }

        const dust=random()<.19;
        const volume=!dust&&random()<.10;

        const displacement=dust
            ?rand(.02,.115)
            :gauss()*.009;

        point.x+=point.nx*displacement;
        point.y+=point.ny*displacement;
        point.z+=point.nz*displacement;

        if(volume){
            point.z*=rand(.08,.90);
        }

        Object.assign(point,{
            kind:volume?2:dust?1:0,

            size:random()<.065
                ?rand(1.35,1.95)
                :rand(.55,1.32),

            alpha:rand(.55,.98),
            phase:rand(0,TAU),
            speed:rand(.75,1.65),

            color:random()<.05
                ?3
                :random()<.72
                    ?1
                    :random()<.88
                        ?2
                        :0,

            hot:random()<.015,

            px:0,
            py:0,
            screenSize:1,
            opacity:0,
            tint:0
        });

        heartDots.push(point);
    }
}

function makeScene(mobile){
    makeHeart(mobile);

    petals=[];
    stars=[];
    bursts=[];

    for(let layer=0;layer<2;layer++){
        const count=layer?18:30;
        const steps=mobile?34:58;

        for(let petal=0;petal<count;petal++){
            for(let side=-1;side<=1;side+=2){
                for(let i=0;i<steps;i++){
                    petals.push({
                        layer,
                        petal,
                        count,
                        side,
                        u:(i+.5)/steps,
                        phase:rand(0,TAU),
                        size:rand(.48,1),
                        alpha:rand(.4,.86)
                    });
                }
            }
        }
    }

    for(let i=0;i<(mobile?90:170);i++){
        stars.push({
            x:random(),
            y:random(),
            alpha:rand(.03,.23),
            size:rand(.4,1.2),
            phase:rand(0,TAU)
        });
    }

    for(let i=0;i<(mobile?150:250);i++){
        bursts.push({
            angle:rand(0,TAU),
            radius:rand(.3,.95),
            speed:rand(.65,2.2),
            brightness:random(),
            size:rand(.5,1.3)
        });
    }
}

function resize(){
    W=innerWidth;
    H=innerHeight;
    DPR=Math.min(devicePixelRatio||1,1.6);

    canvas.width=Math.round(W*DPR);
    canvas.height=Math.round(H*DPR);

    ctx.setTransform(DPR,0,0,DPR,0,0);

    CX=W/2;
    FY=H*(W<700?.64:.76);

    S=Math.min(
        W*(W<700?.34:.32),
        H*(W<700?.235:.30),
        300
    );

    CY=FY-S*1.12;
    FR=Math.min(W*.455,S*1.85);

    background=ctx.createRadialGradient(
        CX,CY,0,
        CX,CY,
        Math.max(W,H)*.69
    );

    background.addColorStop(0,"#24182a");
    background.addColorStop(.38,"#110d19");
    background.addColorStop(1,"#030408");

    const nextProfile=W<700?"mobile":"desktop";

    if(nextProfile!==profile){
        profile=nextProfile;
        makeScene(profile==="mobile");
    }
}

function scene(time){
    const local=time%15;

    let yaw=0;
    let zoom=1;

    if(local<4.4){
        yaw=TAU*ease(local/4.4);
    }else if(local<8.5){
        yaw=
            TAU+
            .10*Math.sin((local-4.4)*.9)*
            Math.sin((local-4.4)/4.1*Math.PI);
    }else{
        yaw=
            TAU+
            TAU*ease((local-8.5)/6.5);
    }

    if(local>7.6&&local<9){
        zoom=lerp(
            1,
            .77,
            ease((local-7.6)/1.4)
        );
    }else if(local>=9&&local<11.2){
        zoom=.77;
    }else if(local>=11.2){
        zoom=lerp(
            .77,
            1,
            ease((local-11.2)/2.2)
        );
    }

    if(reduce){
        yaw=.25;
        zoom=1;
    }

    const pitch=
        -.055+
        .038*Math.sin(time*.37);

    const roll=
        .022*Math.sin(time*.28);

    Object.assign(state,{
        yaw,
        zoom,

        cosYaw:Math.cos(yaw),
        sinYaw:Math.sin(yaw),

        cosPitch:Math.cos(pitch),
        sinPitch:Math.sin(pitch),

        cosRoll:Math.cos(roll),
        sinRoll:Math.sin(roll),

        ring:
            1-
            .86*
            ease((local-4)/.8)*
            (1-ease((local-8.8)/.9)),

        burst:
            !reduce&&local>4.05&&local<6.25
                ?(local-4.05)/2.2
                :-1
    });

    return state;
}

function rotate(x,y,z,state,out){
    const yawX=
        x*state.cosYaw+
        z*state.sinYaw;

    const yawZ=
        -x*state.sinYaw+
        z*state.cosYaw;

    const pitchY=
        y*state.cosPitch-
        yawZ*state.sinPitch;

    const pitchZ=
        y*state.sinPitch+
        yawZ*state.cosPitch;

    out[0]=
        yawX*state.cosRoll-
        pitchY*state.sinRoll;

    out[1]=
        yawX*state.sinRoll+
        pitchY*state.cosRoll;

    out[2]=pitchZ;
}

const position=new Float32Array(3);
const normal=new Float32Array(3);

function prepareHeart(time,state){
    for(const bucket of buckets){
        bucket.length=0;
    }

    const centerY=
        FY-
        S*(.18+.94*state.zoom);

    for(const point of heartDots){
        const normalDrift=
            .006*Math.sin(
                time*.86+
                point.phase
            );

        const wanderX=
            .0038*Math.sin(
                time*point.speed*.55+
                point.phase*1.7
            );

        const wanderY=
            .0038*Math.cos(
                time*point.speed*.47+
                point.phase*1.3
            );

        rotate(
            point.x+
                point.nx*normalDrift+
                wanderX,

            point.y+
                point.ny*normalDrift+
                wanderY,

            point.z+
                point.nz*normalDrift,

            state,
            position
        );

        rotate(
            point.nx,
            point.ny,
            point.nz,
            state,
            normal
        );

        const perspective=
            5.5/(5.5-position[2]);

        const normalZ=normal[2];

        const rim=Math.pow(
            1-Math.abs(normalZ),
            .62
        );

        const lighting=Math.max(
            0,
            -normal[0]*.36+
            normal[1]*.48+
            normalZ*.8
        );

        const facing=
            .42+
            .58*ease(
                (normalZ+.15)/.3
            );

        let alpha=(
            .028+
            1.72*rim+
            .08*lighting
        )*facing;

        if(point.kind===1){
            alpha*=.42;
        }

        if(point.kind===2){
            alpha=.043;
        }

        const flicker=
            .74+
            .26*Math.pow(
                .5+
                .5*Math.sin(
                    time*point.speed+
                    point.phase
                ),
                3
            );

        point.opacity=clamp(
            alpha*
            point.alpha*
            flicker*
            (.82+position[2]*.16)*
            (.55+.45*Math.abs(state.cosYaw))
        );

        point.px=
            CX+
            position[0]*
            S*
            state.zoom*
            perspective;

        point.py=
            centerY-
            position[1]*
            S*
            state.zoom*
            perspective;

        point.screenSize=
            point.size*
            perspective*
            Math.max(.78,S/220)*
            state.zoom;

        point.tint=point.hot?3:point.color;

        const bucketIndex=clamp(
            Math.floor((position[2]+1.5)*8),
            0,
            23
        );

        buckets[bucketIndex].push(point);
    }
}

function dot(x,y,size,alpha,color=2){
    if(alpha<.008)return;

    if(gpu){
        gpu.dot(x,y,size,alpha,color);
        return;
    }

    const diameter=Math.max(
        1.5,
        size*4.6
    );

    ctx.globalAlpha=clamp(alpha);

    ctx.drawImage(
        sprites[color],
        x-diameter/2,
        y-diameter/2,
        diameter,
        diameter
    );
}

function drawHeart(time){
    ctx.globalCompositeOperation="lighter";

    for(const bucket of buckets){
        for(const point of bucket){
            dot(
                point.px,
                point.py,
                point.screenSize,
                point.opacity,
                point.tint
            );

            if(point.hot&&point.opacity>.15){
                const shine=Math.pow(
                    .5+
                    .5*Math.sin(
                        time*1.6+
                        point.phase
                    ),
                    14
                );

                if(shine>.22){
                    const radius=
                        point.screenSize*
                        (2.5+shine*3.5);

                    const alpha=
                        shine*
                        point.opacity*
                        .6;

                    stroke(
                        point.px-radius,
                        point.py,
                        point.px+radius,
                        point.py,
                        .6,
                        alpha,
                        "#ffedf7"
                    );

                    stroke(
                        point.px,
                        point.py-radius,
                        point.px,
                        point.py+radius,
                        .6,
                        alpha,
                        "#ffedf7"
                    );
                }
            }
        }
    }
}

function drawFlower(time){
    ctx.globalCompositeOperation="lighter";

    for(const point of petals){
        const u=point.u;
        const layer=point.layer;

        const angle=
            point.petal/point.count*TAU+
            (layer?.08:0)+
            time*(layer?-.024:.017);

        const wave=Math.sin(
            time*1.05-
            u*3.6+
            point.petal*.31+
            point.side*.55
        );

        const opening=
            1+
            .045*Math.sin(
                time*.68+
                point.petal*.27
            )+
            wave*.018;

        const radius=(
            .045+
            Math.sin(u*Math.PI/2)*
            (layer?.65:1)
        )*opening;

        const width=
            Math.pow(
                Math.sin(Math.PI*u),
                1.25
            )*
            (layer?.075:.05)*
            (1+wave*.15);

        const sideways=point.side*width;

        const curl=(
            .038*Math.sin(
                time*.58+
                point.petal*.41
            )+
            wave*.018
        )*u*u;

        const finalAngle=angle+curl;

        const x=
            Math.cos(finalAngle)*radius-
            Math.sin(finalAngle)*sideways;

        const z=
            Math.sin(finalAngle)*radius+
            Math.cos(finalAngle)*sideways;

        const lift=
            Math.sin(Math.PI*u)*
            (
                .085+
                .035*Math.sin(
                    time*.66+
                    point.petal*.41
                )+
                wave*.018
            );

        const perspective=1/(1-z*.15);

        const px=
            CX+
            x*FR*perspective;

        const py=
            FY+
            z*FR*.28*perspective-
            lift*FR*.22;

        const shimmer=
            .65+
            .35*Math.pow(
                .5+
                .5*Math.sin(
                    time*1.2+
                    point.phase
                ),
                2
            );

        dot(
            px,
            py,
            point.size*(.65+FR/520)*.83,
            point.alpha*
                shimmer*
                (.49+z*.13),
            layer?1:2
        );
    }

    for(let ring=0;ring<6;ring++){
        const radius=.035+ring*.038;
        const count=70+ring*14;

        for(let i=0;i<count;i++){
            const angle=
                i/count*TAU+
                time*(ring%2?.07:-.05);

            dot(
                CX+
                    Math.cos(angle)*
                    radius*
                    FR,

                FY+
                    Math.sin(angle)*
                    radius*
                    FR*
                    .28,

                .48,
                .38,
                3
            );
        }
    }
}

const ribbonSettings=[
    {
        turns:2.1,
        top:1.02,
        bottom:-.90,
        radius:1.18,
        tilt:.16,
        phase:.1,
        speed:.23,
        direction:1
    },
    {
        turns:1.08,
        top:.66,
        bottom:-.20,
        radius:1.26,
        tilt:-.38,
        phase:2.4,
        speed:.34,
        direction:-1
    },
    {
        turns:.87,
        top:.06,
        bottom:-.86,
        radius:1.31,
        tilt:.29,
        phase:4.1,
        speed:.28,
        direction:1
    }
];

const ribbonPoints=Array.from(
    {length:3},
    ()=>Array.from(
        {length:300},
        ()=>({
            x:0,
            y:0,
            z:0,
            u:0
        })
    )
);

function prepareRibbons(time,state){
    const centerY=
        FY-
        S*(.18+.94*state.zoom);

    for(let ribbon=0;ribbon<ribbonSettings.length;ribbon++){
        const settings=ribbonSettings[ribbon];

        for(let i=0;i<300;i++){
            const u=i/299;
            const envelope=Math.sin(Math.PI*u);

            const angle=
                u*
                TAU*
                settings.turns*
                settings.direction+
                time*settings.speed+
                settings.phase;

            const flutter=
                .12*Math.sin(
                    angle*1.7-
                    time*.9+
                    ribbon
                )+
                .046*Math.sin(
                    angle*3.1+
                    time*1.18
                );

            const radius=
                settings.radius+
                .10*Math.sin(
                    angle*1.35+
                    time*.52+
                    ribbon
                )+
                .025*Math.sin(
                    time*1.3-
                    u*11+
                    ribbon
                );

            const twist=
                angle+
                flutter*envelope+
                .07*Math.sin(
                    time*.53+
                    ribbon*1.9
                )*envelope;

            const offsetX=
                .095*Math.sin(
                    angle*.47+
                    time*.31+
                    ribbon*2.1
                )*envelope;

            const offsetZ=
                .075*Math.sin(
                    angle*.63-
                    time*.37+
                    ribbon*.8
                )*envelope;

            const x=
                offsetX+
                Math.cos(twist)*radius;

            const z=
                offsetZ+
                Math.sin(twist)*radius;

            const y=
                lerp(
                    settings.top,
                    settings.bottom,
                    u
                )+
                settings.tilt*
                    Math.sin(angle+.5)*
                    envelope+
                .09*Math.sin(
                    time*.83-
                    u*9.2+
                    ribbon*1.7
                )*envelope+
                .025*Math.sin(
                    time*1.5+
                    angle*2.3
                )*envelope;

            const perspective=
                5.5/(5.5-z);

            const point=ribbonPoints[ribbon][i];

            point.x=
                CX+
                x*
                S*
                state.zoom*
                perspective;

            point.y=
                centerY-
                y*
                S*
                state.zoom*
                perspective;

            point.z=z;
            point.u=u;
        }
    }
}

function drawRibbons(front,time,state){
    ctx.globalCompositeOperation="lighter";
    ctx.lineCap="round";

    for(let ribbon=0;ribbon<3;ribbon++){
        const points=ribbonPoints[ribbon];

        for(let i=1;i<points.length;i++){
            const previous=points[i-1];
            const current=points[i];

            if((current.z>0)!==front)continue;

            const taper=Math.pow(
                Math.sin(Math.PI*current.u),
                .45
            );

            const wave=
                .48+
                .52*Math.pow(
                    .5+
                    .5*Math.sin(
                        current.u*19-
                        time*(2+ribbon*.34)+
                        ribbon
                    ),
                    3
                );

            const alpha=
                state.ring*
                taper*
                wave*
                (front?.54:.11);

            stroke(
                previous.x,
                previous.y,
                current.x,
                current.y,
                5.2,
                alpha*.17,
                ribbon===2
                    ?"#ddbddf"
                    :"#f5b5d5"
            );

            stroke(
                previous.x,
                previous.y,
                current.x,
                current.y,
                ribbon===0?.88:.62,
                alpha,
                ribbon===1
                    ?"#ffdfeb"
                    :"#ffd5e9"
            );

            if(i%3===0){
                const sparkle=
                    .5+
                    .5*Math.sin(
                        i*12.3+
                        ribbon*7
                    );

                dot(
                    current.x+
                        Math.sin(i*17.1)*2,

                    current.y+
                        Math.cos(i*9.3)*2,

                    .45+sparkle*.35,
                    alpha*.8,
                    ribbon===2?4:2
                );
            }
        }

        for(let comet=0;comet<2;comet++){
            const head=fract(
                time*(.16+ribbon*.023)+
                comet*.5+
                ribbon*.18
            );

            for(let tail=0;tail<18;tail++){
                const u=fract(
                    head-tail*.0025
                );

                const point=points[
                    Math.min(
                        299,
                        Math.floor(u*299)
                    )
                ];

                if((point.z>0)!==front)continue;

                const alpha=
                    Math.pow(
                        1-tail/18,
                        2
                    )*
                    state.ring*
                    (front?.80:.20)*
                    Math.sin(Math.PI*u);

                dot(
                    point.x,
                    point.y,
                    .75+
                        (1-tail/18)*.65,
                    alpha,
                    3
                );
            }
        }
    }
}

function drawBurst(state){
    if(state.burst<0)return;

    const progress=state.burst;

    const fade=
        Math.sin(Math.PI*progress)*
        Math.pow(1-progress,.6);

    const centerY=
        FY-
        S*(.18+.94*state.zoom);

    for(const particle of bursts){
        const radius=(
            particle.radius+
            progress*
            particle.speed*
            2.3
        )*S;

        const tail=
            radius-
            (.025+.10*(1-progress))*S;

        const cos=Math.cos(particle.angle);
        const sin=Math.sin(particle.angle);

        stroke(
            CX+cos*tail,
            centerY+sin*tail,
            CX+cos*radius,
            centerY+sin*radius,
            .7,
            fade*(
                .16+
                particle.brightness*.22
            ),
            particle.brightness>.75
                ?"#ffe7f0"
                :"#f1a6cc"
        );

        dot(
            CX+cos*radius,
            centerY+sin*radius,
            particle.size,
            fade*.38,
            2
        );
    }
}

let seconds=0;
let last=performance.now();

function render(now){
    const delta=Math.min(
        .05,
        Math.max(0,(now-last)/1000)
    );

    last=now;

    if(!document.hidden){
        seconds+=delta;
    }

    const time=reduce?5.7:seconds;
    const currentState=scene(time);

    if(gpu){
        gpu.begin();
    }else{
        ctx.globalCompositeOperation="source-over";
        ctx.globalAlpha=1;
        ctx.fillStyle=background;
        ctx.fillRect(0,0,W,H);
    }

    for(const star of stars){
        dot(
            star.x*W,
            star.y*H,
            star.size,
            star.alpha*(
                .6+
                .4*Math.sin(
                    time*.45+
                    star.phase
                )**2
            ),
            4
        );
    }

    drawFlower(time);

    if(gpu)gpu.flush();

    prepareRibbons(time,currentState);
    drawRibbons(false,time,currentState);

    if(gpu)gpu.flush();

    drawBurst(currentState);

    if(gpu)gpu.flush();

    prepareHeart(time,currentState);
    drawHeart(time);

    if(gpu)gpu.flush();

    drawRibbons(true,time,currentState);

    if(gpu)gpu.end();

    ctx.globalAlpha=1;
    ctx.globalCompositeOperation="source-over";

    requestAnimationFrame(render);
}

addEventListener("resize",resize,{passive:true});

document.addEventListener("visibilitychange",()=>{
    last=performance.now();
});

resize();
requestAnimationFrame(render);

})();
</script>
</body>
</html>
