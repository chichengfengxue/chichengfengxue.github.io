<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08070e">
<title>Love · 3D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#08070e}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="love" aria-label="旋转的粉色粒子爱心与花瓣"></canvas>

<script>
(()=>{
"use strict";

let canvas=document.getElementById("love");
const ctx=canvas.getContext("2d",{alpha:false});
const TAU=Math.PI*2;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const fract=v=>v-Math.floor(v);
const ease=v=>{
    v=clamp(v);
    return v*v*v*(v*(v*6-15)+10);
};

const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const query=new URLSearchParams(location.search);
const still=query.has("still")?Number(query.get("still")):null;
const fixedYaw=query.has("angle")?Number(query.get("angle")):null;

let seed=0x249fad;

function random(){
    seed|=0;
    seed=seed+0x6D2B79F5|0;
    let t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
}

const rand=(a,b)=>a+(b-a)*random();
const gauss=()=>random()+random()+random()+random()-2;

const palette=[
    "#e78cb6",
    "#f3afd0",
    "#ffcee5",
    "#fff0f5",
    "#c6addb"
];

const sprites=palette.map(color=>{
    const c=document.createElement("canvas");
    c.width=c.height=40;

    const g=c.getContext("2d");
    const r=g.createRadialGradient(20,20,0,20,20,20);

    r.addColorStop(0,"#fff8fb");
    r.addColorStop(.14,color);
    r.addColorStop(.34,color+"e6");
    r.addColorStop(.55,color+"28");
    r.addColorStop(1,color+"00");

    g.fillStyle=r;
    g.fillRect(0,0,40,40);

    return c;
});

/* GPU 批量绘制；不支持 WebGL 时回退到 Canvas。 */
const gpu=(()=>{
    const layer=document.createElement("canvas");
    let gl;

    try{
        gl=layer.getContext("webgl",{
            alpha:false,
            antialias:true,
            powerPreference:"high-performance"
        });
    }catch(e){
        return null;
    }

    if(!gl)return null;

    function program(vs,fs){
        const p=gl.createProgram();

        for(const [type,source] of [
            [gl.VERTEX_SHADER,vs],
            [gl.FRAGMENT_SHADER,fs]
        ]){
            const s=gl.createShader(type);
            gl.shaderSource(s,source);
            gl.compileShader(s);

            if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
                throw Error(gl.getShaderInfoLog(s));
            }

            gl.attachShader(p,s);
            gl.deleteShader(s);
        }

        gl.linkProgram(p);

        if(!gl.getProgramParameter(p,gl.LINK_STATUS)){
            throw Error(gl.getProgramInfoLog(p));
        }

        return p;
    }

    try{
        const point=program(`
            attribute vec4 a_point;
            attribute float a_alpha;

            uniform vec2 u_size;
            uniform float u_dpr;

            varying mediump float v_index;
            varying mediump float v_alpha;

            void main(){
                gl_Position=vec4(
                    a_point.xy/u_size*vec2(2.,-2.)+vec2(-1.,1.),
                    0.,
                    1.
                );
                gl_PointSize=a_point.z*u_dpr;
                v_index=a_point.w;
                v_alpha=a_alpha;
            }
        `,`
            precision mediump float;

            uniform sampler2D u_atlas;

            varying mediump float v_index;
            varying mediump float v_alpha;

            void main(){
                vec4 c=texture2D(
                    u_atlas,
                    vec2(
                        (gl_PointCoord.x+v_index)/5.,
                        gl_PointCoord.y
                    )
                );
                gl_FragColor=vec4(c.rgb,c.a*v_alpha);
            }
        `);

        const line=program(`
            attribute vec2 a_xy;
            attribute vec4 a_color;

            uniform vec2 u_size;
            varying mediump vec4 v_color;

            void main(){
                gl_Position=vec4(
                    a_xy/u_size*vec2(2.,-2.)+vec2(-1.,1.),
                    0.,
                    1.
                );
                v_color=a_color;
            }
        `,`
            precision mediump float;
            varying mediump vec4 v_color;

            void main(){
                gl_FragColor=v_color;
            }
        `);

        const bg=program(`
            attribute vec2 a_xy;

            void main(){
                gl_Position=vec4(a_xy,0.,1.);
            }
        `,`
            precision mediump float;

            uniform vec2 u_size;
            uniform vec2 u_center;
            uniform float u_dpr;

            void main(){
                vec2 p=vec2(
                    gl_FragCoord.x/u_dpr,
                    u_size.y-gl_FragCoord.y/u_dpr
                );

                float r=clamp(
                    length(p-u_center)/(max(u_size.x,u_size.y)*.69),
                    0.,
                    1.
                );

                vec3 a=vec3(32.,23.,40.)/255.;
                vec3 b=vec3(16.,14.,25.)/255.;
                vec3 c=vec3(3.,4.,8.)/255.;

                gl_FragColor=vec4(
                    r<.38
                        ?mix(a,b,r/.38)
                        :mix(b,c,(r-.38)/.62),
                    1.
                );
            }
        `);

        const atlas=document.createElement("canvas");
        atlas.width=200;
        atlas.height=40;

        const ac=atlas.getContext("2d");
        sprites.forEach((s,i)=>ac.drawImage(s,i*40,0));

        const texture=gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D,texture);
        gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
        gl.texImage2D(
            gl.TEXTURE_2D,0,gl.RGBA,
            gl.RGBA,gl.UNSIGNED_BYTE,atlas
        );

        const pb=gl.createBuffer();
        const lb=gl.createBuffer();
        const bb=gl.createBuffer();

        gl.bindBuffer(gl.ARRAY_BUFFER,bb);
        gl.bufferData(
            gl.ARRAY_BUFFER,
            new Float32Array([-1,-1,3,-1,-1,3]),
            gl.STATIC_DRAW
        );

        const points=new Float32Array(40000*5);
        const lines=new Float32Array(36000*6);

        let pn=0;
        let ln=0;

        const colors=new Map();

        const attribute=(p,name,n,stride,offset)=>{
            const a=gl.getAttribLocation(p,name);
            gl.enableVertexAttribArray(a);
            gl.vertexAttribPointer(a,n,gl.FLOAT,false,stride,offset);
            return a;
        };

        const uniform=(p,name,...v)=>{
            const u=gl.getUniformLocation(p,name);
            v.length===2
                ?gl.uniform2f(u,...v)
                :gl.uniform1f(u,v[0]);
        };

        layer.id="love";
        layer.setAttribute("aria-label",canvas.getAttribute("aria-label"));
        canvas.replaceWith(layer);
        canvas=layer;

        return{
            begin(){
                pn=ln=0;

                gl.viewport(0,0,canvas.width,canvas.height);
                gl.disable(gl.BLEND);

                gl.useProgram(bg);
                gl.bindBuffer(gl.ARRAY_BUFFER,bb);

                const a=attribute(bg,"a_xy",2,0,0);

                uniform(bg,"u_size",W,H);
                uniform(bg,"u_center",CX,CY);
                uniform(bg,"u_dpr",DPR);

                gl.drawArrays(gl.TRIANGLES,0,3);
                gl.disableVertexAttribArray(a);

                gl.enable(gl.BLEND);
                gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
            },

            dot(x,y,size,alpha,color){
                if(pn+5>points.length)return;

                points[pn++]=x;
                points[pn++]=y;
                points[pn++]=Math.max(2,size*5.8);
                points[pn++]=color;
                points[pn++]=clamp(alpha);
            },

            line(x1,y1,x2,y2,width,alpha,color){
                if(ln+36>lines.length)return;

                let rgb=colors.get(color);

                if(!rgb){
                    rgb=[1,3,5].map(
                        i=>parseInt(color.slice(i,i+2),16)/255
                    );
                    colors.set(color,rgb);
                }

                const length=Math.hypot(x2-x1,y2-y1)||1;
                const dx=-(y2-y1)/length*width/2;
                const dy=(x2-x1)/length*width/2;

                const vertex=(x,y)=>{
                    lines[ln++]=x;
                    lines[ln++]=y;
                    lines[ln++]=rgb[0];
                    lines[ln++]=rgb[1];
                    lines[ln++]=rgb[2];
                    lines[ln++]=clamp(alpha);
                };

                vertex(x1+dx,y1+dy);
                vertex(x1-dx,y1-dy);
                vertex(x2+dx,y2+dy);

                vertex(x2+dx,y2+dy);
                vertex(x1-dx,y1-dy);
                vertex(x2-dx,y2-dy);
            },

            end(){
                gl.useProgram(point);
                gl.bindBuffer(gl.ARRAY_BUFFER,pb);
                gl.bufferData(
                    gl.ARRAY_BUFFER,
                    points.subarray(0,pn),
                    gl.DYNAMIC_DRAW
                );

                const a=attribute(point,"a_point",4,20,0);
                const b=attribute(point,"a_alpha",1,20,16);

                uniform(point,"u_size",W,H);
                uniform(point,"u_dpr",DPR);

                gl.drawArrays(gl.POINTS,0,pn/5);
                gl.disableVertexAttribArray(a);
                gl.disableVertexAttribArray(b);

                gl.useProgram(line);
                gl.bindBuffer(gl.ARRAY_BUFFER,lb);
                gl.bufferData(
                    gl.ARRAY_BUFFER,
                    lines.subarray(0,ln),
                    gl.DYNAMIC_DRAW
                );

                const c=attribute(line,"a_xy",2,24,0);
                const d=attribute(line,"a_color",4,24,8);

                uniform(line,"u_size",W,H);

                gl.drawArrays(gl.TRIANGLES,0,ln/6);
                gl.disableVertexAttribArray(c);
                gl.disableVertexAttribArray(d);
            }
        };
    }catch(e){
        console.warn("Using Canvas fallback",e);
        return null;
    }
})();

function stroke(x1,y1,x2,y2,width,alpha,color){
    if(alpha<.003)return;

    if(gpu){
        gpu.line(x1,y1,x2,y2,width,alpha,color);
        return;
    }

    ctx.globalAlpha=clamp(alpha);
    ctx.lineWidth=width;
    ctx.strokeStyle=color;
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.stroke();
}

/* 常用心形曲线，保留完整轮廓。 */
function heart(t){
    const s=Math.sin(t);

    return{
        x:s*s*s,
        y:(
            13*Math.cos(t)
            -5*Math.cos(2*t)
            -2*Math.cos(3*t)
            -Math.cos(4*t)
            +2.5
        )/15.4
    };
}

/* 连续厚度场：前后曲面在轮廓处自然闭合。 */
const G=137;
const SPAN=2.18;
const MIN=-SPAN/2;
const STEP=SPAN/(G-1);

const field=new Float32Array(G*G);
const boundary=Array.from(
    {length:1200},
    (_,i)=>heart(i/1200*TAU)
);
const interior=[];

for(let j=1;j<G-1;j++){
    const y=MIN+j*STEP;
    const cross=[];

    for(let i=0;i<boundary.length;i++){
        const a=boundary[i];
        const b=boundary[(i+1)%boundary.length];

        if((a.y>y)!==(b.y>y)){
            cross.push(a.x+(y-a.y)*(b.x-a.x)/(b.y-a.y));
        }
    }

    cross.sort((a,b)=>a-b);

    for(let k=0;k+1<cross.length;k+=2){
        for(let i=1;i<G-1;i++){
            const x=MIN+i*STEP;

            if(x>cross[k]&&x<cross[k+1]){
                interior.push(j*G+i);
            }
        }
    }
}

for(let pass=0;pass<460;pass++){
    for(const n of interior){
        const q=(
            field[n-1]+field[n+1]
            +field[n-G]+field[n+G]
            +STEP*STEP
        )*.25;

        field[n]+=1.78*(q-field[n]);
    }
}

let fieldMax=0;

for(const n of interior){
    fieldMax=Math.max(fieldMax,field[n]);
}

for(const n of interior){
    field[n]=.37*Math.sqrt(Math.max(0,field[n])/fieldMax);
}

function height(x,y){
    const fx=(x-MIN)/STEP;
    const fy=(y-MIN)/STEP;
    const i=Math.floor(fx);
    const j=Math.floor(fy);

    if(i<0||j<0||i>=G-1||j>=G-1)return 0;

    const u=fx-i;
    const v=fy-j;
    const n=j*G+i;

    return lerp(
        lerp(field[n],field[n+1],u),
        lerp(field[n+G],field[n+G+1],u),
        v
    );
}

function surface(x,y,side){
    const h=height(x,y);
    const e=STEP*.65;

    const hx=(height(x+e,y)-height(x-e,y))/(2*e);
    const hy=(height(x,y+e)-height(x,y-e))/(2*e);
    const k=1/Math.hypot(hx,hy,1);

    return{
        x,y,
        z:h*side,
        nx:-hx*k,
        ny:-hy*k,
        nz:side*k
    };
}

let W=0,H=0,DPR=1;
let S=1,CX=0,CY=0,FY=0,FR=1;

let heartDots=[];
let petals=[];
let stars=[];
let bursts=[];

let profile="";
let background=null;

const buckets=Array.from({length:24},()=>[]);
const state={};

function makeHeart(mobile){
    seed=0x249fad;
    heartDots=[];

    const count=mobile?9600:18000;

    while(heartDots.length<count){
        const n=interior[Math.floor(random()*interior.length)];

        const x=MIN+(n%G+rand(-.48,.48))*STEP;
        const y=MIN+(Math.floor(n/G)+rand(-.48,.48))*STEP;
        const h=height(x,y);

        if(h<.007)continue;

        const p=surface(x,y,random()<.5?-1:1);

        if(
            random()>
            Math.min(1,.30/Math.max(.08,Math.abs(p.nz)))
        )continue;

        const dust=random()<.14;
        const volume=!dust&&random()<.12;
        const displacement=dust?rand(.02,.115):gauss()*.009;

        p.x+=p.nx*displacement;
        p.y+=p.ny*displacement;
        p.z+=p.nz*displacement;

        if(volume)p.z*=rand(.08,.90);

        Object.assign(p,{
            kind:volume?2:dust?1:0,
            size:random()<.07?rand(1.65,2.35):rand(.62,1.52),
            alpha:rand(.55,1),
            phase:rand(0,TAU),
            speed:rand(.75,1.65),
            color:random()<.13?3:random()<.68?2:1,
            hot:random()<.018,
            px:0,
            py:0,
            screenSize:1,
            opacity:0,
            tint:0
        });

        heartDots.push(p);
    }
}

function makeScene(mobile){
    makeHeart(mobile);

    petals=[];
    stars=[];
    bursts=[];

    for(let layer=0;layer<2;layer++){
        const count=layer?18:30;
        const steps=mobile?34:58;

        for(let petal=0;petal<count;petal++){
            for(let side=-1;side<=1;side+=2){
                for(let j=0;j<steps;j++){
                    petals.push({
                        layer,petal,count,side,
                        u:(j+.5)/steps,
                        phase:rand(0,TAU),
                        size:rand(.48,1),
                        a:rand(.4,.86)
                    });
                }
            }
        }
    }

    for(let i=0;i<(mobile?90:170);i++){
        stars.push({
            x:random(),
            y:random(),
            a:rand(.03,.23),
            s:rand(.4,1.2),
            p:rand(0,TAU)
        });
    }

    for(let i=0;i<(mobile?150:250);i++){
        bursts.push({
            a:rand(0,TAU),
            r:rand(.3,.95),
            speed:rand(.65,2.2),
            p:random(),
            s:rand(.5,1.3)
        });
    }
}

function resize(){
    W=innerWidth;
    H=innerHeight;
    DPR=Math.min(devicePixelRatio||1,1.6);

    canvas.width=Math.round(W*DPR);
    canvas.height=Math.round(H*DPR);

    ctx.setTransform(DPR,0,0,DPR,0,0);

    CX=W/2;
    FY=H*(W<700?.64:.72);
    S=Math.min(W*(W<700?.34:.305),H*.235,290);
    CY=FY-S*1.12;
    FR=Math.min(W*.455,S*1.85);

    background=ctx.createRadialGradient(
        CX,CY,0,
        CX,CY,Math.max(W,H)*.69
    );

    background.addColorStop(0,"#201728");
    background.addColorStop(.38,"#100e19");
    background.addColorStop(1,"#030408");

    const p=W<700?"m":"d";

    if(p!==profile){
        profile=p;
        makeScene(p==="m");
    }
}

function scene(t){
    const u=t%15;

    let yaw=0;
    let zoom=1;

    if(u<4.4){
        yaw=TAU*ease(u/4.4);
    }else if(u<8.5){
        yaw=TAU+
            .10*Math.sin((u-4.4)*.9)
            *Math.sin((u-4.4)/4.1*Math.PI);
    }else{
        yaw=TAU+TAU*ease((u-8.5)/6.5);
    }

    if(u>7.6&&u<9){
        zoom=lerp(1,.77,ease((u-7.6)/1.4));
    }else if(u>=9&&u<11.2){
        zoom=.77;
    }else if(u>=11.2){
        zoom=lerp(.77,1,ease((u-11.2)/2.2));
    }

    if(reduce){
        yaw=.25;
        zoom=1;
    }

    if(Number.isFinite(fixedYaw))yaw=fixedYaw;

    const pitch=-.055+.038*Math.sin(t*.37);
    const roll=.022*Math.sin(t*.28);

    Object.assign(state,{
        yaw,zoom,
        c:Math.cos(yaw),
        s:Math.sin(yaw),
        cp:Math.cos(pitch),
        sp:Math.sin(pitch),
        cr:Math.cos(roll),
        sr:Math.sin(roll),

        ring:1-.86
            *ease((u-4)/.8)
            *(1-ease((u-8.8)/.9)),

        burst:!reduce&&u>4.05&&u<6.25
            ?(u-4.05)/2.2
            :-1
    });

    return state;
}

function rotate(x,y,z,q,out){
    const a=x*q.c+z*q.s;
    const b=-x*q.s+z*q.c;
    const c=y*q.cp-b*q.sp;
    const d=y*q.sp+b*q.cp;

    out[0]=a*q.cr-c*q.sr;
    out[1]=a*q.sr+c*q.cr;
    out[2]=d;
}

const pos=new Float32Array(3);
const normal=new Float32Array(3);

function prepareHeart(t,q){
    for(const b of buckets)b.length=0;

    const cy=FY-S*(.18+.94*q.zoom);

    for(const p of heartDots){
        const drift=.005*Math.sin(t*.8+p.phase);

        rotate(
            p.x+p.nx*drift,
            p.y+p.ny*drift,
            p.z+p.nz*drift,
            q,pos
        );

        rotate(p.nx,p.ny,p.nz,q,normal);

        const k=5.5/(5.5-pos[2]);
        const nz=normal[2];
        const rim=Math.pow(1-Math.abs(nz),.62);

        const lighting=Math.max(
            0,
            -normal[0]*.36+normal[1]*.48+nz*.8
        );

        const facing=.42+.58*ease((nz+.15)/.3);
        let alpha=(.035+2.2*rim+.09*lighting)*facing;

        if(p.kind===1)alpha*=.38;
        if(p.kind===2)alpha=.055;

        const flicker=.74+.26*Math.pow(
            .5+.5*Math.sin(t*p.speed+p.phase),
            3
        );

        p.opacity=clamp(
            alpha*p.alpha*flicker
            *(.82+pos[2]*.16)
            *(.55+.45*Math.abs(q.c))
        );

        p.px=CX+pos[0]*S*q.zoom*k;
        p.py=cy-pos[1]*S*q.zoom*k;

        p.screenSize=p.size*k*Math.max(.78,S/220)*q.zoom;
        p.tint=rim>.91?3:p.color;

        buckets[
            clamp(Math.floor((pos[2]+1.5)*8),0,23)
        ].push(p);
    }
}

function dot(x,y,size,alpha,color=2){
    if(alpha<.008)return;

    if(gpu){
        gpu.dot(x,y,size,alpha,color);
        return;
    }

    const d=Math.max(2,size*5.8);

    ctx.globalAlpha=clamp(alpha);
    ctx.drawImage(sprites[color],x-d/2,y-d/2,d,d);
}

function drawHeart(t){
    ctx.globalCompositeOperation="lighter";

    for(const bucket of buckets){
        for(const p of bucket){
            dot(p.px,p.py,p.screenSize,p.opacity,p.tint);

            if(p.hot&&p.opacity>.15){
                const shine=Math.pow(
                    .5+.5*Math.sin(t*1.6+p.phase),
                    14
                );

                if(shine>.22){
                    const r=p.screenSize*(2.5+shine*3.5);
                    const a=shine*p.opacity*.6;

                    stroke(
                        p.px-r,p.py,p.px+r,p.py,
                        .6,a,"#ffedf7"
                    );

                    stroke(
                        p.px,p.py-r,p.px,p.py+r,
                        .6,a,"#ffedf7"
                    );
                }
            }
        }
    }
}

function flower(t){
    ctx.globalCompositeOperation="lighter";

    for(const p of petals){
        const u=p.u;
        const l=p.layer;

        const angle=p.petal/p.count*TAU
            +(l?.08:0)
            +t*(l?-.024:.017);

        const open=1+.035*Math.sin(t*.6+p.petal*.27);

        const radius=(
            .045+Math.sin(u*Math.PI/2)*(l?.65:1)
        )*open;

        const width=Math.pow(
            Math.sin(Math.PI*u),
            1.25
        )*(l?.075:.05);

        const sideways=p.side*width;
        const curl=.035*Math.sin(t*.5+p.petal*.41)*u*u;
        const a=angle+curl;

        const x=Math.cos(a)*radius-Math.sin(a)*sideways;
        const z=Math.sin(a)*radius+Math.cos(a)*sideways;

        const lift=Math.sin(Math.PI*u)*(
            .085+.035*Math.sin(t*.6+p.petal*.41)
        );

        const k=1/(1-z*.15);
        const px=CX+x*FR*k;
        const py=FY+z*FR*.28*k-lift*FR*.22;

        const shimmer=.65+.35*Math.pow(
            .5+.5*Math.sin(t*1.2+p.phase),
            2
        );

        dot(
            px,py,
            p.size*(.65+FR/520)*.83,
            p.a*shimmer*(.49+z*.13),
            l?1:2
        );
    }

    for(let ring=0;ring<6;ring++){
        const r=.035+ring*.038;
        const n=70+ring*14;

        for(let j=0;j<n;j++){
            const a=j/n*TAU+t*(ring%2?.07:-.05);

            dot(
                CX+Math.cos(a)*r*FR,
                FY+Math.sin(a)*r*FR*.28,
                .48,.38,3
            );
        }
    }
}

const bands=[
    {
        turns:2.1,
        top:1.02,bottom:-.90,
        radius:1.18,tilt:.16,
        phase:.1,speed:.23,dir:1
    },
    {
        turns:1.08,
        top:.66,bottom:-.20,
        radius:1.26,tilt:-.38,
        phase:2.4,speed:.34,dir:-1
    },
    {
        turns:.87,
        top:.06,bottom:-.86,
        radius:1.31,tilt:.29,
        phase:4.1,speed:.28,dir:1
    }
];

const trail=Array.from(
    {length:3},
    ()=>Array.from(
        {length:300},
        ()=>({x:0,y:0,z:0,u:0})
    )
);

function prepareRibbons(t,q){
    const cy=FY-S*(.18+.94*q.zoom);

    for(let j=0;j<bands.length;j++){
        const b=bands[j];

        for(let i=0;i<300;i++){
            const u=i/299;
            const e=Math.sin(Math.PI*u);
            const a=u*TAU*b.turns*b.dir+t*b.speed+b.phase;

            const flutter=
                .09*Math.sin(a*1.7-t*.8+j)
                +.035*Math.sin(a*3.1+t*1.1);

            const r=b.radius+.08*Math.sin(a*1.35+t*.45+j);
            const x=Math.cos(a+flutter*e)*r;
            const z=Math.sin(a+flutter*e)*r;

            const y=lerp(b.top,b.bottom,u)
                +b.tilt*Math.sin(a+.5)*e
                +.07*Math.sin(t*.7+a*2)*e;

            const k=5.5/(5.5-z);
            const p=trail[j][i];

            p.x=CX+x*S*q.zoom*k;
            p.y=cy-y*S*q.zoom*k;
            p.z=z;
            p.u=u;
        }
    }
}

function ribbons(front,t,q){
    ctx.globalCompositeOperation="lighter";
    ctx.lineCap="round";

    for(let j=0;j<3;j++){
        const list=trail[j];

        for(let i=1;i<list.length;i++){
            const a=list[i-1];
            const b=list[i];

            if((b.z>0)!==front)continue;

            const taper=Math.pow(Math.sin(Math.PI*b.u),.45);

            const wave=.48+.52*Math.pow(
                .5+.5*Math.sin(b.u*19-t*(2+j*.34)+j),
                3
            );

            const alpha=q.ring*taper*wave*(front?.54:.11);

            stroke(
                a.x,a.y,b.x,b.y,
                5.2,alpha*.17,
                j===2?"#ddbddf":"#f5b5d5"
            );

            stroke(
                a.x,a.y,b.x,b.y,
                j===0?.88:.62,
                alpha,
                j===1?"#ffdfeb":"#ffd5e9"
            );

            if(i%3===0){
                const spark=.5+.5*Math.sin(i*12.3+j*7);

                dot(
                    b.x+Math.sin(i*17.1)*2,
                    b.y+Math.cos(i*9.3)*2,
                    .45+spark*.35,
                    alpha*.8,
                    j===2?4:2
                );
            }
        }

        for(let c=0;c<2;c++){
            const head=fract(t*(.11+j*.016)+c*.5+j*.18);

            for(let n=0;n<18;n++){
                const u=fract(head-n*.0025);
                const p=list[Math.min(299,Math.floor(u*299))];

                if((p.z>0)!==front)continue;

                const a=Math.pow(1-n/18,2)
                    *q.ring
                    *(front?.80:.20)
                    *Math.sin(Math.PI*u);

                dot(
                    p.x,p.y,
                    .75+(1-n/18)*.65,
                    a,3
                );
            }
        }
    }
}

function burst(q){
    if(q.burst<0)return;

    const u=q.burst;
    const fade=Math.sin(Math.PI*u)*Math.pow(1-u,.6);
    const cy=FY-S*(.18+.94*q.zoom);

    ctx.globalCompositeOperation="lighter";

    for(const p of bursts){
        const r=(p.r+u*p.speed*2.3)*S;
        const tail=r-(.025+.10*(1-u))*S;
        const ca=Math.cos(p.a);
        const sa=Math.sin(p.a);

        stroke(
            CX+ca*tail,cy+sa*tail,
            CX+ca*r,cy+sa*r,
            .7,
            fade*(.16+p.p*.22),
            p.p>.75?"#ffe7f0":"#f1a6cc"
        );

        dot(
            CX+ca*r,
            cy+sa*r,
            p.s,
            fade*.38,
            2
        );
    }
}

let seconds=0;
let last=performance.now();

function render(now){
    const dt=Math.min(.05,Math.max(0,(now-last)/1000));
    last=now;

    if(!document.hidden)seconds+=dt;

    const t=Number.isFinite(still)
        ?still
        :reduce?5.7:seconds;

    const q=scene(t);

    if(gpu){
        gpu.begin();
    }else{
        ctx.globalCompositeOperation="source-over";
        ctx.globalAlpha=1;
        ctx.fillStyle=background;
        ctx.fillRect(0,0,W,H);
    }

    for(const p of stars){
        dot(
            p.x*W,
            p.y*H,
            p.s,
            p.a*(.6+.4*Math.sin(t*.45+p.p)**2),
            4
        );
    }

    flower(t);

    prepareRibbons(t,q);
    ribbons(false,t,q);

    burst(q);

    prepareHeart(t,q);
    drawHeart(t);

    ribbons(true,t,q);

    ctx.globalAlpha=1;
    ctx.globalCompositeOperation="source-over";

    if(gpu)gpu.end();

    if(!Number.isFinite(still)){
        requestAnimationFrame(render);
    }
}

addEventListener("resize",resize,{passive:true});

document.addEventListener("visibilitychange",()=>{
    last=performance.now();
});

resize();
requestAnimationFrame(render);

})();
</script>
</body>
</html>
