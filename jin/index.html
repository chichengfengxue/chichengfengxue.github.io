<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Love</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#050208}
body{
    background:
    radial-gradient(circle at 50% 39%,rgba(77,20,67,.20) 0%,rgba(20,6,25,.10) 35%,rgba(5,2,8,0) 68%),
    #050208
}
canvas{position:fixed;inset:0;display:block;width:100%;height:100%}
#loading{
    position:fixed;inset:0;z-index:100;
    display:flex;align-items:center;justify-content:center;
    background:#050208;color:rgba(255,185,224,.5);
    font:10px Arial,sans-serif;letter-spacing:7px;
    transition:opacity 1s ease;pointer-events:none
}
#loading.hide{opacity:0}
.home{
    position:fixed;left:24px;top:22px;z-index:20;
    color:rgba(255,220,240,.28);
    text-decoration:none;font:10px Arial,sans-serif;
    letter-spacing:3px;transition:.35s
}
.home:hover{color:#ffe1f3;text-shadow:0 0 15px rgba(255,100,190,.8)}
</style>
<script type="importmap">
{
    "imports":{
        "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>
</head>
<body>
<a href="/" class="home">HOME</a>
<div id="loading">LOVE</div>

<script type="module">
import * as THREE from "three";
import {EffectComposer} from "three/addons/postprocessing/EffectComposer.js";
import {RenderPass} from "three/addons/postprocessing/RenderPass.js";
import {UnrealBloomPass} from "three/addons/postprocessing/UnrealBloomPass.js";
import {OutputPass} from "three/addons/postprocessing/OutputPass.js";

const MOBILE=innerWidth<768;
const DPR=Math.min(devicePixelRatio||1,MOBILE?1.35:1.75);

const COUNT={
    heart:MOBILE?24000:52000,
    inside:MOBILE?2200:5200,
    sparks:MOBILE?3500:9000,
    fountain:MOBILE?800:1900,
    stars:MOBILE?900:2200,
    rays:MOBILE?70:170
};

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050208);
scene.fog=new THREE.FogExp2(0x050208,.012);

const camera=new THREE.PerspectiveCamera(
    MOBILE?54:47,
    innerWidth/innerHeight,
    .1,
    150
);

camera.position.set(0,2.5,MOBILE?41:37.5);

const renderer=new THREE.WebGLRenderer({
    antialias:false,
    powerPreference:"high-performance"
});

renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.10;
document.body.appendChild(renderer.domElement);

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));

const bloom=new UnrealBloomPass(
    new THREE.Vector2(innerWidth,innerHeight),
    1.28,
    .62,
    .16
);

bloom.threshold=.12;
bloom.strength=MOBILE?1.05:1.25;
bloom.radius=.70;

composer.addPass(bloom);
composer.addPass(new OutputPass());

const heartGroup=new THREE.Group();
heartGroup.position.y=3.25;
scene.add(heartGroup);

const HEART_SCALE=.61;

const commonHeartFunctions=`
#define PI 3.141592653589793
#define TAU 6.283185307179586

vec2 heart(float t){
    float s=sin(t);
    float x=16.0*s*s*s;
    float y=
        13.0*cos(t)
        -5.0*cos(2.0*t)
        -2.0*cos(3.0*t)
        -cos(4.0*t);

    return vec2(x,y)*${HEART_SCALE.toFixed(4)};
}

vec2 heartDerivative(float t){
    float s=sin(t);
    float c=cos(t);

    float dx=48.0*s*s*c;

    float dy=
        -13.0*sin(t)
        +10.0*sin(2.0*t)
        +6.0*sin(3.0*t)
        +4.0*sin(4.0*t);

    return vec2(dx,dy)*${HEART_SCALE.toFixed(4)};
}
`;

function createHeartParticles(){

    const n=COUNT.heart;

    const geometry=new THREE.BufferGeometry();

    const position=new Float32Array(n*3);
    const angle=new Float32Array(n);
    const band=new Float32Array(n);
    const z=new Float32Array(n);
    const size=new Float32Array(n);
    const seed=new Float32Array(n);
    const speed=new Float32Array(n);
    const bright=new Float32Array(n);

    for(let i=0;i<n;i++){

        angle[i]=Math.random()*Math.PI*2;

        const r=Math.random();

        if(r<.70){
            band[i]=(Math.random()-.5)*.80;
        }else if(r<.93){
            band[i]=(Math.random()-.5)*1.55;
        }else{
            band[i]=(Math.random()-.5)*2.6;
        }

        z[i]=(Math.random()-.5)*(r<.9?1.65:3.4);

        const q=Math.random();

        if(q<.82){
            size[i]=.40+Math.random()*.50;
        }else if(q<.975){
            size[i]=.85+Math.random()*.55;
        }else{
            size[i]=1.35+Math.random()*.75;
        }

        seed[i]=Math.random();

        speed[i]=
            .020+
            Math.random()*.026;

        bright[i]=Math.random();

    }

    geometry.setAttribute("position",new THREE.BufferAttribute(position,3));
    geometry.setAttribute("aAngle",new THREE.BufferAttribute(angle,1));
    geometry.setAttribute("aBand",new THREE.BufferAttribute(band,1));
    geometry.setAttribute("aZ",new THREE.BufferAttribute(z,1));
    geometry.setAttribute("aSize",new THREE.BufferAttribute(size,1));
    geometry.setAttribute("aSeed",new THREE.BufferAttribute(seed,1));
    geometry.setAttribute("aSpeed",new THREE.BufferAttribute(speed,1));
    geometry.setAttribute("aBright",new THREE.BufferAttribute(bright,1));

    const vertex=`
    ${commonHeartFunctions}

    attribute float aAngle;
    attribute float aBand;
    attribute float aZ;
    attribute float aSize;
    attribute float aSeed;
    attribute float aSpeed;
    attribute float aBright;

    uniform float uTime;
    uniform float uBeat;
    uniform float uPixelRatio;
    uniform float uSizeMul;

    varying vec3 vColor;
    varying float vAlpha;

    void main(){

        float t=
            aAngle+
            uTime*aSpeed;

        vec2 hp=heart(t);

        vec2 derivative=
            heartDerivative(t);

        vec2 tangent=
            normalize(derivative);

        vec2 normal=
            vec2(-tangent.y,tangent.x);

        float turbulence=
            sin(
                t*11.0+
                uTime*.72+
                aSeed*19.0
            )*.085;

        turbulence+=
            sin(
                t*23.0-
                uTime*.43+
                aSeed*31.0
            )*.035;

        float widthPulse=
            1.0+
            sin(
                t*5.0+
                uTime*.45+
                aSeed*15.0
            )*.045;

        vec2 p2=
            hp+
            normal*
            (
                aBand*widthPulse+
                turbulence
            );

        float breath=
            1.0+
            sin(uTime*.72)*.006+
            uBeat*.024;

        p2*=breath;

        float zz=
            aZ+
            sin(
                uTime*.65+
                t*4.0+
                aSeed*12.0
            )*.12;

        vec3 p=
            vec3(
                p2.x,
                p2.y,
                zz
            );

        vec4 mv=
            modelViewMatrix*
            vec4(p,1.0);

        float perspective=
            78.0/
            max(8.0,-mv.z);

        float hot=
            smoothstep(.91,1.0,aBright);

        hot+=
            exp(
                -p2.x*p2.x*.55
                -(p2.y-3.3)*(p2.y-3.3)*.40
            )*.75;

        hot+=
            exp(
                -p2.x*p2.x*.55
                -(p2.y+9.0)*(p2.y+9.0)*.50
            )*.35;

        hot=clamp(hot,0.0,1.0);

        gl_PointSize=
            clamp(
                aSize*
                uSizeMul*
                uPixelRatio*
                perspective,
                .45,
                7.0
            );

        gl_Position=
            projectionMatrix*mv;

        vec3 purple=
            vec3(.68,.18,.62);

        vec3 pink=
            vec3(1.0,.35,.70);

        vec3 pale=
            vec3(1.0,.72,.88);

        vec3 white=
            vec3(1.0,.98,1.0);

        float colorNoise=
            .5+
            .5*sin(aSeed*17.0);

        vec3 c=
            mix(
                purple,
                pink,
                .55+
                colorNoise*.25
            );

        c=mix(
            c,
            pale,
            hot*.70
        );

        c=mix(
            c,
            white,
            pow(hot,3.0)
        );

        float shimmer=
            .74+
            .26*sin(
                uTime*
                (1.8+aSeed*2.0)+
                aSeed*35.0
            );

        vColor=c;

        vAlpha=
            (
                .42+
                hot*.58
            )*
            shimmer;
    }
    `;

    const fragment=`
    precision highp float;

    varying vec3 vColor;
    varying float vAlpha;

    uniform float uSoft;

    void main(){

        vec2 uv=
            gl_PointCoord-
            .5;

        float d=
            length(uv);

        if(d>.5)discard;

        float core=
            exp(
                -d*d*42.0
            );

        float halo=
            exp(
                -d*d*10.0
            );

        float alpha=
            mix(
                core,
                halo,
                uSoft
            )*
            vAlpha;

        gl_FragColor=
            vec4(
                vColor,
                alpha
            );
    }
    `;

    function material(sizeMul,alpha,soft){

        return new THREE.ShaderMaterial({
            vertexShader:vertex,
            fragmentShader:fragment,

            uniforms:{
                uTime:{value:0},
                uBeat:{value:0},
                uPixelRatio:{value:DPR},
                uSizeMul:{value:sizeMul},
                uSoft:{value:soft}
            },

            transparent:true,
            depthWrite:false,
            depthTest:true,
            blending:THREE.AdditiveBlending
        });

    }

    const haloMaterial=
        material(
            3.6,
            .05,
            1
        );

    const bodyMaterial=
        material(
            1.0,
            1,
            .15
        );

    const halo=
        new THREE.Points(
            geometry,
            haloMaterial
        );

    const body=
        new THREE.Points(
            geometry,
            bodyMaterial
        );

    halo.frustumCulled=false;
    body.frustumCulled=false;

    halo.material.opacity=.08;

    heartGroup.add(halo);
    heartGroup.add(body);

    return {
        bodyMaterial,
        haloMaterial
    };
}

const heartParticles=
    createHeartParticles();

function createInnerDust(){

    const n=COUNT.inside;

    const geometry=
        new THREE.BufferGeometry();

    const position=
        new Float32Array(n*3);

    const size=
        new Float32Array(n);

    const seed=
        new Float32Array(n);

    for(let i=0;i<n;i++){

        const t=
            Math.random()*
            Math.PI*2;

        const s=Math.sin(t);

        const hx=
            16*s*s*s*
            HEART_SCALE;

        const hy=
            (
                13*Math.cos(t)
                -5*Math.cos(2*t)
                -2*Math.cos(3*t)
                -Math.cos(4*t)
            )*
            HEART_SCALE;

        const radius=
            Math.pow(
                Math.random(),
                .55
            )*.80;

        position[i*3]=
            hx*radius+
            (Math.random()-.5)*.22;

        position[i*3+1]=
            hy*radius+
            (Math.random()-.5)*.22;

        position[i*3+2]=
            (Math.random()-.5)*3.0;

        size[i]=
            .35+
            Math.random()*.85;

        seed[i]=
            Math.random();
    }

    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            position,
            3
        )
    );

    geometry.setAttribute(
        "aSize",
        new THREE.BufferAttribute(
            size,
            1
        )
    );

    geometry.setAttribute(
        "aSeed",
        new THREE.BufferAttribute(
            seed,
            1
        )
    );

    const vertex=`
    attribute float aSize;
    attribute float aSeed;

    uniform float uTime;
    uniform float uPixelRatio;

    varying float vAlpha;
    varying vec3 vColor;

    void main(){

        vec3 p=position;

        p.x+=
            sin(
                uTime*.32+
                p.y*.8+
                aSeed*20.0
            )*.055;

        p.y+=
            cos(
                uTime*.28+
                p.x*.6+
                aSeed*16.0
            )*.05;

        p.z+=
            sin(
                uTime*.42+
                aSeed*17.0
            )*.08;

        vec4 mv=
            modelViewMatrix*
            vec4(p,1.0);

        gl_PointSize=
            clamp(
                aSize*
                uPixelRatio*
                68.0/
                max(8.0,-mv.z),
                .4,
                3.2
            );

        gl_Position=
            projectionMatrix*mv;

        float hot=
            smoothstep(
                .94,
                1.0,
                aSeed
            );

        vColor=
            mix(
                vec3(.83,.28,.70),
                vec3(1.0,.88,.96),
                hot
            );

        vAlpha=
            (
                .16+
                aSeed*.30
            )*
            (
                .68+
                .32*sin(
                    uTime*
                    (1.0+aSeed)+
                    aSeed*28.0
                )
            );
    }
    `;

    const fragment=`
    precision highp float;
    varying float vAlpha;
    varying vec3 vColor;

    void main(){

        vec2 p=
            gl_PointCoord-.5;

        float d=
            length(p);

        if(d>.5)discard;

        float a=
            exp(-d*d*28.0)*
            vAlpha;

        gl_FragColor=
            vec4(
                vColor,
                a
            );
    }
    `;

    const material=
        new THREE.ShaderMaterial({
            vertexShader:vertex,
            fragmentShader:fragment,

            uniforms:{
                uTime:{value:0},
                uPixelRatio:{value:DPR}
            },

            transparent:true,
            depthWrite:false,
            blending:THREE.AdditiveBlending
        });

    const points=
        new THREE.Points(
            geometry,
            material
        );

    points.frustumCulled=false;

    heartGroup.add(points);

    return material;
}

const innerMaterial=
    createInnerDust();

function createSparks(){

    const n=COUNT.sparks;

    const geometry=
        new THREE.BufferGeometry();

    const position=
        new Float32Array(n*3);

    const angle=
        new Float32Array(n);

    const seed=
        new Float32Array(n);

    const speed=
        new Float32Array(n);

    const distance=
        new Float32Array(n);

    const size=
        new Float32Array(n);

    const spread=
        new Float32Array(n);

    for(let i=0;i<n;i++){

        angle[i]=
            Math.random()*
            Math.PI*2;

        seed[i]=
            Math.random();

        speed[i]=
            .035+
            Math.random()*.080;

        distance[i]=
            2.5+
            Math.pow(
                Math.random(),
                .55
            )*11;

        size[i]=
            .35+
            Math.random()*.75;

        spread[i]=
            (Math.random()-.5)*1.1;
    }

    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            position,
            3
        )
    );

    geometry.setAttribute(
        "aAngle",
        new THREE.BufferAttribute(
            angle,
            1
        )
    );

    geometry.setAttribute(
        "aSeed",
        new THREE.BufferAttribute(
            seed,
            1
        )
    );

    geometry.setAttribute(
        "aSpeed",
        new THREE.BufferAttribute(
            speed,
            1
        )
    );

    geometry.setAttribute(
        "aDistance",
        new THREE.BufferAttribute(
            distance,
            1
        )
    );

    geometry.setAttribute(
        "aSize",
        new THREE.BufferAttribute(
            size,
            1
        )
    );

    geometry.setAttribute(
        "aSpread",
        new THREE.BufferAttribute(
            spread,
            1
        )
    );

    const vertex=`
    ${commonHeartFunctions}

    attribute float aAngle;
    attribute float aSeed;
    attribute float aSpeed;
    attribute float aDistance;
    attribute float aSize;
    attribute float aSpread;

    uniform float uTime;
    uniform float uPixelRatio;

    varying float vAlpha;
    varying vec3 vColor;

    void main(){

        float life=
            fract(
                aSeed+
                uTime*aSpeed
            );

        float t=
            aAngle+
            uTime*.015;

        vec2 hp=
            heart(t);

        vec2 tangent=
            normalize(
                heartDerivative(t)
            );

        vec2 normal=
            vec2(
                -tangent.y,
                tangent.x
            );

        float side=
            sign(
                dot(
                    hp,
                    normal
                )
            );

        normal*=side;

        float travel=
            pow(
                life,
                1.45
            );

        vec2 p2=
            hp+
            normal*
            (
                travel*
                aDistance
            );

        p2+=
            tangent*
            aSpread*
            travel;

        p2.x+=
            sin(
                life*15.0+
                aSeed*31.0+
                uTime*1.4
            )*
            .12*
            life;

        p2.y+=
            cos(
                life*12.0+
                aSeed*23.0+
                uTime
            )*
            .10*
            life;

        float zz=
            sin(
                aSeed*17.0+
                life*7.0
            )*
            2.0*
            life;

        vec3 p=
            vec3(
                p2.x,
                p2.y,
                zz
            );

        vec4 mv=
            modelViewMatrix*
            vec4(p,1.0);

        gl_PointSize=
            clamp(
                aSize*
                uPixelRatio*
                72.0/
                max(8.0,-mv.z),
                .4,
                3.5
            );

        gl_Position=
            projectionMatrix*mv;

        float fadeIn=
            smoothstep(
                0.0,
                .08,
                life
            );

        float fadeOut=
            1.0-
            smoothstep(
                .45,
                1.0,
                life
            );

        vAlpha=
            fadeIn*
            fadeOut*
            (.30+aSeed*.52);

        vColor=
            mix(
                vec3(1.0,.34,.70),
                vec3(1.0,.90,.97),
                pow(
                    1.0-life,
                    3.0
                )
            );
    }
    `;

    const fragment=`
    precision highp float;

    varying float vAlpha;
    varying vec3 vColor;

    void main(){

        vec2 p=
            gl_PointCoord-.5;

        float d=
            length(p);

        if(d>.5)discard;

        float a=
            exp(
                -d*d*30.0
            )*
            vAlpha;

        gl_FragColor=
            vec4(
                vColor,
                a
            );
    }
    `;

    const material=
        new THREE.ShaderMaterial({
            vertexShader:vertex,
            fragmentShader:fragment,

            uniforms:{
                uTime:{value:0},
                uPixelRatio:{value:DPR}
            },

            transparent:true,
            depthWrite:false,
            blending:THREE.AdditiveBlending
        });

    const particles=
        new THREE.Points(
            geometry,
            material
        );

    particles.frustumCulled=false;

    heartGroup.add(particles);

    return material;
}

const sparkMaterial=
    createSparks();

function createHeartRays(){

    const positions=[];
    const colors=[];

    for(let i=0;i<COUNT.rays;i++){

        const t=
            Math.random()*
            Math.PI*2;

        const s=Math.sin(t);

        const x=
            16*s*s*s*
            HEART_SCALE;

        const y=
            (
                13*Math.cos(t)
                -5*Math.cos(2*t)
                -2*Math.cos(3*t)
                -Math.cos(4*t)
            )*
            HEART_SCALE;

        const len=
            4+
            Math.random()*12;

        const length=
            Math.sqrt(
                x*x+y*y
            )||1;

        const nx=
            x/length;

        const ny=
            y/length;

        const jitter=
            (Math.random()-.5)*.12;

        positions.push(
            x,
            y+3.25,
            -2-Math.random()*4,

            x+
            nx*len+
            jitter*len,
            y+3.25+
            ny*len,
            -4-Math.random()*8
        );

        colors.push(
            .38,.08,.28,
            .015,.002,.01
        );

    }

    const geometry=
        new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            positions,
            3
        )
    );

    geometry.setAttribute(
        "color",
        new THREE.Float32BufferAttribute(
            colors,
            3
        )
    );

    const material=
        new THREE.LineBasicMaterial({
            vertexColors:true,
            transparent:true,
            opacity:.22,
            depthWrite:false,
            blending:THREE.AdditiveBlending
        });

    const lines=
        new THREE.LineSegments(
            geometry,
            material
        );

    scene.add(lines);

    return lines;
}

const rays=createHeartRays();

function createStars(){

    const n=COUNT.stars;

    const positions=
        new Float32Array(n*3);

    const colors=
        new Float32Array(n*3);

    for(let i=0;i<n;i++){

        positions[i*3]=
            (Math.random()-.5)*75;

        positions[i*3+1]=
            (Math.random()-.5)*48+3;

        positions[i*3+2]=
            -8-
            Math.random()*45;

        const brightness=
            .16+
            Math.random()*.38;

        colors[i*3]=
            brightness;

        colors[i*3+1]=
            brightness*.42;

        colors[i*3+2]=
            brightness*.75;

    }

    const geometry=
        new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            positions,
            3
        )
    );

    geometry.setAttribute(
        "color",
        new THREE.BufferAttribute(
            colors,
            3
        )
    );

    const material=
        new THREE.PointsMaterial({
            size:.075,
            vertexColors:true,
            transparent:true,
            opacity:.55,
            depthWrite:false,
            blending:THREE.AdditiveBlending
        });

    const stars=
        new THREE.Points(
            geometry,
            material
        );

    scene.add(stars);

    return stars;
}

const stars=createStars();

const FLOOR_Y=-12.15;

function createFloor(){

    const group=
        new THREE.Group();

    scene.add(group);

    const linePositions=[];
    const lineColors=[];

    const rings=25;

    for(let r=1;r<=rings;r++){

        const radius=
            .60+
            Math.pow(
                r/rings,
                1.25
            )*18;

        const segments=100;

        for(let i=0;i<segments;i++){

            const a=
                i/
                segments*
                Math.PI*2;

            const b=
                (i+1)/
                segments*
                Math.PI*2;

            linePositions.push(
                Math.cos(a)*radius,
                FLOOR_Y,
                Math.sin(a)*radius
            );

            linePositions.push(
                Math.cos(b)*radius,
                FLOOR_Y,
                Math.sin(b)*radius
            );

            const alpha=
                .35*
                (
                    1-r/rings
                );

            lineColors.push(
                alpha,
                alpha*.42,
                alpha*.75
            );

            lineColors.push(
                alpha,
                alpha*.42,
                alpha*.75
            );
        }
    }

    const spokes=40;

    for(let i=0;i<spokes;i++){

        const a=
            i/spokes*
            Math.PI*2;

        linePositions.push(
            0,
            FLOOR_Y,
            0
        );

        linePositions.push(
            Math.cos(a)*18,
            FLOOR_Y,
            Math.sin(a)*18
        );

        lineColors.push(
            .18,.055,.15
        );

        lineColors.push(
            .008,.002,.007
        );
    }

    const geometry=
        new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            linePositions,
            3
        )
    );

    geometry.setAttribute(
        "color",
        new THREE.Float32BufferAttribute(
            lineColors,
            3
        )
    );

    const material=
        new THREE.LineBasicMaterial({
            vertexColors:true,
            transparent:true,
            opacity:.16,
            depthWrite:false,
            blending:THREE.AdditiveBlending
        });

    group.add(
        new THREE.LineSegments(
            geometry,
            material
        )
    );

    const dots=3500;

    const dotPositions=
        new Float32Array(
            dots*3
        );

    const dotColors=
        new Float32Array(
            dots*3
        );

    for(let i=0;i<dots;i++){

        const radius=
            Math.sqrt(
                Math.random()
            )*18;

        const a=
            Math.random()*
            Math.PI*2;

        dotPositions[i*3]=
            Math.cos(a)*radius;

        dotPositions[i*3+1]=
            FLOOR_Y+
            Math.random()*.015;

        dotPositions[i*3+2]=
            Math.sin(a)*radius;

        const near=
            1-radius/18;

        dotColors[i*3]=
            .35+
            near*.30;

        dotColors[i*3+1]=
            .12+
            near*.20;

        dotColors[i*3+2]=
            .42+
            near*.35;
    }

    const dotGeometry=
        new THREE.BufferGeometry();

    dotGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            dotPositions,
            3
        )
    );

    dotGeometry.setAttribute(
        "color",
        new THREE.BufferAttribute(
            dotColors,
            3
        )
    );

    const dotMaterial=
        new THREE.PointsMaterial({
            size:.035,
            vertexColors:true,
            transparent:true,
            opacity:.36,
            depthWrite:false,
            blending:THREE.AdditiveBlending
        });

    group.add(
        new THREE.Points(
            dotGeometry,
            dotMaterial
        )
    );

    const ringGroup=
        new THREE.Group();

    ringGroup.position.y=
        FLOOR_Y+.03;

    group.add(ringGroup);

    for(let i=0;i<7;i++){

        const radius=
            .55+
            i*.48;

        const points=[];

        for(let j=0;j<150;j++){

            const a=
                j/150*
                Math.PI*2;

            points.push(
                new THREE.Vector3(
                    Math.cos(a)*radius,
                    0,
                    Math.sin(a)*radius
                )
            );
        }

        const rg=
            new THREE.BufferGeometry()
            .setFromPoints(
                points
            );

        const rm=
            new THREE.LineBasicMaterial({
                color:
                    i<2
                    ?0xffcce7
                    :0xe46abb,

                transparent:true,

                opacity:
                    .32-
                    i*.038,

                depthWrite:false,

                blending:
                    THREE.AdditiveBlending
            });

        ringGroup.add(
            new THREE.LineLoop(
                rg,
                rm
            )
        );
    }

    return ringGroup;
}

const floorRings=
    createFloor();

function createFountain(){

    const n=
        COUNT.fountain;

    const geometry=
        new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            new Float32Array(
                n*3
            ),
            3
        )
    );

    const phase=
        new Float32Array(n);

    const radius=
        new Float32Array(n);

    const seed=
        new Float32Array(n);

    for(let i=0;i<n;i++){

        phase[i]=
            Math.random();

        radius[i]=
            Math.pow(
                Math.random(),
                2
            )*1.1;

        seed[i]=
            Math.random();
    }

    geometry.setAttribute(
        "aPhase",
        new THREE.BufferAttribute(
            phase,
            1
        )
    );

    geometry.setAttribute(
        "aRadius",
        new THREE.BufferAttribute(
            radius,
            1
        )
    );

    geometry.setAttribute(
        "aSeed",
        new THREE.BufferAttribute(
            seed,
            1
        )
    );

    const vertex=`
    attribute float aPhase;
    attribute float aRadius;
    attribute float aSeed;

    uniform float uTime;
    uniform float uPixelRatio;

    varying float vAlpha;
    varying vec3 vColor;

    void main(){

        float q=
            fract(
                aPhase+
                uTime*
                (
                    .10+
                    aSeed*.12
                )
            );

        float y=
            mix(
                ${FLOOR_Y.toFixed(3)},
                -7.05,
                q
            );

        float taper=
            1.0-q*.72;

        float angle=
            aSeed*27.0+
            uTime*
            (
                .4+
                aSeed*.3
            );

        float radius=
            aRadius*
            taper;

        vec3 p=
            vec3(
                cos(angle)*radius,
                y,
                sin(angle)*radius*.45
            );

        p.x+=
            sin(
                q*16.0+
                uTime*2.0+
                aSeed*24.0
            )*.055;

        vec4 mv=
            modelViewMatrix*
            vec4(p,1.0);

        gl_PointSize=
            clamp(
                (
                    .6+
                    aSeed*.9
                )*
                uPixelRatio*
                70.0/
                max(8.0,-mv.z),
                .45,
                3.5
            );

        gl_Position=
            projectionMatrix*mv;

        float fade=
            sin(
                q*
                3.14159265
            );

        vAlpha=
            fade*
            (
                .28+
                aSeed*.62
            );

        vColor=
            mix(
                vec3(1.0,.32,.72),
                vec3(1.0,.94,.99),
                pow(aSeed,2.5)
            );
    }
    `;

    const fragment=`
    precision highp float;

    varying float vAlpha;
    varying vec3 vColor;

    void main(){

        vec2 p=
            gl_PointCoord-.5;

        float d=
            length(p);

        if(d>.5)discard;

        float a=
            exp(
                -d*d*28.0
            )*
            vAlpha;

        gl_FragColor=
            vec4(
                vColor,
                a
            );
    }
    `;

    const material=
        new THREE.ShaderMaterial({
            vertexShader:vertex,
            fragmentShader:fragment,

            uniforms:{
                uTime:{value:0},
                uPixelRatio:{value:DPR}
            },

            transparent:true,
            depthWrite:false,
            blending:THREE.AdditiveBlending
        });

    const points=
        new THREE.Points(
            geometry,
            material
        );

    points.frustumCulled=false;

    scene.add(points);

    return material;
}

const fountainMaterial=
    createFountain();

const pointer={
    x:0,
    y:0,
    tx:0,
    ty:0
};

addEventListener(
    "pointermove",
    e=>{

        pointer.tx=
            (
                e.clientX/
                innerWidth-
                .5
            )*2;

        pointer.ty=
            (
                e.clientY/
                innerHeight-
                .5
            )*2;

    },
    {passive:true}
);

addEventListener(
    "pointerleave",
    ()=>{

        pointer.tx=0;
        pointer.ty=0;

    },
    {passive:true}
);

function heartbeat(t){

    const cycle=
        t%1.55;

    let value=0;

    if(cycle<.115){

        value=
            Math.sin(
                cycle/
                .115*
                Math.PI
            );

    }

    if(
        cycle>.18&&
        cycle<.295
    ){

        value+=
            .52*
            Math.sin(
                (
                    cycle-.18
                )/
                .115*
                Math.PI
            );

    }

    return value;
}

addEventListener(
    "resize",
    ()=>{

        const mobile=
            innerWidth<768;

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.fov=
            mobile?54:47;

        camera.position.z=
            mobile?41:37.5;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

        composer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

const clock=
    new THREE.Clock();

let loaded=false;

function animate(){

    requestAnimationFrame(
        animate
    );

    const t=
        clock.getElapsedTime();

    const beat=
        heartbeat(t);

    heartParticles
    .bodyMaterial
    .uniforms
    .uTime
    .value=t;

    heartParticles
    .bodyMaterial
    .uniforms
    .uBeat
    .value=beat;

    heartParticles
    .haloMaterial
    .uniforms
    .uTime
    .value=t;

    heartParticles
    .haloMaterial
    .uniforms
    .uBeat
    .value=beat;

    innerMaterial
    .uniforms
    .uTime
    .value=t;

    sparkMaterial
    .uniforms
    .uTime
    .value=t;

    fountainMaterial
    .uniforms
    .uTime
    .value=t;

    pointer.x+=
        (
            pointer.tx-
            pointer.x
        )*.025;

    pointer.y+=
        (
            pointer.ty-
            pointer.y
        )*.025;

    heartGroup.rotation.y=
        pointer.x*.035+
        Math.sin(t*.12)*.006;

    heartGroup.rotation.x=
        pointer.y*.014;

    camera.position.x+=
        (
            pointer.x*.25-
            camera.position.x
        )*.025;

    camera.position.y+=
        (
            2.5-
            pointer.y*.12-
            camera.position.y
        )*.025;

    camera.lookAt(
        0,
        .6,
        0
    );

    floorRings.scale.setScalar(
        1+
        beat*.025+
        Math.sin(t*.9)*.004
    );

    stars.rotation.z=
        t*.0007;

    rays.rotation.z=
        Math.sin(t*.07)*.004;

    composer.render();

    if(!loaded){

        loaded=true;

        setTimeout(
            ()=>{
                document
                .getElementById("loading")
                .classList
                .add("hide");
            },
            350
        );
    }
}

animate();
</script>
