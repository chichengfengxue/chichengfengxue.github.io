<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Love</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#07040d;
}
body{
    background:
        radial-gradient(circle at 50% 36%,rgba(76,31,68,.26) 0%,rgba(24,10,31,.15) 34%,rgba(7,4,13,0) 67%),
        #07040d;
}
#canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}
.home{
    position:fixed;
    top:22px;
    left:24px;
    z-index:10;
    color:rgba(255,220,240,.25);
    text-decoration:none;
    font:10px Arial,sans-serif;
    letter-spacing:3px;
    transition:.35s;
}
.home:hover{
    color:#ffe4f4;
    text-shadow:0 0 14px rgba(255,126,203,.8);
}
</style>
</head>
<body>

<a class="home" href="/">HOME</a>
<canvas id="canvas"></canvas>

<script>
(() => {
"use strict";

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d",{alpha:false});

let W=0;
let H=0;
let DPR=1;

const TAU=Math.PI*2;
const CURVE_N=4096;

const curveX=new Float32Array(CURVE_N);
const curveY=new Float32Array(CURVE_N);
const curveNX=new Float32Array(CURVE_N);
const curveNY=new Float32Array(CURVE_N);

let tinyParticles=[];
let softParticles=[];
let hotParticles=[];
let innerParticles=[];
let rays=[];
let stars=[];
let streamParticles=[];

let glowPink;
let glowWhite;
let glowTiny;

let mouseX=0;
let mouseY=0;
let targetMouseX=0;
let targetMouseY=0;

function rand(a,b){
    return a+Math.random()*(b-a);
}

function gaussian(){
    return (Math.random()+Math.random()+Math.random()+Math.random()-2);
}

function heart(t){
    const s=Math.sin(t);
    const x=16*s*s*s;
    const y=
        13*Math.cos(t)
        -5*Math.cos(2*t)
        -2*Math.cos(3*t)
        -Math.cos(4*t);
    return [x,-y];
}

function buildCurve(){
    for(let i=0;i<CURVE_N;i++){
        const t=i/CURVE_N*TAU;
        const p=heart(t);
        curveX[i]=p[0];
        curveY[i]=p[1];
    }

    for(let i=0;i<CURVE_N;i++){
        const prev=(i-2+CURVE_N)%CURVE_N;
        const next=(i+2)%CURVE_N;

        const dx=curveX[next]-curveX[prev];
        const dy=curveY[next]-curveY[prev];

        const len=Math.sqrt(dx*dx+dy*dy)||1;

        curveNX[i]=-dy/len;
        curveNY[i]=dx/len;
    }
}

function sampleCurve(u){
    u=((u%1)+1)%1;

    const f=u*CURVE_N;
    const i0=Math.floor(f)%CURVE_N;
    const i1=(i0+1)%CURVE_N;
    const a=f-Math.floor(f);

    return {
        x:curveX[i0]+(curveX[i1]-curveX[i0])*a,
        y:curveY[i0]+(curveY[i1]-curveY[i0])*a,
        nx:curveNX[i0]+(curveNX[i1]-curveNX[i0])*a,
        ny:curveNY[i0]+(curveNY[i1]-curveNY[i0])*a
    };
}

function makeSprite(size,inner,mid){
    const c=document.createElement("canvas");
    c.width=c.height=size;

    const g=c.getContext("2d");
    const r=size*.5;

    const gradient=g.createRadialGradient(r,r,0,r,r,r);

    gradient.addColorStop(0,inner);
    gradient.addColorStop(.09,inner);
    gradient.addColorStop(.23,mid);
    gradient.addColorStop(.55,"rgba(255,110,200,.12)");
    gradient.addColorStop(1,"rgba(255,80,190,0)");

    g.fillStyle=gradient;
    g.fillRect(0,0,size,size);

    return c;
}

function createSprites(){
    glowWhite=makeSprite(
        64,
        "rgba(255,255,255,1)",
        "rgba(255,220,242,.9)"
    );

    glowPink=makeSprite(
        48,
        "rgba(255,240,250,.92)",
        "rgba(255,130,205,.72)"
    );

    glowTiny=makeSprite(
        24,
        "rgba(255,248,252,.9)",
        "rgba(255,155,215,.55)"
    );
}

function createParticles(){
    tinyParticles=[];
    softParticles=[];
    hotParticles=[];
    innerParticles=[];
    rays=[];
    stars=[];
    streamParticles=[];

    const mobile=W<700;

    const contourCount=mobile?6500:14500;
    const innerCount=mobile?1100:2600;
    const rayCount=mobile?75:165;
    const starCount=mobile?450:1200;
    const streamCount=mobile?420:1050;

    for(let i=0;i<contourCount;i++){
        let band;
        const r=Math.random();

        if(r<.70){
            band=gaussian()*.48;
        }else if(r<.94){
            band=gaussian()*.90;
        }else{
            band=gaussian()*1.65;
        }

        const p={
            u:Math.random(),
            band,
            speed:rand(.006,.018)*(Math.random()<.12?-1:1),
            phase:rand(0,TAU),
            wobble:rand(.02,.18),
            alpha:rand(.45,1),
            size:rand(.7,1.35)
        };

        const q=Math.random();

        if(q<.79){
            tinyParticles.push(p);
        }else if(q<.965){
            p.size=rand(3.0,6.5);
            softParticles.push(p);
        }else{
            p.size=rand(7,14);
            hotParticles.push(p);
        }
    }

    for(let i=0;i<innerCount;i++){
        const t=Math.random();
        const radius=Math.pow(Math.random(),.72)*.83;
        const p=sampleCurve(t);

        innerParticles.push({
            u:t,
            radius,
            phase:rand(0,TAU),
            alpha:rand(.12,.55),
            size:Math.random()<.91?rand(.55,1.35):rand(3,6),
            hot:Math.random()<.06
        });
    }

    for(let i=0;i<rayCount;i++){
        rays.push({
            u:Math.random(),
            length:rand(.08,.31),
            speed:rand(.025,.075),
            phase:Math.random(),
            width:rand(.35,1.15),
            alpha:rand(.05,.20),
            offset:rand(5,55)
        });
    }

    for(let i=0;i<starCount;i++){
        stars.push({
            x:Math.random(),
            y:Math.random(),
            phase:rand(0,TAU),
            alpha:rand(.06,.46),
            size:Math.random()<.94?rand(.45,1.25):rand(2,4.5)
        });
    }

    for(let i=0;i<streamCount;i++){
        streamParticles.push({
            phase:Math.random(),
            speed:rand(.05,.16),
            spread:gaussian(),
            drift:rand(0,TAU),
            alpha:rand(.2,1),
            size:Math.random()<.88?rand(.7,1.6):rand(3,7)
        });
    }
}

function resize(){
    W=window.innerWidth;
    H=window.innerHeight;

    DPR=Math.min(window.devicePixelRatio||1,1.75);

    canvas.width=Math.round(W*DPR);
    canvas.height=Math.round(H*DPR);

    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(DPR,0,0,DPR,0,0);

    createParticles();
}

function layout(){
    const mobile=W<700;

    const heartWidth=mobile
        ?Math.min(W*.86,H*.55)
        :Math.min(W*.58,H*.52);

    const scale=heartWidth/32;

    const cx=W*.5+mouseX*5;
    const cy=H*(mobile?.34:.355)+mouseY*3;

    return {cx,cy,scale};
}

function heartbeat(t){
    const q=t%1.52;

    let beat=0;

    if(q<.11){
        beat=Math.sin(q/.11*Math.PI);
    }

    if(q>.18&&q<.30){
        beat+=.48*Math.sin((q-.18)/.12*Math.PI);
    }

    return 1+beat*.026+Math.sin(t*.72)*.004;
}

function heartScreenPoint(u,cx,cy,scale,pulse,band=0){
    const p=sampleCurve(u);

    const wobbleScale=scale*band;

    return {
        x:cx+p.x*scale*pulse+p.nx*wobbleScale,
        y:cy+p.y*scale*pulse+p.ny*wobbleScale,
        nx:p.nx,
        ny:p.ny,
        lx:p.x,
        ly:p.y
    };
}

function drawBackground(t){
    ctx.globalCompositeOperation="source-over";

    ctx.fillStyle="#06030b";
    ctx.fillRect(0,0,W,H);

    let g=ctx.createRadialGradient(
        W*.5,H*.37,0,
        W*.5,H*.37,Math.max(W,H)*.62
    );

    g.addColorStop(0,"rgba(74,29,66,.30)");
    g.addColorStop(.27,"rgba(44,17,48,.20)");
    g.addColorStop(.58,"rgba(17,8,25,.11)");
    g.addColorStop(1,"rgba(0,0,0,0)");

    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);

    ctx.globalCompositeOperation="lighter";

    ctx.fillStyle="rgba(245,160,215,.52)";

    for(const s of stars){
        const a=
            s.alpha*
            (.58+.42*Math.sin(t*.75+s.phase));

        if(a<=.02)continue;

        ctx.globalAlpha=a;

        const x=s.x*W;
        const y=s.y*H;

        if(s.size<1.8){
            ctx.fillRect(x,y,s.size,s.size);
        }else{
            ctx.drawImage(
                glowTiny,
                x-s.size*.5,
                y-s.size*.5,
                s.size,
                s.size
            );
        }
    }

    ctx.globalAlpha=1;
}

function buildHeartPath(cx,cy,scale,pulse){
    ctx.beginPath();

    const steps=400;

    for(let i=0;i<=steps;i++){
        const u=i/steps;
        const p=sampleCurve(u);

        const x=cx+p.x*scale*pulse;
        const y=cy+p.y*scale*pulse;

        if(i===0)ctx.moveTo(x,y);
        else ctx.lineTo(x,y);
    }

    ctx.closePath();
}

function drawHeartGlow(cx,cy,scale,pulse){
    ctx.save();

    ctx.globalCompositeOperation="lighter";

    buildHeartPath(cx,cy,scale,pulse);

    ctx.filter=`blur(${Math.max(7,scale*.85)}px)`;
    ctx.strokeStyle="rgba(255,65,177,.15)";
    ctx.lineWidth=scale*4.1;
    ctx.stroke();

    buildHeartPath(cx,cy,scale,pulse);

    ctx.filter=`blur(${Math.max(4,scale*.4)}px)`;
    ctx.strokeStyle="rgba(255,140,205,.17)";
    ctx.lineWidth=scale*2.7;
    ctx.stroke();

    buildHeartPath(cx,cy,scale,pulse);

    ctx.filter=`blur(${Math.max(1.5,scale*.12)}px)`;
    ctx.strokeStyle="rgba(255,228,242,.20)";
    ctx.lineWidth=scale*.92;
    ctx.stroke();

    ctx.filter="none";
    ctx.restore();
}

function drawRays(t,cx,cy,scale,pulse){
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.lineCap="round";

    const maxDim=Math.max(W,H);

    for(const r of rays){
        const q=(r.phase+t*r.speed)%1;

        const hp=heartScreenPoint(
            r.u,
            cx,
            cy,
            scale,
            pulse
        );

        let dx=hp.x-cx;
        let dy=hp.y-cy;

        let len=Math.sqrt(dx*dx+dy*dy)||1;

        dx/=len;
        dy/=len;

        const moving=r.offset+q*90;
        const startX=hp.x+dx*moving;
        const startY=hp.y+dy*moving;

        const rayLength=maxDim*r.length*(.55+.45*(1-q));

        const endX=startX+dx*rayLength;
        const endY=startY+dy*rayLength;

        const fade=Math.pow(1-q,1.45);

        ctx.globalAlpha=r.alpha*fade;
        ctx.strokeStyle="rgba(255,78,186,1)";
        ctx.lineWidth=r.width;

        ctx.beginPath();
        ctx.moveTo(startX,startY);
        ctx.lineTo(endX,endY);
        ctx.stroke();

        if(r.alpha>.11){
            const s=3+r.width*3;

            ctx.globalAlpha=r.alpha*fade*.7;

            ctx.drawImage(
                glowTiny,
                startX-s*.5,
                startY-s*.5,
                s,s
            );
        }
    }

    ctx.globalAlpha=1;
    ctx.restore();
}

function drawInterior(t,cx,cy,scale,pulse){
    ctx.save();
    ctx.globalCompositeOperation="lighter";

    ctx.fillStyle="rgba(255,176,219,.72)";

    for(const p of innerParticles){
        const hp=sampleCurve(p.u);

        const driftX=Math.sin(t*.55+p.phase)*scale*.06;
        const driftY=Math.cos(t*.47+p.phase*1.3)*scale*.05;

        const x=
            cx+
            hp.x*scale*p.radius*pulse+
            driftX;

        const y=
            cy+
            hp.y*scale*p.radius*pulse+
            driftY;

        const twinkle=
            .52+
            .48*Math.sin(
                t*(.7+p.alpha)+
                p.phase
            );

        const alpha=
            p.alpha*
            (.45+.55*twinkle);

        ctx.globalAlpha=alpha;

        if(p.size<2){
            ctx.fillRect(x,y,p.size,p.size);
        }else{
            const s=p.hot?p.size*1.5:p.size;

            ctx.drawImage(
                p.hot?glowWhite:glowTiny,
                x-s*.5,
                y-s*.5,
                s,s
            );
        }
    }

    ctx.globalAlpha=1;
    ctx.restore();
}

function particlePosition(p,t,cx,cy,scale,pulse){
    const u=p.u+t*p.speed;

    const wobble=
        p.band+
        Math.sin(
            t*.75+
            p.phase
        )*p.wobble;

    return heartScreenPoint(
        u,
        cx,
        cy,
        scale,
        pulse,
        wobble
    );
}

function drawHeartParticles(t,cx,cy,scale,pulse){
    ctx.save();
    ctx.globalCompositeOperation="lighter";

    ctx.fillStyle="rgba(255,191,226,.88)";
    ctx.globalAlpha=.68;

    for(const p of tinyParticles){
        const a=particlePosition(
            p,t,cx,cy,scale,pulse
        );

        const size=p.size;

        ctx.fillRect(
            a.x-size*.5,
            a.y-size*.5,
            size,
            size
        );
    }

    ctx.globalAlpha=.68;

    for(const p of softParticles){
        const a=particlePosition(
            p,t,cx,cy,scale,pulse
        );

        const shimmer=
            .72+
            .28*Math.sin(
                t*1.6+
                p.phase
            );

        const s=p.size*shimmer;

        ctx.globalAlpha=
            p.alpha*.58;

        ctx.drawImage(
            glowPink,
            a.x-s*.5,
            a.y-s*.5,
            s,s
        );
    }

    for(const p of hotParticles){
        const a=particlePosition(
            p,t,cx,cy,scale,pulse
        );

        const shimmer=
            .76+
            .24*Math.sin(
                t*2.1+
                p.phase
            );

        const s=p.size*shimmer;

        ctx.globalAlpha=
            .68+
            p.alpha*.28;

        ctx.drawImage(
            glowWhite,
            a.x-s*.5,
            a.y-s*.5,
            s,s
        );
    }

    ctx.globalAlpha=1;
    ctx.restore();
}

function drawHotContour(cx,cy,scale,pulse){
    ctx.save();
    ctx.globalCompositeOperation="lighter";

    buildHeartPath(cx,cy,scale,pulse);

    ctx.strokeStyle="rgba(255,236,246,.14)";
    ctx.lineWidth=Math.max(.55,scale*.13);
    ctx.stroke();

    ctx.restore();
}

function getHeartBottom(cx,cy,scale,pulse){
    let maxY=-Infinity;

    for(let i=0;i<512;i++){
        const p=sampleCurve(i/512);
        const y=cy+p.y*scale*pulse;
        if(y>maxY)maxY=y;
    }

    return maxY;
}

function drawFloor(t,cx,floorY){
    const maxR=Math.min(
        W*.60,
        H*1.08
    );

    const yScale=.205;

    ctx.save();

    ctx.globalCompositeOperation="lighter";

    /*
     * 放射线
     */
    ctx.lineWidth=.55;
    ctx.setLineDash([1.1,5]);

    const spokes=W<700?38:64;

    for(let i=0;i<spokes;i++){
        const a=i/spokes*TAU;

        const x2=cx+Math.cos(a)*maxR;
        const y2=floorY+Math.sin(a)*maxR*yScale;

        const front=(Math.sin(a)+1)*.5;

        ctx.globalAlpha=.045+.075*front;
        ctx.strokeStyle="rgba(216,116,222,1)";

        ctx.beginPath();
        ctx.moveTo(cx,floorY);
        ctx.lineTo(x2,y2);
        ctx.stroke();
    }

    /*
     * 波纹环
     */
    const rings=W<700?18:27;

    ctx.setLineDash([1.2,3.2]);

    for(let ri=1;ri<=rings;ri++){
        const q=ri/rings;

        const baseR=
            maxR*
            Math.pow(q,1.38);

        const steps=190;

        ctx.beginPath();

        for(let j=0;j<=steps;j++){
            const a=j/steps*TAU;

            const petals=
                1+
                (.030+.045*(1-q))*
                Math.sin(
                    a*8-
                    t*.60+
                    ri*.53
                );

            const ripple=
                1+
                .014*
                Math.sin(
                    a*17+
                    t*.36+
                    ri
                );

            const r=
                baseR*
                petals*
                ripple;

            const x=
                cx+
                Math.cos(a)*r;

            const y=
                floorY+
                Math.sin(a)*r*yScale;

            if(j===0)ctx.moveTo(x,y);
            else ctx.lineTo(x,y);
        }

        ctx.globalAlpha=
            .055+
            .21*(1-q);

        ctx.strokeStyle=
            ri%3===0
                ?"rgba(255,205,239,1)"
                :"rgba(216,121,222,1)";

        ctx.lineWidth=
            ri<7?1:.65;

        ctx.stroke();
    }

    ctx.setLineDash([]);

    /*
     * 地面星点
     */
    const pointCount=W<700?400:1050;

    ctx.fillStyle="rgba(246,183,231,.82)";

    for(let i=0;i<pointCount;i++){
        const hash1=(i*12.9898)%1;
        const hash2=(i*78.233)%1;

        const r=
            Math.sqrt(
                (Math.sin(i*91.7)*43758.5453)%1
            );

        const rr=
            Math.abs(r)*
            maxR;

        const a=
            (
                Math.abs(
                    Math.sin(i*51.91)*923.3
                )%1
            )*
            TAU;

        const x=
            cx+
            Math.cos(a)*rr;

        const y=
            floorY+
            Math.sin(a)*rr*yScale;

        ctx.globalAlpha=
            .08+
            .22*
            (1-rr/maxR);

        ctx.fillRect(
            x,
            y,
            .7,
            .7
        );
    }

    ctx.globalAlpha=1;

    /*
     * 中央光环
     */
    for(let i=0;i<7;i++){
        const pulse=
            1+
            Math.sin(
                t*1.35-
                i*.55
            )*.045;

        const rx=
            (13+i*12)*
            pulse;

        const ry=
            (2.8+i*2.2)*
            pulse;

        ctx.globalAlpha=
            .28-
            i*.027;

        ctx.strokeStyle=
            i<2
                ?"rgba(255,244,251,1)"
                :"rgba(255,142,215,1)";

        ctx.lineWidth=
            i<2?1.05:.75;

        ctx.beginPath();
        ctx.ellipse(
            cx,
            floorY,
            rx,
            ry,
            0,
            0,
            TAU
        );
        ctx.stroke();
    }

    ctx.restore();
}

function drawStream(t,cx,tipY,floorY,scale){
    ctx.save();
    ctx.globalCompositeOperation="lighter";

    /*
     * 模糊能量柱
     */
    ctx.filter=`blur(${Math.max(5,scale*.45)}px)`;

    let gradient=ctx.createLinearGradient(
        cx,tipY,
        cx,floorY
    );

    gradient.addColorStop(
        0,
        "rgba(255,214,239,.18)"
    );

    gradient.addColorStop(
        .45,
        "rgba(255,96,194,.12)"
    );

    gradient.addColorStop(
        1,
        "rgba(255,240,249,.30)"
    );

    ctx.strokeStyle=gradient;
    ctx.lineWidth=Math.max(5,scale*.6);

    ctx.beginPath();
    ctx.moveTo(cx,tipY);
    ctx.lineTo(cx,floorY);
    ctx.stroke();

    ctx.filter="none";

    /*
     * 粒子流
     */
    for(const p of streamParticles){
        const q=
            (
                p.phase+
                t*p.speed
            )%1;

        const middle=
            Math.sin(q*Math.PI);

        const y=
            tipY+
            (floorY-tipY)*q;

        const width=
            scale*
            (
                .10+
                middle*.42
            );

        const x=
            cx+
            p.spread*
            width+
            Math.sin(
                t*1.7+
                p.drift+
                q*11
            )*
            scale*.055;

        const alpha=
            p.alpha*
            middle;

        ctx.globalAlpha=alpha;

        if(p.size<2.5){
            ctx.fillStyle="rgba(255,224,241,.9)";
            ctx.fillRect(
                x,
                y,
                p.size,
                p.size
            );
        }else{
            const s=p.size;

            ctx.drawImage(
                glowWhite,
                x-s*.5,
                y-s*.5,
                s,s
            );
        }
    }

    /*
     * 接地点强光
     */
    const groundGlow=
        Math.max(
            20,
            scale*2.5
        );

    ctx.globalAlpha=.72;

    ctx.drawImage(
        glowWhite,
        cx-groundGlow*.5,
        floorY-groundGlow*.5,
        groundGlow,
        groundGlow
    );

    ctx.globalAlpha=1;
    ctx.restore();
}

function drawVignette(){
    ctx.save();

    ctx.globalCompositeOperation="source-over";

    const g=
        ctx.createRadialGradient(
            W*.5,
            H*.46,
            Math.min(W,H)*.18,
            W*.5,
            H*.46,
            Math.max(W,H)*.72
        );

    g.addColorStop(0,"rgba(0,0,0,0)");
    g.addColorStop(.6,"rgba(0,0,0,.04)");
    g.addColorStop(1,"rgba(0,0,0,.72)");

    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);

    ctx.restore();
}

let lastTime=performance.now();

function frame(now){
    requestAnimationFrame(frame);

    const dt=Math.min(
        (now-lastTime)/1000,
        .033
    );

    lastTime=now;

    const t=now*.001;

    mouseX+=
        (targetMouseX-mouseX)*
        .025;

    mouseY+=
        (targetMouseY-mouseY)*
        .025;

    const {cx,cy,scale}=layout();

    const pulse=heartbeat(t);

    const tipY=
        getHeartBottom(
            cx,
            cy,
            scale,
            pulse
        );

    const floorY=
        Math.min(
            H*.82,
            tipY+
            Math.max(
                25,
                H*.12
            )
        );

    drawBackground(t);

    /*
     * 顺序非常重要：
     * 背景射线 -> 地面 -> 心体 glow -> 内部 -> 心粒子 -> 能量柱
     */
    drawRays(
        t,
        cx,
        cy,
        scale,
        pulse
    );

    drawFloor(
        t,
        cx,
        floorY
    );

    drawHeartGlow(
        cx,
        cy,
        scale,
        pulse
    );

    drawInterior(
        t,
        cx,
        cy,
        scale,
        pulse
    );

    drawHeartParticles(
        t,
        cx,
        cy,
        scale,
        pulse
    );

    drawHotContour(
        cx,
        cy,
        scale,
        pulse
    );

    drawStream(
        t,
        cx,
        tipY,
        floorY,
        scale
    );

    drawVignette();
}

window.addEventListener(
    "pointermove",
    e=>{
        targetMouseX=
            (
                e.clientX/W-.5
            )*2;

        targetMouseY=
            (
                e.clientY/H-.5
            )*2;
    },
    {passive:true}
);

window.addEventListener(
    "pointerleave",
    ()=>{
        targetMouseX=0;
        targetMouseY=0;
    }
);

let resizeTimer;

window.addEventListener(
    "resize",
    ()=>{
        clearTimeout(resizeTimer);
        resizeTimer=setTimeout(resize,100);
    }
);

buildCurve();
createSprites();
resize();

requestAnimationFrame(frame);

})();
</script>
</body>
</html>
