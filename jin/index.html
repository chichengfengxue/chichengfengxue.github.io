<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Love</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#050208}
body{background:radial-gradient(circle at 50% 34%,#241021 0,#0c0612 38%,#050208 72%)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.home{
    position:fixed;left:22px;top:20px;z-index:10;
    color:rgba(255,225,242,.25);text-decoration:none;
    font:10px Arial,sans-serif;letter-spacing:3px;transition:.35s
}
.home:hover{color:#fff2fa;text-shadow:0 0 15px #ff6fbd}
</style>
</head>
<body>
<a class="home" href="/">HOME</a>
<canvas id="c"></canvas>
<script>
(()=>{
"use strict";

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d",{alpha:false});
const TAU=Math.PI*2;
const CURVE_N=4096;
let W=0,H=0,DPR=1,last=performance.now();
let mx=0,my=0,tmx=0,tmy=0;
let first=true,beatWasHigh=false;

const cxArr=new Float32Array(CURVE_N);
const cyArr=new Float32Array(CURVE_N);
const nxArr=new Float32Array(CURVE_N);
const nyArr=new Float32Array(CURVE_N);
const txArr=new Float32Array(CURVE_N);
const tyArr=new Float32Array(CURVE_N);

let flow=[];
let inner=[];
let ribbons=[];
let comets=[];
let sparks=[];
let stars=[];
let floorDust=[];
let tipDust=[];
let glowWhite,glowPink,glowPurple;

function rand(a,b){return a+Math.random()*(b-a)}
function gauss(){return Math.random()+Math.random()+Math.random()+Math.random()-2}
function norm(u){u%=1;return u<0?u+1:u}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}

function heart(t){
    const s=Math.sin(t);
    return [
        16*s*s*s,
        -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))
    ];
}

function buildCurve(){
    for(let i=0;i<CURVE_N;i++){
        const p=heart(i/CURVE_N*TAU);
        cxArr[i]=p[0];
        cyArr[i]=p[1];
    }
    for(let i=0;i<CURVE_N;i++){
        const a=(i-3+CURVE_N)%CURVE_N;
        const b=(i+3)%CURVE_N;
        let dx=cxArr[b]-cxArr[a];
        let dy=cyArr[b]-cyArr[a];
        const l=Math.hypot(dx,dy)||1;
        dx/=l;dy/=l;
        let nx=-dy,ny=dx;
        if(nx*cxArr[i]+ny*cyArr[i]<0){nx=-nx;ny=-ny}
        nxArr[i]=nx;nyArr[i]=ny;
        txArr[i]=-ny;tyArr[i]=nx;
    }
}

function sample(u){
    u=norm(u);
    const f=u*CURVE_N;
    const i=Math.floor(f)%CURVE_N;
    const j=(i+1)%CURVE_N;
    const a=f-Math.floor(f);
    let nx=nxArr[i]+(nxArr[j]-nxArr[i])*a;
    let ny=nyArr[i]+(nyArr[j]-nyArr[i])*a;
    const l=Math.hypot(nx,ny)||1;
    nx/=l;ny/=l;
    return {
        x:cxArr[i]+(cxArr[j]-cxArr[i])*a,
        y:cyArr[i]+(cyArr[j]-cyArr[i])*a,
        nx,ny,tx:-ny,ty:nx
    };
}

function sprite(size,c0,c1,c2){
    const c=document.createElement("canvas");
    c.width=c.height=size;
    const g=c.getContext("2d");
    const r=size/2;
    const gr=g.createRadialGradient(r,r,0,r,r,r);
    gr.addColorStop(0,c0);
    gr.addColorStop(.08,c0);
    gr.addColorStop(.25,c1);
    gr.addColorStop(.58,c2);
    gr.addColorStop(1,"rgba(255,70,180,0)");
    g.fillStyle=gr;
    g.fillRect(0,0,size,size);
    return c;
}

function makeSprites(){
    glowWhite=sprite(96,"rgba(255,255,255,1)","rgba(255,221,241,.95)","rgba(255,92,189,.13)");
    glowPink=sprite(72,"rgba(255,241,250,.92)","rgba(255,116,198,.72)","rgba(229,63,169,.11)");
    glowPurple=sprite(128,"rgba(255,120,204,.22)","rgba(194,55,169,.12)","rgba(104,30,129,.04)");
}

function layout(){
    const mobile=W<700;
    const width=Math.min(W*(mobile?.84:.50),H*(mobile?.72:.72));
    return {
        x:W*.5+mx*5,
        y:H*(mobile?.335:.335)+my*3,
        s:width/32
    };
}

function beatInfo(t){
    const q=t%1.48;
    let b=0;
    if(q<.10)b=Math.sin(q/.10*Math.PI);
    if(q>.17&&q<.285)b+=.48*Math.sin((q-.17)/.115*Math.PI);
    return {b,pulse:1+b*.022+Math.sin(t*.67)*.003};
}

function bandWidth(u,t,s){
    return s*(
        .62+
        .10*Math.sin(u*TAU*3-t*.48)+
        .065*Math.sin(u*TAU*7+t*.31)+
        .038*Math.sin(u*TAU*15-t*.22)
    );
}

function flowPos(p,t,L,pulse){
    const c=sample(p.u);
    const bw=bandWidth(p.u,t,L.s);
    const braid=
        Math.sin(p.u*TAU*6+t*p.braidSpeed+p.phase)*bw*.24+
        Math.sin(p.u*TAU*17-t*.54+p.phase*1.7)*bw*.07;
    const off=p.band*bw+braid;
    return {
        x:L.x+c.x*L.s*pulse+c.nx*off,
        y:L.y+c.y*L.s*pulse+c.ny*off,
        nx:c.nx,ny:c.ny,tx:c.tx,ty:c.ty
    };
}

function createFlow(){
    flow=[];
    const n=W<700?3600:8200;
    const L=layout();
    for(let i=0;i<n;i++){
        const r=Math.random();
        let band=gauss()*.49;
        if(r>.82)band*=1.65;
        if(r>.96)band*=2.3;
        const p={
            u:Math.random(),
            band,
            speed:rand(.025,.072)*(Math.random()<.09?-1:1),
            phase:rand(0,TAU),
            braidSpeed:rand(.65,1.45),
            size:Math.random()<.90?rand(.42,1.05):rand(1.1,2),
            alpha:rand(.42,1),
            hot:Math.random()<.045,
            x:0,y:0,px:0,py:0
        };
        const q=flowPos(p,0,L,1);
        p.x=p.px=q.x;
        p.y=p.py=q.y;
        flow.push(p);
    }
}

function createInner(){
    inner=[];
    const n=W<700?650:1600;
    for(let i=0;i<n;i++){
        inner.push({
            u:Math.random(),
            r:Math.pow(Math.random(),.58)*.79,
            phase:rand(0,TAU),
            size:Math.random()<.94?rand(.4,1):rand(2,4),
            alpha:rand(.05,.32)
        });
    }
}

function createRibbons(){
    ribbons=[];
    const n=W<700?11:23;
    for(let i=0;i<n;i++){
        ribbons.push({
            u:Math.random(),
            speed:rand(.045,.11)*(Math.random()<.18?-1:1),
            len:rand(.025,.075),
            band:gauss()*.32,
            phase:rand(0,TAU),
            width:rand(.55,1.45),
            alpha:rand(.12,.42)
        });
    }
}

function resetComet(c,L,t,pulse,initial=false){
    const u=Math.random();
    const h=sample(u);
    const bw=bandWidth(u,t,L.s);
    const off=gauss()*bw*.72;
    const x=L.x+h.x*L.s*pulse+h.nx*off;
    const y=L.y+h.y*L.s*pulse+h.ny*off;

    const outward=rand(80,230);
    const tangent=rand(-125,125);

    c.x=x;c.y=y;c.px=x;c.py=y;
    c.vx=h.nx*outward+h.tx*tangent;
    c.vy=h.ny*outward+h.ty*tangent;
    c.life=rand(.70,1.65);
    c.age=initial?Math.random()*c.life:0;
    c.phase=rand(0,TAU);
    c.curve=rand(.55,1.6)*(Math.random()<.5?-1:1);
    c.alpha=rand(.18,.65);
    c.width=rand(.45,1.25);
    c.hot=Math.random()<.20;
    c.history=[];
    for(let j=0;j<14;j++)c.history.push({x,y});
}

function createComets(){
    comets=[];
    const L=layout();
    const n=W<700?85:190;
    for(let i=0;i<n;i++){
        const c={};
        resetComet(c,L,0,1,true);
        comets.push(c);
    }
}

function createSparks(){
    sparks=[];
}

function createStars(){
    stars=[];
    const n=W<700?320:850;
    for(let i=0;i<n;i++){
        stars.push({
            x:Math.random(),
            y:Math.random(),
            size:Math.random()<.97?rand(.35,.9):rand(1.5,3.5),
            a:rand(.025,.24),
            phase:rand(0,TAU),
            drift:rand(.4,1.2)
        });
    }
}

function createFloor(){
    floorDust=[];
    const n=W<700?500:1350;
    for(let i=0;i<n;i++){
        floorDust.push({
            r:Math.sqrt(Math.random()),
            a:Math.random()*TAU,
            alpha:rand(.04,.22),
            size:rand(.35,.85)
        });
    }
    tipDust=[];
    const k=W<700?90:210;
    for(let i=0;i<k;i++){
        tipDust.push({
            q:Math.random(),
            phase:rand(0,TAU),
            size:Math.random()<.92?rand(.45,1):rand(2,4),
            alpha:rand(.18,.80)
        });
    }
}

function recreate(){
    createFlow();
    createInner();
    createRibbons();
    createComets();
    createSparks();
    createStars();
    createFloor();
}

function resize(){
    W=innerWidth;
    H=innerHeight;
    DPR=Math.min(devicePixelRatio||1,1.7);
    canvas.width=Math.round(W*DPR);
    canvas.height=Math.round(H*DPR);
    canvas.style.width=W+"px";
    canvas.style.height=H+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
    first=true;
    recreate();
}

function background(t,L){
    ctx.globalCompositeOperation="source-over";
    ctx.fillStyle=first?"#050208":"rgba(5,2,8,.24)";
    ctx.fillRect(0,0,W,H);

    const R=Math.max(W,H)*.48;
    const g=ctx.createRadialGradient(L.x,L.y,0,L.x,L.y,R);
    g.addColorStop(0,"rgba(91,28,74,.060)");
    g.addColorStop(.33,"rgba(50,15,50,.032)");
    g.addColorStop(.70,"rgba(14,6,22,.010)");
    g.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);

    ctx.globalCompositeOperation="lighter";
    for(const s of stars){
        const y=norm(s.y+t*.0007*s.drift)*H;
        const a=s.a*(.55+.45*Math.sin(t*.5+s.phase));
        ctx.globalAlpha=a;
        ctx.fillStyle="#f6a8d7";
        const x=s.x*W;
        if(s.size<1.4)ctx.fillRect(x,y,s.size,s.size);
        else ctx.drawImage(glowPink,x-s.size,y-s.size,s.size*2,s.size*2);
    }
    ctx.globalAlpha=1;
}

function drawMist(L,t){
    const s=Math.min(W,H)*.55;
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.globalAlpha=.075+.018*Math.sin(t*.6);
    ctx.drawImage(glowPurple,L.x-s/2,L.y-s*.46,s,s);
    ctx.restore();
}

function drawInner(t,L,pulse){
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.fillStyle="#f59acb";

    for(const p of inner){
        const c=sample(p.u);
        const drift=Math.sin(t*.35+p.phase)*L.s*.07;
        const r=p.r+.007*Math.sin(t*.24+p.phase);

        const x=L.x+c.x*L.s*r*pulse+c.nx*drift;
        const y=L.y+c.y*L.s*r*pulse+c.ny*drift;

        ctx.globalAlpha=p.alpha*(.5+.5*Math.sin(t*(.5+p.alpha)+p.phase));

        if(p.size<1.4)ctx.fillRect(x,y,p.size,p.size);
        else ctx.drawImage(glowPink,x-p.size,y-p.size,p.size*2,p.size*2);
    }
    ctx.restore();
}

function drawFlow(t,dt,L,pulse){
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.lineCap="round";

    const colors=["#fff0f8","#ff8fcb","#d948a0"];
    const widths=[.82,.70,.55];

    for(let layer=0;layer<3;layer++){
        ctx.beginPath();

        for(let i=layer;i<flow.length;i+=3){
            const p=flow[i];

            p.px=p.x;p.py=p.y;
            p.u=norm(p.u+p.speed*dt);

            const q=flowPos(p,t,L,pulse);

            p.x=q.x;
            p.y=q.y;

            if(Math.hypot(p.x-p.px,p.y-p.py)<15){
                ctx.moveTo(p.px,p.py);
                ctx.lineTo(p.x,p.y);
            }
        }

        ctx.globalAlpha=layer===0?.34:layer===1?.25:.16;
        ctx.strokeStyle=colors[layer];
        ctx.lineWidth=widths[layer];
        ctx.stroke();

        ctx.fillStyle=colors[layer];
        ctx.globalAlpha=layer===0?.68:layer===1?.54:.40;

        for(let i=layer;i<flow.length;i+=6){
            const p=flow[i];
            ctx.fillRect(p.x,p.y,p.size,p.size);
        }
    }

    for(let i=0;i<flow.length;i+=11){
        const p=flow[i];
        if(!p.hot)continue;
        const s=rand(.88,1.12)*5;
        ctx.globalAlpha=.24;
        ctx.drawImage(glowWhite,p.x-s/2,p.y-s/2,s,s);
    }

    ctx.restore();
}

function drawRibbons(t,L,pulse){
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.lineCap="round";
    ctx.lineJoin="round";

    for(const r of ribbons){
        r.u=norm(r.u+r.speed/60);

        const steps=30;
        let last=null;

        for(let i=0;i<steps;i++){
            const q=i/(steps-1);
            const sign=r.speed>0?1:-1;
            const u=norm(r.u-r.len*q*sign);
            const c=sample(u);
            const bw=bandWidth(u,t,L.s);

            const offset=
                r.band*bw+
                Math.sin(u*TAU*10+t*1.05+r.phase)*bw*.19+
                Math.sin(u*TAU*23-t*.46+r.phase)*bw*.05;

            const x=L.x+c.x*L.s*pulse+c.nx*offset;
            const y=L.y+c.y*L.s*pulse+c.ny*offset;

            if(last){
                ctx.globalAlpha=r.alpha*Math.pow(1-q,1.55);
                ctx.strokeStyle=q<.22?"#fff9fd":"#ff91cb";
                ctx.lineWidth=r.width*(1-q*.70);

                ctx.beginPath();
                ctx.moveTo(last.x,last.y);
                ctx.lineTo(x,y);
                ctx.stroke();
            }

            last={x,y};
        }

        if(last){
            ctx.globalAlpha=r.alpha*.22;
            const s=6;
            ctx.drawImage(glowWhite,last.x-s/2,last.y-s/2,s,s);
        }
    }

    ctx.restore();
}

function fieldForce(x,y,t,L,phase,curve){
    const dx=x-L.x;
    const dy=y-L.y;
    const r=Math.hypot(dx,dy)||1;

    const rx=dx/r,ry=dy/r;
    const tx=-ry,ty=rx;

    const n1=Math.sin(x*.013+t*1.15+phase);
    const n2=Math.cos(y*.016-t*.86+phase*1.7);
    const n3=Math.sin((x+y)*.006+t*.53+phase*.7);

    const swirl=(42+115/(1+r*.012))*curve;
    const radial=20+16*Math.sin(t*.7+phase);

    return {
        x:tx*swirl+rx*radial+(n1+n3*.5)*28,
        y:ty*swirl+ry*radial+(n2-n3*.5)*28
    };
}

function updateComets(t,dt,L,pulse,beat){
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.lineCap="round";
    ctx.lineJoin="round";

    for(const c of comets){
        c.age+=dt;
        if(c.age>c.life||c.x<-100||c.x>W+100||c.y<-100||c.y>H+100){
            resetComet(c,L,t,pulse,false);
            continue;
        }

        c.px=c.x;c.py=c.y;

        const f=fieldForce(c.x,c.y,t,L,c.phase,c.curve);

        c.vx+=f.x*dt*(1+beat*.35);
        c.vy+=f.y*dt*(1+beat*.35);

        const drag=Math.pow(.988,dt*60);
        c.vx*=drag;
        c.vy*=drag;

        c.x+=c.vx*dt;
        c.y+=c.vy*dt;

        c.history.unshift({x:c.x,y:c.y});
        if(c.history.length>14)c.history.pop();

        const life=1-c.age/c.life;

        for(let j=1;j<c.history.length;j++){
            const a=c.history[j-1];
            const b=c.history[j];

            ctx.globalAlpha=
                c.alpha*
                life*
                Math.pow(1-j/c.history.length,1.7)*
                .44;

            ctx.strokeStyle=
                c.hot&&j<4
                    ?"#fff7fc"
                    :"#f05ab1";

            ctx.lineWidth=
                c.width*
                (1-j/c.history.length*.75);

            ctx.beginPath();
            ctx.moveTo(a.x,a.y);
            ctx.lineTo(b.x,b.y);
            ctx.stroke();
        }

        const head=c.hot?7:3.5;
        ctx.globalAlpha=c.alpha*life*(c.hot?.72:.35);

        ctx.drawImage(
            c.hot?glowWhite:glowPink,
            c.x-head/2,
            c.y-head/2,
            head,head
        );
    }

    ctx.restore();
}

function spawnBeatBurst(t,L,pulse){
    const count=W<700?70:165;

    for(let i=0;i<count;i++){
        const u=Math.random();
        const c=sample(u);
        const bw=bandWidth(u,t,L.s);
        const off=gauss()*bw*.55;

        const x=L.x+c.x*L.s*pulse+c.nx*off;
        const y=L.y+c.y*L.s*pulse+c.ny*off;

        const speed=rand(55,190);

        sparks.push({
            x,y,px:x,py:y,
            vx:c.nx*speed+c.tx*rand(-90,90),
            vy:c.ny*speed+c.ty*rand(-90,90),
            age:0,
            life:rand(.45,1.15),
            phase:rand(0,TAU),
            hot:Math.random()<.15,
            size:rand(.4,1.25)
        });
    }
}

function updateSparks(t,dt,L){
    if(sparks.length>900)sparks.splice(0,sparks.length-900);

    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.lineCap="round";

    for(let i=sparks.length-1;i>=0;i--){
        const p=sparks[i];
        p.age+=dt;

        if(p.age>p.life){
            sparks.splice(i,1);
            continue;
        }

        p.px=p.x;p.py=p.y;

        const f=fieldForce(p.x,p.y,t,L,p.phase,.45);
        p.vx+=f.x*dt*.42;
        p.vy+=f.y*dt*.42;

        p.vx*=Math.pow(.978,dt*60);
        p.vy*=Math.pow(.978,dt*60);

        p.x+=p.vx*dt;
        p.y+=p.vy*dt;

        const life=1-p.age/p.life;

        ctx.globalAlpha=life*.25;
        ctx.strokeStyle=p.hot?"#fff6fb":"#ff62b8";
        ctx.lineWidth=.55;

        ctx.beginPath();
        ctx.moveTo(p.px,p.py);
        ctx.lineTo(p.x,p.y);
        ctx.stroke();

        ctx.globalAlpha=life*(p.hot?.8:.55);

        if(p.hot){
            const s=4;
            ctx.drawImage(glowWhite,p.x-s/2,p.y-s/2,s,s);
        }else{
            ctx.fillStyle="#ffadd7";
            ctx.fillRect(p.x,p.y,p.size,p.size);
        }
    }

    ctx.restore();
}

function bottomPoint(L,pulse){
    const c=sample(.5);
    return {x:L.x+c.x*L.s*pulse,y:L.y+c.y*L.s*pulse};
}

function drawFloor(t,L,pulse,beat){
    const tip=bottomPoint(L,pulse);
    const fy=tip.y+Math.max(16,L.s*.72);
    const maxR=Math.min(W*(W<700?.62:.39),H*.43);
    const sy=.19;

    ctx.save();
    ctx.globalCompositeOperation="lighter";

    const g=ctx.createRadialGradient(L.x,fy,0,L.x,fy,maxR*.75);
    g.addColorStop(0,"rgba(255,190,230,.075)");
    g.addColorStop(.30,"rgba(209,77,190,.024)");
    g.addColorStop(1,"rgba(100,20,120,0)");
    ctx.fillStyle=g;
    ctx.fillRect(L.x-maxR,fy-maxR*.26,maxR*2,maxR*.52);

    const spokes=W<700?38:58;

    for(let i=0;i<spokes;i++){
        const a=i/spokes*TAU+t*.025;
        const x2=L.x+Math.cos(a)*maxR;
        const y2=fy+Math.sin(a)*maxR*sy;

        const grad=ctx.createLinearGradient(L.x,fy,x2,y2);
        grad.addColorStop(0,"rgba(255,210,238,.20)");
        grad.addColorStop(.25,"rgba(219,101,203,.08)");
        grad.addColorStop(1,"rgba(110,30,130,0)");

        ctx.globalAlpha=.22;
        ctx.strokeStyle=grad;
        ctx.lineWidth=.42;
        ctx.beginPath();
        ctx.moveTo(L.x,fy);
        ctx.lineTo(x2,y2);
        ctx.stroke();
    }

    const rings=W<700?17:24;

    for(let ri=1;ri<=rings;ri++){
        const q=ri/rings;
        const base=maxR*Math.pow(q,1.45);
        ctx.beginPath();

        for(let j=0;j<=180;j++){
            const a=j/180*TAU;
            const wave=
                1+
                (.115*(1-q)+.015)*
                Math.sin(a*8-t*.72+ri*.45)+
                .014*Math.sin(a*19+t*.31+ri);

            const twist=.11*Math.sin(t*.24+q*4);
            const aa=a+twist*(1-q);

            const r=base*wave*(1+beat*.012*(1-q));

            const x=L.x+Math.cos(aa)*r;
            const y=fy+Math.sin(aa)*r*sy;

            if(j===0)ctx.moveTo(x,y);
            else ctx.lineTo(x,y);
        }

        ctx.globalAlpha=.065+.23*(1-q);
        ctx.strokeStyle=ri<5?"#ffe5f5":"#cb6fc9";
        ctx.lineWidth=ri<5?.82:.45;
        ctx.stroke();
    }

    for(const d of floorDust){
        const r=d.r*maxR;
        const a=d.a+t*.018*(1-d.r);
        const x=L.x+Math.cos(a)*r;
        const y=fy+Math.sin(a)*r*sy;

        ctx.globalAlpha=d.alpha*(1-d.r*.72);
        ctx.fillStyle="#efacd9";
        ctx.fillRect(x,y,d.size,d.size);
    }

    for(let i=0;i<6;i++){
        const scale=
            1+
            Math.sin(t*1.3-i*.55)*.04+
            beat*.035;

        const rx=(8+i*10)*scale;
        const ry=(1.8+i*1.85)*scale;

        ctx.globalAlpha=.33-i*.042;
        ctx.strokeStyle=i<2?"#fff8fc":"#ed83c9";
        ctx.lineWidth=i<2?.95:.62;

        ctx.beginPath();
        ctx.ellipse(L.x,fy,rx,ry,0,0,TAU);
        ctx.stroke();
    }

    drawTipStream(t,tip.x,tip.y,fy,L.s);

    ctx.restore();
}

function drawTipStream(t,x,y1,y2,s){
    const gap=y2-y1;
    if(gap<=0)return;

    ctx.save();
    ctx.globalCompositeOperation="lighter";

    for(const p of tipDust){
        const q=norm(p.q+t*.10);
        const mid=Math.sin(q*Math.PI);

        const yy=y1+gap*q;
        const width=s*(.025+.16*mid);

        const xx=
            x+
            Math.sin(
                p.phase+t*2.15+q*14
            )*width;

        ctx.globalAlpha=p.alpha*mid;

        if(p.size<1.5){
            ctx.fillStyle="#ffe4f4";
            ctx.fillRect(xx,yy,p.size,p.size);
        }else{
            const z=p.size;
            ctx.drawImage(glowWhite,xx-z/2,yy-z/2,z,z);
        }
    }

    ctx.globalAlpha=.20;
    ctx.drawImage(
        glowWhite,
        x-s*.45,
        y2-s*.45,
        s*.9,
        s*.9
    );

    ctx.restore();
}

function vignette(){
    ctx.save();
    ctx.globalCompositeOperation="source-over";

    const g=ctx.createRadialGradient(
        W*.5,H*.43,
        Math.min(W,H)*.22,
        W*.5,H*.43,
        Math.max(W,H)*.72
    );

    g.addColorStop(0,"rgba(0,0,0,0)");
    g.addColorStop(.63,"rgba(0,0,0,.02)");
    g.addColorStop(1,"rgba(0,0,0,.60)");

    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);

    ctx.restore();
}

function animate(now){
    requestAnimationFrame(animate);

    const dt=Math.min((now-last)/1000,.033);
    last=now;
    const t=now*.001;

    mx+=(tmx-mx)*.025;
    my+=(tmy-my)*.025;

    const L=layout();
    const B=beatInfo(t);

    background(t,L);
    drawMist(L,t);
    drawFloor(t,L,B.pulse,B.b);
    drawInner(t,L,B.pulse);
    drawFlow(t,dt,L,B.pulse);
    drawRibbons(t,L,B.pulse);
    updateComets(t,dt,L,B.pulse,B.b);

    const high=B.b>.72;
    if(high&&!beatWasHigh)spawnBeatBurst(t,L,B.pulse);
    beatWasHigh=high;

    updateSparks(t,dt,L);
    vignette();

    first=false;
}

addEventListener("pointermove",e=>{
    tmx=(e.clientX/W-.5)*2;
    tmy=(e.clientY/H-.5)*2;
},{passive:true});

addEventListener("pointerleave",()=>{
    tmx=0;tmy=0;
},{passive:true});

let timer;
addEventListener("resize",()=>{
    clearTimeout(timer);
    timer=setTimeout(resize,120);
},{passive:true});

buildCurve();
makeSprites();
resize();
requestAnimationFrame(animate);
})();
</script>
</body>
</html>
